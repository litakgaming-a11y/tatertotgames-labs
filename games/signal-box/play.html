<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Signal Box | TaterTot Games</title>
<meta name="theme-color" content="#1f332c">
<link rel="icon" href="data:,">
<script src="/analytics.js" defer></script>
<style>
  :root {
    --room: #1f332c; --room2: #172722; --floor: #2b211c; --bed: #1a1411;
    --enamel: #eef0ea; --enamel2: #dfe3dc; --rule: #c5cbc3; --ink: #17211d; --ink2: #4d5a55; --faint: #7d8782;
    --red: #c62f2a; --red-press: #a32521; --blue: #1f4d99; --amber: #f2a33a; --brass: #b8963f; --steel: #c7ccce;
    --l1: #7b2334; --l2: #1f3f74; --l3: #1e5b3c; --l4: #5d3a24; --l5: #b4521a;
    --sign: "Gill Sans", "Gill Sans MT", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", "Roboto Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--room); touch-action: none; overscroll-behavior: none; position: fixed; inset: 0; }
  body { font-family: var(--sans); color: var(--ink); font-size: 14px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  ::selection { background: var(--red); color: #fff; }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  canvas { display: block; touch-action: none; }
  .num { font-variant-numeric: tabular-nums lining-nums; }

  .btn { min-height: 44px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 6px; font-family: var(--sign); font-size: 16px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--enamel); color: var(--ink); transition: background-color .1s ease-out, transform .1s ease-out; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: #f7f8f4; }
  .btn:active:not(:disabled) { background: var(--ink); color: var(--enamel); transform: translateY(1px); }
  .btn:disabled { color: var(--faint); border-color: var(--rule); background: repeating-linear-gradient(135deg, rgba(23,33,29,.08) 0 1px, transparent 1px 5px), var(--enamel2); cursor: default; }
  .btn.go { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.go:hover:not(:disabled) { background: #b22a25; }
  .btn.go:active:not(:disabled) { background: var(--red-press); border-color: var(--red-press); }
  .btn.sm { min-height: 36px; padding: 0 12px; font-size: 15px; }
  .btn.icon { width: 44px; padding: 0; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.icon.on { background: var(--ink); color: var(--enamel); }

  .screen { position: fixed; inset: 0; display: none; z-index: 10; }
  .screen.show { display: flex; }
  .scrim { background: rgba(15, 24, 21, .62); align-items: center; justify-content: center; padding: 14px; z-index: 20; }
  .panel { width: min(420px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--enamel); border: 2px solid var(--ink); border-radius: 8px; padding: 22px 20px 20px; text-align: center; touch-action: pan-y; }
  .panel h2 { font-family: var(--sign); font-size: 26px; font-weight: 700; line-height: 1.1; }
  .panel p { margin-top: 10px; color: var(--ink2); }
  .panel .act { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .stars { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }
  .stars svg { width: 34px; height: 34px; }
  .big { font-family: var(--mono); font-size: 18px; margin-top: 8px; color: var(--ink); }

  /* the nameboard: an enamel station sign */
  .board { display: inline-block; background: var(--l1); color: #fff; border: 3px solid #fff; outline: 2px solid var(--ink); border-radius: 8px; font-family: var(--sign); font-weight: 600; letter-spacing: .01em; }

  /* title */
  #title { flex-direction: column; justify-content: space-between; align-items: center; text-align: center; padding: max(5vh, 18px) 16px 0; pointer-events: none; }
  #title > * { pointer-events: auto; }
  #tcv { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }
  #title h1 { font-size: clamp(38px, min(11vw, 10vh), 84px); line-height: 1; padding: .16em .5em .2em; }
  #title .tag { margin-top: 12px; font-size: clamp(14px, 3.6vw, 17px); font-weight: 600; color: #d9e2dc; max-width: 30em; }
  #tgo { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #tgo .btn.go { min-height: 52px; padding: 0 30px; font-size: 20px; }
  #tstat { font-size: 13px; color: #d9e2dc; font-weight: 600; min-height: 18px; }
  #badge { color: #d9e2dc; font-size: 13px; font-weight: 600; text-decoration: none; border-bottom: 2px solid var(--amber); padding: 6px 2px 2px; }

  /* the lines */
  #lines { flex-direction: column; background: var(--room); }
  .top { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--room2); border-bottom: 2px solid #0e1714; }
  .top .grow { flex: 1 1 auto; min-width: 0; }
  .top h2 { font-family: var(--sign); font-size: 20px; font-weight: 600; color: #fff; }
  .top .meta { font-size: 13px; color: #c9d3cd; font-weight: 600; }
  #tabs { flex: 0 0 auto; display: flex; gap: 6px; padding: 10px 10px 0; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button { flex: 0 0 auto; min-height: 40px; padding: 0 12px; border-radius: 6px 6px 0 0; font-family: var(--sign); font-weight: 600; font-size: 15px; color: #fff; opacity: .72; display: flex; align-items: center; gap: 8px; }
  #tabs button .chip { width: 12px; height: 12px; border-radius: 3px; border: 2px solid #fff; }
  #tabs button.on { opacity: 1; background: var(--enamel); color: var(--ink); }
  #lineBody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; background: var(--enamel); margin: 0 10px 10px; border-radius: 0 6px 6px 6px; padding: 14px; }
  #lineHead .board { font-size: 22px; padding: 4px 14px 6px; }
  #lineIdea { margin-top: 10px; color: var(--ink2); max-width: 40em; }
  #lineLock { margin-top: 10px; font-weight: 600; color: var(--ink); }
  #stations { margin-top: 12px; display: grid; gap: 6px; }
  body.land #stations { grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .st { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 6px; background: #f7f8f4; text-align: left; }
  .st:hover:not(:disabled) { background: #fff; }
  .st:active:not(:disabled) { background: var(--enamel2); }
  .st .n { font-family: var(--mono); font-size: 14px; color: var(--ink2); }
  .st .nm { font-family: var(--sign); font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st .sub { display: block; font-family: var(--sans); font-size: 12px; font-weight: 400; color: var(--ink2); }
  .st .ss { display: flex; gap: 2px; }
  .st .ss svg { width: 18px; height: 18px; }
  .st:disabled { border-color: var(--rule); background: repeating-linear-gradient(135deg, rgba(23,33,29,.07) 0 1px, transparent 1px 5px), var(--enamel2); color: var(--faint); cursor: default; }
  .st:disabled .n, .st:disabled .sub { color: var(--faint); }

  /* the box */
  #game { display: none; background: var(--room); }
  #game.show { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto auto; }
  body.land #game.show { grid-template-columns: minmax(0, 1fr) minmax(260px, 34%); grid-template-rows: auto minmax(0, 1fr) auto; }
  #gTop { grid-column: 1 / -1; }
  #gTop .board { font-size: 18px; padding: 2px 12px 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #gLine { font-size: 12px; color: #c9d3cd; font-weight: 600; margin-top: 2px; }
  #muteBtn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid #0e1714; border-radius: 6px; background: var(--enamel); color: var(--ink); flex: none; }
  #muteBtn svg { width: 20px; height: 20px; }
  #muteBtn:active { background: var(--ink); color: var(--enamel); }
  #dWrap { position: relative; min-height: 0; }
  #dcv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #side { display: flex; flex-direction: column; min-height: 0; }
  body.land #side { grid-row: 2; grid-column: 2; border-left: 2px solid #0e1714; background: var(--room2); }
  body.port #side { display: contents; }
  #note { flex: none; padding: 8px 12px; font-size: 14px; color: #e3ebe6; min-height: 44px; }
  #note b { color: #fff; }
  #note.warn { color: #fff; }
  #note.warn b { color: var(--amber); }
  #tt { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 0 10px 6px; display: grid; gap: 4px; align-content: start; }
  body.port #tt { max-height: 22vh; }
  body.land #tt { flex: 1 1 auto; min-height: 0; }
  .tr { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--enamel); border-radius: 5px; padding: 5px 8px; min-height: 40px; }
  .tr .hc { font-family: var(--mono); font-weight: 700; font-size: 15px; background: #101412; color: var(--amber); border-radius: 3px; text-align: center; padding: 2px 0; }
  .tr .to { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr .stt { display: block; font-size: 12px; font-weight: 400; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr .tm { font-family: var(--mono); font-size: 13px; text-align: right; color: var(--ink); }
  .tr .tm small { display: block; font-size: 11px; color: var(--ink2); }
  .tr.in { background: var(--enamel2); }
  .tr.in .hc { color: #8a9a92; }
  .tr.late .tm { color: var(--red); }
  #ctl { display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex-wrap: nowrap; }
  #clock { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--amber); background: #101412; border-radius: 5px; padding: 6px 8px; min-width: 76px; text-align: center; }
  #pulls { font-size: 12.5px; color: #e3ebe6; font-weight: 600; line-height: 1.2; min-width: 60px; }
  #pulls b { display: block; font-family: var(--mono); font-size: 17px; color: #fff; }
  #ctl .gap { flex: 1 1 auto; }
  body.land #ctl { flex-wrap: wrap; row-gap: 8px; }
  body.land #ctl .gap { flex-basis: 100%; height: 0; }
  body.land #runBtn { flex: 1 1 auto; }
  #runBtn { min-width: 84px; }
  #fcv { grid-column: 1 / -1; width: 100%; height: clamp(118px, 24vh, 210px); }
  body.land #fcv { height: clamp(92px, 25vh, 176px); }
  @media (max-width: 379px) { #ctl { flex-wrap: wrap; row-gap: 8px; } #ctl .gap { flex-basis: 100%; height: 0; } #runBtn { flex: 1 1 auto; } }
  @media (max-height: 520px) { .btn { min-height: 38px; } #muteBtn { width: 38px; height: 38px; } #clock { font-size: 17px; padding: 4px 6px; } #note { min-height: 0; padding: 4px 10px; } .top { padding: 5px 8px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="port">
<canvas id="tcv"></canvas>

<div id="title" class="screen show">
  <div>
    <h1 class="board">Signal Box</h1>
    <p class="tag">Set the points, clear the signals, and bring every train in on time.</p>
  </div>
  <div id="tgo">
    <button class="btn go" id="playBtn">Open the box</button>
    <div id="tstat" class="num"></div>
    <a id="badge" href="https://tatertotgames.com">tatertotgames.com</a>
  </div>
</div>

<div id="lines" class="screen">
  <div class="top">
    <button class="btn sm" id="linesBack">Back</button>
    <div class="grow"><h2>The lines</h2></div>
    <div class="meta num" id="starCount"></div>
  </div>
  <div id="tabs" role="tablist"></div>
  <div id="lineBody">
    <div id="lineHead"><span class="board" id="lineBoard"></span></div>
    <p id="lineIdea"></p>
    <p id="lineLock"></p>
    <div id="stations"></div>
  </div>
</div>

<div id="game" class="screen">
  <div class="top" id="gTop">
    <button class="btn sm" id="gameBack">Back</button>
    <div class="grow"><span class="board" id="gBoard"></span><div id="gLine"></div></div>
    <button id="muteBtn" aria-label="Sound on or off">
      <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
      <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" style="display:none"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>
  <div id="dWrap"><canvas id="dcv"></canvas></div>
  <div id="side">
    <div id="note"></div>
    <div id="tt"></div>
    <div id="ctl">
      <div id="clock" class="num">06:00</div>
      <div id="pulls"></div>
      <span class="gap"></span>
      <button class="btn icon" id="stepBtn" aria-label="Step one minute"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5.5v13l9-6.5z"/><rect x="16.5" y="5.5" width="2.6" height="13" rx="1"/></svg></button>
      <button class="btn icon" id="fastBtn" aria-label="Run faster"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 6v12l8-6zM12.5 6v12l8-6z"/></svg></button>
      <button class="btn icon" id="resetBtn" aria-label="Start the puzzle again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4v4.5H9"/></svg></button>
      <button class="btn go" id="runBtn">Start</button>
    </div>
  </div>
  <canvas id="fcv"></canvas>
</div>

<div id="done" class="screen scrim">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="doneH">
    <h2 id="doneH"></h2>
    <p id="doneP"></p>
    <div class="stars" id="doneStars"></div>
    <div class="big num" id="doneN"></div>
    <div class="act" id="doneAct"></div>
  </div>
</div>

<div id="notice" class="screen scrim">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="noticeH">
    <h2 id="noticeH"></h2>
    <p id="noticeP"></p>
    <div class="act"><button class="btn go" id="noticeOk">Understood</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
/* ============================== the railway: parse, route, tick ============================== */
const DIRS = { W: [-1, 0], E: [1, 0], NW: [-1, -1], NE: [1, -1], SW: [-1, 1], SE: [1, 1] };
const OPP = { W: 'E', E: 'W', NW: 'SE', SE: 'NW', NE: 'SW', SW: 'NE' };
const ACC = { '-': ['W', 'E'], '~': ['W', 'E'], '/': ['SW', 'NE'], '\\': ['NW', 'SE'], '>': ['W', 'E'], '<': ['W', 'E'], ')': ['W', 'E'], '(': ['W', 'E'] };
const ALLD = Object.keys(DIRS);
function accOf(c) { if (ACC[c]) return ACC[c]; if (/[A-Z]/.test(c)) return ['W', 'E']; if (/[a-z+*]/.test(c)) return ALLD; return null; }
function dirOf(dx, dy) { for (const k in DIRS) if (DIRS[k][0] === dx && DIRS[k][1] === dy) return k; return null; }

function build(L, li) {
  const rows = L.map.replace(/^\n+/, '').replace(/\s+$/, '').split('\n');
  const gh = rows.length, gw = Math.max(...rows.map(r => r.length));
  const at = (x, y) => (y >= 0 && y < gh && x >= 0 && x < rows[y].length) ? rows[y][x] : ' ';
  const idOf = (x, y) => y * gw + x;
  const cells = new Map();
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) { const c = at(x, y); if (accOf(c)) cells.set(idOf(x, y), { id: idOf(x, y), x, y, ch: c, nb: {}, east: [], west: [] }); }
  for (const C of cells.values()) for (const d of accOf(C.ch)) {
    const [dx, dy] = DIRS[d], o = cells.get(idOf(C.x + dx, C.y + dy)); if (!o || o.x !== C.x + dx) continue;
    if (accOf(o.ch).includes(OPP[d])) { C.nb[d] = o.id; (dx > 0 ? C.east : C.west).push(o.id); }
  }
  // a diagonal runs into a straight track that has nothing else on that side: a curve
  for (const C of cells.values()) if (C.ch === '/' || C.ch === '\\') for (const d of accOf(C.ch)) {
    if (C.nb[d] !== undefined) continue;
    const [dx, dy] = DIRS[d], o = cells.get(idOf(C.x + dx, C.y + dy)); if (!o || o.x !== C.x + dx) continue;
    const oa = accOf(o.ch); if (oa.length !== 2 || !oa.includes('W')) continue;
    const oside = dx > 0 ? o.west : o.east; if (oside.length) continue;
    C.nb[d] = o.id; (dx > 0 ? C.east : C.west).push(o.id);
    o.nb[OPP[d]] = C.id; oside.push(C.id);
  }
  const W = { name: L.n, li, gw, gh, cells, idOf, levers: [], lock: li >= 1, places: {}, ports: {}, sections: [], trains: [], names: L.names || {}, rows };
  const bad = m => { throw new Error((L.n || '?') + ': ' + m); };
  const groups = {};
  for (const C of cells.values()) {
    const lo = /[a-z*]/.test(C.ch);
    if (C.east.length > 2 || C.west.length > 2) bad('too many links at ' + C.x + ',' + C.y);
    if (lo) {
      if (!((C.east.length === 2 && C.west.length === 1) || (C.east.length === 1 && C.west.length === 2))) bad('points ' + C.ch + ' at ' + C.x + ',' + C.y + ' need 1+2 links');
      const toeSide = C.west.length === 1 ? -1 : 1, legs = toeSide < 0 ? C.east : C.west, toe = toeSide < 0 ? C.west[0] : C.east[0];
      const straight = legs.find(id => cells.get(id).y === C.y);
      const normal = straight !== undefined ? straight : legs.slice().sort((a, b) => cells.get(a).y - cells.get(b).y)[0];
      C.pts = { toeSide, toe, legs: [normal, legs.find(id => id !== normal)], lever: -1, spring: C.ch === '*' };
      if (C.ch !== '*') (groups[C.ch] = groups[C.ch] || []).push(C.id);
    } else if (C.ch === '+') {
      C.dia = true;
    } else if (C.east.length > 1 || C.west.length > 1) bad('split without points at ' + C.x + ',' + C.y);
    if ('><)('.includes(C.ch)) C.sig = { h: (C.ch === '>' || C.ch === ')') ? 1 : -1, shunt: C.ch === ')' || C.ch === '(', lever: -1 };
    if (/[A-Z]/.test(C.ch)) { C.place = C.ch; (W.places[C.ch] = W.places[C.ch] || []).push(C.id); }
    if (!C.east.length && C.x === gw - 1) { C.port = 1; } else if (!C.west.length && C.x === 0) { C.port = -1; }
    if (C.port) { if (!C.place) bad('open end without a name at ' + C.x + ',' + C.y); W.ports[C.place] = C.id; }
    C.dead = !C.port && (!C.east.length || !C.west.length);
  }
  // single-line sections: runs of ~
  const seen = new Set();
  for (const C of cells.values()) if (C.ch === '~' && !seen.has(C.id)) {
    const sec = new Set(), st = [C.id];
    while (st.length) { const id = st.pop(); if (seen.has(id)) continue; const D = cells.get(id); if (D.ch !== '~') continue; seen.add(id); sec.add(id); st.push(...D.east, ...D.west); }
    W.sections.push({ cells: sec, x: Math.min(...[...sec].map(id => cells.get(id).x)), lever: -1 });
  }
  // levers, numbered left to right the way the frame is laid out
  const lv = [];
  for (const C of cells.values()) if (C.sig) lv.push({ kind: 'sig', cells: [C.id], x: C.x + (C.sig.h < 0 ? 0.4 : 0), y: C.y, h: C.sig.h, shunt: C.sig.shunt });
  for (const k in groups) { const xs = groups[k].map(id => cells.get(id)); lv.push({ kind: 'pts', cells: groups[k], x: Math.min(...xs.map(c => c.x)) + 0.2, y: Math.min(...xs.map(c => c.y)), key: k }); }
  W.sections.forEach((s, i) => lv.push({ kind: 'dir', cells: [...s.cells], x: s.x + 0.1, y: cells.get([...s.cells][0]).y, sec: i }));
  lv.sort((a, b) => a.x - b.x || a.y - b.y);
  lv.forEach((v, i) => { v.n = i + 1; if (v.kind === 'sig') cells.get(v.cells[0]).sig.lever = i; else if (v.kind === 'pts') v.cells.forEach(id => { cells.get(id).pts.lever = i; }); else W.sections[v.sec].lever = i; });
  W.levers = lv;
  if (lv.length > 12) bad('too many levers');
  for (const T of L.trains) {

  }
  D.an.f = clamp(D.acc / TK, 0, 1);
  D.s.lv.forEach((v, i) => { D.lvA[i] += (v - D.lvA[i]) * Math.min(1, dt * 12); });
}
function drawTitle(now) {
  const { c, w, h } = fit($('tcv'));
  c.fillStyle = COL.room; c.fillRect(0, 0, w, h);
  const fh = clamp(h * 0.16, 70, 140);
  if (!DEMO.W) return;
  const top = $('title').firstElementChild.getBoundingClientRect(), bot = $('tgo').getBoundingClientRect();
  const y0 = top.bottom + 12, y1 = bot.top - 12;
  if (y1 - y0 > 60) drawBoard(c, geom(DEMO.W, 12, y0, w - 24, y1 - y0), DEMO.W, DEMO.s, DEMO.an, now);
  drawFrame(c, 0, h - fh, w, fh, DEMO.W, DEMO.s, DEMO.lvA, DEMO.shake, null, now);
}

/* ============================== the lines ============================== */
const STAR = on => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.75 5.9 6.45.72-4.8 4.36 1.35 6.37L12 16.9l-5.75 3.25 1.35-6.37-4.8-4.36 6.45-.72z" fill="' + (on ? '#b8963f' : 'none') + '" stroke="#17211d" stroke-width="1.6" stroke-linejoin="round"/></svg>';
function openLines(tab) {
  mode = 'lines'; stopRun();
  if (tab !== undefined) S.tab = tab;
  ['title', 'game', 'done', 'notice'].forEach(id => $(id).classList.remove('show'));
  $('lines').classList.add('show'); $('tcv').style.display = 'none';
  buildLines();
}
function buildLines() {
  $('starCount').textContent = totalStars() + ' of ' + LEVELS.length * 3 + ' stars';
  $('tabs').innerHTML = LINES.map((l, li) => '<button role="tab" data-li="' + li + '" class="' + (li === S.tab ? 'on' : '') + '" aria-selected="' + (li === S.tab) + '"><span class="chip" style="background:' + LINE[li].c + '"></span>' + (li + 1) + ' ' + l.name + '</button>').join('');
  $('tabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { S.tab = +b.dataset.li; persist(); buildLines(); }));
  const li = S.tab, info = LINE[li];
  $('lineBoard').textContent = LINES[li].name; $('lineBoard').style.background = info.c;
  $('lineIdea').textContent = info.idea;
  const open = lineOpen(li);
  $('lineLock').textContent = open ? solvedIn(li) + ' of ' + PER + ' stations worked.' : 'Opens when you have worked ' + OPEN_NEXT + ' stations on ' + LINES[li - 1].name + '. So far: ' + solvedIn(li - 1) + '.';
  $('stations').innerHTML = LEVELS.filter(x => x.li === li).map(x => {
    const ok = stationOpen(x), st = starsOf(x.g);
    const sub = solved(x.g) ? 'Best ' + S.best[x.g] + ' pulls, par ' + PAR[x.g] : ok ? 'Par ' + PAR[x.g] + ' pulls' : 'Work the station before it first';
    return '<button class="st" data-g="' + x.g + '"' + (ok ? '' : ' disabled') + '><span class="n num">' + (x.i + 1) + '</span><span class="nm">' + x.L.n + '<span class="sub">' + sub + '</span></span><span class="ss">' + STAR(st > 0) + STAR(st > 1) + STAR(st > 2) + '</span></button>';
  }).join('');
  $('stations').querySelectorAll('.st').forEach(b => b.addEventListener('click', () => startPuzzle(+b.dataset.g)));
}

/* ============================== working a station ============================== */
let G = null;
const TICK = 0.62;
function startPuzzle(g) {
  const x = LEVELS[g];
  mode = 'game';
  ['title', 'lines', 'done', 'notice'].forEach(id => $(id).classList.remove('show'));
  $('game').classList.add('show'); $('tcv').style.display = 'none';
  const W = build(x.L, x.li);
  G = { g, x, W, s: fresh(W), running: false, acc: 0, over: null, noteT: 0, pan: 0, panMax: 0, lvA: W.levers.map(() => 0), shake: W.levers.map(() => 0) };
  G.an = { prev: G.s.tr.map(o => (o.st === 1 || o.st === 2) ? -1 : -2), f: 0, t0: 0, exitK: new Set() };
  $('gBoard').textContent = x.L.n; $('gBoard').style.background = LINE[x.li].c;
  $('gLine').textContent = 'Line ' + (x.li + 1) + ', ' + LINES[x.li].name + ', station ' + (x.i + 1) + ' of ' + PER;
  setNote();
  syncRun(); updateSide();
  window.TTG?.track('level_start', { level: g + 1 });
  if (!S.seen[x.li]) { S.seen[x.li] = true; persist(); $('noticeH').textContent = LINE[x.li].head; $('noticeP').textContent = LINE[x.li].notice; $('notice').classList.add('show'); }
  requestAnimationFrame(() => { layout(); });
}
function setNote(html, warn) {
  const n = $('note');
  if (html) { n.innerHTML = html; n.className = warn ? 'warn' : ''; G.noteT = 4.5; }
  else { n.textContent = NOTES[G.x.L.n] || ''; n.className = ''; G.noteT = 0; }
}
const code = k => '<b>' + G.W.trains[k].code + '</b>';
const lvN = j => G.W.levers[j].n;
function lockText(i, lk) {
  const n = lvN(i), V = G.W.levers[i];
  const who = V.kind === 'sig' ? 'Signal ' + n + ' will not come off: ' : 'Lever ' + n + ' is locked: ';
  switch (lk.why) {
    case 'train': return who + code(lk.k) + ' is standing on the points.';
    case 'reads': return who + 'signal ' + lvN(lk.j) + ' is off over this line. Put ' + lvN(lk.j) + ' back first.';
    case 'held': return who + code(lk.k) + ' has not cleared the road yet.';
    case 'onsingle': return who + code(lk.k) + ' is on the single line.';
    case 'against': return who + 'the points ahead are set against it.';
    case 'occupied': return who + code(lk.k) + ' is on the line ahead.';
    case 'conflict': return who + 'signal ' + lvN(lk.j) + ' is off for a road that crosses it.';
    case 'direction': return who + 'the single line is set the other way. Lever ' + lvN(lk.j) + ' sets it.';
  }
  return who + 'the frame will not allow it.';
}
function tryPull(i) {
  if (!G || G.over || i < 0 || i >= G.W.levers.length) return;
  audio(); if (AC && AC.state === 'suspended') AC.resume();
  const lk = lockOf(G.W, G.s, i);
  if (lk) { G.shake[i] = 0.35; sfxLocked(); setNote(lockText(i, lk), true); return; }
  pull(G.W, G.s, i); sfxLever();
  if (G.s.fail) { failed(); return; }
  updateSide();
}
function stopRun() { if (G) { G.running = false; syncRun(); } }
function syncRun() { if (!G) return; $('runBtn').textContent = G.running ? 'Stop' : 'Start'; $('fastBtn').classList.toggle('on', S.fast); $('fastBtn').setAttribute('aria-pressed', S.fast); $('stepBtn').disabled = G.running || !!G.over; $('runBtn').disabled = !!G.over; }
function doTick() {
  const s = G.s;
  G.an = { prev: s.tr.map(o => (o.st === 1 || o.st === 2) ? o.c : -1), f: 0, exitK: new Set(), bump: null };
  tick(G.W, s);
  let inN = 0;
  for (const e of s.ev) {
    if (e[0] === 'enter') bell(1);
    if (e[0] === 'out') { G.an.exitK.add(e[1]); inN++; }
    if (e[0] === 'in') inN++;
  }
  if (inN) bell(2, 0.2);
  if (s.fail) { failed(); return; }
  if (s.won) { won(); return; }
  updateSide();
}
const FAILS = {
  collide: f => ['Collision', code(f.k) + ' and ' + code(f.q) + ' met on the same line.'],
  derail: f => ['Off the road', code(f.k) + ' ran through points set against it.'],
  moved: f => ['Off the road', 'The points moved under ' + code(f.k) + '.'],
  wrong: f => ['Wrong road', code(f.k) + ' went out the wrong way, towards ' + nameOf(G.W, G.W.cells.get(f.c).place) + '.'],
  buffers: f => ['Buffer stop', code(f.k) + ' ran into the buffers.'],
  late: f => ['Late', code(f.k) + ' was due at ' + hhmm(G.W.trains[f.k].due) + ' and is not in.'],
};
function failed() {
  const f = G.s.fail; G.over = 'fail'; G.running = false; syncRun(); updateSide();
  G.an.bump = new Set([f.k, f.q].filter(k => k !== undefined));
  sfxCrash();
  window.TTG?.track('level_fail', { level: G.g + 1 });
  const [h, p] = (FAILS[f.why] || (() => ['Stopped', 'Something went wrong.']))(f);
  setTimeout(() => {
    if (!G || mode !== 'game') return;
    $('doneH').textContent = h; $('doneP').innerHTML = p; $('doneStars').innerHTML = ''; $('doneN').textContent = '';
    $('doneAct').innerHTML = '<button class="btn go" id="dAgain">Try again</button><button class="btn" id="dBack">Back</button>';
    $('dAgain').addEventListener('click', () => startPuzzle(G.g)); $('dBack').addEventListener('click', () => openLines(G.x.li));
    $('done').classList.add('show'); $('dAgain').focus();
  }, 950);
}
function won() {
  const g = G.g, n = G.s.pulls, st = starsFor(g, n), before = starsOf(g), opened = [];
  for (let li = 1; li < LINES.length; li++) if (!lineOpen(li)) opened.push(li);
  G.over = 'won'; G.running = false; syncRun(); updateSide();
  if (!(S.best[g] <= n)) S.best[g] = n;
  persist();
  window.TTG?.track('level_complete', { level: g + 1, value: st });
  const nowOpen = opened.filter(li => lineOpen(li));
  nowOpen.forEach(li => window.TTG?.track('village_levelup', { level: li + 1 }));
  bell(3, 0.18); bell(3, 0.18);
  setTimeout(() => {
    if (!G || mode !== 'game') return;
    $('doneH').textContent = 'All trains in';
    let p = st === 3 ? 'Worked at par. That is as few pulls as this box allows.' : 'Par here is ' + PAR[g] + ' pulls. Work it at par for three stars.';
    if (starsOf(g) > before && before > 0) p = 'A better day than last time. ' + p;
    if (nowOpen.length) p += ' ' + LINES[nowOpen[0]].name + ' is open.';
    $('doneP').textContent = p;
    $('doneStars').innerHTML = STAR(st > 0) + STAR(st > 1) + STAR(st > 2);
    $('doneN').textContent = n + ' pulls, par ' + PAR[g];
    const next = LEVELS[g + 1] && LEVELS[g + 1].li === G.x.li && stationOpen(LEVELS[g + 1]) ? g + 1 : nowOpen.length ? LEVELS.findIndex(x => x.li === nowOpen[0]) : -1;
    $('doneAct').innerHTML = (next >= 0 ? '<button class="btn go" id="dNext">Next station</button>' : '') + '<button class="btn" id="dAgain">Try again</button><button class="btn" id="dBack">Back</button>';
    if (next >= 0) $('dNext').addEventListener('click', () => startPuzzle(next));
    $('dAgain').addEventListener('click', () => startPuzzle(g)); $('dBack').addEventListener('click', () => openLines(G.x.li));
    $('done').classList.add('show'); ($('dNext') || $('dAgain')).focus();
  }, 800);
}
function statusOf(k) {
  const W = G.W, s = G.s, o = s.tr[k], T = W.trains[k];
  if (o.st === 0) return s.t < T.at ? 'Due in ' + hhmm(T.at) : 'Waiting to come in';
  if (o.st >= 2) return 'In at ' + hhmm(o.arr);
  if (o.dw > 0) return o.rv ? 'Reversing' : 'Calling at ' + cap(nameOf(W, T.stages[o.s - 1].p));
  const C = W.cells.get(o.c);
  if (C.sig && C.sig.h === o.h && !s.lv[C.sig.lever]) return 'At signal ' + W.levers[C.sig.lever].n;
  if (G.an && G.an.prev && G.an.prev[k] === o.c && s.t > 0) return 'Stopped';
  return 'Running';
}
function updateSide() {
  if (!G) return;
  const W = G.W, s = G.s;
  $('clock').textContent = hhmm(s.t);
  $('pulls').innerHTML = '<b>' + s.pulls + '</b>pulls, par ' + PAR[G.g];
  $('tt').innerHTML = W.trains.map((T, k) => {
    const o = s.tr[k], last = T.stages[T.stages.length - 1].p;
    const via = T.stages.slice(0, -1).map(st => (st.rev || W.cells.get(W.places[st.p][0]).dead) ? 'reverses at ' + nameOf(W, st.p) : 'calls at ' + cap(nameOf(W, st.p)));
    const late = s.fail && s.fail.why === 'late' && s.fail.k === k;
    const tm = o.st >= 2 ? hhmm(o.arr) + '<small>in</small>' : T.due ? hhmm(T.due) + '<small>due</small>' : '';
    return '<div class="tr' + (o.st >= 2 ? ' in' : '') + (late ? ' late' : '') + '"><span class="hc">' + T.code + '</span><span class="to">to ' + cap(nameOf(W, last)) + (via.length ? ', ' + via.join(', ') : '') + '<span class="stt">' + statusOf(k) + (T.slow ? ', goods' : '') + '</span></span><span class="tm num">' + tm + '</span></div>';
  }).join('');
}
function drawGame(now) {
  if (!G) return;
  const d = fit($('dcv'));
  d.c.fillStyle = COL.room; d.c.fillRect(0, 0, d.w, d.h);
  // a wide line on a narrow screen keeps a readable size and pans sideways
  const gm = geom(G.W, 8, 8, d.w - 16, d.h - 16, land ? 0 : 22);
  G.panMax = Math.max(0, gm.bw - (d.w - 16));
  G.pan = clamp(G.pan || 0, 0, G.panMax);
  if (G.panMax > 0) { const dx = 8 - gm.bx - G.pan; gm.bx += dx; gm.ox += dx; }
  drawBoard(d.c, gm, G.W, G.s, G.an, now);
  if (G.panMax > 0) {
    const cy = gm.by + gm.bh / 2;
    const arrow = (x, dir) => { d.c.fillStyle = COL.room; d.c.fillRect(dir < 0 ? 0 : d.w - 26, gm.by, 26, gm.bh); d.c.strokeStyle = COL.amber; d.c.lineWidth = 3; d.c.lineCap = 'round'; d.c.beginPath(); d.c.moveTo(x - dir * 5, cy - 9); d.c.lineTo(x + dir * 4, cy); d.c.lineTo(x - dir * 5, cy + 9); d.c.stroke(); };
    if (G.pan > 1) arrow(12, -1);
    if (G.pan < G.panMax - 1) arrow(d.w - 12, 1);
  }
  const fr = fit($('fcv'));
  fr.c.fillStyle = COL.room; fr.c.fillRect(0, 0, fr.w, fr.h);
  const locks = G.W.lock && !G.over ? G.W.levers.map((v, i) => !!lockOf(G.W, G.s, i)) : null;
  drawFrame(fr.c, 0, 0, fr.w, fr.h, G.W, G.s, G.lvA, G.shake, locks, now);
}

/* ============================== input ============================== */
let drag = null;
$('dcv').addEventListener('pointerdown', e => { if (G && G.panMax > 0) { drag = { x: e.clientX, p: G.pan }; $('dcv').setPointerCapture(e.pointerId); } });
$('dcv').addEventListener('pointermove', e => { if (drag && G) G.pan = clamp(drag.p - (e.clientX - drag.x), 0, G.panMax); });
['pointerup', 'pointercancel'].forEach(k => $('dcv').addEventListener(k, () => { drag = null; }));
$('fcv').addEventListener('pointerdown', e => {
  if (!G) return;
  const r = $('fcv').getBoundingClientRect(), { n, p, x0 } = frameGeom(G.W, 0, 0, r.width, r.height);
  const i = Math.floor((e.clientX - r.left - (x0 - p / 2)) / p);
  if (i >= 0 && i < n) tryPull(i);
});
$('runBtn').addEventListener('click', () => { if (!G || G.over) return; audio(); if (AC && AC.state === 'suspended') AC.resume(); G.running = !G.running; if (G.running) G.acc = TICK * 0.999; syncRun(); });
$('stepBtn').addEventListener('click', () => { if (!G || G.over || G.running) return; audio(); doTick(); });
$('fastBtn').addEventListener('click', () => { S.fast = !S.fast; persist(); syncRun(); });
$('resetBtn').addEventListener('click', () => { if (G) startPuzzle(G.g); });
$('gameBack').addEventListener('click', () => openLines(G ? G.x.li : S.tab));
$('linesBack').addEventListener('click', () => { mode = 'title'; $('lines').classList.remove('show'); $('title').classList.add('show'); $('tcv').style.display = ''; titleStat(); layout(); });
$('noticeOk').addEventListener('click', () => $('notice').classList.remove('show'));
$('playBtn').addEventListener('click', () => { audio(); if (AC && AC.state === 'suspended') AC.resume(); S.started = true; persist(); window.TTG?.track('game_launch'); openLines(); });
$('muteBtn').addEventListener('click', () => { audio(); setMuted(!S.muted); });
document.addEventListener('keydown', e => {
  if (mode !== 'game' || !G || $('notice').classList.contains('show') || $('done').classList.contains('show')) return;
  if (/^[0-9]$/.test(e.key)) { tryPull(e.key === '0' ? 9 : +e.key - 1); e.preventDefault(); }
  else if (e.key === ' ') { $('runBtn').click(); e.preventDefault(); }
  else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowRight') $('stepBtn').click();
  else if (e.key === 'r' || e.key === 'R') $('resetBtn').click();
  else if (e.key === 'f' || e.key === 'F') $('fastBtn').click();
});
document.addEventListener('touchmove', e => {
  let n = e.target;
  while (n && n !== document.body) { if (n.scrollHeight > n.clientHeight + 1 || n.scrollWidth > n.clientWidth + 1) { const cs = getComputedStyle(n); if (/auto|scroll/.test(cs.overflowY + cs.overflowX)) return; } n = n.parentElement; }
  if (e.cancelable) e.preventDefault();
}, { passive: false });
function titleStat() { $('tstat').textContent = S.started ? totalStars() + ' of ' + LEVELS.length * 3 + ' stars in the register.' : ''; if (S.started) $('playBtn').textContent = 'Back to the box'; }

/* ============================== loop ============================== */
let last = performance.now(), running = true;
function frame(now) {
  if (!running) return;
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const t = now / 1000;
  if (mode === 'title') { demoStep(dt); drawTitle(t); }
  if (mode === 'game' && G) {
    if (G.running && !G.over && !$('notice').classList.contains('show')) {
      G.acc += dt * (S.fast ? 3 : 1);
      if (G.acc >= TICK) { G.acc -= TICK; doTick(); }
    }
    G.an.f = G.running || G.an.f < 1 ? clamp(G.an.f + dt * (S.fast ? 3 : 1) / TICK * (G.running ? 1 : 1.6), 0, 1) : 1;
    G.s.lv.forEach((v, i) => { G.lvA[i] += (v - G.lvA[i]) * Math.min(1, dt * 14); if (G.shake[i] > 0) G.shake[i] -= dt; });
    if (G.noteT > 0) { G.noteT -= dt; if (G.noteT <= 0 && !G.over) setNote(); }
    drawGame(t);
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; if (G) stopRun(); persist(); if (AC && AC.state === 'running') AC.suspend(); }
  else { if (running) return; running = true; last = performance.now(); if (AC && AC.state === 'suspended' && !S.muted) AC.resume(); requestAnimationFrame(frame); }
});
window.addEventListener('pagehide', persist);
window.addEventListener('resize', () => { layout(); if (mode === 'lines') buildLines(); });
if (/[?&]debug(&|=|$)/.test(location.search)) window.__sb = {
  S: () => S, G: () => G, LEVELS, PAR,
  state: () => G && ({ g: G.g, t: G.s.t, pulls: G.s.pulls, lv: G.s.lv.slice(), won: G.s.won, fail: G.s.fail, tr: G.s.tr.map(o => [o.st, o.c, o.h]) }),
  pull: i => tryPull(i), tick: () => G && !G.over && doTick(), start: g => startPuzzle(g),
  solve: g => { const x = LEVELS[g]; const W = build(x.L, x.li); const r = solve(W, 5e6); return { pulls: r.pulls, path: r.path }; },
  play: g => { const x = LEVELS[g]; startPuzzle(g); $('notice').classList.remove('show'); const r = solve(build(x.L, x.li), 5e6); let pi = 0; for (let n = 0; n < 900 && !G.over; n++) { while (pi < r.path.length && r.path[pi][0] === G.s.t) { tryPull(r.path[pi][1]); pi++; } doTick(); } return { over: G.over, pulls: G.s.pulls, par: PAR[g] }; },
  win: (g, n) => { S.best[g] = n || PAR[g]; persist(); },
};
setMuted(S.muted, true);
titleStat();
layout();
demoReset();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
