<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pinball Almanac | TaterTot Games</title>
<meta name="theme-color" content="#1d2340">
<link rel="icon" href="data:,">
<script src="/analytics.js" defer></script>
<style>
  :root {
    --navy: #1d2340; --navy2: #141a33; --paper: #efe6d2; --paper2: #e4d8bd; --rule: #cbbd9c; --ink: #1d2340; --ink2: #4a4f68; --faint: #857f70;
    --verm: #e4472f; --verm-btn: #c7361f; --mari: #f3b21f; --teal: #178f86; --pink: #d9487c;
    --cond: "Bahnschrift", "Roboto Condensed", "Arial Narrow", "sans-serif-condensed", "Segoe UI", system-ui, sans-serif;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy2); touch-action: none; overscroll-behavior: none; position: fixed; inset: 0; }
  body { font-family: var(--sans); color: var(--ink); font-size: 14px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  ::selection { background: var(--verm); color: #fff; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--verm); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums lining-nums; }
  .cond { font-family: var(--cond); font-stretch: condensed; }

  .btn { min-height: 44px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 4px; font-family: var(--cond); font-stretch: condensed; font-size: 17px; font-weight: 700; letter-spacing: .02em;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--paper); color: var(--ink); transition: background-color .1s ease-out, transform .1s ease-out; }
  .btn:hover:not(:disabled) { background: #f7f0e1; }
  .btn:active:not(:disabled) { background: var(--ink); color: var(--paper); transform: translateY(1px); }
  .btn:disabled { color: var(--faint); border-color: var(--rule); background: repeating-linear-gradient(135deg, rgba(29,35,64,.08) 0 1px, transparent 1px 5px), var(--paper2); cursor: default; }
  .btn.go { background: var(--verm-btn); border-color: var(--verm-btn); color: #fff; }
  .btn.go:hover:not(:disabled) { background: #b32f1a; }
  .btn.go:active:not(:disabled) { background: #8f2514; border-color: #8f2514; }
  .btn.sm { min-height: 36px; padding: 0 12px; font-size: 15px; }
  .btn.icon { width: 44px; padding: 0; }
  .btn svg { width: 20px; height: 20px; }

  #muteBtn, #pauseBtn { position: fixed; width: 40px; height: 40px; display: none; align-items: center; justify-content: center; z-index: 4;
    background: rgba(239, 230, 210, .95); border: 2px solid var(--ink); border-radius: 4px; color: var(--ink); }
  #muteBtn svg, #pauseBtn svg { width: 20px; height: 20px; }
  #muteBtn:active, #pauseBtn:active { background: var(--ink); color: var(--paper); }

  .screen { position: fixed; inset: 0; display: none; z-index: 10; }
  .screen.show { display: flex; }
  .page { background: var(--paper); overflow: hidden; }
  .scrim { background: rgba(14, 18, 36, .66); align-items: center; justify-content: center; padding: 14px; }
  .panel { width: min(420px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 22px 20px 20px; text-align: center; touch-action: pan-y; }
  .panel h2 { font-family: var(--cond); font-stretch: condensed; font-size: 30px; font-weight: 800; line-height: 1; }
  .panel p { margin-top: 8px; color: var(--ink2); }
  .panel .act { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .big { font-family: var(--cond); font-stretch: condensed; font-weight: 800; font-size: 44px; line-height: 1; margin-top: 10px; }
  .earned { margin-top: 12px; display: grid; gap: 6px; text-align: left; }
  .earned div { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; font-size: 14px; }

  /* title: the flyer */
  #title { flex-direction: column; justify-content: space-between; padding: max(6vh, 20px) 18px 18px; text-align: center; color: var(--paper);
    background: linear-gradient(180deg, rgba(20,26,51,.94) 0%, rgba(20,26,51,.55) 30%, rgba(20,26,51,0) 48%, rgba(20,26,51,0) 64%, rgba(20,26,51,.94) 100%); }
  #title h1 { font-family: var(--cond); font-stretch: condensed; font-weight: 800; font-size: clamp(46px, min(15vw, 13vh), 120px); line-height: .86; letter-spacing: -.01em;
    transform: rotate(-4deg); color: var(--mari); text-shadow: 3px 3px 0 var(--verm); }
  #title h1 span { display: block; color: var(--paper); text-shadow: 3px 3px 0 var(--teal); }
  #title .tag { margin-top: 18px; font-size: clamp(14px, 3.6vw, 17px); font-weight: 600; color: #e8dfca; }
  #title .go { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #title .btn.go { min-height: 54px; padding: 0 30px; font-size: 21px; }
  #title .stat { font-size: 13px; color: #e8dfca; font-weight: 600; }
  #badge { color: #e8dfca; font-size: 13px; font-weight: 600; text-decoration: none; border-bottom: 2px solid var(--mari); padding: 6px 2px 2px; }
  body.land #title { align-items: flex-start; text-align: left; padding: max(8vh, 20px) 5vw max(6vh, 16px);
    background: linear-gradient(90deg, rgba(20,26,51,.96) 0%, rgba(20,26,51,.85) 30%, rgba(20,26,51,0) 44%); }
  body.land #title .go { align-items: flex-start; }
  body.land #title > div { max-width: 34vw; }

  /* the almanac */
  #almanac { flex-direction: column; }
  #alTop { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-bottom: 2px solid var(--ink); }
  #alTop .pg { font-family: var(--cond); font-stretch: condensed; font-weight: 700; font-size: 16px; color: var(--ink2); }
  #alBody { flex: 1 1 auto; display: grid; min-height: 0; }
  body.port #alBody { grid-template-rows: minmax(0, 44%) minmax(0, 1fr); }
  body.land #alBody { grid-template-columns: minmax(0, 40%) minmax(0, 1fr); }
  #prevWrap { position: relative; background: var(--navy); min-height: 0; overflow: hidden; }
  #prev { position: absolute; inset: 0; width: 100%; height: 100%; }
  #alInfo { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 14px 16px 18px; }
  #alName { font-family: var(--cond); font-stretch: condensed; font-weight: 800; font-size: clamp(34px, 7vw, 54px); line-height: .92; transform: rotate(-2deg); transform-origin: left; }
  #alSub { margin-top: 6px; color: var(--ink2); font-size: 14px; }
  #alHi { margin-top: 4px; font-size: 14px; }
  .h3 { margin-top: 16px; font-family: var(--cond); font-stretch: condensed; font-weight: 800; font-size: 20px; }
  .missions { margin-top: 6px; display: grid; gap: 4px; }
  .missions div { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; font-size: 14px; }
  .missions div.got { color: var(--ink); } .missions div.no { color: var(--ink2); }
  .star { width: 20px; height: 20px; display: block; }
  .sock { margin-top: 8px; }
  .sock .lab { font-size: 12.5px; font-weight: 700; color: var(--ink2); margin-bottom: 4px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .seg button { min-height: 38px; font-family: var(--cond); font-stretch: condensed; font-size: 15px; font-weight: 700; padding: 0 4px; border-left: 1px solid var(--rule); }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .seg button:disabled { color: var(--faint); background: repeating-linear-gradient(135deg, rgba(29,35,64,.08) 0 1px, transparent 1px 5px); cursor: default; }
  .partnote { margin-top: 4px; font-size: 12.5px; color: var(--ink2); }
  #alPlay { margin-top: 16px; width: 100%; min-height: 52px; font-size: 21px; }
  #lockNote { margin-top: 10px; font-size: 14px; color: var(--ink2); }
  #keys { margin-top: 14px; font-size: 12.5px; color: var(--ink2); }
  @media (max-height: 520px) { #alTop { padding: 6px 10px; } .btn { min-height: 38px; } #alPlay { min-height: 44px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="port">
<canvas id="view"></canvas>
<button id="pauseBtn" aria-label="Pause">
  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
</button>
<button id="muteBtn" aria-label="Sound on or off">
  <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
  <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" style="display:none"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<div id="title" class="screen show">
  <div>
    <h1>Pinball<span>Almanac</span></h1>
    <p class="tag">Four tables, one for each season. Flip, nudge, and fill the almanac.</p>
  </div>
  <div class="go">

    <div class="stat num" id="titleStat"></div>
    <a id="badge" href="https://tatertotgames.com">tatertotgames.com</a>
  </div>
</div>

<div id="almanac" class="screen page">
  <div id="alTop">
    <button class="btn sm" id="alBack">Back</button>
    <span class="pg num" id="alPage"></span>
    <span style="display:flex;gap:8px">
      <button class="btn icon" id="alPrevBtn" aria-label="Previous table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn icon" id="alNextBtn" aria-label="Next table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </span>
  </div>
  <div id="alBody">
    <div id="prevWrap"><canvas id="prev"></canvas></div>
    <div id="alInfo">
      <div id="alName"></div>
      <div id="alSub"></div>
      <div id="alHi" class="num"></div>
      <div id="alRest"></div>
    </div>
  </div>
</div>

<div id="pause" class="screen scrim">
  <div class="panel">
    <h2>Paused</h2>
    <p>The ball waits where it is.</p>
    <div class="act"><button class="btn go" id="resumeBtn">Resume</button><button class="btn" id="quitBtn">Back</button></div>
  </div>
</div>

<div id="over" class="screen scrim">
  <div class="panel">
    <h2 id="overTitle">Game over</h2>
    <div class="big num" id="overScore"></div>
    <p id="overSub" class="num"></p>
    <div class="earned" id="overStars"></div>
    <div class="act"><button class="btn go" id="againBtn">Play again</button><button class="btn" id="overBack">Back</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgba(h, a) { const c = hex(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function mixC(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => clamp(Math.round(v + (B[i] - v) * t), 0, 255).toString(16).padStart(2, '0')).join(''); }
const fmt = n => Math.floor(n).toLocaleString('en-US');
const COND = getComputedStyle(document.documentElement).getPropertyValue('--cond');

/* ============================== the four tables ============================== */
const NAVY = '#1d2340', PAPER = '#efe6d2', VERM = '#e4472f', MARI = '#f3b21f', TEAL = '#178f86', PINK = '#d9487c';
const TABLES = [
  { id: 'fair', n: 'County Fair', sub: 'The spring table. Rides, prizes and a strongman bell.', word: 'FAIR', i1: VERM, i2: MARI, art: 'fair', ramps: ['L'], saucer: [70, 60], eject: [-46, 10],
    bumpers: [[34, 42], [50, 36], [44, 54]], bank: 3, target: 200000, sockets: [[33, 60], [62, 80]], need: 0,
    modes: [{ n: 'Ride the Wheel', k: 'orbit', goal: 4, t: 30 }, { n: 'Test Your Strength', k: 'bank', goal: 2, t: 35 }, { n: 'Prize Pig', k: 'ramp', goal: 3, t: 30 }], wizard: 'Fireworks Night' },
  { id: 'tide', n: 'Tidewater', sub: 'The summer table. A lighthouse, a harbour and the tide coming in.', word: 'TIDE', i1: TEAL, i2: MARI, art: 'tide', ramps: ['R'], saucer: [47.5, 62], eject: [-44, 12],
    bumpers: [[32, 40], [62, 40]], bank: 3, target: 300000, sockets: [[29, 62], [47.5, 42]], need: 3,
    modes: [{ n: 'Riptide', k: 'orbit', goal: 4, t: 30 }, { n: 'Net the Catch', k: 'bank', goal: 2, t: 35 }, { n: 'Beacon Run', k: 'ramp', goal: 3, t: 30 }], wizard: 'Spring Tide' },
  { id: 'rail', n: 'Night Train', sub: 'The autumn table. Two ramps, a coal bunker and a long way to go.', word: 'RAIL', i1: VERM, i2: TEAL, art: 'rail', ramps: ['L', 'R'], saucer: [70, 58], eject: [-46, 10],
    bumpers: [[34, 42], [50, 36], [44, 54]], bank: 3, target: 400000, sockets: [[33, 60], [54, 78]], need: 7,
    modes: [{ n: 'Express', k: 'ramp', goal: 4, t: 30 }, { n: 'Switchyard', k: 'orbit', goal: 5, t: 30 }, { n: 'Coal Bunker', k: 'bumper', goal: 30, t: 30 }], wizard: 'Through the Night' },
  { id: 'star', n: 'Comet Year', sub: 'The winter table. Long cold nights and a comet coming round.', word: 'STAR', i1: PINK, i2: TEAL, art: 'star', ramps: ['L', 'R'], saucer: [47.5, 62], eject: [44, 12],
    bumpers: [[33, 40], [48, 32], [62, 42]], bank: 4, target: 500000, sockets: [[33, 60], [54, 78]], need: 12,
    modes: [{ n: 'Comet Chase', k: 'ramp', goal: 4, t: 30 }, { n: 'Star Field', k: 'bumper', goal: 30, t: 30 }, { n: 'Slingshot Orbit', k: 'orbit', goal: 5, t: 30 }], wizard: 'Perihelion' },
];
const MISSIONS = [
  t => 'Score ' + fmt(t.target) + ' in one game.',
  t => 'Light every letter of ' + t.word + '.',
  t => 'Lock two balls and start multiball.',
  t => 'Finish one of the three modes.',
  t => 'Collect a jackpot during multiball.',
  t => 'Finish all three modes and start ' + t.wizard + '.',
];
const PARTS = {
  none: { n: 'Empty', t: 'Nothing in this socket.', need: 0 },
  bumper: { n: 'Bumper', t: 'Another pop bumper. Every hit scores and keeps the ball busy.', need: 0 },
  spinner: { n: 'Spinner', t: 'A spinning gate. Hit it fast and it spins for points.', need: 2 },
  bullseye: { n: 'Bullseye', t: 'A round target. Every third hit raises the bonus multiplier.', need: 6 },
};
const CABINET = {
  none: { n: 'None', t: 'The cabinet runs as it came.', need: 0 },
  kickback: { n: 'Kickback', t: 'Fires a ball back out of the left outlane. Completing the top lanes lights it again.', need: 4 },
  saver: { n: 'Long save', t: 'Ball save lasts twenty seconds instead of eight.', need: 9 },
  lucky: { n: 'Lucky start', t: 'Every ball starts with the bonus multiplier at 2x.', need: 13 },
  fortune: { n: 'Fortune', t: 'The first ball starts with an extra ball lit at the saucer.', need: 17 },
};

/* ============================== save ============================== */
const KEY = 'ttg_pinball';
function fresh() { return { v: 1, started: false, muted: false, page: 0, stars: {}, hi: {}, fit: {}, games: 0, lastSeen: Date.now() }; }
function loadSave() {
  let s = null; try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { s = null; }
  const o = s && typeof s === 'object' ? Object.assign(fresh(), s) : fresh();
  ['stars', 'hi', 'fit'].forEach(k => { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; });
  TABLES.forEach(t => { const a = o.stars[t.id]; o.stars[t.id] = Array.isArray(a) ? a.slice(0, 6).map(Boolean) : [0, 0, 0, 0, 0, 0].map(Boolean);
    while (o.stars[t.id].length < 6) o.stars[t.id].push(false); if (!isFinite(o.hi[t.id])) o.hi[t.id] = 0;
    const f = o.fit[t.id]; o.fit[t.id] = { s1: f && PARTS[f.s1] ? f.s1 : 'bumper', s2: f && PARTS[f.s2] ? f.s2 : 'none', cab: f && CABINET[f.cab] ? f.cab : 'none' }; });
  o.page = clamp(o.page | 0, 0, TABLES.length - 1); o.muted = !!o.muted;
  return o;
}
let S = loadSave();
function persist() { S.lastSeen = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage blocked */ } }
const totalStars = () => TABLES.reduce((n, t) => n + S.stars[t.id].filter(Boolean).length, 0);
const tableOpen = i => totalStars() >= TABLES[i].need;

/* ============================== audio: chimes, thunks and a knocker ============================== */
let AC = null, master = null, noiseBuf = null;
function audio() {
  if (AC) return AC;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = S.muted ? 0 : 0.8; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.3, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
  return AC;
}
const live = () => AC && !S.muted && AC.state === 'running' && !demo;
function tone(f, dur, vol, type, delay) {
  if (!live()) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function thud(freq, dur, vol) {
  if (!live()) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const sfxFlip = () => thud(900, 0.06, 0.25);
const sfxBumper = () => { thud(500, 0.12, 0.5); tone(180, 0.1, 0.06, 'square'); };
const sfxSling = () => thud(1400, 0.07, 0.3);
const sfxTarget = () => { thud(2400, 0.04, 0.2); tone(1320, 0.12, 0.03, 'triangle'); };
const sfxRamp = () => [440, 554, 659].forEach((f, i) => tone(f, 0.18, 0.04, 'triangle', i * 0.06));
const sfxKnock = () => { thud(160, 0.25, 0.9); };
const sfxDrain = () => { tone(220, 0.4, 0.05, 'sawtooth'); tone(147, 0.6, 0.05, 'sawtooth', 0.15); };
const CHIME = { 10: 1568, 100: 1047, 1000: 784, 10000: 523 };
let chimeT = 0;
function chime(place) { const now = performance.now(); if (now - chimeT < 45) return; chimeT = now; const f = CHIME[Math.min(10000, place)] || 523; tone(f, 0.5, 0.035, 'sine'); tone(f * 2.01, 0.3, 0.012, 'sine'); }
function setMuted(m, keep) { S.muted = m; if (master) master.gain.value = m ? 0 : 0.8; $('icoOn').style.display = m ? 'none' : ''; $('icoOff').style.display = m ? '' : 'none'; if (!keep) persist(); }

/* ============================== the table: geometry ============================== */
const TW = 100, TH = 184, BR = 2.2, GRAV = 138, VMAX = 330, SUB = 12;
const mx = x => 95 - x;
function archPts() { const p = []; for (let i = 0; i <= 30; i++) { const t = Math.PI + Math.PI * i / 30; p.push([50.5 + 46.5 * Math.cos(t), 34 + 30 * Math.sin(t)]); } return p; }
function rampPath(side) {
  const L = [[25.5, 74], [23, 44], [31, 22], [47, 14], [64, 18], [78, 32], [80.75, 70], [80.75, 112]];
  return side === 'L' ? L : L.map(p => [mx(p[0]), p[1]]);
}
function orbitPath(side) {
  const L = [[8, 86], [6, 56], [10, 28], [26, 12], [47, 7], [70, 12], [82, 22], [76, 30]];
  return side === 'L' ? L : L.map(p => [mx(p[0]), p[1]]);
