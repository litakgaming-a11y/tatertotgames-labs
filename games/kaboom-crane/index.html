<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kaboom Crane — TaterTot Games Labs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%97%EF%B8%8F%3C/text%3E%3C/svg%3E">
<script src="/analytics.js" defer></script>
<style>
  :root{
    --ink:#1d1530;
    --accent:#ff6b35;
    --gold:#ffc93c;
    --sky:#3b2a63;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:#2b2050;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;
  }
  canvas{position:fixed;inset:0;display:block;touch-action:none}
  .screen{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .28s ease;z-index:10;text-align:center;
  }
  .screen.show{pointer-events:auto;opacity:1}
  /* ---------- TITLE ---------- */
  #titleScreen{justify-content:flex-start;padding-top:11vh}
  #logo{
    font-size:min(15vw,86px);font-weight:900;letter-spacing:-.02em;line-height:.94;
    color:#fff;margin:0;
    text-shadow:0 4px 0 rgba(0,0,0,.22), 0 10px 30px rgba(0,0,0,.4);
    animation:logoBounce 2.4s ease-in-out infinite;transform-origin:50% 60%;
  }
  #logo .l2{display:block;color:var(--gold)}
  @keyframes logoBounce{
    0%,100%{transform:scale(1) rotate(-2deg)}
    25%{transform:scale(1.05) rotate(1.5deg)}
    50%{transform:scale(.98) rotate(-1deg)}
    75%{transform:scale(1.04) rotate(2deg)}
  }
  #tapToPlay{
    margin-top:24px;font-size:min(6vw,26px);font-weight:900;color:#fff;letter-spacing:.14em;
    animation:blink 1.15s ease-in-out infinite;text-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.96)}}
  #bestLine{margin-top:12px;color:#ffffffcc;font-weight:800;font-size:15px;letter-spacing:.04em}
  #titleUpgBtn{
    pointer-events:auto;margin-top:18px;font-size:17px;font-weight:900;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#8e5bf0,#6a3bd8);border:none;border-radius:18px;
    padding:14px 30px;font-family:inherit;letter-spacing:.06em;
    box-shadow:0 5px 0 #4a248f, 0 10px 24px rgba(0,0,0,.35);transition:transform .08s ease;
  }
  #titleUpgBtn:active{transform:scale(.92)}
  #footerBadge{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center}
  #footerBadge a{
    color:#fff;background:rgba(0,0,0,.32);text-decoration:none;font-weight:800;font-size:12px;
    padding:8px 16px;border-radius:99px;letter-spacing:.08em;border:2px solid rgba(255,255,255,.25);
  }
  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .25s ease}
  #hud.show{opacity:1}
  #hudTop{
    position:absolute;top:calc(10px + env(safe-area-inset-top));left:8px;right:8px;
    display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;
  }
  .pill{
    background:rgba(0,0,0,.4);color:#fff;font-weight:900;font-size:13px;
    padding:7px 13px;border-radius:99px;letter-spacing:.03em;border:2px solid rgba(255,255,255,.18);
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .pill b{color:var(--gold)}
  .pill.pop{animation:pillPop .4s ease}
  @keyframes pillPop{50%{transform:scale(1.22)}}
  #muteBtn{
    pointer-events:auto;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.18);
    color:#fff;font-size:16px;border-radius:99px;width:44px;height:44px;cursor:pointer;
  }
  #demoWrap{
    position:absolute;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    width:min(70vw,300px);text-align:center;
  }
  #demoLabel{color:#fff;font-weight:900;font-size:12px;letter-spacing:.08em;text-shadow:0 2px 2px rgba(0,0,0,.4)}
  #demoBar{height:14px;border-radius:99px;background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.22);overflow:hidden;margin-top:3px;position:relative}
  #demoFill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#ffc93c,#ff6b35);transition:width .35s ease}
  #demoTarget{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;box-shadow:0 0 6px #fff;border-radius:2px}
  #demoBar.hit #demoFill{background:linear-gradient(90deg,#7dff8a,#2ee06b);box-shadow:0 0 14px #2ee06b}
  #contractBanner{
    position:absolute;top:32%;left:0;right:0;text-align:center;pointer-events:none;
    opacity:0;transition:opacity .4s ease, transform .4s ease;transform:translateY(14px);
  }
  #contractBanner.show{opacity:1;transform:translateY(0)}
  #contractBanner .cNum{color:var(--gold);font-weight:900;font-size:min(5vw,20px);letter-spacing:.2em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  #contractBanner .cName{color:#fff;font-weight:900;font-size:min(7.5vw,34px);text-shadow:0 3px 0 rgba(0,0,0,.35)}
  #contractBanner .cGoal{color:#ffffffdd;font-weight:800;font-size:min(4.4vw,17px);margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  #releaseBtn{
    pointer-events:auto;position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%);
    font-size:min(7vw,30px);font-weight:900;font-family:inherit;color:#fff;letter-spacing:.08em;cursor:pointer;
    padding:18px 46px;border:none;border-radius:28px;
    background:linear-gradient(180deg,#ff7a59,#ff3d68);
    box-shadow:0 7px 0 #b3123f, 0 0 34px rgba(255,90,60,.75);
    animation:relPulse .8s ease-in-out infinite;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  #releaseBtn.show{opacity:1;pointer-events:auto}
  @keyframes relPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.09)}}
  #releaseBtn:active{transform:translateX(-50%) scale(.9);animation:none}
  #hintLine{
    position:absolute;bottom:calc(110px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;
    color:#fff;font-weight:900;font-size:min(4.5vw,17px);letter-spacing:.06em;
    text-shadow:0 2px 0 rgba(0,0,0,.4);opacity:0;transition:opacity .4s ease;pointer-events:none;
  }
  #hintLine.show{opacity:.92}
  /* ---------- PANELS ---------- */
  .panel{
    background:rgba(22,14,46,.86);border:3px solid rgba(255,255,255,.16);border-radius:30px;
    padding:28px 32px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    transform:scale(.7);transition:transform .35s cubic-bezier(.2,1.6,.4,1);
    max-width:88vw;max-height:84vh;overflow-y:auto;
  }
  .screen.show .panel{transform:scale(1)}
  .panelTitle{font-size:min(9vw,42px);font-weight:900;color:#fff;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.3)}
  .panelSub{color:#ffffffbb;font-weight:800;font-size:15px;margin-top:6px}
  #stars{font-size:42px;letter-spacing:6px;margin:12px 0 2px;min-height:54px}
  #stars span{display:inline-block;opacity:0;transform:scale(3) rotate(-30deg)}
  #stars span.on{animation:starPop .45s cubic-bezier(.2,1.7,.4,1) forwards}
  @keyframes starPop{to{opacity:1;transform:scale(1) rotate(0deg)}}
  #winPct{font-size:min(12vw,52px);font-weight:900;color:#7dff8a;margin:2px 0;text-shadow:0 3px 0 rgba(0,0,0,.3)}
  #winCoins{font-size:28px;font-weight:900;color:var(--gold);margin:2px 0 8px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
  #failPct{font-size:min(14vw,60px);font-weight:900;color:#ff7b6b;margin:8px 0 2px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
  #nearMissLine{font-size:17px;font-weight:900;color:var(--gold);min-height:22px;margin-bottom:6px}
  .btn{
    pointer-events:auto;cursor:pointer;border:none;font-family:inherit;font-weight:900;
    border-radius:20px;color:#fff;letter-spacing:.05em;transition:transform .08s ease;
    min-height:44px; /* minimum comfortable touch target */
  }
  .btn:active{transform:scale(.9)}
  .btnBig{
    display:block;margin:10px auto 0;font-size:21px;padding:16px 42px;
    background:linear-gradient(180deg,#ffb43c,#ff7a1c);
    box-shadow:0 6px 0 #b3540f, 0 12px 26px rgba(255,140,40,.4);
  }
  .btnAlt{
    display:block;margin:12px auto 0;font-size:15px;padding:12px 26px;
    background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);
  }
  /* ---------- UPGRADES ---------- */
  #upgList{margin-top:14px;display:flex;flex-direction:column;gap:10px;min-width:min(78vw,340px)}
  .upgRow{
    display:flex;align-items:center;gap:12px;text-align:left;
    background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.13);border-radius:18px;padding:10px 12px;
  }
  .upgIcon{font-size:30px;width:44px;text-align:center;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
  .upgInfo{flex:1;min-width:0}
  .upgName{color:#fff;font-weight:900;font-size:15px}
  .upgDesc{color:#ffffff99;font-weight:700;font-size:12px;margin-top:1px}
  .upgPips{margin-top:4px;display:flex;gap:4px}
  .upgPips i{width:16px;height:7px;border-radius:4px;background:rgba(255,255,255,.16)}
  .upgPips i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,201,60,.6)}
  .upgBuy{
    font-size:13px;font-weight:900;padding:11px 13px;border-radius:14px;min-width:74px;
    background:linear-gradient(180deg,#4cd964,#2ba84a);box-shadow:0 4px 0 #17702c;
  }
  .upgBuy:disabled{background:rgba(255,255,255,.1);box-shadow:none;color:#ffffff66;cursor:default}
  .upgBuy.maxed{background:rgba(255,201,60,.2);box-shadow:none;color:var(--gold)}
  #upgCoins{font-size:22px;font-weight:900;color:var(--gold);margin-top:4px}
</style>
</head>
<body>
<canvas id="cvs"></canvas>

<!-- HUD -->
<div id="hud">
  <div id="hudTop">
    <div class="pill" id="contractPill">📋 <b>#1</b></div>
    <div class="pill" id="ballsPill">⚫⚫⚫</div>
    <div class="pill" id="coinPill">🪙 <b id="coinNum">0</b></div>
    <button id="muteBtn" aria-label="Toggle sound">🔊</button>
  </div>
  <div id="demoWrap">
    <div id="demoLabel">DEMOLITION 0% / 75%</div>
    <div id="demoBar"><div id="demoFill"></div><div id="demoTarget" style="left:75%"></div></div>
  </div>
  <div id="contractBanner">
    <div class="cNum">CONTRACT #1</div>
    <div class="cName">Uncle Morty's Chimney</div>
    <div class="cGoal">Wreck 75% of it!</div>
  </div>
  <div id="hintLine">TAP in rhythm to swing the ball!</div>
  <button id="releaseBtn">RELEASE!</button>
</div>

<!-- TITLE -->
<div class="screen show" id="titleScreen">
  <h1 id="logo">KABOOM<span class="l2">CRANE</span></h1>
  <div id="tapToPlay">TAP TO PLAY</div>
  <div id="bestLine"></div>
  <button id="titleUpgBtn">🛠️ UPGRADES</button>
  <div id="footerBadge"><a href="../../">🥔 TaterTot Games Labs</a></div>
</div>

<!-- WIN -->
<div class="screen" id="winScreen">
  <div class="panel">
    <h2 class="panelTitle">CONTRACT<br>COMPLETE!</h2>
    <div id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div id="winPct">0%</div>
    <div id="winCoins">🪙 +0</div>
    <button class="btn btnBig" id="nextBtn">NEXT CONTRACT ➜</button>
    <button class="btn btnAlt" id="winUpgBtn">🛠️ UPGRADES</button>
  </div>
</div>

<!-- FAIL -->
<div class="screen" id="failScreen">
  <div class="panel">
    <h2 class="panelTitle">OUT OF BALLS!</h2>
    <div id="failPct">0%</div>
    <div id="nearMissLine"></div>
    <div class="panelSub" id="failGoalLine"></div>
    <button class="btn btnBig" id="retryBtn">🔄 RETRY — FREE</button>
    <button class="btn btnAlt" id="failUpgBtn">🛠️ UPGRADES</button>
  </div>
</div>

<!-- UPGRADES -->
<div class="screen" id="upgScreen">
  <div class="panel">
    <h2 class="panelTitle">UPGRADES</h2>
    <div id="upgCoins">🪙 0</div>
    <div id="upgList"></div>
    <button class="btn btnBig" id="upgBackBtn">DONE</button>
  </div>
</div>

<script>
'use strict';
/* ============================ HELPERS ============================ */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const easeOut=t=>1-Math.pow(1-t,3);
const TAU=Math.PI*2;

/* ============================ SAVE ============================ */
const SAVE_KEY='ttg_kaboom';
const DEF_SAVE={coins:0,contract:1,best:0,muted:false,up:{heavy:0,chain:0,balls:0,tnt:0}};
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEF_SAVE));
    const p=JSON.parse(raw);
    return {...DEF_SAVE,...p,up:{...DEF_SAVE.up,...(p.up||{})}};
  }catch(e){ return JSON.parse(JSON.stringify(DEF_SAVE)); }
}
function persist(){
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){}
}
let save=loadSave();

/* ============================ AUDIO ============================ */
let ac=null, master=null, noiseBuf=null, audioTried=false;
function ensureAudio(){
  if(audioTried){ if(ac&&ac.state==='suspended'){ try{ac.resume();}catch(e){} } return; }
  audioTried=true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    ac=new AC();
    master=ac.createGain();
    master.gain.value=save.muted?0:0.85;
    master.connect(ac.destination);
    const len=ac.sampleRate*1.2;
    noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    if(ac.state==='suspended') ac.resume();
  }catch(e){ ac=null; master=null; }
}
function setMuted(m){
  save.muted=m; persist();
  if(master) master.gain.value=m?0:0.85;
  muteBtn.textContent=m?'🔇':'🔊';
}
function noiseSrc(){ const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }
function env(g,t0,a,peak,dec){
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(peak,t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec);
}
function sfxPush(perfect,streak){
  if(!ac||save.muted) return;
  try{
    const t=ac.currentTime, mult=1+Math.min(streak,8)*0.12;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine';
    o.frequency.setValueAtTime((perfect?300:220)*mult,t);
    o.frequency.exponentialRampToValueAtTime((perfect?760:420)*mult,t+0.22);
    env(g,t,0.01,perfect?0.28:0.16,0.24);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.3);
    const n=noiseSrc(), f=ac.createBiquadFilter(), ng=ac.createGain();
    f.type='bandpass'; f.Q.value=1.4;
    f.frequency.setValueAtTime(500*mult,t);
    f.frequency.exponentialRampToValueAtTime(2600*mult,t+0.22);
    env(ng,t,0.02,perfect?0.2:0.1,0.22);
    n.connect(f); f.connect(ng); ng.connect(master); n.start(t); n.stop(t+0.3);
  }catch(e){}
}
function sfxThud(){
  if(!ac||save.muted) return;
  try{
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(95,t);
    o.frequency.exponentialRampToValueAtTime(50,t+0.14);
    env(g,t,0.005,0.3,0.15);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.18);
  }catch(e){}
}
function sfxCrumble(power){
  if(!ac||save.muted) return;
  try{
    const t=ac.currentTime, p=clamp(power,0.2,1);
    const n=noiseSrc(), f=ac.createBiquadFilter(), g=ac.createGain();
    f.type='lowpass';
    f.frequency.setValueAtTime(900+900*p,t);
    f.frequency.exponentialRampToValueAtTime(140,t+0.35+0.25*p);
    env(g,t,0.008,0.45*p+0.12,0.4+0.3*p);
    n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+0.8);
    const o=ac.createOscillator(), og=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t);
    o.frequency.exponentialRampToValueAtTime(45,t+0.25);
    env(og,t,0.005,0.35*p,0.28);
    o.connect(og); og.connect(master); o.start(t); o.stop(t+0.32);
  }catch(e){}
}
function sfxGlass(){
  if(!ac||save.muted) return;
  try{
    const t=ac.currentTime;
    const n=noiseSrc(), f=ac.createBiquadFilter(), g=ac.createGain();
    f.type='highpass'; f.frequency.value=2800;
    env(g,t,0.004,0.3,0.28);
    n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+0.35);
    for(let i=0;i<3;i++){
      const o=ac.createOscillator(), og=ac.createGain();
      o.type='sine'; o.frequency.value=rand(2400,4800);
      env(og,t+i*0.03,0.004,0.08,0.16);
      o.connect(og); og.connect(master); o.start(t+i*0.03); o.stop(t+i*0.03+0.2);
    }
  }catch(e){}
}
function sfxBoom(){
  if(!ac||save.muted) return;
  try{
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(170,t);
    o.frequency.exponentialRampToValueAtTime(32,t+0.5);
    env(g,t,0.005,0.85,0.55);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.6);
    const n=noiseSrc(), f=ac.createBiquadFilter(), ng=ac.createGain();
    f.type='lowpass'; f.frequency.setValueAtTime(2600,t);
    f.frequency.exponentialRampToValueAtTime(180,t+0.5);
    env(ng,t,0.005,0.55,0.5);
    n.connect(f); f.connect(ng); ng.connect(master); n.start(t); n.stop(t+0.6);
  }catch(e){}
}
function sfxCoin(){
  if(!ac||save.muted) return;
  try{
    const t=ac.currentTime;
    [988,1319].forEach((fr,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='square'; o.frequency.value=fr;
      env(g,t+i*0.07,0.005,0.07,0.12);
      o.connect(g); g.connect(master); o.start(t+i*0.07); o.stop(t+i*0.07+0.15);
    });
  }catch(e){}
}
function sfxRelease(){
  if(!ac||save.muted) return;
  try{
    const t=ac.currentTime;
    const n=noiseSrc(), f=ac.createBiquadFilter(), g=ac.createGain();
    f.type='bandpass'; f.Q.value=2;
    f.frequency.setValueAtTime(400,t);
    f.frequency.exponentialRampToValueAtTime(1800,t+0.3);
    env(g,t,0.01,0.25,0.3);
    n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+0.4);
  }catch(e){}
}
function sfxWin(){
  if(!ac||save.muted) return;
  try{
    const t=ac.currentTime;
    [523,659,784,1047].forEach((fr,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='triangle'; o.frequency.value=fr;
      env(g,t+i*0.11,0.01,0.22,0.3);
      o.connect(g); g.connect(master); o.start(t+i*0.11); o.stop(t+i*0.11+0.35);
    });
  }catch(e){}
}
function sfxFail(){
  if(!ac||save.muted) return;
  try{
    const t=ac.currentTime;
    [330,262].forEach((fr,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sawtooth'; o.frequency.value=fr;
      env(g,t+i*0.18,0.01,0.12,0.3);
      o.connect(g); g.connect(master); o.start(t+i*0.18); o.stop(t+i*0.18+0.35);
    });
  }catch(e){}
}
function buzz(pat){ try{ if(navigator.vibrate) navigator.vibrate(pat); }catch(e){} }

/* ============================ CANVAS ============================ */
const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1;
function resize(){
  W=innerWidth; H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
  // Canvas is a replaced element: without an explicit CSS size it lays out at its
  // attribute size (W*DPR), i.e. double the viewport on any phone. Pin it to CSS px.
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  groundY=H-Math.max(46,H*0.075);
  genBackdrop();
  coinPillRect=null;
}
addEventListener('resize',resize);

/* ============================ BACKDROP ============================ */
function genBackdrop(){
  clouds=[]; skyline=[];
  const n=Math.ceil(W/140)+2;
  for(let i=0;i<n;i++){
    clouds.push({x:rand(0,W),y:rand(H*0.05,H*0.42),s:rand(0.5,1.3),v:rand(4,12)});
  }
  let x=-40;
  while(x<W+80){
    const w=rand(40,90), h=rand(H*0.08,H*0.24);
    skyline.push({x,w,h,win:Math.random()<0.7});
    x+=w+rand(4,18);
  }
}
genBackdrop();

/* ============================ UPGRADES ============================ */
const UPG=[
  {id:'heavy',icon:'💪',name:'Heavier Ball',costs:[30,70,150,300,600],
   desc:l=>'+'+(l*25)+'% smash power'},
  {id:'chain',icon:'⛓️',name:'Chain Length',costs:[25,60,130,260,520],

  {id:'balls',icon:'⚫',name:'Extra Ball',costs:[80,200,450,900,1600],

  {id:'tnt',icon:'🧨',name:'TNT Luck',costs:[40,100,220,460,900],
   desc:l=>'+'+(l*4)+'% TNT block chance'}
];
const ballPower=()=>1+0.25*save.up.heavy;
const ballMassF=()=>1+0.18*save.up.heavy;
const chainF=()=>1+0.08*save.up.chain;

/* ============================ LEVEL GEN ============================ */
function blockSize(){ return clamp(Math.floor(Math.min(W,H*0.8)/12),20,42); }
function makeBlock(x,y,w,h,type){
  const hp={brick:2,wood:1.3,glass:0.5,gold:0.8,tnt:0.6}[type];
  return {x,y,w,h,type,hp,maxHp:hp,dead:false,falling:false,vx:0,vy:0,
    seed:Math.random(),fuse:-1,wob:0};
}
function pickType(n){
  const r=Math.random();
  const tntC=save.up.tnt*0.04+(n>=4?0.03:0);
  const glassC=0.12+Math.min(0.2,n*0.016);
  const woodC=0.22;
  if(r<tntC) return 'tnt';
  if(r<tntC+glassC) return 'glass';
  if(r<tntC+glassC+woodC) return 'wood';
  return 'brick';
}
function buildTower(x0,cols,rows,n,fromRight){
  const bs=blockSize();
  const heights=[];
  for(let c=0;c<cols;c++) heights.push(clamp(rows+randi(-1,1),3,rows+1));
  const made=[];
  for(let c=0;c<cols;c++){
    for(let r=0;r<heights[c];r++){
      const bx=fromRight? x0-(c+1)*bs : x0+c*bs;
      const by=groundY-(r+1)*bs;
      made.push(makeBlock(bx,by,bs-1,bs-1,pickType(n)));
    }
  }
  // sprinkle gold
  const golds=randi(1,2+Math.floor(n/5));
  for(let i=0;i<golds&&made.length;i++){
    const b=made[randi(0,made.length-1)];
    b.type='gold'; b.hp=b.maxHp=0.8;
  }
  return made;
}
function startLevel(n){
  const both=n>=6&&n%3===0;
  const side=both?'both':(n%2===1?'right':'left');
  const cols=3+Math.min(2,Math.floor(n/3));
  const bs=blockSize();
  // towers reach up toward the swing zone so throws connect
  const maxRows=Math.max(5,Math.floor((groundY-H*0.42)/bs));
  const rows=Math.min(maxRows,6+Math.min(5,Math.floor((n-1)*0.8)));
  // anchor towers to throw range from the pivot (matters in wide/landscape views)
  const Lc=Math.min(W*0.50,H*0.34)*chainF();
  const reach=Lc*0.4+330;
  blocks=[];
  if(both){
    const px=W*0.5;
    blocks=blocks.concat(buildTower(Math.max(bs*0.8,px-reach),3,Math.max(4,rows-1),n,false));
    blocks=blocks.concat(buildTower(Math.min(W-bs*0.8,px+reach),3,Math.max(4,rows-1),n,true));
  }else if(side==='right'){
    const px=W*0.5-W*0.14;
    blocks=buildTower(Math.min(W-bs*0.8,px+reach),cols,rows,n,true);
  }else{
    const px=W*0.5+W*0.14;
    blocks=buildTower(Math.max(bs*0.8,px-reach),cols,rows,n,false);
  }
  const target=both?Math.min(80,70+Math.floor(n*0.8)):Math.min(90,75+Math.floor((n-1)*1.6));
  const balls=(n<=6?3:2)+(both?1:0)+save.up.balls;
  level={
    n,name:CONTRACT_NAMES[(n-1)%CONTRACT_NAMES.length],target,
    total:blocks.length,destroyed:0,ballsLeft:balls,ballsMax:balls,
    side,coinsEarned:0,over:false,settleT:0,
    tapCue:clamp(1-(n-1)*0.34,0,1),started:true
  };
  particles=[]; debris=[]; popups=[]; coinFly=[]; explosions=[];
  streak=0; combo=0; comboT=0;
  resetPendulum();
  attachBall();
  shake=0; flashA=0; slowmoT=0; freezeFrames=0; timeScale=1;
  updateHUD();
  demoTargetEl.style.left=target+'%';
  demoBar.classList.remove('hit');
  // banner
  contractBanner.querySelector('.cNum').textContent='CONTRACT #'+n;
  contractBanner.querySelector('.cName').textContent=level.name;
  contractBanner.querySelector('.cGoal').textContent='Wreck '+target+'% of it!';
  contractBanner.classList.add('show');
  bannerT=2.4;
  hintLine.textContent='TAP in rhythm to swing the ball!';
  hintLine.classList.toggle('show',n<=2);
  window.TTG?.track('level_start',{level:n});
}
function resetPendulum(){
  const dir=level.side==='left'?1:(level.side==='right'?-1:0);
  pend.px=W*0.5+dir*W*0.14;
  pend.py=H*0.17;
  pend.L=Math.min(W*0.50,H*0.34)*chainF();
  pend.theta=0.06*(level.side==='left'?-1:1);
  pend.omega=0;
  pend.lagTheta=pend.theta;
  pend.amp=0;
}
function attachBall(){
  ball.mode='attached';
  ball.r=clamp(Math.min(W,H)*0.028,13,22)+save.up.heavy*1.2;
  ball.vx=0; ball.vy=0; ball.restT=0; ball.hitThisThrow=false; ball.squash=0;
  syncBallToPend();
}
function syncBallToPend(){
  ball.x=pend.px+Math.sin(pend.theta)*pend.L;
  ball.y=pend.py+Math.cos(pend.theta)*pend.L;
}

/* ============================ FX SPAWNERS ============================ */
function addPopup(text,x,y,color,size){

}
function dust(x,y,n,col){

    particles.push({x:x+rand(-8,8),y:y+rand(-8,8),vx:rand(-90,90),vy:rand(-140,10),
      r:rand(3,9),t:0,dur:rand(0.5,1.1),col:col||'rgba(180,166,150,',kind:'dust'});
  }
}
function glitter(x,y,n){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:rand(-220,220),vy:rand(-260,60),
      r:rand(1.5,3.5),t:0,dur:rand(0.4,0.9),col:'rgba(200,240,255,',kind:'spark'});

}
function sparks(x,y,n,col){

    particles.push({x,y,vx:rand(-260,260),vy:rand(-320,-40),
      r:rand(2,4),t:0,dur:rand(0.3,0.7),col:col,kind:'spark'});

}
function chunkBurst(b,power){
  const cols={brick:'#c0563a',wood:'#b78649',glass:'#bfe4f2',gold:'#ffcf4d',tnt:'#d8352f'};
  const n=Math.round(clamp(4+power*4,4,10));
  for(let i=0;i<n;i++){
    debris.push({x:b.x+rand(0,b.w),y:b.y+rand(0,b.h),
      vx:rand(-200,200)*(0.5+power*0.5),vy:rand(-340,-60)*(0.5+power*0.5),
      w:rand(4,b.w*0.4),h:rand(4,b.h*0.4),rot:rand(0,TAU),vr:rand(-8,8),
      t:0,dur:rand(1.2,2.4),col:cols[b.type]});
  }
}
function spawnCoinFly(x,y,count){
  for(let i=0;i<count;i++){
    coinFly.push({x,y,vx:rand(-160,160),vy:rand(-320,-120),t:0,phase:0});
  }
}
function getCoinTarget(){
  if(!coinPillRect){
    try{ coinPillRect=coinPill.getBoundingClientRect(); }catch(e){ coinPillRect={left:W-80,top:20,width:60,height:30}; }
  }
  return {x:coinPillRect.left+coinPillRect.width/2,y:coinPillRect.top+coinPillRect.height/2};
}

/* ============================ DESTRUCTION ============================ */
function pct(){ return level.total? Math.round(level.destroyed/level.total*100):0; }
function destroyBlock(b,power){
  if(b.dead) return;
  b.dead=true;
  level.destroyed++;
  combo++; comboT=1.2;
  chunkBurst(b,power);
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  if(b.type==='glass'){
    glitter(cx,cy,14); sfxGlass();
  }else if(b.type==='gold'){
    sparks(cx,cy,12,'rgba(255,210,80,');
    addPopup('GOLD! +15',cx,cy,'#ffcf4d',22);
    level.coinsEarned+=15;
    spawnCoinFly(cx,cy,5);
    sfxCoin();
  }else if(b.type==='tnt'){
    explode(cx,cy);
  }else{
    dust(cx,cy,8); sfxCrumble(clamp(power,0.3,1));
  }
  if(b.type!=='gold'){
    level.coinsEarned+=(b.type==='tnt'?2:1);
    if(Math.random()<0.35) spawnCoinFly(cx,cy,1);
  }
  if(combo>=3&&comboT>0){
    addPopup(combo+' BLOCKS!',cx,cy-30,'#7dff8a',24+Math.min(combo*2,14));
  }
  updateHUD();
}
function explode(cx,cy){
  const bs=blockSize(), R=bs*2.7;
  explosions.push({x:cx,y:cy,t:0,r:R});
  shake=Math.min(shake+18,26);
  flashA=Math.max(flashA,0.45);
  sfxBoom(); buzz(60);
  addPopup('KA-BOOM!',cx,cy-20,'#ff6b35',30);
  dust(cx,cy,16,'rgba(90,80,70,');
  sparks(cx,cy,16,'rgba(255,140,50,');
  for(const b of blocks){
    if(b.dead) continue;
    const dx=b.x+b.w/2-cx, dy=b.y+b.h/2-cy;
    const d=Math.hypot(dx,dy);
    if(d<R){
      if(b.type==='tnt'&&b.fuse<0&&d>1){ b.fuse=0.12+d/R*0.15; continue; }
      const dmg=3*(1-d/R);
      b.hp-=dmg;
      if(b.hp<=0) destroyBlock(b,1);
      else{ b.falling=true; b.vx=dx/Math.max(d,1)*140; b.vy=-80; }
    }
  }
}

/* ============================ PHYSICS ============================ */
function doTap(){
  if(ball.mode!=='attached') return;
  const th=pend.theta, om=pend.omega;
  const absTh=Math.abs(th);
  if(Math.abs(om)<0.25){
    // starter push toward building
    const dir=level.side==='left'?-1:1;
    pend.omega+=dir*(260/pend.L);
    sfxPush(false,0);
    return;
  }
  const dir=Math.sign(om);
  if(absTh<0.32){
    pend.omega+=dir*(340/pend.L);
    streak++;
    addPopup('PERFECT PUSH!',ball.x,ball.y-ball.r-16,'#7dff8a',20);
    flashA=Math.max(flashA,0.12);
    sfxPush(true,streak);
    buzz(12);
  }else if(absTh<0.8){
    pend.omega+=dir*(230/pend.L);
    streak=0;
    sfxPush(false,0);
  }else{
    pend.omega*=0.86;
    streak=0;
    sfxThud();
  }
  clampSwing();
}
function clampSwing(){
  const MAXA=2.35;
  const c=Math.cos(pend.theta)-Math.cos(MAXA);
  if(c>0){
    const maxO2=2*GRAV/pend.L*c;
    if(pend.omega*pend.omega>maxO2) pend.omega=Math.sign(pend.omega)*Math.sqrt(maxO2);
  }
}
function updatePendulum(dt){
  const steps=2, h=dt/steps;
  for(let i=0;i<steps;i++){
    const alpha=-(GRAV/pend.L)*Math.sin(pend.theta)-0.12*pend.omega;
    pend.omega+=alpha*h;
    pend.theta+=pend.omega*h;
  }
  pend.lagTheta+=(pend.theta-pend.lagTheta)*Math.min(1,dt*14);
  const c=Math.cos(pend.theta)-(pend.omega*pend.omega*pend.L)/(2*GRAV);
  pend.amp=Math.acos(clamp(c,-1,1));
  syncBallToPend();
}
function releaseBall(){
  if(ball.mode!=='attached'||state!=='play') return;
  ball.mode='free';
  ball.vx=pend.L*pend.omega*Math.cos(pend.theta);
  ball.vy=-pend.L*pend.omega*Math.sin(pend.theta);
  // cap release speed so throws stay aimable (chain upgrade raises the cap)
  const cap=600*(1+0.05*save.up.chain);
  const sp=Math.hypot(ball.vx,ball.vy);
  if(sp>cap){ ball.vx*=cap/sp; ball.vy*=cap/sp; }
  level.ballsLeft--;
  sfxRelease();
  releaseBtn.classList.remove('show');
  hintLine.classList.remove('show');
  updateHUD();
}
function updateFreeBall(dt){
  ball.vy+=GRAV*dt;
  const speed=Math.hypot(ball.vx,ball.vy);
  const steps=clamp(Math.ceil(speed*dt/(ball.r*0.6)),1,6);
  const h=dt/steps;
  for(let s=0;s<steps;s++){
    ball.x+=ball.vx*h;
    ball.y+=ball.vy*h;
    collideBallBlocks();
    // ground
    if(ball.y+ball.r>groundY){
      ball.y=groundY-ball.r;
      if(ball.vy>60){ dust(ball.x,groundY,6); shake=Math.min(shake+ball.vy/220,10); sfxThud(); }
      ball.vy*=-0.34;
      ball.vx*=0.72;
      if(Math.abs(ball.vy)<50) ball.vy=0;
    }
  }
  ball.squash=Math.max(0,ball.squash-dt*4);
  // spent? (anywhere it comes to rest, incl. wedged on the building)
  const sp=Math.hypot(ball.vx,ball.vy);
  if(sp<32) ball.restT+=dt; else ball.restT=0;
  if(ball.restT>0.8||ball.y>H+160||ball.x<-220||ball.x>W+220){
    ball.mode='dead';
  }
}
function splash(b,dmg){
  const bs=blockSize();
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  for(const o of blocks){
    if(o===b||o.dead||o.falling) continue;
    const d=Math.hypot(o.x+o.w/2-cx,o.y+o.h/2-cy);
    if(d<bs*1.5){
      o.hp-=dmg; o.wob=1;
      if(o.hp<=0) destroyBlock(o,0.6);
    }
  }
}
function collideBallBlocks(){
  for(const b of blocks){
    if(b.dead||b.falling) continue;
    const nx=clamp(ball.x,b.x,b.x+b.w);
    const ny=clamp(ball.y,b.y,b.y+b.h);
    let dx=ball.x-nx, dy=ball.y-ny;
    let d=Math.hypot(dx,dy);
    if(d>=ball.r) continue;
    if(d<0.001){ dx=0; dy=-1; d=1; }
    const inx=dx/d, iny=dy/d;
    const speed=Math.hypot(ball.vx,ball.vy);
    if(speed>120){
      const dmg=(speed-60)/340*ballPower()*ballMassF();
      const kills=b.hp-dmg<=0;
      b.hp-=dmg;
      b.wob=1;
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      impactJuice(cx,cy,speed);
      ball.squash=1;
      if(kills){
        // smash THROUGH: keep plowing, small speed loss, splash neighbors on hard hits
        destroyBlock(b,clamp(speed/800,0.4,1.2));
        if(speed>420) splash(b,dmg*0.35);
        ball.vx*=0.90; ball.vy*=0.90;
        continue;
      }
      // survived: bounce + maybe dislodge it
      dust(cx,cy,3);
      sfxThud();
      if(dmg>0.4&&Math.random()<0.75){
        b.falling=true;
        b.vx=ball.vx*0.45; b.vy=Math.min(ball.vy*0.3-60,-40);
      }
      const loss=clamp(dmg*0.12,0.04,0.22);
      ball.vx*=(1-loss); ball.vy*=(1-loss);
    }
    // positional resolve + reflect (only when the block survived / slow contact)
    ball.x=nx+inx*ball.r;
    ball.y=ny+iny*ball.r;
    const vn=ball.vx*inx+ball.vy*iny;
    if(vn<0){
      ball.vx-=(1+0.28)*vn*inx;
      ball.vy-=(1+0.28)*vn*iny;
    }
  }
}
function impactJuice(x,y,speed){
  const e=clamp(speed/900,0.2,1.3);
  shake=Math.min(shake+e*9,24);
  buzz(18);
  if(!ball.hitThisThrow){
    ball.hitThisThrow=true;
    slowmoT=0.6;
    freezeFrames=2;
    flashA=Math.max(flashA,0.4);
    cam.zx=x; cam.zy=y; cam.zoom=1.07;
  }
}
function overlapX(a,b){
  const o=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x);
  return o>Math.min(a.w,b.w)*0.3;
}
function updateBlocks(dt){
  // support check for static blocks
  for(const b of blocks){
    if(b.dead||b.falling) continue;
    b.wob=Math.max(0,b.wob-dt*3);
    if(b.fuse>=0){
      b.fuse-=dt;
      if(b.fuse<=0&&!b.dead) destroyBlock(b,1);
      continue;
    }
    if(b.y+b.h>=groundY-2) continue;
    let supported=false;
    for(const o of blocks){
      if(o===b||o.dead||o.falling) continue;
      if(Math.abs(o.y-(b.y+b.h))<4&&overlapX(b,o)){ supported=true; break; }
    }
    if(!supported){ b.falling=true; b.vy=0; b.vx=0; }
  }
  // falling blocks
  for(const b of blocks){
    if(b.dead||!b.falling) continue;
    b.vy+=GRAV*dt;
    b.vx*=(1-Math.min(1,dt*2));
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    // ground
    if(b.y+b.h>=groundY){
      if(b.vy>400){
        destroyBlock(b,clamp(b.vy/900,0.4,1));
      }else{
        b.y=groundY-b.h; b.falling=false; b.vy=0; b.vx=0;
        dust(b.x+b.w/2,groundY,4);
      }
      continue;
    }
    // land on static blocks
    for(const o of blocks){
      if(o===b||o.dead||o.falling) continue;
      if(b.y+b.h>o.y&&b.y<o.y&&overlapX(b,o)){
        if(b.vy>240){
          // crush below
          o.hp-=0.9+b.vy/650;
          o.wob=1;
          dust(o.x+o.w/2,o.y,5);
          if(o.hp<=0){ destroyBlock(o,clamp(b.vy/800,0.4,1)); sfxCrumble(0.5); continue; }
        }
        b.y=o.y-b.h; b.falling=false; b.vy=0; b.vx=0;
        break;
      }
    }
  }
}
function anyActivity(){
  if(ball.mode==='free') return true;
  for(const b of blocks){ if(!b.dead&&(b.falling||b.fuse>=0)) return true; }
  return false;
}
function updateThrowFlow(dt){
  if(level.over) return;
  if(ball.mode==='dead'){
    if(anyActivity()) level.settleT=0; else level.settleT+=dt;
    if(level.settleT>0.85) endThrow();
  }
}
function endThrow(){
  level.settleT=0;
  const p=pct();
  if(p>=level.target){ doWin(); return; }
  if(level.ballsLeft>0){
    resetPendulum();
    attachBall();
    updateHUD();
    if(level.n<=2){ hintLine.textContent='TAP in rhythm to swing!'; hintLine.classList.add('show'); }
  }else{
    doFail();
  }
}

/* ============================ WIN / FAIL ============================ */
function starCount(){ return level.ballsLeft>=2?3:(level.ballsLeft>=1?2:1); }
function doWin(){
  if(level.over) return;
  level.over=true;
  const p=pct();
  const bonus=level.n*5+starCount()*5;
  level.coinsEarned+=bonus;
  save.coins+=level.coinsEarned;
  save.best=Math.max(save.best,level.n);
  save.contract=level.n+1;
  persist();
  window.TTG?.track('level_complete',{level:level.n,value:p});
  sfxWin(); buzz([30,40,60]);
  state='win';
  releaseBtn.classList.remove('show');
  $('winPct').textContent=p+'% WRECKED';
  $('winCoins').textContent='🪙 +0';
  winScreen.classList.add('show');
  // stars stagger
  const stars=$('stars').children;
  for(let i=0;i<3;i++){
    stars[i].classList.remove('on');
    if(i<starCount()){
      setTimeout(((el)=>()=>{el.classList.add('on'); sfxCoin();})(stars[i]),350+i*320);
    }
  }
  // coin count-up
  const total=level.coinsEarned, t0=performance.now();
  const tick=()=>{
    const k=clamp((performance.now()-t0)/900,0,1);
    $('winCoins').textContent='🪙 +'+Math.round(easeOut(k)*total);
    if(k<1&&state==='win') requestAnimationFrame(tick);
  };
  setTimeout(tick,500);
  updateHUD();
}
function doFail(){
  if(level.over) return;
  level.over=true;
  save.coins+=level.coinsEarned;
  persist();
  window.TTG?.track('game_over',{level:level.n});
  sfxFail(); buzz(80);
  state='fail';
  releaseBtn.classList.remove('show');
  const p=pct();
  $('failPct').textContent=p+'%';
  $('failGoalLine').textContent='Needed '+level.target+'% — earned 🪙 '+level.coinsEarned;
  $('nearMissLine').textContent=(p>=level.target-8)?('NEAR MISS '+p+'%! SO close!'):'';
  failScreen.classList.add('show');
  updateHUD();
}

/* ============================ HUD ============================ */
function updateHUD(){
  contractPill.innerHTML='📋 <b>#'+level.n+'</b>';

  for(let i=0;i<level.ballsMax;i++) dots+=(i<level.ballsLeft?'⚫':'<span style="opacity:.25">⚫</span>');

/* ============================ UPDATE ============================ */
function update(dt){
  now+=dt;
  // slowmo
  if(slowmoT>0){ slowmoT-=dt; timeScale=0.35; }
  else timeScale=1;
  const sdt=dt*timeScale;
  // banner
  if(bannerT>0){ bannerT-=dt; if(bannerT<=0) contractBanner.classList.remove('show'); }
  // decay fx
  shake=Math.max(0,shake-dt*38);
  flashA=Math.max(0,flashA-dt*2.2);
  cam.zoom+=(1-cam.zoom)*Math.min(1,dt*3.5);
  // clouds always drift
  for(const c of clouds){ c.x+=c.v*dt*c.s; if(c.x>W+120) c.x=-120; }
  // particles always
  updateFx(dt);
  if(state==='title'){
    pend.px=W*0.5; pend.py=H*0.16; pend.L=Math.min(W*0.42,H*0.30);
    pend.theta=Math.sin(now*1.35)*0.5;
    pend.lagTheta+=(pend.theta-pend.lagTheta)*Math.min(1,dt*10);
    syncBallToPend();
    return;
  }
  if(state!=='play') return;
  if(freezeFrames>0){ freezeFrames--; return; }
  if(ball.mode==='attached'){
    updatePendulum(sdt);
    const ready=pend.amp>0.5;
    releaseBtn.classList.toggle('show',ready);
  }else if(ball.mode==='free'){
    updateFreeBall(sdt);
  }
  updateBlocks(sdt);
  updateThrowFlow(dt);
  if(comboT>0){ comboT-=dt; if(comboT<=0) combo=0; }
  // early win check while ball still flying? handled on endThrow; but if all destroyed, celebrate fast
  if(!level.over&&level.total>0&&level.destroyed>=level.total){
    ball.mode='dead'; level.settleT=1;
    endThrow();
  }
}
function updateFx(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.t+=dt;
    if(p.t>=p.dur){ particles.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.kind==='spark') p.vy+=900*dt; else p.vy+=180*dt;
    p.vx*=(1-Math.min(1,dt*1.6));
  }
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];
    d.t+=dt;
    if(d.t>=d.dur){ debris.splice(i,1); continue; }
    d.vy+=GRAV*dt*0.8;
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.rot+=d.vr*dt;
    if(d.y>groundY-d.h/2){ d.y=groundY-d.h/2; d.vy*=-0.3; d.vx*=0.7; d.vr*=0.7; }
  }
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i];
    p.t+=dt;
    if(p.t>=p.dur){ popups.splice(i,1); continue; }
    p.y+=p.vy*dt;
    p.vy*=(1-Math.min(1,dt*2));
  }
  for(let i=explosions.length-1;i>=0;i--){
    explosions[i].t+=dt;
    if(explosions[i].t>0.45) explosions.splice(i,1);
  }
  const tgt=getCoinTarget();
  for(let i=coinFly.length-1;i>=0;i--){
    const c=coinFly[i];
    c.t+=dt;
    if(c.phase===0){
      c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy+=1100*dt;
      if(c.t>0.35) c.phase=1;
    }else{
      const k=Math.min(1,dt*7);
      c.x+=(tgt.x-c.x)*k; c.y+=(tgt.y-c.y)*k;
      if(Math.hypot(tgt.x-c.x,tgt.y-c.y)<16){
        coinFly.splice(i,1);
        coinPill.classList.remove('pop');
        void coinPill.offsetWidth;
        coinPill.classList.add('pop');
        updateHUD();
      }
    }
  }
}

/* ============================ RENDER ============================ */
function skyColors(){
  return SKIES[(Math.max(1,level.n)-1)%SKIES.length];
}
function render(){
  ctx.clearRect(0,0,W,H);
  const [c1,c2,c3]=skyColors();
  const g=ctx.createLinearGradient(0,0,0,H);
  const drift=Math.sin(now*0.07)*0.04;
  g.addColorStop(0,c1);
  g.addColorStop(clamp(0.55+drift,0.3,0.8),c2);
  g.addColorStop(1,c3);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  // sun
  ctx.globalAlpha=0.85;
  ctx.fillStyle='#fff7d6';
  ctx.beginPath(); ctx.arc(W*0.82,H*0.14,Math.min(W,H)*0.06,0,TAU); ctx.fill();
  ctx.globalAlpha=1;
  // clouds
  ctx.fillStyle='rgba(255,255,255,.8)';
  for(const c of clouds){
    ctx.beginPath();
    ctx.arc(c.x,c.y,16*c.s,0,TAU);
    ctx.arc(c.x+18*c.s,c.y+4*c.s,13*c.s,0,TAU);
    ctx.arc(c.x-17*c.s,c.y+5*c.s,11*c.s,0,TAU);
    ctx.fill();
  }
  // skyline
  ctx.fillStyle='rgba(70,70,110,.35)';
  for(const s of skyline){
    ctx.fillRect(s.x,groundY-s.h,s.w,s.h);
  }
  // camera (shake + zoom)
  ctx.save();
  if(cam.zoom>1.001){
    ctx.translate(cam.zx,cam.zy);
    ctx.scale(cam.zoom,cam.zoom);
    ctx.translate(-cam.zx,-cam.zy);
  }
  if(shake>0.2){
    ctx.translate(rand(-shake,shake),rand(-shake,shake));
  }
  drawGround();
  drawCrane();
  drawBlocks();
  drawDebris();
  drawBallAndChain();
  drawParticles();
  drawExplosions();
  drawPopups();
  drawCoinFly();
  if(state==='play') drawSwingUI();
  ctx.restore();
  // white flash
  if(flashA>0.01){
    ctx.fillStyle='rgba(255,255,255,'+flashA.toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
}
function drawGround(){
  ctx.fillStyle='#6b6259';
  ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#8a7f73';
  ctx.fillRect(0,groundY,W,5);
  // hazard stripes
  const sh=10, y=groundY+12;
  for(let x=-20;x<W+20;x+=26){
    ctx.fillStyle=(Math.floor(x/26)%2===0)?'#f2c94c':'#3b3630';
    ctx.save();
    ctx.translate(x,y);
    ctx.transform(1,0,-0.5,1,0,0);
    ctx.fillRect(0,0,13,sh);
    ctx.restore();
  }
}
function drawCrane(){
  const bob=Math.sin(now*2.1)*2+pend.omega*2.2;
  const px=pend.px, py=pend.py+bob*0.4;
  const mastX=level.side==='left'?px+W*0.2:(level.side==='right'?px-W*0.2:px);
  // mast truss
  ctx.strokeStyle='#e8a13c';
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(mastX-9,groundY); ctx.lineTo(mastX-9,py-16);
  ctx.moveTo(mastX+9,groundY); ctx.lineTo(mastX+9,py-16);
  ctx.stroke();
  ctx.lineWidth=2.5;
  ctx.beginPath();
  for(let y=groundY-14;y>py;y-=26){
    ctx.moveTo(mastX-9,y); ctx.lineTo(mastX+9,y-13);
    ctx.moveTo(mastX+9,y); ctx.lineTo(mastX-9,y-13);
  }
  ctx.stroke();
  // arm
  const armY=py-16+bob;
  const armL=Math.min(px,mastX)-W*0.16;
  const armR=Math.max(px,mastX)+W*0.10;
  ctx.fillStyle='#f2b544';
  ctx.fillRect(armL,armY-8,armR-armL,14);
  ctx.strokeStyle='#c07f1d';
  ctx.lineWidth=2;
  ctx.beginPath();
  for(let x=armL+8;x<armR-8;x+=22){
    ctx.moveTo(x,armY+6); ctx.lineTo(x+11,armY-8);
    ctx.moveTo(x+11,armY-8); ctx.lineTo(x+22,armY+6);
  }
  ctx.stroke();
  // cab
  ctx.fillStyle='#3d3a4f';
  ctx.fillRect(mastX-20,armY-32,40,26);
  ctx.fillStyle='#9fd8ef';
  ctx.fillRect(mastX-14,armY-27,18,13);
  // counterweight
  ctx.fillStyle='#55506b';
  const cwX=mastX+(mastX>px?26:-46);
  ctx.fillRect(cwX,armY-4,20,22);
  // trolley at pivot
  ctx.fillStyle='#3d3a4f';
  ctx.fillRect(px-11,armY-2,22,12);
  ctx.beginPath();
  ctx.fillStyle='#222';
  ctx.arc(px,armY+11,4,0,TAU);
  ctx.fill();
}
function drawBallAndChain(){
  if(ball.mode==='dead') return;
  const px=pend.px, py=pend.py;
  let bx=ball.x, by=ball.y;
  if(ball.mode==='attached'||ball.mode==='idle'){
    // chain with lag whip
    const segs=10;
    ctx.strokeStyle='#4a4557';
    ctx.lineWidth=3;
    let prevX=px, prevY=py;
    for(let i=1;i<=segs;i++){
      const t=i/segs;
      const th=lerp(pend.lagTheta,pend.theta,t*t);
      const r=pend.L*t;
      const x=px+Math.sin(th)*r, y=py+Math.cos(th)*r;
      // link
      ctx.beginPath();
      ctx.moveTo(prevX,prevY); ctx.lineTo(x,y);
      ctx.stroke();
      ctx.beginPath();
      ctx.fillStyle=(i%2===0)?'#5c566e':'#443f52';
      ctx.arc(x,y,3.2,0,TAU);
      ctx.fill();
      prevX=x; prevY=y;
    }
    bx=prevX; by=prevY;
  }
  // ball
  const sq=ball.squash*0.18;
  ctx.save();
  ctx.translate(bx,by);
  ctx.scale(1+sq,1-sq);
  const bg=ctx.createRadialGradient(-ball.r*0.35,-ball.r*0.35,ball.r*0.15,0,0,ball.r*1.1);
  bg.addColorStop(0,'#6e6880');
  bg.addColorStop(0.6,'#3a3547');
  bg.addColorStop(1,'#221f2c');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(0,0,ball.r,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(-ball.r*0.35,-ball.r*0.4,ball.r*0.22,0,TAU); ctx.fill();
  ctx.restore();
  // trail when fast
  if(ball.mode==='free'){
    const sp=Math.hypot(ball.vx,ball.vy);
    if(sp>380){
      ctx.strokeStyle='rgba(255,255,255,.35)';
      ctx.lineWidth=ball.r*0.8;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(bx-ball.vx*0.045,by-ball.vy*0.045);
      ctx.lineTo(bx,by);
      ctx.stroke();
      ctx.lineCap='butt';
    }
  }
}
function crackPath(b){
  const s=b.seed;
  ctx.beginPath();
  ctx.moveTo(b.x+b.w*(0.2+s*0.3),b.y);
  ctx.lineTo(b.x+b.w*(0.4+s*0.2),b.y+b.h*0.45);
  ctx.lineTo(b.x+b.w*(0.15+s*0.3),b.y+b.h*0.7);
  ctx.moveTo(b.x+b.w*(0.4+s*0.2),b.y+b.h*0.45);
  ctx.lineTo(b.x+b.w*(0.7+s*0.2),b.y+b.h);
  ctx.stroke();
}
function drawBlocks(){
  for(const b of blocks){
    if(b.dead) continue;
    const wob=b.wob>0?Math.sin(now*40)*b.wob*1.6:0;
    ctx.save();
    ctx.translate(b.x+b.w/2+wob,b.y+b.h/2);
    ctx.translate(-(b.x+b.w/2),-(b.y+b.h/2));
    if(b.type==='brick'){
      ctx.fillStyle='#c0563a';
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle='rgba(255,255,255,.12)';
      ctx.fillRect(b.x,b.y,b.w,3);
      ctx.strokeStyle='rgba(90,30,18,.5)';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(b.x,b.y+b.h/2); ctx.lineTo(b.x+b.w,b.y+b.h/2);
      ctx.moveTo(b.x+b.w*0.5,b.y); ctx.lineTo(b.x+b.w*0.5,b.y+b.h/2);
      ctx.moveTo(b.x+b.w*0.25,b.y+b.h/2); ctx.lineTo(b.x+b.w*0.25,b.y+b.h);
      ctx.moveTo(b.x+b.w*0.75,b.y+b.h/2); ctx.lineTo(b.x+b.w*0.75,b.y+b.h);
      ctx.stroke();
    }else if(b.type==='glass'){
      ctx.fillStyle='rgba(159,216,239,.75)';
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.strokeStyle='#e8f6fc';
      ctx.lineWidth=2;
      ctx.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);
      ctx.strokeStyle='rgba(255,255,255,.75)';
      ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.moveTo(b.x+b.w*0.2,b.y+b.h*0.85);
      ctx.lineTo(b.x+b.w*0.75,b.y+b.h*0.15);
      ctx.stroke();
    }else if(b.type==='wood'){
      ctx.fillStyle='#b78649';
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.strokeStyle='rgba(120,80,35,.7)';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      for(let i=1;i<4;i++){
        ctx.moveTo(b.x,b.y+b.h*i/4);
        ctx.quadraticCurveTo(b.x+b.w/2,b.y+b.h*i/4+3*(b.seed-0.5),b.x+b.w,b.y+b.h*i/4);
      }
      ctx.stroke();
    }else if(b.type==='gold'){
      const shim=0.5+0.5*Math.sin(now*4+b.seed*9);
      ctx.fillStyle='#ffcf4d';
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle='rgba(255,255,255,'+(0.25+shim*0.3)+')';
      ctx.fillRect(b.x+b.w*0.15,b.y+b.h*0.12,b.w*0.28,b.h*0.2);
      ctx.strokeStyle='#c98d12';
      ctx.lineWidth=2;
      ctx.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);
      ctx.fillStyle='#8a5c00';
      ctx.font='900 '+Math.floor(b.h*0.42)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('★',b.x+b.w/2,b.y+b.h/2+1);
    }else if(b.type==='tnt'){
      ctx.fillStyle='#d8352f';
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle='rgba(0,0,0,.22)';
      ctx.fillRect(b.x,b.y+b.h*0.36,b.w,b.h*0.28);
      ctx.fillStyle='#fff';
      ctx.font='900 '+Math.floor(b.h*0.3)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('TNT',b.x+b.w/2,b.y+b.h/2+1);
      if(b.fuse>=0){
        ctx.fillStyle=Math.sin(now*30)>0?'#fff':'#ffcf4d';
        ctx.beginPath(); ctx.arc(b.x+b.w/2,b.y-3,3.4,0,TAU); ctx.fill();
      }
    }
    if(b.hp<b.maxHp*0.65){
      ctx.strokeStyle='rgba(30,20,15,.6)';
      ctx.lineWidth=1.6;
      crackPath(b);
    }
    ctx.restore();
  }
}
function drawDebris(){
  for(const d of debris){
    const a=1-d.t/d.dur;
    ctx.save();
    ctx.translate(d.x,d.y);
    ctx.rotate(d.rot);
    ctx.globalAlpha=clamp(a*1.4,0,1);
    ctx.fillStyle=d.col;
    ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawParticles(){
  for(const p of particles){
    const a=1-p.t/p.dur;
    if(p.kind==='dust'){
      ctx.fillStyle=p.col+(a*0.55).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1+p.t*1.6),0,TAU); ctx.fill();
    }else{
      ctx.fillStyle=p.col+a.toFixed(3)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
    }
  }
}
function drawExplosions(){
  for(const ex of explosions){
    const k=ex.t/0.45;
    ctx.strokeStyle='rgba(255,170,60,'+((1-k)*0.9).toFixed(3)+')';
    ctx.lineWidth=6*(1-k)+2;
    ctx.beginPath();
    ctx.arc(ex.x,ex.y,ex.r*easeOut(k),0,TAU);
    ctx.stroke();
  }
}
function drawPopups(){
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  for(const p of popups){
    const k=p.t/p.dur;
    const a=k<0.15?k/0.15:1-Math.max(0,(k-0.6)/0.4);
    const sc=k<0.2?easeOut(k/0.2)*1.15:lerp(1.15,1,Math.min(1,(k-0.2)/0.3));
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.scale(sc,sc);
    ctx.globalAlpha=clamp(a,0,1);
    ctx.font='900 '+p.size+'px sans-serif';
    ctx.lineWidth=4;
    ctx.strokeStyle='rgba(20,12,30,.8)';
    ctx.strokeText(p.text,0,0);
    ctx.fillStyle=p.color;
    ctx.fillText(p.text,0,0);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawCoinFly(){
  for(const c of coinFly){
    ctx.font='900 16px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🪙',c.x,c.y);
  }
}
function drawSwingUI(){
  if(ball.mode!=='attached') return;
  // amplitude meter (arc near pivot)
  const px=pend.px, py=pend.py;
  const mR=Math.min(W,H)*0.09;
  const fill=clamp(pend.amp/2.2,0,1);
  const ready=pend.amp>0.5;
  ctx.lineWidth=7;
  ctx.strokeStyle='rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.arc(px,py,mR,Math.PI*0.5+0.35,Math.PI*0.5-0.35+TAU,false);
  ctx.stroke();
  ctx.strokeStyle=ready?'#7dff8a':'#ffc93c';
  ctx.beginPath();
  const a0=Math.PI*0.5+0.35;
  ctx.arc(px,py,mR,a0,a0+(TAU-0.7)*fill,false);
  ctx.stroke();
  if(ready){
    ctx.fillStyle='rgba(125,255,138,'+(0.5+0.4*Math.sin(now*8)).toFixed(3)+')';
    ctx.font='900 13px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('READY!',px,py-mR-10);
  }
  // TAP cue ring at ideal moment
  if(level.tapCue>0.02){
    const inWindow=Math.abs(pend.theta)<0.32&&Math.abs(pend.omega)>0.3;
    if(inWindow||Math.abs(pend.omega)<0.25){
      const pul=1+0.14*Math.sin(now*10);
      const a=level.tapCue*(0.55+0.35*Math.sin(now*10));
      ctx.strokeStyle='rgba(255,255,255,'+clamp(a,0,1).toFixed(3)+')';
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.arc(ball.x,ball.y,(ball.r+14)*pul,0,TAU);
      ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,'+clamp(a+0.2,0,1).toFixed(3)+')';
      ctx.font='900 15px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('TAP!',ball.x,ball.y-ball.r-24);
    }
  }
}

/* ============================ MAIN LOOP ============================ */
let lastT=0;
function frame(t){
  try{
    const dt=clamp((t-lastT)/1000,0,0.033);
    lastT=t;
    update(dt);
    render();
  }catch(e){
    if(errCount<3){ console.error(e); errCount++; }
  }finally{
    requestAnimationFrame(frame);
  }
}

/* ============================ BOOT ============================ */
resize();
setMuted(save.muted);
goTitle();
requestAnimationFrame(frame);
</script>
