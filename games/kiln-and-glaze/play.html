<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kiln &amp; Glaze | TaterTot Games</title>
<meta name="theme-color" content="#262b2e">
<link rel="icon" href="data:,">
<script src="/analytics.js" defer></script>
<style>
  :root {
    --wall: #353c40; --wall2: #262b2e; --card: #f4f5f2; --card2: #e9ecea; --rule: #d6dcdf; --blue-rule: #c9d7ea;
    --ink: #1e2a31; --ink2: #50606a; --faint: #87949b; --cobalt: #2f55c0; --cobalt-press: #23439c; --ember: #f0a04b;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --hatch: repeating-linear-gradient(135deg, rgba(30, 42, 49, .08) 0 1px, transparent 1px 5px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--wall2); touch-action: none; overscroll-behavior: none; position: fixed; inset: 0; }
  body { font-family: var(--sans); color: var(--ink); font-size: 14px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  ::selection { background: var(--cobalt); color: #fff; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums lining-nums; }

  .btn { min-height: 44px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 10px; font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--card); color: var(--ink); transition: background-color .12s ease-out, transform .12s ease-out; }
  .btn:hover:not(:disabled) { background: #fff; }
  .btn:active:not(:disabled) { background: var(--ink); color: var(--card); transform: translateY(1px); }
  .btn:disabled { color: var(--faint); border-color: var(--rule); background: var(--hatch), var(--card2); cursor: default; }
  .btn.go { background: var(--cobalt); border-color: var(--cobalt); color: #fff; }
  .btn.go:hover:not(:disabled) { background: #2a4db0; }
  .btn.go:active:not(:disabled) { background: var(--cobalt-press); border-color: var(--cobalt-press); }
  .btn.go:disabled { color: var(--faint); border-color: var(--rule); background: var(--hatch), var(--card2); }
  .btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .btn.wide { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  #deck { position: fixed; display: none; flex-direction: column; background: var(--card); z-index: 3; }
  body.port #deck { left: 0; right: 0; bottom: 0; border-top: 2px solid var(--ink); }
  body.land #deck { top: 0; right: 0; bottom: 0; border-left: 2px solid var(--ink); }
  #stat { flex: 0 0 auto; padding: 9px 14px 7px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 13px; color: var(--ink2); background: var(--card2); border-bottom: 1px solid var(--rule); }
  #stat b { color: var(--ink); font-size: 16px; }
  #tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--rule); }
  .tab { min-height: 42px; font-size: 13.5px; font-weight: 600; color: var(--faint); position: relative; }
  .tab.on { color: var(--ink); }
  .tab.on::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -1px; height: 3px; border-radius: 3px; background: var(--cobalt); }
  .tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--cobalt); margin-left: 4px; vertical-align: 2px; }
  #jbody { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding-bottom: 16px; }
  .scroll::-webkit-scrollbar { width: 6px; } .scroll::-webkit-scrollbar-thumb { background: #bcc6cb; border-radius: 3px; }
  .scroll { scrollbar-width: thin; scrollbar-color: #bcc6cb transparent; }
  .note { padding: 10px 14px 2px; font-size: 13px; color: var(--ink2); }
  .note b { color: var(--ink); }
  .sec { padding: 12px 14px 4px; font-size: 14px; font-weight: 800; color: var(--ink); }
  .pad { padding: 8px 14px 0; }

  /* index card */
  .card { margin: 10px 14px 4px; padding: 12px 14px 12px; border-radius: 12px; background: #fbfbf9; border: 1px solid var(--rule); border-top: 3px solid #e3a49c; }
  .card h3 { font-size: 16px; font-weight: 800; line-height: 1.25; }
  .card .sub { font-size: 12.5px; color: var(--ink2); }
  .card .lines { margin-top: 6px; font-size: 13px; line-height: 26px; background: repeating-linear-gradient(180deg, transparent 0 25px, var(--blue-rule) 25px 26px); }
  .card .lines span { display: block; }
  .card .lines span b { font-weight: 700; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .seg button { min-height: 38px; font-size: 13px; font-weight: 600; padding: 0 6px; border-left: 1px solid var(--rule); }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--ink); color: var(--card); }
  .seg button:disabled { color: var(--faint); background: var(--hatch); cursor: default; }
  .lab { font-size: 12px; font-weight: 700; color: var(--ink2); margin: 10px 0 5px; }

  .ox { display: grid; grid-template-columns: 1fr repeat(5, 34px); gap: 4px; align-items: center; margin-top: 4px; }
  .ox span { font-size: 13.5px; font-weight: 600; }
  .ox button { height: 34px; border-radius: 8px; border: 1.5px solid var(--rule); font-size: 13px; font-weight: 700; color: var(--ink2); background: #fff; }
  .ox button.on { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .ox button.lo { border-color: var(--ink); }

  .ware { display: flex; gap: 8px; overflow-x: auto; padding: 8px 14px 4px; touch-action: pan-x; }
  .ware button { flex: 0 0 auto; width: 62px; height: 70px; border-radius: 10px; border: 1.5px solid var(--rule); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--ink2); }
  .ware button.sel { border-color: var(--cobalt); box-shadow: 0 0 0 2px var(--cobalt) inset; }
  .ware canvas { width: 44px; height: 44px; }

  .order { margin: 8px 14px 0; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--rule); background: #fff; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .order.ok { border-color: var(--cobalt); }
  .order .who { font-size: 12.5px; color: var(--ink2); }
  .order .what { font-size: 14px; font-weight: 700; }
  .order .pay { font-size: 12.5px; color: var(--ink2); }
  .up { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 14px; }
  .up + .up { border-top: 1px solid var(--rule); }
  .up h4 { font-size: 14px; } .up p { font-size: 12.5px; color: var(--ink2); }
  .buy { flex-direction: column; gap: 0; line-height: 1.15; min-width: 86px; }
  .buy small { font-size: 11.5px; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--cobalt); height: 30px; }
  .airrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink2); }

  #muteBtn { position: fixed; width: 42px; height: 42px; display: none; align-items: center; justify-content: center; z-index: 4;
    background: rgba(244, 245, 242, .94); border: 1.5px solid var(--ink); border-radius: 21px; color: var(--ink); }
  #muteBtn svg { width: 20px; height: 20px; }
  #muteBtn:active { background: var(--ink); color: var(--card); }
  #toast { position: fixed; display: none; z-index: 4; pointer-events: none; background: rgba(244, 245, 242, .97); color: var(--ink); border: 1.5px solid var(--ink);
    border-radius: 12px; padding: 7px 14px; font-size: 13px; font-weight: 600; max-width: min(92vw, 460px); text-align: center; transform: translateX(-50%); }

  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; background: rgba(20, 25, 28, .6); padding: 14px; }
  .screen.show { display: flex; }
  .panel { width: min(440px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 20px; touch-action: pan-y; text-align: center; }
  .panel h2 { font-size: 20px; font-weight: 800; }
  .panel p { color: var(--ink2); font-size: 14px; margin-top: 8px; }
  .panel .act { margin-top: 16px; display: flex; justify-content: center; }
  #title { background: linear-gradient(180deg, rgba(38, 43, 46, .9) 0%, rgba(38, 43, 46, .35) 34%, rgba(38, 43, 46, 0) 52%, rgba(38, 43, 46, 0) 66%, rgba(38, 43, 46, .92) 100%);
    flex-direction: column; justify-content: space-between; text-align: center; padding: max(8vh, 26px) 16px 18px; color: #f4f5f2; }
  #title h1 { font-size: clamp(40px, min(12vw, 13vh), 92px); font-weight: 800; line-height: .95; letter-spacing: -.01em; }
  #title h1 span { color: #9fc9b4; }
  #title .tag { margin-top: 12px; font-size: clamp(14px, 3.6vw, 17px); color: #dfe4e6; font-weight: 600; }
  #title .go { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #title .btn.go { min-height: 52px; padding: 0 30px; font-size: 17px; }
  #title .stat { font-size: 13px; color: #dfe4e6; font-weight: 600; }
  #badge { color: #dfe4e6; font-size: 13px; font-weight: 600; text-decoration: none; border-bottom: 1.5px solid #7f9be3; padding: 6px 2px 2px; }
  body.land #title { align-items: flex-start; text-align: left; padding: max(9vh, 22px) 6vw max(7vh, 18px);
    background: linear-gradient(90deg, rgba(38, 43, 46, .95) 0%, rgba(38, 43, 46, .78) 30%, rgba(38, 43, 46, 0) 48%); }
  body.land #title .go { align-items: flex-start; }
  body.land #title > div { max-width: 34vw; }
  @media (max-height: 520px) { #stat { padding: 5px 12px 4px; } .tab { min-height: 36px; } .card { margin-top: 6px; } .seg button { min-height: 34px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="port">
<canvas id="view"></canvas>
<button id="muteBtn" aria-label="Sound on or off">
  <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
  <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" style="display:none"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>
<div id="toast"></div>

<div id="deck">
  <div id="stat" class="num"></div>
  <nav id="tabs">
    <button class="tab on" data-tab="wheel">Wheel</button>
    <button class="tab" data-tab="glaze">Glaze</button>
    <button class="tab" data-tab="kiln">Kiln</button>
    <button class="tab" data-tab="shelf">Shelf</button>
    <button class="tab" data-tab="book">Book</button>
  </nav>
  <div id="jbody" class="scroll"></div>
</div>

<div id="title" class="screen show">
  <div>
    <h1>Kiln &amp;<br><span>Glaze</span></h1>
    <p class="tag">Throw it, glaze it, fire it. Then open the kiln and see.</p>
  </div>
  <div class="go">
    <button class="btn go" id="playBtn">Open the studio</button>
    <div class="stat num" id="titleStat"></div>
    <a id="badge" href="https://tatertotgames.com">tatertotgames.com</a>

</div>

<div id="away" class="screen">
  <div class="panel">
    <h2>While you were away</h2>
    <p class="num" id="awayText"></p>
    <div class="act"><button class="btn go" id="awayBtn">Back to the studio</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;
const pick = a => a[Math.floor(Math.random() * a.length)];
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function toHex(c) { return '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function mixC(a, b, t) { const A = hex(a), B = hex(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); }
function shade(h, amt) { return toHex(hex(h).map(v => v + amt)); }
function rgba(h, a) { const c = hex(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

/* ============================== the studio's materials ============================== */
const CLAYS = {
  stone: { n: 'Stoneware', raw: '#8f857a', fired: '#b09c84', mult: 1, lvl: 0, t: 'Buff clay with a little iron in it. Takes any firing.' },
  red:   { n: 'Red earthenware', raw: '#8a5040', fired: '#a4533a', mult: 0.8, lvl: 0, t: 'Rich red clay. Only takes the coolest firing, cone 04.' },
  porc:  { n: 'Porcelain', raw: '#c9c8c3', fired: '#eeede8', mult: 1.6, lvl: 2, t: 'White and fine. Glazes glow on it.' },
  speck: { n: 'Speckled stoneware', raw: '#948b80', fired: '#b8aa94', mult: 1.25, lvl: 5, speck: true, t: 'Iron specks bleed up through the glaze.' },
};
const CLAY_ORDER = ['stone', 'red', 'porc', 'speck'];
const OXIDES = [
  { id: 'fe', n: 'Iron', lvl: 0, col: '#a8651e' }, { id: 'cu', n: 'Copper', lvl: 0, col: '#3f8a4e' }, { id: 'co', n: 'Cobalt', lvl: 0, col: '#2d4fa8' },
  { id: 'sn', n: 'Tin', lvl: 1, col: '#f2f1ec' }, { id: 'ru', n: 'Rutile', lvl: 1, col: '#c49a5a' },
  { id: 'cr', n: 'Chrome', lvl: 3, col: '#4f7a3a' }, { id: 'mn', n: 'Manganese', lvl: 3, col: '#6b3b52' },
];
const BASES = { clear: { n: 'Clear', lvl: 0 }, matte: { n: 'Matte', lvl: 0 }, bare: { n: 'None', lvl: 0 }, shino: { n: 'Shino', lvl: 4 }, ash: { n: 'Ash', lvl: 5 } };
const BASE_ORDER = ['clear', 'matte', 'shino', 'ash', 'bare'];
const DIPS = ['Thin', 'Medium', 'Thick'];
const KILNS = {
  electric: { n: 'Electric', cones: ['04', '6'], air: false, lvl: 0, up: 18, cool: 7 },
  gas:      { n: 'Gas', cones: ['6', '10'], air: true, lvl: 2, up: 22, cool: 8 },
  wood:     { n: 'Wood', cones: ['10'], air: true, lvl: 5, up: 28, cool: 10 },
};
const KILN_ORDER = ['electric', 'gas', 'wood'];
const CONE_T = { '04': 1060, '6': 1220, '10': 1300 };
const FORMS = {
  plate: { n: 'plate', v: 9 }, bowl: { n: 'bowl', v: 10 }, cup: { n: 'cup', v: 6 }, jar: { n: 'jar', v: 13 },
  vase: { n: 'vase', v: 15 }, bottle: { n: 'bottle', v: 18 }, pot: { n: 'pot', v: 7 },
};
const PRESETS = {
  plate: { r0: 3, r1: 10, r2: 12, r3: 13, H: 3 }, bowl: { r0: 3, r1: 6.5, r2: 9, r3: 10, H: 7 }, cup: { r0: 3, r1: 4.2, r2: 4.3, r3: 4.5, H: 9 },
  jar: { r0: 4, r1: 8, r2: 8.5, r3: 5, H: 13 }, vase: { r0: 3.5, r1: 6.5, r2: 4.5, r3: 3.5, H: 22 }, bottle: { r0: 4, r1: 7.5, r2: 3, r3: 1.6, H: 24 },
};
function classify(p) {
  const m = Math.max(p.r1, p.r2, p.r3), W = 2 * m;
  if (p.H < 0.28 * W) return 'plate';
  if (p.r3 <= 0.38 * m && p.H >= 0.9 * W) return 'bottle';
  if (p.r3 >= 0.9 * m && p.H < 0.75 * W) return 'bowl';
  if (p.r3 >= 0.75 * m && p.H >= 0.75 * W && W <= 12) return 'cup';
  if (p.H >= 1.15 * W && p.r3 < 0.9 * m) return 'vase';
  if (p.r3 < 0.9 * m) return 'jar';
  return 'pot';
}
const LEVELS = [0, 8, 20, 40, 65, 100];
const LEVEL_NOTE = ['', 'Tin and rutile are on the glaze shelf.', 'The gas kiln is built, and porcelain has arrived.', 'Chrome and manganese are on the glaze shelf.', 'The shino base is mixed.', 'The wood kiln is built. Ash glaze and speckled clay are in.'];
const LEVEL_NEXT = ['', 'tin and rutile', 'the gas kiln and porcelain', 'chrome and manganese', 'the shino base', 'the wood kiln'];

/* ============================== the glaze book ============================== */
// c1 main colour, c2 the second colour (breaks, streaks, blush), surf: gloss, satin, matte, metal.
const G = {
  clear:    { n: 'Clear', fam: 'clear', rare: 0, lvl: 0, c1: '', c2: '', surf: 'gloss', pat: 'none', clues: ['Nothing in it at all.', 'The glossy base on its own.'] },
  satin:    { n: 'Satin White', fam: 'white', rare: 0, lvl: 0, c1: '#e7e5de', c2: '#cfcbc0', surf: 'satin', pat: 'none', clues: ['Nothing in it at all.', 'The matte base on its own.'] },
  honey:    { n: 'Honey', fam: 'amber', rare: 0, lvl: 0, c1: '#d99a3a', c2: '#8f5214', surf: 'gloss', pat: 'break', clues: ['A touch of iron.', 'Plenty of air in the kiln.'] },
  amber:    { n: 'Amber', fam: 'amber', rare: 1, lvl: 0, c1: '#b8641d', c2: '#5e2c0a', surf: 'gloss', pat: 'break', clues: ['Iron, two of it.', 'Plenty of air in the kiln.'] },
  tenmoku:  { n: 'Tenmoku', fam: 'black', rare: 1, lvl: 0, c1: '#2a1a12', c2: '#9a5220', surf: 'gloss', pat: 'break', clues: ['A lot of iron.', 'Cone 6 or hotter.'] },
  hare:     { n: "Hare's Fur", fam: 'black', rare: 4, lvl: 0, c1: '#231710', c2: '#b8702e', surf: 'gloss', pat: 'hare', clues: ['The most iron, glossy, dipped thick.', 'Let it cool slowly.'] },
  cobalt:   { n: 'Cobalt Blue', fam: 'blue', rare: 1, lvl: 0, c1: '#2446a8', c2: '#102a70', surf: 'gloss', pat: 'break', clues: ['Cobalt, just one.', 'Any kiln will do.'] },
  midnight: { n: 'Midnight Blue', fam: 'blue', rare: 1, lvl: 0, c1: '#16245e', c2: '#0a1133', surf: 'gloss', pat: 'none', clues: ['More cobalt than you think.', 'Any kiln will do.'] },
  cugreen:  { n: 'Copper Green', fam: 'green', rare: 1, lvl: 0, c1: '#4e8f58', c2: '#2a5a33', surf: 'gloss', pat: 'break', clues: ['Copper, with air.', 'Cone 6 or hotter.'] },
  turq:     { n: 'Turquoise', fam: 'blue', rare: 2, lvl: 0, c1: '#3fb0b0', c2: '#1f7f86', surf: 'gloss', pat: 'break', clues: ['Copper.', 'The coolest firing, cone 04.'] },
  oribe:    { n: 'Oribe', fam: 'green', rare: 2, lvl: 0, c1: '#2f7a4a', c2: '#173f26', surf: 'gloss', pat: 'runs', clues: ['Two of copper, glossy, dipped thick.', 'Cone 6 or hotter, with air.'] },
  bronze:   { n: 'Copper Bronze', fam: 'brown', rare: 2, lvl: 0, c1: '#5a4a36', c2: '#b89868', surf: 'metal', pat: 'streak', clues: ['A lot of copper in the matte base.', 'With air.'] },
  tinwhite: { n: 'Tin White', fam: 'white', rare: 0, lvl: 1, c1: '#f2f1ec', c2: '#d9d6cc', surf: 'gloss', pat: 'none', clues: ['Tin makes things white.', 'Cone 6 or hotter.'] },
  majolica: { n: 'Majolica White', fam: 'white', rare: 1, lvl: 1, c1: '#f4f0e4', c2: '#ddd4bd', surf: 'gloss', pat: 'none', clues: ['Tin makes things white.', 'The coolest firing, cone 04.'] },
  powder:   { n: 'Powder Blue', fam: 'blue', rare: 1, lvl: 1, c1: '#9db8e0', c2: '#6f8fc4', surf: 'gloss', pat: 'float', clues: ['Cobalt with tin.', 'Nothing else in it.'] },
  rutblue:  { n: 'Rutile Blue', fam: 'blue', rare: 2, lvl: 1, c1: '#5d7fa6', c2: '#c9a46a', surf: 'gloss', pat: 'streak', clues: ['Cobalt and rutile together.', 'Nothing else in it.'] },
  floating: { n: 'Floating Blue', fam: 'blue', rare: 3, lvl: 1, c1: '#3f6f9e', c2: '#b4cbdc', surf: 'gloss', pat: 'float', clues: ['Cobalt, rutile and iron.', 'Cone 6 or hotter, cooled slowly.'] },
  robin:    { n: "Robin's Egg", fam: 'blue', rare: 2, lvl: 1, c1: '#9fd3cf', c2: '#6fb3ae', surf: 'satin', pat: 'float', clues: ['Copper with tin.', 'Cone 6 or hotter, with air.'] },

function kilnDur() { const k = KILNS[S.kiln.kiln || S.kilnType]; return { up: k.up, hold: 2, cool: k.cool * (S.kiln.cool === 'fast' ? 0.6 : 1.5) }; }

    const p = el('div', 'pad'); p.appendChild(button('Open the kiln', 'go wide', openKiln)); jb.appendChild(p);
  }
}
function kilnStatus() {
  const K = S.kiln, d = kilnDur(), T = kilnTemp(K.t), heating = K.t < d.up + d.hold;
  return '<b>' + Math.round(T) + '°C</b>. ' + (heating ? (T > 900 ? 'The glazes are melting. The air in the kiln matters now.' : 'Water and carbon are burning out of the clay.') : 'Listen for the glazes pinging as they cool.');
}
function airControl() {
  const wrap = el('div', 'pad');
  wrap.appendChild(el('div', 'lab', 'Damper'));
  const r = el('div', 'airrow'); r.appendChild(el('span', '', 'Starved')); const inp = document.createElement('input'); inp.type = 'range'; inp.min = 0; inp.max = 100; inp.value = Math.round(S.air * 100); inp.setAttribute('aria-label', 'Air in the kiln');
  inp.addEventListener('input', () => { S.air = inp.value / 100; }); r.appendChild(inp); r.appendChild(el('span', '', 'Open')); wrap.appendChild(r);
  wrap.appendChild(el('div', 'note', 'Starve it of air while the glazes melt, above 900°C, and copper turns red and iron turns celadon green.'));

}
function deckShelf() {
  window.TTG?.track('shop_open');
  const sel = potById(selShelf) && potById(selShelf).st === 'fired' ? potById(selShelf) : null;
  if (sel) {
    const r = sel.res, card = el('div', 'card');
    card.innerHTML = '<h3>' + r.name + ' ' + FORMS[sel.form].n + '</h3><div class="sub">' + CLAYS[sel.clay].n + '. ' + recipeText(sel.rec) + '</div><div class="lines num"><span>' + firingText(r) + '</span>' + (r.flaw ? '<span><b>Flaw:</b> ' + r.flaw + '</span>' : '') + '<span>Worth <b>' + r.val + '</b> coins.</span></div>';
    const act = el('div', 'row'); act.style.marginTop = '8px';
    act.appendChild(button('Sell for ' + r.val, 'go', () => { S.coins += r.val; S.pots.splice(S.pots.indexOf(sel), 1); selShelf = null; sfxCoin(); window.TTG?.track('purchase', { value: r.val }); dirty = true; persist(); }));

  } else if (shelfPots().length) jb.appendChild(el('div', 'note', 'Tap a pot on the shelf to see it, sell it, or give it to someone who ordered one.'));
  jb.appendChild(el('div', 'sec', 'Orders'));
  if (!S.orders.length) jb.appendChild(el('div', 'note', 'Nobody has asked for anything yet. Orders come in every minute or so.'));
  S.orders.forEach(o => {
    const ok = sel && fits(sel, o.want), any = shelfPots().some(p => fits(p, o.want));
    const box = el('div', 'order' + (ok ? ' ok' : ''));
    box.appendChild(el('div', '', '<div class="who">' + o.who + '</div><div class="what">' + orderText(o.want) + '</div><div class="pay num">' + o.pay + ' coins and ' + o.rep + ' reputation</div>'));
    box.appendChild(button(ok ? 'Give it' : any ? 'Pick it' : 'Not yet', ok ? 'go sm' : 'sm', () => {
      if (ok) { S.coins += o.pay; gainRep(o.rep); S.pots.splice(S.pots.indexOf(sel), 1); S.orders.splice(S.orders.indexOf(o), 1); selShelf = null; sfxCoin(); toast(o.who + ' is delighted.'); window.TTG?.track('purchase', { value: o.pay }); dirty = true; persist(); }
      else if (any) { selShelf = shelfPots().find(p => fits(p, o.want)).id; dirty = true; }
    }, !ok && !any));
    jb.appendChild(box);
  });
  jb.appendChild(el('div', 'sec', 'The studio'));
  const ups = [
    { n: 'Kiln shelf', t: 'Room for one more pot in every firing.', lv: S.up.shelf, cost: [50, 120, 260], fn: () => { S.up.shelf++; } },
    { n: 'Ware board', t: 'Two more pots can wait to be glazed.', lv: S.up.board, cost: [40, 110], fn: () => { S.up.board++; } },
  ];
  ups.forEach(u => {
    const row = el('div', 'up'); row.appendChild(el('div', '', '<h4>' + u.n + '</h4><p>' + u.t + '</p>'));
    const c = u.cost[u.lv];
    if (c == null) row.appendChild(el('span', 'note', 'Done'));
    else row.appendChild(button('Buy<small>' + c + ' coins</small>', 'buy num', () => { if (S.coins < c) return; S.coins -= c; u.fn(); sfxCoin(); window.TTG?.track('upgrade_bought', { level: u.lv + 1, value: c }); dirty = true; persist(); }, S.coins < c));
    jb.appendChild(row);
  });
  const next = LEVELS[S.lvl + 1];
  if (next) jb.appendChild(el('div', 'note num', 'At <b>' + next + '</b> reputation: ' + LEVEL_NEXT[S.lvl + 1] + '. New glazes in the book count for 2 each.'));
}
function deckBook() {
  jb.appendChild(el('div', 'note num', '<b>' + found() + ' of ' + BOOK.length + '</b> glazes found. Tap a tile.'));
  const k = selBook || BOOK.find(x => S.book[x]) || BOOK[0];
  const g = G[k], b = S.book[k], card = el('div', 'card');
  if (b) {
    card.innerHTML = '<h3>' + g.n + '</h3><div class="sub">First came out on a ' + FORMS[b.form].n + ' of ' + CLAYS[b.clay].n.toLowerCase() + '.</div><div class="lines"><span><b>Glaze:</b> ' + recipeText(b.rec) + '</span><span><b>Firing:</b> ' + firingText(b.f) + '</span></div>';
    const r = el('div', 'row'); r.style.marginTop = '8px'; r.appendChild(button('Glaze with this', 'go', () => useRecipe(k))); card.appendChild(r);
  } else {
    const n = S.notes[k] || 0, lock = g.lvl > S.lvl;
    card.innerHTML = '<h3>Not found yet</h3><div class="sub">' + (lock ? 'Needs something the studio does not have yet.' : 'A ' + FAM_WORD[g.fam] + ' glaze.') + '</div><div class="lines">' + g.clues.slice(0, n).map(c => '<span>' + c + '</span>').join('') + '</div>';
    if (n < 2) { const cost = 20 + n * 20, r = el('div', 'row'); r.style.marginTop = '8px'; r.appendChild(button('Buy a note, ' + cost + ' coins', 'go', () => { if (S.coins < cost) return; S.coins -= cost; S.notes[k] = n + 1; sfxCoin(); window.TTG?.track('upgrade_bought', { value: cost }); dirty = true; persist(); }, S.coins < cost)); card.appendChild(r); }
  }

}
document.querySelectorAll('#tabs .tab').forEach(b => b.addEventListener('click', () => { audio(); tab = b.dataset.tab; if (tab === 'book') S.newBook = false; sfxTap(); dirty = true; }));

/* ============================== input ============================== */
function toast(msg) { const e = $('toast'); e.textContent = msg; e.style.display = 'block'; e.style.left = (area.x + area.w / 2) + 'px'; e.style.bottom = (H - (area.y + area.h) + 12) + 'px'; toastT = 3.4 + Math.min(3, msg.length / 40); }
let toastT = 0;
cv.addEventListener('pointerdown', e => {
  audio(); if (AC && AC.state === 'suspended') AC.resume();
  if (mode !== 'play') return;
  const x = e.clientX, y = e.clientY; if (x > area.x + area.w || y > area.y + area.h) return;
  if (tab === 'wheel') {
    const Wh = S.wheel;
    if (Wh.state === 'lump') { Wh.hold = [x, y]; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } return; }
    if (Wh.state === 'shape') { let best = -1, bd = 34; handles().forEach((h, i) => { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = i; } }); if (best >= 0) { drag = { i: best }; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } } return; }
  }
  for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (h.fn && x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { h.fn(); return; } }
});
cv.addEventListener('pointermove', e => {
  if (mode !== 'play' || tab !== 'wheel') return;
  const Wh = S.wheel, x = e.clientX, y = e.clientY;
  if (Wh.state === 'lump' && Wh.hold) { Wh.jit += Math.hypot(x - Wh.hold[0], y - Wh.hold[1]); Wh.hold = [x, y]; }
  if (Wh.state === 'shape' && drag) {
    const { s, cx0, by } = wheelGeom(), p = Wh.p, r = clamp((x - cx0) / s, 1.2, 14);
    if (drag.i === 0) p.r1 = r; else if (drag.i === 1) p.r2 = clamp(r, 1.2, p.r1 * 1.6 + 1); else { p.r3 = clamp(r, 1.2, p.r2 * 1.6 + 1); p.H = clamp((by - y) / s, 2, 30); }
    p.r0 = clamp(Math.min(p.r1, p.r2 + 2) * 0.55, 2, 6);
  }
});
function up() { if (tab === 'wheel') { if (S.wheel.hold) S.wheel.hold = null; if (drag) { drag = null; dirty = true; } } }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
document.addEventListener('touchmove', e => {
  let n = e.target;
  while (n && n !== document.body) { const oy = getComputedStyle(n).overflowY, ox = getComputedStyle(n).overflowX; if ((n.scrollHeight > n.clientHeight + 1 && (oy === 'auto' || oy === 'scroll')) || (n.scrollWidth > n.clientWidth + 1 && (ox === 'auto' || ox === 'scroll')) || n.type === 'range') return; n = n.parentElement; }
  if (e.cancelable) e.preventDefault();
}, { passive: false });
$('muteBtn').addEventListener('click', () => { audio(); setMuted(!S.muted); });

/* ============================== time ============================== */
function stepWheel(dt) {
  const Wh = S.wheel;
  if (Wh.state === 'lump') {
    if (Wh.hold) Wh.wob = Math.max(0, Wh.wob - dt * 0.5 + Math.min(0.05, Wh.jit * 0.0006)); else Wh.wob = Math.min(1, Wh.wob + dt * 0.04);
    if (Wh.hold && Wh.wob <= 0.04) { Wh.state = 'shape'; Wh.q = clamp(1 - Wh.jit * 0.0012, 0.72, 1); Wh.p = Object.assign({}, PRESETS.cup); Wh.hold = null; toast('Centered. Now pull the walls.'); dirty = true; }
  }
  if (humG) humG.gain.value = S.muted || tab !== 'wheel' || Wh.state === 'empty' ? 0 : 0.04;
}
function stepOrders(dt) {
  S.orderClock -= dt;
  if (S.orderClock <= 0) { S.orderClock = 70 + Math.random() * 30; if (S.orders.length < 4 && (S.fired > 0 || S.pots.length)) { newOrder(); dirty = true; if (tab !== 'shelf') toast('A new order came in.'); } }
}
function checkAway() {
  const el2 = (Date.now() - S.lastSeen) / 1000;
  if (!isFinite(el2) || el2 < 120) { S.lastSeen = Date.now(); return false; }
  const lines = [];
  if (S.kiln.state === 'firing') { stepKiln(1e6); lines.push('The kiln finished its firing and has cooled.'); }
  let n = 0; while (S.orders.length < 4 && n < Math.floor(el2 / 80) && (S.fired > 0 || S.pots.length)) { newOrder(); n++; }
  if (n) lines.push(n + ' new order' + (n > 1 ? 's' : '') + ' came in.');
  if (!lines.length) { S.lastSeen = Date.now(); return false; }
  $('awayText').textContent = lines.join(' ');
  window.TTG?.track('offline_claim', { value: n });
  $('away').classList.add('show'); persist(); return true;
}
$('awayBtn').addEventListener('click', () => { $('away').classList.remove('show'); dirty = true; });
$('playBtn').addEventListener('click', () => {
  audio(); if (AC && AC.state === 'suspended') AC.resume();
  const first = !S.started; S.started = true; mode = 'play';
  $('title').classList.remove('show'); $('deck').style.display = 'flex'; $('muteBtn').style.display = 'flex';
  window.TTG?.track('game_launch');
  layout(); dirty = true;
  if (!checkAway() && first) toast('Pick a clay and put it on the wheel.');
  persist();
});
let last = performance.now(), running = true, saveT = 0, uiT = 0;
function frame(now) {
  if (!running) return;

  const t = now / 1000;
  if (mode === 'play' && !$('away').classList.contains('show')) {
    stepWheel(dt); stepKiln(dt); stepOrders(dt);
    if (dip > 0) { dip += dt * 1.1; if (dip >= 1) dip = 0; }
    if (reveal > 0) reveal = Math.max(0, reveal - dt / 1.8);
    if (roarG) { const T = S.kiln.state === 'firing' ? kilnTemp(S.kiln.t) : 0; roarG.gain.value = S.muted ? 0 : clamp(T / 1300, 0, 1) * (tab === 'kiln' ? 0.22 : 0.07); }
  }
  draw(t);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.display = 'none'; }
  uiT -= dt;
  if (mode === 'play' && dirty && !drag) buildDeck();
  if (mode === 'play' && uiT <= 0) {
    uiT = 0.25;
    const ks = $('kstat'); if (ks && S.kiln.state === 'firing') ks.innerHTML = kilnStatus();
    const lp = $('lumpPct'); if (lp && S.wheel.state === 'lump') lp.textContent = Math.round((1 - S.wheel.wob) * 100) + '%';
  }
  saveT -= dt; if (saveT <= 0 && mode === 'play') { saveT = 8; persist(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; if (mode === 'play') persist(); if (AC && AC.state === 'running') AC.suspend(); }
  else { if (running) return; running = true; last = performance.now(); if (AC && AC.state === 'suspended' && !S.muted) AC.resume(); if (mode === 'play') { checkAway(); dirty = true; } requestAnimationFrame(frame); }
});
window.addEventListener('pagehide', () => { if (mode === 'play') persist(); });
window.addEventListener('resize', () => { layout(); dirty = true; });
if (/[?&]debug(&|=|$)/.test(location.search)) window.__kg = {
  state: () => ({ mode, tab, coins: S.coins, rep: S.rep, lvl: S.lvl, found: found(), pots: S.pots.map(p => p.id + ':' + p.form + ':' + p.st + (p.res ? ':' + (p.res.key || p.res.name) : '')), kiln: S.kiln.state, load: S.kiln.load.length, orders: S.orders.length, wheel: S.wheel.state, area: Object.assign({}, area) }),

  give: (c, r) => { S.coins += c || 0; if (r) gainRep(r); dirty = true; }, S: () => S, book: () => BOOK, G,
};
setMuted(S.muted, true);
layout();
if (S.started) { $('titleStat').textContent = found() + ' of ' + BOOK.length + ' glazes in the book. ' + S.coins + ' coins.'; $('playBtn').textContent = 'Back to the studio'; }
requestAnimationFrame(t => { last = t; frame(t); });
})();
