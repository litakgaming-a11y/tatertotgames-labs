<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sky Bloom 🎆</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%8E%86%3C/text%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#070a1e; touch-action:none; overscroll-behavior:none; position:fixed; inset:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#f2ecff; }
  canvas#cv { position:fixed; inset:0; display:block; touch-action:none; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .screen.show { display:flex; }
  button { pointer-events:auto; font-family:inherit; border:none; cursor:pointer; color:#fff; }

  /* ---------- Title ---------- */
  #title { justify-content:flex-start; padding-top:calc(7vh + env(safe-area-inset-top)); }
  .logo { font-weight:900; font-size:clamp(44px, 15vw, 96px); line-height:.88; letter-spacing:2px;
    font-style:italic; transform:skewX(-5deg);
    background:linear-gradient(180deg,#fffbf0 0%, #ffd9f2 30%, #ffb347 62%, #ff5f9e 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,150,220,.55)) drop-shadow(0 4px 0 rgba(50,10,50,.65));
    animation:logoBounce 2.6s ease-in-out infinite; }
  .logo small { display:block; font-size:.5em; letter-spacing:11px; margin-left:8px;
    background:linear-gradient(180deg,#eafcff,#8fd4ff 55%,#5a7dff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  @keyframes logoBounce { 0%,100%{transform:skewX(-5deg) translateY(0) scale(1);} 50%{transform:skewX(-5deg) translateY(-10px) scale(1.035);} }
  .tagline { margin-top:6px; font-size:clamp(11px,3.4vw,15px); font-weight:700; letter-spacing:2px; opacity:.72; text-shadow:0 2px 6px #000; }
  .statRow { margin-top:13px; font-size:clamp(14px,4.1vw,19px); font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.7);
    background:rgba(16,10,40,.55); padding:7px 16px; border-radius:999px; border:1px solid rgba(200,160,255,.28); backdrop-filter:blur(3px); }
  .statRow + .statRow { margin-top:7px; }
  .statRow .dim { opacity:.75; font-weight:600; font-size:.85em; }
  #playBtn { margin-top:4.5vh; font-size:clamp(20px,6vw,30px); font-weight:900; letter-spacing:1px; padding:18px 42px; border-radius:20px;
    background:linear-gradient(180deg,#ffd76a,#ff7a3d); color:#43180a;
    box-shadow:0 6px 0 #9c3a10, 0 0 34px rgba(255,150,80,.5); animation:pulse 1.15s ease-in-out infinite; }
  #playBtn:active { transform:scale(.94); box-shadow:0 2px 0 #9c3a10, 0 0 24px rgba(255,150,80,.5); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.055);} }
  .metaBtns { display:flex; gap:10px; margin-top:14px; }
  .subBtn { font-size:clamp(14px,4.1vw,18px); font-weight:800; padding:12px 22px; border-radius:15px;
    background:linear-gradient(180deg,#7a5cff,#3c2bb5); box-shadow:0 5px 0 #241571, 0 0 20px rgba(130,110,255,.32); }
  .subBtn:active { transform:scale(.94); box-shadow:0 2px 0 #241571; }
  #badge { pointer-events:auto; position:absolute; bottom:calc(10px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    font-size:12px; font-weight:700; letter-spacing:.6px; color:#e2d5ff; text-decoration:none; opacity:.85;
    background:rgba(12,8,30,.65); border:1px solid rgba(200,170,255,.3); padding:6px 14px; border-radius:999px; }
  #badge::before { content:"🥔 "; }

  @media (max-height: 540px) {
    #title { padding-top:calc(2vh + env(safe-area-inset-top)); }
    .logo { font-size:clamp(28px, 9vh, 58px); }
    .tagline { display:none; }
    #playBtn { margin-top:1.6vh; padding:11px 28px; }
    .metaBtns { margin-top:9px; }
    .subBtn { padding:8px 16px; }
    #badge { display:none; }
  }

  /* ---------- HUD ---------- */
  #hud { pointer-events:none; justify-content:flex-start; }
  #hudTop { position:absolute; top:calc(8px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left));
    right:calc(60px + env(safe-area-inset-right)); display:flex; justify-content:space-between; align-items:flex-start; gap:6px; flex-wrap:wrap; }
  .chip { background:rgba(14,9,34,.72); border:1px solid rgba(190,160,255,.28); border-radius:12px; padding:6px 11px;
    font-weight:800; font-size:clamp(12px,3.6vw,16px); text-shadow:0 1px 3px #000; white-space:nowrap; }
  .chip b { color:#ffd76a; }
  #hudCombo { position:absolute; top:calc(56px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:clamp(17px,5.4vw,26px); font-weight:900; color:#ffd76a; text-shadow:0 0 14px rgba(255,180,80,.85), 0 2px 4px #000;
    opacity:0; transition:opacity .25s; }
  #hudCombo.on { opacity:1; }
  #hudCombo.pop { animation:comboPop .3s ease-out; }
  @keyframes comboPop { 0%{transform:translateX(-50%) scale(1.7);} 100%{transform:translateX(-50%) scale(1);} }
  #finalePrompt { position:absolute; bottom:calc(16vh + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    font-size:clamp(18px,5.6vw,28px); font-weight:900; letter-spacing:1px; color:#fff5d0; display:none;
    text-shadow:0 0 18px rgba(255,190,90,.9), 0 3px 6px #000; animation:pulse .8s ease-in-out infinite; white-space:nowrap; }
  #finalePrompt.show { display:block; }

  /* ---------- Panels ---------- */
  #results, #shop, #album { background:rgba(8,5,22,.55); }
  .panel { pointer-events:auto; background:linear-gradient(180deg, rgba(34,22,72,.96), rgba(16,10,38,.96));
    border:1px solid rgba(200,170,255,.35); border-radius:22px; padding:24px 24px 20px; width:min(90vw, 400px);
    max-height:86vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    box-shadow:0 14px 50px rgba(0,0,0,.65), 0 0 46px rgba(150,90,255,.2); animation:panelIn .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes panelIn { from{transform:scale(.7) translateY(30px); opacity:0;} to{transform:scale(1) translateY(0); opacity:1;} }
  .panel h2 { font-size:clamp(22px,6.6vw,32px); font-weight:900; font-style:italic; letter-spacing:1px;
    background:linear-gradient(180deg,#fff,#ffc46a); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,180,90,.4)); }
  .panel .bigNum { font-size:clamp(28px,8.6vw,42px); font-weight:900; color:#ffd76a; text-shadow:0 0 16px rgba(255,180,60,.6); margin:6px 0 2px; }
  .panel .sub { opacity:.82; font-size:14px; font-weight:600; margin-bottom:4px; }
  #stars { font-size:clamp(28px,9vw,40px); letter-spacing:6px; min-height:46px; margin:2px 0 4px; }
  #stars span { display:inline-block; opacity:.18; transform:scale(.6); transition:none; }
  #stars span.on { opacity:1; animation:starPop .45s cubic-bezier(.2,1.8,.4,1) forwards; }
  @keyframes starPop { 0%{transform:scale(.4) rotate(-25deg);} 60%{transform:scale(1.35) rotate(8deg);} 100%{transform:scale(1) rotate(0);} }
  #unlockLine { min-height:22px; font-weight:800; color:#8affd8; font-size:15px; text-shadow:0 0 10px rgba(80,255,200,.5); margin:6px 0; }
  .cta { margin-top:12px; width:100%; font-size:clamp(16px,4.8vw,21px); font-weight:900; padding:14px; border-radius:16px;
    background:linear-gradient(180deg,#ffd76a,#ff7a3d); color:#43180a; box-shadow:0 5px 0 #9c3a10; animation:pulse 1.25s ease-in-out infinite; }
  .cta:active { transform:scale(.95); box-shadow:0 2px 0 #9c3a10; }
  .cta.alt { background:linear-gradient(180deg,#8fb6ff,#3f52c9); color:#f0f4ff; box-shadow:0 5px 0 #1f2a86; animation:none; margin-top:9px; }
  .cta.alt:active { box-shadow:0 2px 0 #1f2a86; }

  /* ---------- Shop ---------- */
  #shopSparks { font-size:clamp(18px,5.2vw,24px); font-weight:900; color:#ffd76a; margin:8px 0 10px; text-shadow:0 0 10px rgba(255,190,60,.4); }
  .secHead { text-align:left; font-size:12px; font-weight:900; letter-spacing:2px; opacity:.65; margin:12px 2px 7px; }
  .upRow { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.06); border:1px solid rgba(200,170,255,.18);
    border-radius:14px; padding:9px 11px; margin-bottom:9px; text-align:left; }
  .upRow .ic { font-size:25px; filter:drop-shadow(0 0 6px rgba(200,150,255,.5)); }
  .upRow .info { flex:1; min-width:0; }
  .upRow .nm { font-weight:800; font-size:15px; }
  .upRow .ds { font-size:12px; opacity:.75; font-weight:600; }
  .upRow .lv { font-size:11px; font-weight:800; color:#c3a8ff; letter-spacing:1px; }
  .upRow.locked { opacity:.55; }
  .buyBtn { min-width:76px; padding:9px 10px; border-radius:12px; font-weight:900; font-size:14px;
    background:linear-gradient(180deg,#5ce09a,#1e9e63); box-shadow:0 4px 0 #0d5c37; }
  .buyBtn:active { transform:scale(.93); box-shadow:0 1px 0 #0d5c37; }
  .buyBtn.no { background:linear-gradient(180deg,#5f5a80,#3b3757); box-shadow:0 4px 0 #24213a; opacity:.75; }
  .buyBtn.max { background:linear-gradient(180deg,#c99cff,#7440dd); box-shadow:0 4px 0 #421f86; }
  .tag { font-size:11px; font-weight:900; letter-spacing:1px; padding:5px 9px; border-radius:9px; background:rgba(255,215,106,.16); color:#ffd76a; }
  .tag.lock { background:rgba(255,255,255,.08); color:#b8b0d8; }

  /* ---------- Album ---------- */
  #albumGrid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin:10px 0 4px; }
  .card { background:rgba(255,255,255,.05); border:1px solid rgba(200,170,255,.2); border-radius:13px; padding:6px 6px 7px; }
  .card canvas { width:100%; height:auto; display:block; border-radius:8px; background:#080b22; }
  .card .cn { font-size:11px; font-weight:900; letter-spacing:1px; margin-top:5px; opacity:.85; }
  .card .cs { font-size:13px; font-weight:900; color:#ffd76a; }
  #albumEmpty { font-size:14px; font-weight:600; opacity:.72; margin:16px 4px; line-height:1.5; }

  /* ---------- Mute ---------- */
  #muteBtn { position:absolute; top:calc(8px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right)); z-index:6;
    width:44px; height:44px; border-radius:12px; font-size:20px;
    background:rgba(14,9,34,.72); border:1px solid rgba(190,160,255,.28); }
  #muteBtn:active { transform:scale(.9); }
</style>
<script src="/analytics.js" defer></script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="title" class="screen">
    <div class="logo">SKY<small>BLOOM</small></div>
    <div class="tagline">TAP AT THE PERFECT HEIGHT</div>
    <div class="statRow">✨ <span id="sparkCount">0</span> <span class="dim">sparks</span></div>
    <div class="statRow">🌙 <span id="nightCount">Night 1</span> <span class="dim" id="bestLine"></span></div>
    <button id="playBtn">🎆 TAP TO PLAY</button>
    <div class="metaBtns">
      <button class="subBtn" id="shopBtn">🛠️ BARGE</button>
      <button class="subBtn" id="albumBtn">📔 ALBUM</button>
    </div>
    <a id="badge" href="../../">TaterTot Games Labs</a>
  </div>

  <div id="hud" class="screen">
    <div id="hudTop">
      <div class="chip" id="hudNight">NIGHT 1</div>
      <div class="chip" id="hudScore">0</div>
      <div class="chip" id="hudTarget">🎯 0</div>
      <div class="chip" id="hudBank">🎇 0</div>
    </div>
    <div id="hudCombo">PERFECT x2</div>
    <div id="finalePrompt">TAP FOR THE GRAND FINALE!</div>
  </div>

  <div id="results" class="screen">
    <div class="panel">
      <h2 id="resTitle">NIGHT CLEAR!</h2>
      <div id="stars"><span>★</span><span>★</span><span>★</span></div>
      <div class="bigNum" id="resScore">0</div>
      <div class="sub">Target <b id="resTarget">0</b> · Best combo <b id="resCombo">x1</b></div>
      <div class="bigNum" id="resSparks" style="font-size:clamp(20px,6vw,28px)">+0 ✨</div>
      <div id="unlockLine"></div>
      <button class="cta" id="contBtn">NEXT NIGHT 🎆</button>
      <button class="cta alt" id="homeBtn">🏠 FESTIVAL HOME</button>
    </div>
  </div>

  <div id="shop" class="screen">
    <div class="panel">
      <h2>THE BARGE</h2>
      <div id="shopSparks">✨ 0</div>
      <div class="secHead">BARGE UPGRADES</div>
      <div id="upList"></div>
      <div class="secHead">FIREWORK TYPES</div>
      <div id="fwList"></div>
      <button class="cta alt" id="shopBack">⬅ BACK</button>
    </div>
  </div>

  <div id="album" class="screen">
    <div class="panel">
      <h2>FESTIVAL ALBUM</h2>
      <div class="sub">Your best finale from every night.</div>
      <div id="albumGrid"></div>
      <div id="albumEmpty"></div>
      <button class="cta alt" id="albumBack">⬅ BACK</button>
    </div>
  </div>

  <button id="muteBtn">🔊</button>
</div>

<script>
(() => {
'use strict';
/* ============================= helpers ============================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const ri    = (a, b) => (a + Math.random() * (b - a + 1)) | 0;
const $ = id => document.getElementById(id);
const pick = arr => arr[(Math.random() * arr.length) | 0];

function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================= data ============================= */
const PAL = [
  [255, 255, 255], // 0 white
  [255, 214, 106], // 1 gold
  [255, 130, 70],  // 2 ember
  [255, 92, 170],  // 3 pink
  [186, 122, 255], // 4 violet
  [110, 186, 255], // 5 azure
  [120, 255, 208], // 6 mint
  [255, 244, 190], // 7 cream
  [255, 74, 74],   // 8 red
  [168, 255, 120], // 9 lime
];
const COLOR_PAIRS = [[1, 2], [3, 4], [5, 6], [1, 8], [4, 3], [6, 5], [9, 6], [7, 1], [2, 8], [5, 4]];

// Firework types. `at` = total-sparks threshold that unlocks it.
const TYPES = [
  { id: 0, ic: '🌼', nm: 'Peony',        ds: 'The classic double shell',   at: 0 },
  { id: 1, ic: '🌿', nm: 'Willow',       ds: 'Long drooping golden trails', at: 260 },
  { id: 2, ic: '💍', nm: 'Ring',         ds: 'A perfect halo of sparks',    at: 600 },
  { id: 3, ic: '✨', nm: 'Chrysanthemum', ds: 'Dense glitter that crackles', at: 1050 },
  { id: 4, ic: '💗', nm: 'Heart',        ds: 'Shaped bloom for the crowd',  at: 1650 },
  { id: 5, ic: '🐉', nm: 'Dragon',       ds: 'Seven crackling comet spokes', at: 2500 },
];
const UPG = [
  { id: 'win',   ic: '🎯', nm: 'Steady Hand',  ds: '+12% timing window',        base: 90,  max: 5 },
  { id: 'shell', ic: '🚀', nm: 'Extra Shell',  ds: '+1 rocket every night',     base: 120, max: 5 },
  { id: 'size',  ic: '🌸', nm: 'Bigger Blooms',ds: '+14% bloom size & sparks',  base: 110, max: 4 },
  { id: 'rack',  ic: '🎇', nm: 'Finale Rack',  ds: '+2 banked finale shells',   base: 150, max: 4 },
];
const upCost = (u, lvl) => Math.floor(u.base * Math.pow(1.65, lvl));

// Night sky palettes: [top, mid, horizon] rgb. The sky lerps toward the next one
// across a night, so the evening visibly deepens while you play.
const SKIES = [
  [[8, 10, 34],  [30, 18, 66],  [92, 40, 88]],
  [[6, 14, 40],  [18, 34, 82],  [56, 78, 132]],
  [[14, 8, 30],  [54, 16, 62],  [132, 46, 76]],
  [[4, 16, 32],  [10, 46, 68],  [38, 100, 106]],
  [[18, 6, 26],  [62, 20, 46],  [154, 72, 56]],
  [[10, 10, 26], [36, 26, 74],  [100, 60, 144]],
];

/* ============================= save ============================= */
const SAVE_KEY = 'ttg_skybloom';
function defaultSave() {
  return { v: 1, sparks: 0, total: 0, night: 1, best: 0, bestNight: 0, muted: false,
           up: { win: 0, shell: 0, size: 0, rack: 0 }, unlocked: [0], album: {} };
}
function loadSave() {
  const d = defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return d;
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object') return d;
    const out = Object.assign(d, s);
    // ---- schema repair: never trust what came out of storage ----
    out.up = Object.assign({ win: 0, shell: 0, size: 0, rack: 0 }, (s && s.up) || {});
    for (const u of UPG) out.up[u.id] = clamp(out.up[u.id] | 0, 0, u.max);
    out.sparks = Math.max(0, +out.sparks || 0);
    out.total = Math.max(0, +out.total || 0);
    out.night = clamp(out.night | 0 || 1, 1, 999);
    out.best = Math.max(0, +out.best || 0);
    out.bestNight = Math.max(0, +out.bestNight || 0);
    out.muted = !!out.muted;
    out.unlocked = Array.isArray(out.unlocked)
      ? out.unlocked.map(n => n | 0).filter(n => n >= 0 && n < TYPES.length)
      : [0];
    if (out.unlocked.indexOf(0) < 0) out.unlocked.push(0);
    const alb = {};
    if (out.album && typeof out.album === 'object') {
      for (const k of Object.keys(out.album)) {
        const e = out.album[k];
        const n = k | 0;
        if (!e || typeof e !== 'object' || n < 1 || n > 999) continue;
        alb[n] = { s: Math.max(0, e.s | 0), seed: (e.seed | 0) || 1, p: clamp(e.p | 0, 0, SKIES.length - 1),
                   m: clamp(e.m | 0, 1, 20),
                   t: Array.isArray(e.t) ? e.t.map(x => clamp(x | 0, 0, TYPES.length - 1)).slice(0, 10) : [0] };
        if (!alb[n].t.length) alb[n].t = [0];
      }
    }
    out.album = alb;
    return out;
  } catch (e) { return defaultSave(); }
}
let save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const hasType = id => save.unlocked.indexOf(id) >= 0;

/* ============================= canvas ============================= */
const cv = $('cv');
const cx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1, uScale = 1;
let horizonY = 448, crowdY = 600, bargeY = 470;
let stars = [], skyline = [], crowd = [], ripples = [];
let resizing = false;

function resize() {
  if (resizing) return;
  resizing = true;
  try {
    const w = Math.round(window.innerWidth || 0);
    const h = Math.round(window.innerHeight || 0);
    if (w <= 0 || h <= 0) return;
    W = w; H = h;
    DPR = Math.min(2.5, Math.max(1, window.devicePixelRatio || 1));
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    if (cx.setTransform) cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    uScale = Math.min(1.5, Math.max(0.62, Math.min(W, H) / 720));
    horizonY = Math.round(H * (H > W ? 0.70 : 0.62));
    bargeY = Math.round(horizonY + H * 0.045);
    crowdY = H;
    buildStars(); buildSkyline(); buildCrowd(); buildRipples();
  } finally { resizing = false; }
}
function buildStars() {
  stars = [];
  const n = Math.min(150, Math.round(W * horizonY / 5200));
  for (let i = 0; i < n; i++) {
    stars.push({ x: rand(0, W), y: rand(0, horizonY * 0.92), r: rand(0.5, 1.5),
                 tw: rand(0.6, 2.4), ph: rand(0, TAU) });
  }
}
function buildSkyline() {
  skyline = [];
  let x = -20;
  let i = 0;
  while (x < W + 20) {
    const w = 18 + ((i * 37) % 46);
    const h = 12 + ((i * 61) % 58) * (0.5 + 0.5 * Math.sin(i * 1.7));
    skyline.push({ x, w, h: Math.max(10, h), lit: ((i * 29) % 7) < 4 });
    x += w + 3; i++;
  }
}
function buildCrowd() {
  crowd = [];
  const headR = clamp(H * 0.016, 8, 18);
  const step = headR * 2.1;
  let x = -step;
  let i = 0;
  while (x < W + step) {

  const spd = (o.spd || rand(330, 430)) * clamp(H / 720, 0.7, 1.35);
  const topLimit = Math.max(H * 0.08, 40);
  const ringY = o.ringY !== undefined ? o.ringY : rand(topLimit, horizonY * 0.55);
  const pairs = COLOR_PAIRS[(Math.random() * COLOR_PAIRS.length) | 0];
  const unlocked = save.unlocked.length ? save.unlocked : [0];
  const r = {
    x, y, spd,
    vx: (o.vx !== undefined ? o.vx : rand(-12, 12)) * uScale,
    ringY, ringAmp: o.ringAmp || 0, ringSpd: o.ringSpd || 0, ringPh: rand(0, TAU),
    shrink: !!o.shrink, wMul: 1,
    kind: o.kind || 0,                 // 0 normal | 1 dud | 2 split
    type: o.type !== undefined ? o.type : unlocked[(Math.random() * unlocked.length) | 0],
    c1: pairs[0], c2: pairs[1],

  const x = r.x, y = r.y;

  if (r.kind === 1) { // dud
    if (quality === -1) {

      sfxDud(); vibrate([50, 40, 50]);

    } else {

    addFloater(x, y - 24, quality === -2 ? 'MISSED!' : 'fizzle…', '#b7aee0', false);
    sfxFizzle(); vibrate(18);

    updateCombo();

  const perfect = quality === 2;

  const mult = perfect ? Math.min(10, 1 + combo) : 1;
  const power = perfect ? clamp(0.85 + combo * 0.09, 0.85, 1.7) : 0.55;

  if (r.kind === 2 && !r.child) { // split shell: bloom small, then two children
    emitBloom(x, y, 2, 0.5, r.c1, r.c2);
    sfxBoom(0.4, 1);
    addFloater(x, y - 26, 'SPLIT! ×2', '#9fe8ff', true);
    for (let k = 0; k < 2; k++) {
      launchRocket({
        x: x + (k ? 26 : -26) * uScale, y: y - 6,
        spd: r.spd * rand(0.86, 1.02),
        ringY: Math.max(H * 0.07, r.ringY - rand(H * 0.10, H * 0.19)),
        vx: (k ? 40 : -40), child: true, type: r.type,
        ringAmp: r.ringAmp * 0.6, ringSpd: r.ringSpd,
      });
    }
    score += Math.round(60 * mult);
    shake = Math.max(shake, 5);
    return;
  }

  emitBloom(x, y, r.type, power, r.c1, r.c2);
  if (finaleTypes.length < 10) finaleTypes.push(r.type);
  sfxBoom(power, quality);
  if (r.type === 3 || r.type === 5 || combo >= 4) sfxCrackle(power);
  flash = Math.max(flash, perfect ? 0.30 + combo * 0.02 : 0.14);
  shake = Math.max(shake, perfect ? 8 + combo * 1.2 : 4);

  const gained = perfect ? Math.round(120 * mult) : 45;
  score += gained;

  if (perfect) {
    if (bank < bankCap) bank++;
    cheerTarget = clamp(cheerTarget + 0.26, 0, 1);
    sfxCheer(clamp(combo / 7, 0.15, 1));
    addFloater(x, y - 34, 'PERFECT! +' + gained, '#ffd76a', true);
    if (combo >= 1) addFloater(x, y - 70, 'COMBO x' + mult, '#ffb3ff', combo >= 4);
    vibrate(combo >= 4 ? [12, 22, 30] : 20);
  } else {
    cheerTarget = clamp(cheerTarget + 0.06, 0, 1);
    addFloater(x, y - 30, 'good +' + gained, '#9fe8ff', false);
    vibrate(12);
  }
  updateCombo();
}

function updateCombo() {
  const el = $('hudCombo');
  if (!el) return;
  if (combo >= 1) {
    el.textContent = 'PERFECT x' + Math.min(10, 1 + combo);
    el.classList.add('on');
    el.classList.remove('pop');
    if (el.offsetWidth !== undefined) { void el.offsetWidth; }
    el.classList.add('pop');
  } else {
    el.classList.remove('on');
  }
}

/* ============================= night flow ============================= */
function nightTarget(n) { return 850 + (n - 1) * 480; }

function showScreen(id) {
  ['title', 'hud', 'results', 'shop', 'album'].forEach(s => {
    const el = $(s);
    if (el && el.classList) el.classList.toggle('show', s === id);
  });
}
function clearRockets() {
  for (let i = 0; i < rockets.length; i++) stopWhistle(rockets[i]);
  rockets.length = 0;
}
function startNight() {
  night = save.night;
  score = 0; combo = 0; bestCombo = 1;
  target = nightTarget(night);
  rocketsTotal = Math.min(22, 7 + night + save.up.shell);
  toLaunch = rocketsTotal;
  launchTimer = 0.9;
  bankCap = 6 + save.up.rack * 2;
  bank = 0; finaleFired = 0; finaleTimer = 0; settleTimer = 0;
  finaleTypes = []; finaleSeed = (Math.random() * 1e9) | 0;
  wind = night >= 4 ? rand(-1, 1) * clamp(0.25 + night * 0.05, 0.25, 1) : 0;
  windPhase = rand(0, TAU);
  skyFrom = (night - 1) % SKIES.length;
  skyTo = night % SKIES.length;
  skyMix = 0;
  clearRockets();
  floaters.length = 0;
  phase = 'launching';
  state = 'playing';
  window.TTG?.track('level_start', { level: night });
  $('finalePrompt').classList.remove('show');
  updateCombo();
  showScreen('hud');
  updateHUD();
}
function scheduleLaunch() {
  const prog = 1 - toLaunch / Math.max(1, rocketsTotal);
  let n = 1;
  if (night >= 3 && Math.random() < 0.24) n = 2;
  if (night >= 6 && Math.random() < 0.13) n = 3;
  n = Math.min(n, toLaunch);
  for (let i = 0; i < n; i++) {
    toLaunch--;
    const o = {};
    if (night >= 3 && Math.random() < clamp(0.2 + night * 0.04, 0.2, 0.7)) {
      o.ringAmp = rand(H * 0.020, H * 0.055) * clamp(1 + night * 0.03, 1, 1.5);
      o.ringSpd = rand(0.9, 2.0);
    }
    if (night >= 6 && Math.random() < 0.32) o.shrink = true;
    if (night >= 5 && Math.random() < 0.15) o.kind = 1;               // dud — do NOT tap
    else if (night >= 7 && Math.random() < 0.17) o.kind = 2;          // split
    o.vx = rand(-10, 10) + wind * 46;
    setTimeout_(i * rand(0.16, 0.34), () => { if (state === 'playing') launchRocket(o); });
  }
  launchTimer = lerp(1.55, 0.72, prog) * rand(0.85, 1.15) * clamp(1.12 - night * 0.02, 0.72, 1.12);
}
// tiny frame-driven timer so we never rely on setTimeout for gameplay pacing
const pending = [];
function setTimeout_(delay, fn) { if (delay <= 0) { fn(); return; } pending.push({ t: delay, fn }); }
function pumpPending(dt) {
  for (let i = pending.length - 1; i >= 0; i--) {
    pending[i].t -= dt;
    if (pending[i].t <= 0) {
      const f = pending[i].fn;
      pending.splice(i, 1);
      try { f(); } catch (e) {}
    }
  }
}
function fireFinale() {
  if (phase !== 'finalePrompt') return;
  phase = 'finale';
  finaleFired = 0;
  finaleTimer = 0;
  $('finalePrompt').classList.remove('show');
  addFloater(W / 2, H * 0.34, '🎆 GRAND FINALE 🎆', '#fff0b8', true);
  sfxCheer(1);
  vibrate([30, 40, 30, 40, 60]);
}
function finaleShell() {
  const margin = Math.max(26, W * 0.10);
  const unlocked = save.unlocked.length ? save.unlocked : [0];
  const type = unlocked[(Math.random() * unlocked.length) | 0];
  const pairs = COLOR_PAIRS[(Math.random() * COLOR_PAIRS.length) | 0];
  const x = rand(margin, W - margin);
  const y = rand(H * 0.10, horizonY * 0.52);
  emitBloom(x, y, type, rand(1.15, 1.7), pairs[0], pairs[1]);
  if (finaleTypes.length < 10) finaleTypes.push(type);
  sfxBoom(1.5, 2);
  if (Math.random() < 0.6) sfxCrackle(1.2);
  flash = Math.max(flash, 0.4);
  shake = Math.max(shake, 14);
  cheerTarget = 1;
  score += Math.round(150 * Math.min(10, bestCombo));
}
function endNight() {
  const cleared = score >= target;
  const sparks = Math.floor(score / 12) + (cleared ? night * 8 : 0);
  save.sparks += sparks;
  save.total += sparks;
  if (score > save.best) { save.best = score; save.bestNight = night; }

  // Festival Album: store a compact recipe of this finale, re-drawn on demand.
  const prev = save.album[night];
  if (!prev || score > prev.s) {
    save.album[night] = { s: score, seed: finaleSeed, p: skyTo,
                          m: Math.min(20, bestCombo), t: finaleTypes.slice(0, 8) };
    if (!save.album[night].t.length) save.album[night].t = [0];
  }

  const newly = [];
  for (const ft of TYPES) {
    if (!hasType(ft.id) && save.total >= ft.at) {
      save.unlocked.push(ft.id);
      newly.push(ft);
      window.TTG?.track('firework_unlocked', { value: ft.id, level: night });
    }
  }
  if (cleared) {
    save.night = night + 1;
    window.TTG?.track('level_complete', { level: night, value: score });
  } else {
    window.TTG?.track('game_over', { level: night });
  }
  persist();

  state = 'results';
  phase = 'idle';
  clearRockets();
  const starN = score >= target * 2.2 ? 3 : (score >= target * 1.5 ? 2 : (cleared ? 1 : 0));
  $('resTitle').textContent = cleared ? ('NIGHT ' + night + ' CLEAR!') : 'THE CROWD WANTS MORE';
  $('resTarget').textContent = fmt(target);
  $('resCombo').textContent = 'x' + Math.min(10, bestCombo);
  $('resScore').textContent = '0';
  $('resSparks').textContent = '+0 ✨';
  $('unlockLine').textContent = '';
  $('contBtn').textContent = cleared ? 'NEXT NIGHT 🎆' : 'RETRY NIGHT 🔁';
  const st = $('stars');
  if (st && st.children) {
    for (let i = 0; i < st.children.length; i++) st.children[i].className = '';
  }
  resultsAnim = { t: 0, score, sparks, starN, newly, shownStars: 0, doneUnlock: false, done: false };
  if (cleared) sfxChime(); else sfxDud();
  showScreen('results');
}

  state = 'title';

// Re-paints a stored finale from its recipe — no image data in localStorage.
function drawSnapshot(g, w, h, rec) {
  if (!g) return;
  const rng = mulberry32((rec.seed | 0) || 1);
  const sky = SKIES[clamp(rec.p | 0, 0, SKIES.length - 1)];
  const hz = h * 0.72;
  const grad = g.createLinearGradient(0, 0, 0, hz);
  grad.addColorStop(0, 'rgb(' + sky[0].join(',') + ')');
  grad.addColorStop(0.6, 'rgb(' + sky[1].join(',') + ')');
  grad.addColorStop(1, 'rgb(' + sky[2].join(',') + ')');
  g.fillStyle = grad; g.fillRect(0, 0, w, hz);
  const wg = g.createLinearGradient(0, hz, 0, h);
  wg.addColorStop(0, 'rgb(' + sky[2].map(v => Math.round(v * 0.75)).join(',') + ')');
  wg.addColorStop(1, 'rgb(' + sky[0].map(v => Math.round(v * 0.8)).join(',') + ')');
  g.fillStyle = wg; g.fillRect(0, hz, w, h - hz);
  const types = rec.t && rec.t.length ? rec.t : [0];
  for (let b = 0; b < types.length; b++) {
    const bx = w * (0.14 + rng() * 0.72), by = hz * (0.16 + rng() * 0.6);
    const rad = Math.min(w, h) * (0.10 + rng() * 0.14);
    const pair = COLOR_PAIRS[(rng() * COLOR_PAIRS.length) | 0];
    const n = 46 + ((rng() * 34) | 0);
    for (let i = 0; i < n; i++) {
      const ty = types[b];
      let a = rng() * TAU, rr = rad * (0.35 + rng() * 0.65);
      if (ty === 2) { a = (i / n) * TAU; rr = rad * (0.94 + rng() * 0.1); }
      if (ty === 1) rr = rad * (0.4 + rng() * 0.7);
      const px = bx + Math.cos(a) * rr;
      const py = by + Math.sin(a) * rr * (ty === 1 ? 1.25 : 1) + (ty === 1 ? rad * 0.35 : 0);
      const c = PAL[(i % 3 === 0) ? 0 : pair[i % 2]];
      g.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (0.35 + rng() * 0.6).toFixed(2) + ')';
      g.fillRect(px - 1, py - 1, 2.2, 2.2);
      if (py < hz) {
        g.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.13)';
        g.fillRect(px - 1, 2 * hz - py - 1, 2.2, 2.2);
      }
    }
    g.fillStyle = 'rgba(255,255,255,0.5)';
    g.beginPath(); g.arc(bx, by, 2.4, 0, TAU); g.fill();
  }
  g.fillStyle = 'rgba(4,4,14,0.92)';
  for (let i = 0; i < w; i += 9) {
    const r = 3 + (i % 5);
    g.beginPath(); g.arc(i + 4, h - 1, r, Math.PI, 0); g.fill();
  }
  g.fillRect(0, h - 5, w, 5);
}

/* ============================= input ============================= */
function handleTap() {
  if (state === 'playing') {
    if (phase === 'finalePrompt') { fireFinale(); return; }
    if (phase !== 'launching' && phase !== 'finale' && phase !== 'settling') return;
    const r = pickTarget();
    if (!r) {
      // Tapping into empty sky costs the combo — spam must not beat timing.
      if (combo > 0) {
        combo = 0;
        updateCombo();
        addFloater(W / 2, H * 0.5, 'too early!', '#b7aee0', false);
      }
      sfxFizzle();
      return;
    }
    if (r.kind === 1) { burstRocket(r, -1); return; }
    const e = Math.abs(tErrOf(r));
    const wnd = windows(r);
    burstRocket(r, e <= wnd.pw ? 2 : (e <= wnd.gw ? 1 : 0));
  }
}
function onPointerDown(e) {
  userGestured = true;
  initAudio();
  resumeAudio();
  const t = e && e.target;
  // Let DOM controls (buttons, the footer badge) handle their own taps.
  if (t && typeof t.closest === 'function') { try { if (t.closest('button, a')) return; } catch (er) {} }
  try { if (e && e.cancelable && e.preventDefault) e.preventDefault(); } catch (er) {}
  handleTap();
}
window.addEventListener('pointerdown', onPointerDown, { capture: true, passive: false });
window.addEventListener('pointercancel', () => {}, { passive: true });

/* ============================= update ============================= */
function updateHUD() {
  $('hudNight').textContent = 'NIGHT ' + night;
  $('hudScore').textContent = fmt(score);
  $('hudTarget').textContent = '🎯 ' + fmt(target);
  $('hudBank').textContent = '🎇 ' + bank + '/' + bankCap;
}

function updateRockets(dt) {
  const wnd = windows(null);
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.t += dt;
    if (!r.burst) {
      r.y -= r.spd * dt;
      r.x += (r.vx + wind * 26) * dt;
      if (r.x < 8) { r.x = 8; r.vx = Math.abs(r.vx); }
      if (r.x > W - 8) { r.x = W - 8; r.vx = -Math.abs(r.vx); }
      if (r.shrink) {
        const approach = clamp(1 - Math.abs(tErrOf(r)) / 1.3, 0, 1);
        r.wMul = lerp(1.4, 0.78, approach);
      }
      emitTrail(r.x, r.y, r.kind === 1 ? 2 : 1, r.kind !== 1);
      const e = tErrOf(r);
      if (r.auto) {
        if (e <= 0) burstRocket(r, 2);
      } else {
        const w2 = windows(r);
        if (e < -(w2.gw + 0.32) || r.y < -40) burstRocket(r, r.kind === 1 ? 0 : -2);
      }
    }
    if (r.dead) rockets.splice(i, 1);
  }
  return wnd;
}

function updateParticles(dt) {
  const wdrift = wind * 26 * uScale;
  for (let i = 0; i < MAX_P; i++) {
    const l = Plife[i];
    if (l <= 0) continue;
    const nl = l - dt;
    if (nl <= 0) { killP(i); continue; }
    Plife[i] = nl;
    const d = Math.max(0, 1 - Pdrag[i] * dt);
    Pvx[i] = Pvx[i] * d + wdrift * dt;
    Pvy[i] = Pvy[i] * d + Pgrav[i] * dt;
    Px[i] += Pvx[i] * dt;
    Py[i] += Pvy[i] * dt;
  }
}

function update(dt) {
  T += dt;
  pumpPending(dt);
  windPhase += dt * 0.3;

  // ---- ambient title show: the bay never stops celebrating ----
  if (state !== 'playing') {
    if (rockets.length < 3 && Math.random() < dt * 0.85) {
      launchRocket({ auto: true, silent: state !== 'title', ringY: rand(H * 0.10, horizonY * 0.5) });
    }
    cheerTarget = Math.max(cheerTarget, 0.18);
  }

  updateRockets(dt);
  updateParticles(dt);

  if (state === 'playing') {
    if (phase === 'launching') {
      if (toLaunch > 0) {
        launchTimer -= dt;
        if (launchTimer <= 0) scheduleLaunch();
      } else if (rockets.length === 0 && pending.length === 0) {
        if (bank > 0) {
          phase = 'finalePrompt';
          finaleTimer = 4.5;
          $('finalePrompt').textContent = 'TAP FOR THE GRAND FINALE! 🎇' + bank;
          $('finalePrompt').classList.add('show');
        } else {
          phase = 'settling';
          settleTimer = 1.0;
        }
      }
    } else if (phase === 'finalePrompt') {
      finaleTimer -= dt;
      if (finaleTimer <= 0) fireFinale();
    } else if (phase === 'finale') {
      finaleTimer -= dt;
      if (finaleTimer <= 0 && finaleFired < bank) {
        finaleShell();
        finaleFired++;
        finaleTimer = lerp(0.30, 0.13, finaleFired / Math.max(1, bank));
      }
      if (finaleFired >= bank) { phase = 'settling'; settleTimer = 1.9; }
    } else if (phase === 'settling') {
      settleTimer -= dt;
      if (settleTimer <= 0) endNight();
    }
    updateHUD();
  }

  // ---- results count-up + staggered star pops ----
  if (state === 'results' && resultsAnim && !resultsAnim.done) {
    const ra = resultsAnim;
    ra.t += dt;
    const p = clamp(ra.t / 1.1, 0, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    $('resScore').textContent = fmt(Math.round(ra.score * eased));
    $('resSparks').textContent = '+' + fmt(Math.round(ra.sparks * eased)) + ' ✨';
    const st = $('stars');
    while (ra.shownStars < ra.starN && ra.t >= 1.15 + ra.shownStars * 0.34) {
      if (st && st.children && st.children[ra.shownStars]) st.children[ra.shownStars].className = 'on';
      ra.shownStars++;
      sfxUI(true);
      vibrate(14);
    }
    if (ra.t >= 1.15 + ra.starN * 0.34 + 0.25 && !ra.doneUnlock) {
      showUnlocks(ra.newly);
      ra.doneUnlock = true;
    }
    if (ra.t > 2.6 + ra.starN * 0.34) { flushResults(); }
  }

  // ---- floaters, cheer, shake, sky ----
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y += f.vy * dt;
    f.vy *= (1 - dt * 1.1);
    f.life -= dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  cheerTarget = Math.max(0, cheerTarget - dt * 0.24);
  cheer += (cheerTarget - cheer) * Math.min(1, dt * 3.2);
  shake = Math.max(0, shake - dt * 42);
  flash = Math.max(0, flash - dt * 2.4);
  if (state === 'playing' && rocketsTotal > 0) {
    skyMix = clamp(1 - (toLaunch + rockets.length) / (rocketsTotal + 1), 0, 1) * 0.6;
  } else {
    skyMix = 0.25 + 0.2 * Math.sin(T * 0.06);
    skyFrom = (save.night - 1) % SKIES.length;
    skyTo = save.night % SKIES.length;
  }
}

/* ============================= render ============================= */
function skyColor(idx) {
  const a = SKIES[skyFrom % SKIES.length][idx];
  const b = SKIES[skyTo % SKIES.length][idx];
  const t = clamp(skyMix, 0, 1);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) +
         ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}
function drawSky() {
  const g = cx.createLinearGradient(0, 0, 0, horizonY);
  g.addColorStop(0, skyColor(0));
  g.addColorStop(0.58, skyColor(1));
  g.addColorStop(1, skyColor(2));
  cx.fillStyle = g;
  cx.fillRect(0, 0, W, horizonY + 1);
  // stars
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(T * s.tw + s.ph));
    cx.fillStyle = 'rgba(255,250,235,' + a.toFixed(3) + ')';
    cx.fillRect(s.x, s.y, s.r, s.r);
  }
  // moon
  const mx = W * 0.82, my = horizonY * 0.19, mr = Math.max(12, Math.min(W, H) * 0.035);
  const mg = cx.createRadialGradient(mx, my, mr * 0.2, mx, my, mr * 3.4);
  mg.addColorStop(0, 'rgba(255,246,214,0.30)');
  mg.addColorStop(1, 'rgba(255,246,214,0)');
  cx.fillStyle = mg;
  cx.fillRect(mx - mr * 3.4, my - mr * 3.4, mr * 6.8, mr * 6.8);
  cx.fillStyle = 'rgba(255,248,222,0.92)';
  cx.beginPath(); cx.arc(mx, my, mr, 0, TAU); cx.fill();
}
function drawSkyline() {
  cx.fillStyle = 'rgba(6,6,20,0.86)';
  for (let i = 0; i < skyline.length; i++) {
    const b = skyline[i];
    cx.fillRect(b.x, horizonY - b.h, b.w, b.h + 2);
  }
  cx.fillStyle = 'rgba(255,205,120,0.5)';
  for (let i = 0; i < skyline.length; i++) {
    const b = skyline[i];
    if (!b.lit) continue;
    const tw = 0.5 + 0.5 * Math.sin(T * 1.1 + i);
    cx.globalAlpha = 0.3 + 0.4 * tw;
    cx.fillRect(b.x + b.w * 0.3, horizonY - b.h * 0.6, 2, 2);
    cx.fillRect(b.x + b.w * 0.6, horizonY - b.h * 0.35, 2, 2);
    cx.globalAlpha = 1;
  }
}
function drawRings() {
  for (let i = 0; i < rockets.length; i++) {
    const r = rockets[i];
    if (r.burst || r.auto) continue;
    const e = tErrOf(r);
    if (e > 1.5 || e < -0.7) continue;
    const fade = clamp((1.5 - e) / 0.7, 0, 1) * clamp((e + 0.7) / 0.35, 0, 1);
    const w2 = windows(r);
    const ry = ringYOf(r);
    const rx = clamp(W * 0.19, 54, 148);
    const outer = r.spd * w2.gw;
    const inner = r.spd * w2.pw;
    cx.save();
    cx.globalAlpha = fade;
    if (r.kind === 1) { // dud — hard NO
      cx.strokeStyle = 'rgba(255,86,86,0.85)';
      cx.lineWidth = 2.5;
      cx.setLineDash([7, 7]);
      cx.beginPath(); cx.ellipse(r.x, ry, rx * 0.7, outer * 0.7, 0, 0, TAU); cx.stroke();
      cx.setLineDash([]);
      cx.lineWidth = 4;
      const k = Math.min(rx * 0.34, outer * 0.5);
      cx.beginPath();
      cx.moveTo(r.x - k, ry - k); cx.lineTo(r.x + k, ry + k);
      cx.moveTo(r.x + k, ry - k); cx.lineTo(r.x - k, ry + k);
      cx.stroke();
      cx.restore();
      continue;
    }
    // outer (good) gate
    cx.strokeStyle = 'rgba(150,200,255,0.42)';
    cx.lineWidth = 2;
    cx.setLineDash([9, 8]);
    cx.beginPath(); cx.ellipse(r.x, ry, rx, outer, 0, 0, TAU); cx.stroke();
    cx.setLineDash([]);
    // inner (perfect) band
    const pulse = 0.55 + 0.45 * Math.sin(T * 7 + r.ringPh);
    cx.strokeStyle = 'rgba(255,222,130,' + (0.55 + 0.4 * pulse).toFixed(3) + ')';
    cx.lineWidth = 2.6 + pulse;
    cx.beginPath(); cx.ellipse(r.x, ry, rx * 0.78, inner, 0, 0, TAU); cx.stroke();
    // centre guide
    cx.strokeStyle = 'rgba(255,255,255,0.5)';
    cx.lineWidth = 1.4;
    cx.beginPath();
    cx.moveTo(r.x - rx * 0.9, ry); cx.lineTo(r.x - rx * 0.5, ry);
    cx.moveTo(r.x + rx * 0.5, ry); cx.lineTo(r.x + rx * 0.9, ry);
    cx.stroke();
    if (r.kind === 2) {
      cx.fillStyle = 'rgba(160,235,255,0.95)';
      cx.font = '900 ' + Math.round(13 * uScale) + 'px system-ui, sans-serif';
      cx.textAlign = 'center';
      cx.fillText('SPLIT ×2', r.x, ry - outer - 8);
    }
    cx.restore();
  }
}
function drawRockets() {
  for (let i = 0; i < rockets.length; i++) {
    const r = rockets[i];
    if (r.burst) continue;
    const dull = r.kind === 1;
    const rr = (dull ? 2.6 : 3.4) * uScale;
    if (atlas) {
      const s = rr * (dull ? 5 : 8);
      cx.globalAlpha = dull ? 0.5 : 0.9;
      cx.drawImage(atlas, (dull ? 2 : 1) * SPR, 0, SPR, SPR, r.x - s, r.y - s, s * 2, s * 2);
      cx.globalAlpha = 1;
    }
    cx.fillStyle = dull ? 'rgba(255,150,120,0.85)' : 'rgba(255,255,240,0.98)';
    cx.beginPath(); cx.arc(r.x, r.y, rr, 0, TAU); cx.fill();
  }
}
function drawParticles() {
  if (!atlas) {
    for (let i = 0; i < MAX_P; i++) {
      if (Plife[i] <= 0) continue;
      const a = clamp(Plife[i] / Pmax[i], 0, 1);
      const c = PAL[Pcol[i]];
      cx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')';
      cx.fillRect(Px[i] - Psize[i] * 0.5, Py[i] - Psize[i] * 0.5, Psize[i], Psize[i]);
    }
    return;
  }
  const prevOp = cx.globalCompositeOperation;
  cx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < MAX_P; i++) {
    const l = Plife[i];
    if (l <= 0) continue;
    const p = clamp(l / Pmax[i], 0, 1);
    const k = Pkind[i];
    let a, s = Psize[i];
    if (k === K_GLIT) {
      // glitter decay: sputters harder the closer it is to burning out
      a = p * (0.30 + 0.70 * (0.5 + 0.5 * Math.sin(T * 46 + Pseed[i]))) * (0.4 + 0.6 * p);
    } else if (k === K_TRAIL) {
      a = p * 0.62;
    } else if (k === K_FLASH) {
      a = p * p;
      s = Psize[i] * (1 + (1 - p) * 1.6);
    } else {
      a = p < 0.25 ? p * 4 * 0.95 : 0.95;
      a *= (0.35 + 0.65 * p);
    }
    if (a <= 0.012) continue;
    cx.globalAlpha = a > 1 ? 1 : a;
    cx.drawImage(atlas, Pcol[i] * SPR, 0, SPR, SPR, Px[i] - s, Py[i] - s, s * 2, s * 2);
  }
  cx.globalAlpha = 1;
  cx.globalCompositeOperation = prevOp;
}
// Mirror the whole sky band into the bay in a handful of wobbling strips —
// one flip transform, ~12 blits, and every bloom reflects for free.
function drawReflection() {
  const waterH = H - horizonY;
  if (waterH <= 2 || horizonY <= 2) return;
  const strips = 12;
  const sh = horizonY / strips;
  cx.save();
  cx.beginPath(); cx.rect(0, horizonY, W, waterH); cx.clip();
  cx.translate(0, horizonY * 2);
  cx.scale(1, -1);
  cx.globalAlpha = 0.34;
  for (let k = 0; k < strips; k++) {
    const sy = k * sh;
    const off = Math.sin(T * 1.5 + k * 0.85) * (1.2 + k * 0.42) + wind * 4;
    try {
      cx.drawImage(cv, 0, Math.round(sy * DPR), cv.width, Math.max(1, Math.round(sh * DPR)),
                   off, sy, W, sh + 0.8);
    } catch (e) { break; }
  }
  cx.restore();
  // water tint + shimmer lines
  const wg = cx.createLinearGradient(0, horizonY, 0, H);
  wg.addColorStop(0, 'rgba(6,8,26,0.30)');
  wg.addColorStop(1, 'rgba(3,4,16,0.80)');
  cx.fillStyle = wg;
  cx.fillRect(0, horizonY, W, waterH);
  cx.strokeStyle = 'rgba(190,215,255,0.10)';
  cx.lineWidth = 1;
  cx.beginPath();
  for (let i = 0; i < ripples.length; i++) {
    const rp = ripples[i];
    const y = rp.y + Math.sin(T * rp.sp + rp.ph) * 1.5;
    const half = W * rp.w * 0.5;
    cx.moveTo(W * 0.5 - half + Math.sin(T * 0.8 + rp.ph) * 10, y);
    cx.lineTo(W * 0.5 + half + Math.sin(T * 0.8 + rp.ph) * 10, y);
  }
  cx.stroke();
}
function drawBarge() {
  const bw = clamp(W * 0.30, 88, 220), bh = Math.max(12, H * 0.022);
  const bx = W * 0.5 - bw / 2;
  const bob = Math.sin(T * 1.3) * 2;
  cx.fillStyle = 'rgba(10,10,26,0.95)';
  cx.fillRect(bx, bargeY + bob, bw, bh);
  cx.fillStyle = 'rgba(30,26,58,0.95)';
  cx.fillRect(bx + 4, bargeY + bob - 4, bw - 8, 5);
  // launch tubes
  cx.fillStyle = 'rgba(52,44,92,0.95)';
  for (let i = 0; i < 5; i++) {
    const tx = bx + bw * (0.13 + i * 0.185);
    cx.fillRect(tx, bargeY + bob - 11, 5, 8);
  }
  // lanterns
  for (let i = 0; i < 4; i++) {
    const lx = bx + bw * (0.12 + i * 0.25);
    const a = 0.55 + 0.45 * Math.sin(T * 2.4 + i * 1.3);
    cx.fillStyle = 'rgba(255,180,90,' + (0.5 + 0.4 * a).toFixed(3) + ')';
    cx.beginPath(); cx.arc(lx, bargeY + bob - 15, 2.6, 0, TAU); cx.fill();
  }
}
function drawCrowd() {
  const baseY = crowdY + 4;
  const amp = 2 + cheer * 7;
  for (let row = 0; row < 2; row++) {
    cx.fillStyle = row === 0 ? 'rgba(5,4,16,0.86)' : 'rgba(2,2,10,0.97)';
    for (let i = 0; i < crowd.length; i++) {
      const p = crowd[i];
      if (p.row !== row) continue;
      const r = p.r * (row === 0 ? 0.85 : 1);
      const bob = Math.sin(T * p.sp + p.ph) * amp * (row === 0 ? 0.7 : 1);
      const y = baseY - r * 3.1 - bob - (row === 0 ? r * 0.9 : 0);
      cx.beginPath(); cx.arc(p.x, y, r, 0, TAU); cx.fill();
      cx.beginPath();
      cx.moveTo(p.x - r * 1.25, baseY);
      cx.quadraticCurveTo(p.x - r * 1.15, y + r * 0.55, p.x, y + r * 0.75);
      cx.quadraticCurveTo(p.x + r * 1.15, y + r * 0.55, p.x + r * 1.25, baseY);
      cx.closePath(); cx.fill();
      if (p.hat) cx.fillRect(p.x - r * 1.1, y - r * 1.15, r * 2.2, r * 0.4);
      if (cheer > 0.42) { // arms up when the bay goes wild
        const lift = (cheer - 0.42) / 0.58;
        cx.save();
        cx.strokeStyle = row === 0 ? 'rgba(5,4,16,0.86)' : 'rgba(2,2,10,0.97)';
        cx.lineWidth = Math.max(1.6, r * 0.34);
        cx.lineCap = 'round';
        cx.beginPath();
        cx.moveTo(p.x - r * 1.05, y + r * 1.5);
        cx.lineTo(p.x - r * 1.6, y - r * (0.5 + lift * 1.5) + Math.sin(T * 9 + p.ph) * 2);
        cx.moveTo(p.x + r * 1.05, y + r * 1.5);
        cx.lineTo(p.x + r * 1.6, y - r * (0.5 + lift * 1.5) + Math.cos(T * 9 + p.ph) * 2);
        cx.stroke();
        cx.restore();
      }
    }
  }
}
function drawFloaters() {
  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i];
    const a = clamp(f.life / f.max, 0, 1);
    const sc = f.big ? (1 + (1 - a) * 0.16) : 1;
    cx.save();
    cx.translate(clamp(f.x, 62, Math.max(63, W - 62)), f.y);
    cx.scale(sc, sc);
    cx.font = '900 ' + Math.round((f.big ? 24 : 16) * uScale) + 'px system-ui, sans-serif';
    cx.textAlign = 'center';
    cx.globalAlpha = a;
    cx.lineWidth = 4;
    cx.strokeStyle = 'rgba(0,0,0,0.75)';
    cx.strokeText(f.txt, 0, 0);
    cx.fillStyle = f.col;
    cx.fillText(f.txt, 0, 0);
    cx.restore();
  }
  cx.globalAlpha = 1;
}
function render() {
  cx.clearRect(0, 0, W, H);
  cx.save();
  if (shake > 0.4) cx.translate(rand(-shake, shake) * 0.42, rand(-shake, shake) * 0.42);
  drawSky();
  drawSkyline();
  drawRings();
  drawParticles();
  drawRockets();
  drawReflection();
  drawBarge();
  drawCrowd();
  drawFloaters();
  cx.restore();
  if (flash > 0.004) {
    cx.fillStyle = 'rgba(255,244,220,' + (flash * 0.42).toFixed(3) + ')';
    cx.fillRect(0, 0, W, H);
  }
}

/* ============================= main loop ============================= */
let lastT = 0, frameErrs = 0;
function frame(t) {
  // Re-arm in `finally` — one bad frame must never permanently blank the show.
  try {
    const now = (typeof t === 'number' && isFinite(t)) ? t : 0;
    if (!lastT) lastT = now;
    const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
    lastT = now;
    update(dt);
    render();
  } catch (e) {
    if (++frameErrs <= 3 && window.console && console.error) console.error('[skybloom] frame error:', e);
  } finally {
    requestAnimationFrame(frame);
  }
}

/* ============================= boot ============================= */
buildAtlas();
resize();
$('muteBtn').textContent = save.muted ? '🔇' : '🔊';
refreshTitle();
showScreen('title');
setInterval(persist, 5000);
requestAnimationFrame(frame);

// Read-only introspection used by the automated boot/perf harness. Safe to
// leave in: it exposes counters only, never mutators.
window.__skybloom = {
  stats: () => ({ live: liveP(), cap: MAX_P, state, phase, night, bank, rockets: rockets.length, score }),
  aim: () => { const r = pickTarget(); return r ? { e: tErrOf(r), dud: r.kind === 1, w: windows(r) } : null; },
};
})();
</script>
</body>
</html>
