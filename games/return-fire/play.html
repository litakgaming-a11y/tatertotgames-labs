<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Return Fire 🛡️</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b0f1e; touch-action:none; overscroll-behavior:none; position:fixed; inset:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#eaf1ff; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .screen.show { display:flex; }
  button { pointer-events:auto; font-family:inherit; border:none; cursor:pointer; color:#fff; }

  /* ---------- Title ---------- */
  #title { justify-content:flex-start; padding-top:7vh; }
  .logo { font-weight:900; font-size:clamp(42px, 14.5vw, 92px); line-height:.86; letter-spacing:2px;
    font-style:italic; transform:skewX(-7deg);
    background:linear-gradient(180deg,#fff6e2 0%, #ffd166 34%, #ff8a1f 62%, #e33c1f 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,150,40,.5)) drop-shadow(0 4px 0 rgba(50,14,0,.75));
    animation:logoBounce 2.3s ease-in-out infinite; }
  .logo small { display:block; font-size:.5em; letter-spacing:11px; margin-left:8px;
    background:linear-gradient(180deg,#e6fbff,#7fe3ff 55%,#2b7fd4);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  @keyframes logoBounce { 0%,100%{transform:skewX(-7deg) translateY(0) scale(1);} 50%{transform:skewX(-7deg) translateY(-10px) scale(1.035);} }
  .tag { margin-top:6px; font-size:clamp(11px,3.3vw,14px); font-weight:800; letter-spacing:2px; color:#ffc46b; opacity:.9; text-shadow:0 2px 6px #000; }
  .statRow { margin-top:12px; font-size:clamp(14px,4vw,19px); font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.7);
    background:rgba(10,15,34,.6); padding:7px 16px; border-radius:999px; border:1px solid rgba(150,180,255,.24); backdrop-filter:blur(3px); }
  .statRow + .statRow { margin-top:7px; }
  .statRow .dim { opacity:.72; font-weight:600; font-size:.85em; }
  #playBtn { margin-top:4vh; font-size:clamp(20px,6vw,30px); font-weight:900; letter-spacing:1px; padding:18px 42px; border-radius:20px;
    background:linear-gradient(180deg,#ffd166,#ff7a18); color:#3a1a00; min-height:56px;
    box-shadow:0 6px 0 #a33a00, 0 0 34px rgba(255,140,40,.5); animation:pulse 1.1s ease-in-out infinite; }
  #playBtn:active { transform:scale(.94); box-shadow:0 2px 0 #a33a00, 0 0 24px rgba(255,140,40,.5); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.055);} }
  #shopBtn { margin-top:14px; font-size:clamp(15px,4.4vw,20px); font-weight:800; padding:13px 30px; border-radius:16px; min-height:46px;
    background:linear-gradient(180deg,#4bb8ff,#1f5bd6); box-shadow:0 5px 0 #123a95, 0 0 20px rgba(70,150,255,.32); }
  #shopBtn:active { transform:scale(.94); box-shadow:0 2px 0 #123a95; }
  #badge { pointer-events:auto; position:absolute; bottom:calc(10px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    font-size:12px; font-weight:700; letter-spacing:.6px; color:#cfe0ff; text-decoration:none; opacity:.85;
    background:rgba(8,12,30,.65); border:1px solid rgba(150,180,255,.3); padding:0 18px; border-radius:999px;
    min-height:44px; display:inline-flex; align-items:center; }
  #badge::before { content:"🥔 "; }

  @media (max-height: 540px) {
    #title { padding-top:2vh; }
    .logo { font-size:clamp(28px, 9vh, 58px); }
    .tag { display:none; }
    #playBtn { margin-top:1.6vh; padding:11px 28px; }
    #shopBtn { margin-top:8px; padding:9px 22px; }
    #badge { display:none; }
  }

  /* ---------- HUD ---------- */
  #hud { pointer-events:none; justify-content:flex-start; }
  #hudTop { position:absolute; top:calc(8px + env(safe-area-inset-top)); left:8px; right:60px; display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .chip { background:rgba(9,14,34,.72); border:1px solid rgba(150,180,255,.26); border-radius:12px; padding:6px 12px;
    font-weight:800; font-size:clamp(12px,3.6vw,16px); text-shadow:0 1px 3px #000; white-space:nowrap; }
  #hudHp b { color:#ff6a52; letter-spacing:2px; }
  #hudCombo { position:absolute; top:calc(52px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:clamp(17px,5.4vw,26px); font-weight:900; color:#ffd166; text-shadow:0 0 14px rgba(255,170,40,.85), 0 2px 4px #000;
    opacity:0; transition:opacity .2s; }
  #hudCombo.on { opacity:1; }
  #hudCombo.pop { animation:comboPop .28s ease-out; }
  #hudCombo.rage { animation:comboRage .16s linear infinite; color:#fff2c9; }
  @keyframes comboPop { 0%{transform:translateX(-50%) scale(1.8);} 100%{transform:translateX(-50%) scale(1);} }
  @keyframes comboRage { 0%{transform:translateX(-50%) translate(-2px,1px) rotate(-1.5deg);} 50%{transform:translateX(-50%) translate(2px,-1px) rotate(1.5deg);} 100%{transform:translateX(-50%) translate(-1px,-1px) rotate(-1deg);} }
  #hudCrit { position:absolute; top:calc(88px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:clamp(15px,4.8vw,22px); font-weight:900; letter-spacing:4px; color:#fff;
    text-shadow:0 0 18px rgba(255,255,255,.95), 0 0 34px rgba(120,220,255,.8); display:none; animation:critPulse .3s ease-in-out infinite alternate; }
  #hudCrit.on { display:block; }
  @keyframes critPulse { from{transform:translateX(-50%) scale(1);} to{transform:translateX(-50%) scale(1.09);} }
  #bossWrap { position:absolute; top:calc(46px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(74vw,420px); display:none; }
  #bossWrap.on { display:block; }
  #bossName { font-size:11px; font-weight:900; letter-spacing:3px; color:#ffb0a0; text-shadow:0 1px 3px #000; margin-bottom:3px; }
  #bossBar { height:9px; border-radius:6px; background:rgba(10,14,30,.8); border:1px solid rgba(255,140,110,.45); overflow:hidden; }
  #bossFill { height:100%; width:100%; background:linear-gradient(90deg,#ff5b3a,#ffb05b); transition:width .18s ease-out; }

  /* ---------- Results ---------- */
  #results { background:rgba(5,8,22,.5); }
  .panel { pointer-events:auto; background:linear-gradient(180deg, rgba(23,29,58,.96), rgba(11,15,36,.97));
    border:1px solid rgba(160,190,255,.32); border-radius:22px; padding:24px 24px 20px; width:min(88vw, 384px);
    box-shadow:0 14px 50px rgba(0,0,0,.65), 0 0 40px rgba(255,120,40,.14); animation:panelIn .34s cubic-bezier(.2,1.6,.4,1); }
  @keyframes panelIn { from{transform:scale(.7) translateY(28px); opacity:0;} to{transform:scale(1) translateY(0); opacity:1;} }
  .panel h2 { font-size:clamp(23px,6.8vw,33px); font-weight:900; font-style:italic; letter-spacing:1px;
    background:linear-gradient(180deg,#fff,#ffc266); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,170,60,.4)); }
  .panel h2.bad { background:linear-gradient(180deg,#fff,#ff7a63); -webkit-background-clip:text; background-clip:text; }
  .panel .bigNum { font-size:clamp(29px,8.6vw,42px); font-weight:900; color:#ffd166; text-shadow:0 0 16px rgba(255,180,50,.55); margin:8px 0 2px; }
  .panel .sub { opacity:.82; font-size:14px; font-weight:600; margin-bottom:4px; }
  #resNotes { min-height:20px; font-weight:800; color:#8affc1; font-size:14px; text-shadow:0 0 10px rgba(60,255,150,.45); margin:6px 0; }
  .cta { margin-top:12px; width:100%; font-size:clamp(17px,5vw,22px); font-weight:900; padding:15px; border-radius:16px; min-height:52px;
    background:linear-gradient(180deg,#ffd166,#ff7a18); color:#3a1a00; box-shadow:0 5px 0 #a33a00; animation:pulse 1.2s ease-in-out infinite; }
  .cta:active { transform:scale(.95); box-shadow:0 2px 0 #a33a00; }
  .cta.blue { background:linear-gradient(180deg,#4bb8ff,#1f5bd6); color:#eaf6ff; box-shadow:0 5px 0 #123a95; animation:none; }
  .cta.blue:active { box-shadow:0 2px 0 #123a95; }

  /* ---------- Shop ---------- */
  #shop { background:rgba(5,8,22,.65); }
  #shop .panel { max-height:84vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #shopScrap { font-size:clamp(18px,5.4vw,24px); font-weight:900; color:#ffd166; margin-bottom:10px; text-shadow:0 0 10px rgba(255,180,50,.4); }
  .upRow { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.06); border:1px solid rgba(160,190,255,.16);
    border-radius:14px; padding:9px 11px; margin-bottom:9px; text-align:left; }
  .upRow .ic { font-size:25px; filter:drop-shadow(0 0 6px rgba(255,170,90,.5)); }
  .upRow .info { flex:1; min-width:0; }
  .upRow .nm { font-weight:800; font-size:15px; }
  .upRow .ds { font-size:11.5px; opacity:.75; font-weight:600; }
  .upRow .lv { font-size:11px; font-weight:800; color:#8fd0ff; letter-spacing:1px; }
  .buyBtn { min-width:80px; min-height:44px; padding:9px 10px; border-radius:12px; font-weight:900; font-size:14px;
    background:linear-gradient(180deg,#57e389,#1f9e50); box-shadow:0 4px 0 #0e5c2c; }
  .buyBtn:active { transform:scale(.93); box-shadow:0 1px 0 #0e5c2c; }
  .buyBtn.no { background:linear-gradient(180deg,#5a6480,#39415b); box-shadow:0 4px 0 #222840; opacity:.7; }
  .buyBtn.max { background:linear-gradient(180deg,#c79bff,#7a3fd9); box-shadow:0 4px 0 #43208c; }
  .sectTitle { font-size:12px; font-weight:900; letter-spacing:3px; opacity:.7; margin:14px 0 8px; }
  .skinRow { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:6px; }
  .skinBtn { min-height:44px; padding:9px 12px; border-radius:12px; font-weight:800; font-size:13px;
    background:rgba(255,255,255,.07); border:1px solid rgba(160,190,255,.2); }
  .skinBtn.sel { background:linear-gradient(180deg,#4bb8ff,#1f5bd6); box-shadow:0 3px 0 #123a95; }
  .skinBtn.lock { opacity:.45; }

  /* ---------- Mute ---------- */
  #muteBtn { position:absolute; top:calc(8px + env(safe-area-inset-top)); right:8px; z-index:6; width:44px; height:44px; border-radius:12px;
    font-size:20px; background:rgba(9,14,34,.72); border:1px solid rgba(150,180,255,.28); }
  #muteBtn:active { transform:scale(.9); }
</style>
<script src="/analytics.js" defer></script>

<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="title" class="screen">
    <div class="logo">RETURN<small>FIRE</small></div>
    <div class="tag">THEY BROUGHT THE AMMO</div>
    <div class="statRow">⚙️ <span id="scrapCount">0</span> <span class="dim">scrap</span></div>
    <div class="statRow">🏰 <span id="bastionLbl">Rubble</span> <span class="dim" id="bastionNext"></span></div>
    <div class="statRow">🛡️ Best wave <span id="bestWave">0</span> <span class="dim" id="bestCombo"></span></div>
    <button id="playBtn">🛡️ TAP TO PLAY</button>
    <button id="shopBtn">🔧 THE BASTION</button>
    <a id="badge" href="../../">TaterTot Games Labs</a>
  </div>

  <div id="hud" class="screen">
    <div id="hudTop">
      <div class="chip" id="hudWave">WAVE 1</div>
      <div class="chip" id="hudHp">CORE <b>●●●</b></div>
      <div class="chip" id="hudScrap">⚙️ 0</div>
    </div>
    <div id="bossWrap"><div id="bossName">SIEGE MECH</div><div id="bossBar"><div id="bossFill"></div></div></div>
    <div id="hudCombo">COMBO x2</div>
    <div id="hudCrit">CRITICAL</div>
  </div>

  <div id="results" class="screen">
    <div class="panel">
      <h2 id="resTitle">WAVE CLEAR!</h2>
      <div class="bigNum" id="resScrap">+0 ⚙️</div>
      <div class="sub" id="resSub">Best chain x1</div>
      <div id="resNotes"></div>
      <button class="cta" id="contBtn">NEXT WAVE ▶</button>
      <button class="cta blue" id="homeBtn">🏰 THE BASTION</button>
    </div>
  </div>

  <div id="shop" class="screen">
    <div class="panel">
      <h2>THE BASTION</h2>
      <div id="shopScrap">⚙️ 0</div>
      <div id="upList"></div>
      <div class="sectTitle">SHIELD PLATING</div>
      <div class="skinRow" id="skinList"></div>
      <button class="cta blue" id="backBtn">⬅ BACK</button>
    </div>
  </div>

  <button id="muteBtn">🔊</button>
</div>

<script>
(() => {
'use strict';
/* =========================================================================
   RETURN FIRE — reflection dynamics + momentum transfer
   All state that the loop touches is initialised at declaration: the rAF
   loop runs from boot on the title screen, long before a wave exists.
   ========================================================================= */

/* ============================= helpers ============================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => (a + Math.random() * (b - a + 1)) | 0;
const $ = id => document.getElementById(id);
function wrapPi(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }
function angLerp(a, b, t) { return a + wrapPi(b - a) * t; }
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

/* ============================= save ============================= */
const SAVE_KEY = 'ttg_returnfire';
const UP_DEF = { arc: 0, kin: 0, plate: 0, heat: 0 };

function defaultSave() {
  return { scrap: 0, totalScrap: 0, wave: 1, bestWave: 0, bestCombo: 0,
           muted: false, skin: 'riot', up: { arc: 0, kin: 0, plate: 0, heat: 0 } };
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const s = JSON.parse(raw);
    const out = Object.assign(defaultSave(), (s && typeof s === 'object') ? s : {});
    const up = Object.assign({}, UP_DEF, (s && s.up && typeof s.up === 'object') ? s.up : {});
    for (const k in UP_DEF) up[k] = clamp((+up[k] || 0) | 0, 0, 5);
    out.up = up;
    out.scrap = Math.max(0, +out.scrap || 0);
    out.totalScrap = Math.max(0, +out.totalScrap || 0);
    out.wave = clamp((+out.wave || 1) | 0, 1, 9999);
    out.bestWave = Math.max(0, (+out.bestWave || 0) | 0);
    out.bestCombo = Math.max(0, (+out.bestCombo || 0) | 0);
    out.muted = !!out.muted;
    if (typeof out.skin !== 'string') out.skin = 'riot';
    return out;
  } catch (e) { return defaultSave(); }
}
let save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ============================= meta data ============================= */
const UPG = [
  { id: 'arc',   ic: '🛡️', nm: 'Shield Arc',      ds: 'Wider shield — easier blocks, blinder flank', base: 60, max: 5 },
  { id: 'kin',   ic: '💥', nm: 'Kinetic Gain',    ds: 'More swipe speed transfers into the return',  base: 80, max: 5 },
  { id: 'plate', ic: '🔩', nm: 'Core Plating',    ds: '+1 core hit every 2 levels',                  base: 95, max: 5 },
  { id: 'heat',  ic: '🔥', nm: 'Overheat Charge', ds: 'CRITICAL triggers after fewer deflections',   base: 85, max: 5 },
];
const upCost = (u, lvl) => Math.floor(u.base * Math.pow(1.75, lvl));

const SKINS = [
  { id: 'riot',   nm: 'Riot',       need: 0,  c1: '#7fe3ff', c2: '#1f6fc4', sp: '#c8f2ff', wave: 'square',   tf: 1.00 },
  { id: 'aegis',  nm: 'Aegis',      need: 5,  c1: '#ffe08a', c2: '#c8871a', sp: '#ffe9b0', wave: 'triangle', tf: 1.20 },
  { id: 'scrap',  nm: 'Scrapplate', need: 10, c1: '#d5dcec', c2: '#5e6778', sp: '#eef3ff', wave: 'sawtooth', tf: 0.82 },
  { id: 'solar',  nm: 'Solar',      need: 15, c1: '#ffb46b', c2: '#e0401f', sp: '#ffd9a8', wave: 'square',   tf: 1.38 },
  { id: 'mirror', nm: 'Mirror',     need: 20, c1: '#f2fdff', c2: '#88b0ff', sp: '#ffffff', wave: 'sine',     tf: 1.58 },
];
function skinDef() {
  for (let i = 0; i < SKINS.length; i++) {
    // a hand-edited save must never equip plating that has not been earned
    if (SKINS[i].id === save.skin && save.bestWave >= SKINS[i].need) return SKINS[i];
  }
  return SKINS[0];
}
const BASTION_STAGES = [
  { at: 0,     nm: 'Rubble' },      { at: 150,   nm: 'Foundation' },
  { at: 400,   nm: 'Palisade' },    { at: 800,   nm: 'Stone Wall' },
  { at: 1400,  nm: 'Gatehouse' },   { at: 2200,  nm: 'Watchtower' },
  { at: 3200,  nm: 'Twin Towers' }, { at: 4500,  nm: 'Rampart' },
  { at: 6200,  nm: 'Keep' },        { at: 8400,  nm: 'Banners' },
  { at: 11000, nm: 'Beacon' },      { at: 14500, nm: 'Citadel' },
  { at: 19000, nm: 'THE BASTION' },
];
function bastionStage() {
  let s = 0;
  for (let i = 0; i < BASTION_STAGES.length; i++) if (save.totalScrap >= BASTION_STAGES[i].at) s = i;
  return s;
}

/* ============================= canvas / layout ============================= */
const cv = $('cv');
const cx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1, resizing = false, sizeOk = false, sizeTick = 0;
const core = { x: 180, y: 352, hp: 3, max: 3, hurt: 0, pulse: 0 };
let CORE_R = 26, SR = 90, ERX = 144, ERY = 192;
let ARX0 = 6, ARY0 = 6, ARX1 = 354, ARY1 = 634;

function layout() {
  core.x = W * 0.5;
  core.y = H * 0.55;
  CORE_R = clamp(Math.min(W, H) * 0.056, 18, 44);
  SR = clamp(Math.min(W, H) * 0.21, 58, 158);
  ERX = Math.max(SR * 1.9, W * 0.40);
  ERY = Math.max(SR * 1.9, H * 0.30);
  const topPad = Math.min(H * 0.13, 96);
  ARX0 = 4; ARY0 = 4; ARX1 = W - 4; ARY1 = H - 4;
  // keep the enemy ring on-screen
  ERX = Math.min(ERX, Math.min(core.x, W - core.x) - 26);
  ERY = Math.min(ERY, Math.min(core.y - topPad, H - core.y - 20));
  ERX = Math.max(ERX, SR * 1.55);
  ERY = Math.max(ERY, SR * 1.5);
}
function resize() {
  if (resizing) return;
  resizing = true;
  try {
    const w = window.innerWidth, h = window.innerHeight;
    // 0-size guard (backgrounded webviews / hidden panes). sizeOk stays false so
    // the loop keeps retrying until the viewport is real — otherwise the canvas
    // would render forever at its 300x150 attribute default.
    if (!(w > 10) || !(h > 10)) { sizeOk = false; return; }
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = w; H = h;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    // A canvas is a replaced element: without an explicit CSS size it lays out
    // at its attribute size (W*DPR) — double the viewport on phones. Pin it.
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
    relayoutEnemies();
    sizeOk = true;
  } finally { resizing = false; }
}
/* Cheap self-heal: if the viewport ever disagrees with the backing store
   (first paint before layout, webview restore, orientation race), re-apply. */
function checkSize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!sizeOk || W !== w || H !== h || cv.width !== Math.round(W * DPR)) resize();
}

/* ============================= audio ============================= */
let AC = null, master = null, lowpass = null, noiseBuf = null;
let droneOsc = null, droneGain = null, droneFilt = null;
let audioPitch = 1;           // global pitch multiplier (bullet-time drop)
let userGestured = false;

function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = save.muted ? 0 : 0.52;
    lowpass = AC.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 20000;
    lowpass.Q.value = 0.8;
    master.connect(lowpass);
    lowpass.connect(AC.destination);
    const len = Math.floor(AC.sampleRate * 0.6);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

      else if (roll < 0.56) { kind = 'orb'; shoot = T_ORB; }

    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.spin * dt;
    p.life -= dt;

    if (p.type === T_MORTAR && !p.friendly) {           // telegraphed arc + shadow
      const gd = Math.hypot(p.x - core.x, p.y - core.y);
      const land = SR * MORTAR_LAND;                    // touches down outside the ring
      const denom = Math.max(1, p.gd0 - land);
      p.h = p.h0 * Math.sqrt(clamp((gd - land) / denom, 0, 1));
    }

    // trail (fixed ring buffer, no allocation)
    p.tx[p.tn % TRAIL] = p.x;
    p.ty[p.tn % TRAIL] = p.y - (p.type === T_MORTAR ? p.h : 0);
    p.tn++;

    if (!p.friendly) {
      const hit = shieldSweep(p);
      if (hit) { deflect(p, hit); continue; }
      if (!(p.type === T_MORTAR && p.h > MORTAR_DEFLECT_H) &&
          segCircle(p.px, p.py, p.x, p.y, core.x, core.y, CORE_R + p.r)) {
        coreHit(p);
        continue;
      }
    } else {
      let consumed = false;
      for (let k = 0; k < enemies.length; k++) {
        const e = enemies[k];
        if (e.dead) continue;
        if (segCircle(p.px, p.py, p.x, p.y, e.x, e.y, e.r + p.r)) {
          hitEnemy(p, e);
          if (!p.act) { consumed = true; }
          break;
        }
      }
      if (consumed) continue;
    }

    // walls: saw blades ricochet and keep going; everything else expires
    const r = p.r;
    if (p.type === T_SAW && p.friendly && p.bounce < 9) {
      let bounced = false;
      if (p.x < ARX0 + r) { p.x = ARX0 + r; p.vx = Math.abs(p.vx); bounced = true; }
      else if (p.x > ARX1 - r) { p.x = ARX1 - r; p.vx = -Math.abs(p.vx); bounced = true; }
      if (p.y < ARY0 + r) { p.y = ARY0 + r; p.vy = Math.abs(p.vy); bounced = true; }
      else if (p.y > ARY1 - r) { p.y = ARY1 - r; p.vy = -Math.abs(p.vy); bounced = true; }
      if (bounced) {
        p.bounce++;
        p.px = p.x; p.py = p.y;
        sparkBurst(p.x, p.y, 5, '#ffd8a0', 240);
        tone(620, 0.07, 'square', 0.09, undefined, 380);
        addShake(3, 0, 0);
      }
    } else if (p.x < -70 || p.x > W + 70 || p.y < -140 || p.y > H + 70) {
      if (p.friendly && p.type === T_ROCKET) explodeRocket(p.x, p.y, p.dmg, 50, null);
      killProj(p);
      continue;
    }
    if (p.life <= 0) {
      if (p.friendly && p.type === T_ROCKET) explodeRocket(p.x, p.y, p.dmg, 60, null);
      else sparkBurst(p.x, p.y, 5, '#8fa0c0', 160);
      killProj(p);
    }
  }
}

/* ============================= enemies / waves ============================= */
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.flashT = Math.max(0, e.flashT - dt);
    e.bob += dt * 2.2;
    e.spin += dt * (e.kind === 'saw' ? 3.2 : 0.8);
    e.leg += dt * 3.4;
    if (e.dead) {
      e.deadT -= dt;
      if (e.deadT <= 0) enemies.splice(i, 1);
      continue;
    }
    if (e.drift) {
      e.ang = wrapPi(e.ang + e.drift * dt * 0.34);
      placeEnemy(e);
    } else {
      placeEnemy(e);
      e.y += Math.sin(e.bob) * 3;
    }
    if (e.burst > 0) {
      e.burstT -= dt;
      if (e.burstT <= 0) {
        e.burstOff = (e.burstOff || 0) + (e.burstStep || 0);
        enemyFire(e, e.burstOff, e.burstType);
        e.burst--;
        e.burstT = e.burstGap || 0.17;
      }
    }
  }
  if (bossRef && !bossRef.dead) updateBoss(bossRef, dt);
  else if (bossRef && bossRef.dead) bossRef = null;
}
function updateBoss(b, dt) {
  const frac = clamp(b.hp / b.maxhp, 0, 1);
  const ph = frac > 0.66 ? 0 : (frac > 0.33 ? 1 : 2);
  if (ph !== b.phase) {
    b.phase = ph;
    paletteTarget = 1 + ph;
    freezeT = Math.max(freezeT, 0.08);
    flash = Math.max(flash, 0.6); flashR = 255; flashG = 160; flashB = 120;
    addShake(20, 0, 1);
    addRing(b.x, b.y, Math.max(W, H), 0.6, '#ff8a5c', 6, true);
    addFloat(core.x, core.y - SR - 60, 'PHASE ' + (ph + 1), '#ff9d7c', true);
    sfxExplode(true);
    b.burst = 0;
    fireTimer = Math.max(fireTimer, 0.8);
  }
}
/* Boss volleys sweep across the shield instead of arriving all at once — the
   bullet-hell reads as a wall of fire but stays physically deflectable. */
function fireBossPattern(b) {
  b.volley = (b.volley || 0) + 1;
  const ph = b.phase;
  const mortarEvery = (ph === 0 ? 3 : 2);
  if (!b.armorOpen && b.volley % mortarEvery === 0) {
    enemyFire(b, 0, T_MORTAR);
    b.burst = 0;
    addFloat(b.x, b.y + b.r + 16, '☄ MORTAR INCOMING', '#ffb45b', false);
    tone(110, 0.3, 'triangle', 0.14, undefined, 300);
    return 0;
  }
  const n = ph === 0 ? 3 : (ph === 1 ? 4 : 5);
  const step = (ph === 0 ? 0.20 : (ph === 1 ? 0.21 : 0.22)) * (Math.random() < 0.5 ? 1 : -1);
  const gap = ph === 2 ? 0.17 : 0.19;
  b.burstType = (ph === 2 ? T_SAW : (ph === 1 ? T_ROCKET : -1));
  b.burstOff = -step * (n - 1) / 2;
  b.burstStep = step;
  b.burstGap = gap;
  b.burst = n - 1;
  b.burstT = gap;
  enemyFire(b, b.burstOff, ph >= 1 ? T_BULLET : -1);
  for (let i = 0, k = 3 + ph * 2; i < k; i++) spawnStray(b);
  b.flashT = 0.12;
  noiseHit(0.2, 0.12, 'lowpass', 1200, undefined, 1, 400);
  return (n - 1) * gap;
}
/* One global fire scheduler: exactly one machine opens up at a time, and it is
   only allowed to be one the shield can physically reach in the gap. */
function runFireScheduler(dt) {
  strayTimer -= dt;
  if (strayTimer <= 0) {
    strayTimer = clamp(0.62 - waveNum * 0.014, 0.17, 0.62) * rand(0.7, 1.3);
    let pool = [];
    for (let i = 0; i < enemies.length; i++) if (!enemies[i].dead) pool.push(enemies[i]);
    if (pool.length) {
      const shots = 1 + (Math.random() < clamp(waveNum / 26, 0, 0.6) ? 1 : 0);
      for (let i = 0; i < shots; i++) spawnStray(pool[(Math.random() * pool.length) | 0]);
    }
  }
  for (let i = 0; i < enemies.length; i++) if (enemies[i].burst > 0) return;
  fireTimer -= dt;
  if (fireTimer > 0) return;
  const gap = nextFireGap(waveNum);
  if (bossRef && !bossRef.dead && Math.random() < 0.6 && arrivalOk(bossRef, T_BULLET, 0)) {
    const dur = fireBossPattern(bossRef);
    fireTimer = gap * 1.15 + dur;
    return;
  }
  let list = [], minWait = 1e9;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead || e.boss) continue;
    const w = arrivalWait(e, e.shoot, 0);
    if (w <= 0) list.push(e);
    else if (w < minWait) minWait = w;
  }
  if (!list.length) {
    // nothing the shield could physically reach in time: hold fire until it can
    fireTimer = clamp(minWait, 0.05, 0.6);
    return;
  }
  const cand = list[(Math.random() * list.length) | 0];
  if (cand) {
    cand.burstOff = 0; cand.burstStep = 0; cand.burstType = -1; cand.burstGap = 0.19;
    enemyFire(cand, 0, -1);
    const burstChance = waveNum >= 10 ? 0.45 : (waveNum >= 4 ? 0.28 : 0.06);
    if (Math.random() < burstChance) {
      cand.burst = randi(1, waveNum >= 12 ? 2 : 1);
      cand.burstT = 0.19;
    }
  }
  fireTimer = gap;
}

/* ============================= reference auto-parry bot ============================= */
/* Used by the verification harness (and a handy sanity check in play). */
function botStep() {
  let best = null, bestT = 1e9;
  for (let i = 0; i < PMAX; i++) {
    const p = projs[i];
    if (!p.act || p.friendly || p.held) continue;
    if (p.type === T_MORTAR && p.h > MORTAR_DEFLECT_H) {
      // predict where the telegraphed shadow touches down on the ring
      const gd = Math.hypot(p.x - core.x, p.y - core.y);
      const sp = Math.hypot(p.vx, p.vy) || 1;
      const t = Math.max(0, (gd - SR * MORTAR_LAND) / sp);
      if (t < bestT) { bestT = t; best = Math.atan2(p.y - core.y, p.x - core.x); }
      continue;
    }
    const x0 = p.x - core.x, y0 = p.y - core.y;
    // already inside the ring: it is past the shield, do not chase its far exit
    if (x0 * x0 + y0 * y0 <= SR * SR) continue;
    const a = p.vx * p.vx + p.vy * p.vy;
    if (a < 1e-6) continue;
    // ignore stray fire: only shots actually on course for the core matter
    if (p.seek === 0) {
      const tc = -(x0 * p.vx + y0 * p.vy) / a;
      if (tc < 0) continue;
      const mx = x0 + p.vx * tc, my = y0 + p.vy * tc;
      if (mx * mx + my * my > (CORE_R + p.r + 3) * (CORE_R + p.r + 3)) continue;
    }
    const b = 2 * (x0 * p.vx + y0 * p.vy);
    const c = x0 * x0 + y0 * y0 - SR * SR;
    const disc = b * b - 4 * a * c;
    if (disc < 0) continue;
    const sq = Math.sqrt(disc);
    let t = (-b - sq) / (2 * a);
    if (t < 0) t = (-b + sq) / (2 * a);
    if (t < 0) continue;
    if (t < bestT) {
      bestT = t;
      best = Math.atan2(y0 + p.vy * t, x0 + p.vx * t);
    }
  }
  if (best !== null) shield.target = best;
  if (shield.held && shield.held.charge >= 0.55) releaseOrb();
}
/* ============================= update ============================= */
let needTimeReset = false;

function updateFX(dt, dtReal) {
  for (let i = 0; i < QMAX; i++) {
    const q = parts[i];
    if (!q.act) continue;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vy += q.grav * dt;
    q.vx *= (1 - Math.min(0.9, dt * (q.kind === 2 ? 1.6 : 0.7)));
    if (q.kind === 1) q.rot += q.vr * dt;
    if (q.kind === 2) q.r += 16 * dt;
    q.life -= dt;
    if (q.life <= 0) q.act = false;
  }
  for (let i = 0; i < RMAX; i++) {
    const r = rings[i];
    if (!r.act) continue;
    r.life -= dt;
    r.r = r.r1 * easeOut(1 - clamp(r.life / r.max, 0, 1));
    if (r.life <= 0) r.act = false;
  }
  for (let i = 0; i < FMAX; i++) {
    const f = floats[i];
    if (!f.act) continue;
    f.y -= 42 * dt;
    f.life -= dt;
    if (f.life <= 0) f.act = false;
  }
  for (let i = 0; i < RIPMAX; i++) {
    const r = ripples[i];
    if (!r.act) continue;
    r.life -= dt;
    if (r.life <= 0) r.act = false;
  }
  for (let i = 0; i < SEXMAX; i++) {
    const s = secExp[i];
    if (!s.act) continue;
    s.t -= dt;
    if (s.t <= 0) {
      s.act = false;
      sparkBurst(s.x, s.y, s.big ? 16 : 8, '#ffb45b', s.big ? 480 : 300);
      addRing(s.x, s.y, s.big ? 130 : 54, 0.3, '#ffd166', 3, false);
      smokePuff(s.x, s.y, s.big ? 6 : 3);
      sfxExplode(false);
      if (s.big) addShake(12, 0, 0);
    }
  }
  for (let i = 0; i < shTrailL.length; i++) shTrailL[i] = Math.max(0, shTrailL[i] - dtReal * 4.5);
}

function update(dtReal) {
  T += dtReal;
  if (freezeT > 0) freezeT = Math.max(0, freezeT - dtReal);
  if (slowT > 0) slowT = Math.max(0, slowT - dtReal);
  const wantDrop = (slowT > 0 && slowFactor <= 0.35);
  if (wantDrop !== pitchDropped) { setPitchDrop(wantDrop); pitchDropped = wantDrop; }
  const dt = (freezeT > 0) ? 0 : dtReal * (slowT > 0 ? slowFactor : 1);

  const dk = Math.exp(-7 * dtReal);
  shakeMag *= dk; shakeX *= Math.exp(-9 * dtReal); shakeY *= Math.exp(-9 * dtReal);
  if (shakeMag < 0.15) shakeMag = 0;
  flash = Math.max(0, flash - dtReal * 2.6);
  bloom = Math.max(0, bloom - dtReal * 0.85);
  core.hurt = Math.max(0, core.hurt - dtReal * 1.6);
  core.pulse += dtReal;
  camZoom = lerp(camZoom, camZTarget, Math.min(1, dtReal * 3.4));
  paletteShift = lerp(paletteShift, paletteTarget, Math.min(1, dtReal * 1.1));
  const vT = clamp(combo / 12, 0, 1) * 0.5 + (critical ? 0.3 : 0) + (state === 'play' ? 0.06 : 0);
  vignette = lerp(vignette, vT, Math.min(1, dtReal * 3));

  if (critical) {
    critT -= dtReal;
    critPulseT += dtReal;
    bloom = Math.max(bloom, 0.55 + Math.sin(critPulseT * 9) * 0.15);
    if (Math.random() < dtReal * 7) vibrate(6);            // haptic pulse train
    if (critT <= 0) exitCritical();
  }
  if (comboT > 0) {
    comboT -= dtReal;
    if (comboT <= 0 && combo > 0) {
      combo = 0;
      const hc = $('hudCombo');
      if (hc) hc.classList.remove('on', 'rage');
    }
  }

  updateFX(dt, dtReal);

  if (state === 'play' || state === 'results') {
    simT += dt;
    updateShield(dt);
    if (waveState === 'fight') {
      runFireScheduler(dt);
      updateEnemies(dt);
      updateProjs(dt);
      if (aliveCount() === 0) clearWave();
      setDroneIntensity(clamp(waveNum / 22, 0, 1) * 0.6 + clamp(combo / 12, 0, 1) * 0.4);
    } else if (waveState === 'clear' || waveState === 'fail') {
      updateEnemies(dt);
      updateProjs(dt);
      if (state === 'play') {
        clearTimer -= dtReal;
        if (clearTimer <= 0) { camZTarget = 1; openResults(waveState === 'clear'); }
      }
    }
    if (state === 'play') updateHUD();
  } else {
    // title / shop: the shield idles around the Bastion scene
    shield.target = wrapPi(-Math.PI / 2 + Math.sin(T * 0.45) * 1.3);
    updateShield(dt);
  }
}

/* ============================= drawing helpers ============================= */
function rr(x, y, w, h, r) {
  const rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  cx.beginPath();
  cx.moveTo(x + rad, y);
  cx.arcTo(x + w, y, x + w, y + h, rad);
  cx.arcTo(x + w, y + h, x, y + h, rad);
  cx.arcTo(x, y + h, x, y, rad);
  cx.arcTo(x, y, x + w, y, rad);
  cx.closePath();
}
function poly(x, y, r, n, rot) {
  cx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * TAU / n;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) cx.moveTo(px, py); else cx.lineTo(px, py);
  }
  cx.closePath();
}
function mix(c1, c2, t) {
  const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const a = p(c1), b = p(c2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}
const PAL = [
  { sky0: '#131b34', sky1: '#0a0e1e', gnd: '#1b2340', acc: '#2b3a63' },
  { sky0: '#2a1430', sky1: '#12061a', gnd: '#341a3a', acc: '#5c2a5e' },
  { sky0: '#331229', sky1: '#170617', gnd: '#3d1730', acc: '#6d2140' },
  { sky0: '#3a1113', sky1: '#1a0507', gnd: '#451216', acc: '#7d1f22' },
];
function pal(key) {
  const i = clamp(Math.floor(paletteShift), 0, PAL.length - 1);
  const j = clamp(i + 1, 0, PAL.length - 1);
  return mix(PAL[i][key], PAL[j][key], clamp(paletteShift - i, 0, 1));
}

/* ============================= battle rendering ============================= */
function drawArena() {
  const g = cx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, pal('sky0'));
  g.addColorStop(1, pal('sky1'));
  cx.fillStyle = g;
  cx.fillRect(-80, -80, W + 160, H + 160);

  // scrap-heap horizon behind the arena
  cx.fillStyle = pal('gnd');
  cx.globalAlpha = 0.75;
  cx.beginPath();
  cx.moveTo(-40, H);
  for (let x = -40; x <= W + 40; x += 42) {
    const hh = H * 0.86 - Math.abs(Math.sin(x * 0.021 + 1.3)) * H * 0.055 - ((x * 37) % 17);
    cx.lineTo(x, hh);
  }
  cx.lineTo(W + 40, H);
  cx.closePath();
  cx.fill();
  cx.globalAlpha = 1;

  // arena rings
  cx.strokeStyle = pal('acc');
  cx.lineWidth = 1.5;
  cx.globalAlpha = 0.55;
  for (let k = 1; k <= 3; k++) {
    cx.beginPath();
    cx.ellipse(core.x, core.y, ERX * k / 3, ERY * k / 3, 0, 0, TAU);
    cx.stroke();
  }
  cx.globalAlpha = 0.3;
  cx.setLineDash([6, 10]);
  cx.beginPath();
  cx.arc(core.x, core.y, SR, 0, TAU);
  cx.stroke();
  cx.setLineDash([]);
  cx.globalAlpha = 1;
}
function drawCore() {

  const hurtC = core.hurt;
  cx.save();
  cx.translate(core.x, core.y);
  // plating
  cx.fillStyle = hurtC > 0 ? mix('#39435f', '#ff6a52', hurtC) : '#39435f';
  poly(0, 0, CORE_R * pulse, 6, core.pulse * 0.25);
  cx.fill();
  cx.strokeStyle = '#8fa6d6';
  cx.lineWidth = 2.5;
  cx.stroke();
  // plating bolts
  cx.fillStyle = '#6f80a8';
  for (let i = 0; i < 6; i++) {
    const a = core.pulse * 0.25 + i * TAU / 6 + TAU / 12;
    cx.beginPath();
    cx.arc(Math.cos(a) * CORE_R * 0.72, Math.sin(a) * CORE_R * 0.72, 2.2, 0, TAU);
    cx.fill();
  }
  // glowing centre
  const gg = cx.createRadialGradient(0, 0, 1, 0, 0, CORE_R * 0.85);
  const hot = critical ? '#ffffff' : (core.hp <= 1 ? '#ff6a52' : '#7fe3ff');
  gg.addColorStop(0, '#ffffff');
  gg.addColorStop(0.4, hot);
  gg.addColorStop(1, 'rgba(20,30,60,0)');

  cx.beginPath();
  cx.arc(0, 0, CORE_R * 0.85 * pulse, 0, TAU);

  cx.restore();
  // hp pips around the core
  for (let i = 0; i < core.max; i++) {
    const a = -Math.PI / 2 + (i - (core.max - 1) / 2) * 0.34;
    const x = core.x + Math.cos(a) * (CORE_R + 12);
    const y = core.y + Math.sin(a) * (CORE_R + 12);
    cx.fillStyle = i < core.hp ? '#ff8a5c' : 'rgba(120,135,170,.35)';
    cx.beginPath();
    cx.arc(x, y, 3, 0, TAU);
    cx.fill();
  }
}
function drawShield() {
  const sk = skinDef();
  const ah = arcHalf();
  const a0 = shield.a - ah, a1 = shield.a + ah;
  cx.save();
  // critical white trail
  if (critical) {
    for (let i = 0; i < shTrailA.length; i++) {
      const l = shTrailL[i];
      if (l <= 0) continue;
      cx.globalAlpha = l * 0.22;
      cx.strokeStyle = '#ffffff';
      cx.lineWidth = SHIELD_T * 1.4;
      cx.lineCap = 'round';
      cx.beginPath();
      cx.arc(core.x, core.y, SR, shTrailA[i] - ah, shTrailA[i] + ah);
      cx.stroke();
    }
    cx.globalAlpha = 1;
  }
  // body
  const grad = cx.createLinearGradient(
    core.x + Math.cos(a0) * SR, core.y + Math.sin(a0) * SR,
    core.x + Math.cos(a1) * SR, core.y + Math.sin(a1) * SR);
  grad.addColorStop(0, sk.c2);
  grad.addColorStop(0.5, critical ? '#ffffff' : sk.c1);
  grad.addColorStop(1, sk.c2);
  cx.strokeStyle = grad;
  cx.lineWidth = SHIELD_T;
  cx.lineCap = 'round';
  cx.beginPath();
  cx.arc(core.x, core.y, SR, a0, a1);
  cx.stroke();
  // hex segmentation
  cx.lineWidth = 1.4;
  cx.strokeStyle = 'rgba(255,255,255,.5)';
  const segs = Math.max(3, Math.round(ah * 11));
  for (let i = 0; i <= segs; i++) {
    const a = lerp(a0, a1, i / segs);
    const ix = core.x + Math.cos(a) * (SR - SHIELD_T / 2);
    const iy = core.y + Math.sin(a) * (SR - SHIELD_T / 2);
    const ox = core.x + Math.cos(a) * (SR + SHIELD_T / 2);
    const oy = core.y + Math.sin(a) * (SR + SHIELD_T / 2);
    cx.beginPath(); cx.moveTo(ix, iy); cx.lineTo(ox, oy); cx.stroke();
  }
  // impact flash
  if (shield.flash > 0.01) {
    cx.globalAlpha = shield.flash;
    cx.strokeStyle = '#ffffff';
    cx.lineWidth = SHIELD_T + 6;
    cx.beginPath();
    cx.arc(core.x, core.y, SR, a0, a1);
    cx.stroke();
    cx.globalAlpha = 1;
  }
  // hexagonal ripples propagating around the shield surface
  for (let i = 0; i < RIPMAX; i++) {
    const rp = ripples[i];
    if (!rp.act) continue;
    const t = 1 - clamp(rp.life / rp.max, 0, 1);
    const alpha = (1 - t) * 0.9;
    const spread = t * ah * 2.4;
    cx.globalAlpha = alpha;
    cx.strokeStyle = sk.sp;
    cx.lineWidth = 3 * (1 - t) + 0.5;
    for (const s of [-1, 1]) {
      const a = rp.a + s * spread;
      const x = core.x + Math.cos(a) * SR, y = core.y + Math.sin(a) * SR;
      poly(x, y, (5 + 16 * t) * rp.str, 6, a);
      cx.stroke();
    }
    cx.globalAlpha = alpha * 0.7;
    cx.lineWidth = 2;
    cx.beginPath();
    cx.arc(core.x, core.y, SR + 8 * t, rp.a - spread, rp.a + spread);
    cx.stroke();
    cx.globalAlpha = 1;
  }
  // grip stalk to the core
  cx.strokeStyle = 'rgba(150,175,225,.35)';
  cx.lineWidth = 2;
  cx.beginPath();
  cx.moveTo(core.x + Math.cos(shield.a) * (CORE_R + 2), core.y + Math.sin(shield.a) * (CORE_R + 2));
  cx.lineTo(core.x + Math.cos(shield.a) * (SR - SHIELD_T / 2), core.y + Math.sin(shield.a) * (SR - SHIELD_T / 2));
  cx.stroke();
  cx.restore();
}
function drawProjectiles() {
  for (let i = 0; i < PMAX; i++) {
    const p = projs[i];
    if (!p.act) continue;
    const hot = p.hot;
    const yOff = (p.type === T_MORTAR && !p.friendly) ? -p.h : 0;
    const wob = hot > 0 ? Math.sin(T * 34 + i) * hot * 1.6 : 0;
    const px = p.x + wob, py = p.y + yOff;

    // trail
    const tlen = Math.min(TRAIL, p.tn);
    if (tlen > 1) {
      cx.lineCap = 'round';
      for (let k = 1; k < tlen; k++) {
        const i0 = (p.tn - k - 1 + TRAIL * 3) % TRAIL;
        const i1 = (p.tn - k + TRAIL * 3) % TRAIL;
        const a = (1 - k / tlen) * (hot > 0 ? 0.62 : 0.28);
        cx.globalAlpha = a;
        cx.strokeStyle = hot > 0 ? (hot > 1 ? '#fffbe8' : '#ffcf6b') : ((p.stray && !p.friendly) ? '#5a6a8e' : '#8fb4ff');
        cx.lineWidth = p.r * (hot > 0 ? 1.5 : 0.8) * (1 - k / tlen);
        cx.beginPath();
        cx.moveTo(p.tx[i0], p.ty[i0]);
        cx.lineTo(p.tx[i1], p.ty[i1]);
        cx.stroke();
      }
      cx.globalAlpha = 1;
    }

    if (p.type === T_MORTAR && !p.friendly) {   // telegraphed ground shadow
      const sc = clamp(1 - p.h / Math.max(1, p.h0), 0.25, 1);
      cx.globalAlpha = 0.32 + 0.4 * sc;
      cx.fillStyle = '#000';
      cx.beginPath();
      cx.ellipse(p.x, p.y, p.r * (2.2 - sc), p.r * (1.1 - sc * 0.4), 0, 0, TAU);
      cx.fill();
      cx.globalAlpha = 0.9;
      cx.strokeStyle = '#ff9d5c';
      cx.lineWidth = 2;
      cx.beginPath();
      cx.ellipse(p.x, p.y, p.r * 2.4 * sc, p.r * 1.2 * sc, 0, 0, TAU);
      cx.stroke();
      cx.globalAlpha = 1;
    }

    const strayDim = (p.stray && !p.friendly);
    const bodyCol = hot > 0 ? '#fff6d8' : (strayDim ? '#7f90b4' : '#cfe0ff');
    const glowCol = hot > 0 ? (hot > 1.1 ? '#ffffff' : '#ffb45b') : (strayDim ? '#3f5880' : '#5f8fe0');
    cx.save();
    if (strayDim) cx.globalAlpha = 0.5;
    cx.translate(px, py);
    cx.rotate(p.rot);
    if (hot > 0) {
      cx.globalAlpha = clamp(hot * 0.5, 0.2, 0.8);
      cx.fillStyle = glowCol;
      cx.beginPath(); cx.arc(0, 0, p.r * 2.2, 0, TAU); cx.fill();
      cx.globalAlpha = 1;
    }
    switch (p.type) {
      case T_BULLET:
        cx.fillStyle = bodyCol;
        rr(-p.r * 1.6, -p.r * 0.5, p.r * 3.2, p.r, p.r * 0.5);
        cx.fill();
        cx.fillStyle = glowCol;
        cx.beginPath(); cx.arc(p.r * 1.1, 0, p.r * 0.55, 0, TAU); cx.fill();
        break;
      case T_SAW:
        cx.fillStyle = hot > 0 ? '#ffd9a0' : '#b9c8e6';
        poly(0, 0, p.r, 8, 0); cx.fill();
        cx.fillStyle = hot > 0 ? '#fff' : '#7d8db0';
        cx.beginPath(); cx.arc(0, 0, p.r * 0.42, 0, TAU); cx.fill();
        cx.strokeStyle = hot > 0 ? '#fff2c9' : '#dbe6ff';
        cx.lineWidth = 2;
        poly(0, 0, p.r * 1.25, 8, Math.PI / 8); cx.stroke();
        break;
      case T_ROCKET:
        cx.fillStyle = bodyCol;
        cx.beginPath();
        cx.moveTo(p.r * 1.7, 0); cx.lineTo(-p.r, -p.r * 0.8); cx.lineTo(-p.r * 0.5, 0); cx.lineTo(-p.r, p.r * 0.8);
        cx.closePath(); cx.fill();
        cx.fillStyle = hot > 0 ? '#ffe9a8' : '#ff8a5c';
        cx.beginPath();
        cx.moveTo(-p.r * 0.6, 0);
        cx.lineTo(-p.r * (1.7 + Math.sin(T * 40) * 0.4), -p.r * 0.4);
        cx.lineTo(-p.r * (1.7 + Math.sin(T * 40) * 0.4), p.r * 0.4);
        cx.closePath(); cx.fill();
        break;
      case T_ORB: {
        const ch = p.held ? p.charge : 1;
        const gg = cx.createRadialGradient(0, 0, 1, 0, 0, p.r * 1.6);
        gg.addColorStop(0, '#ffffff');
        gg.addColorStop(0.45, hot > 0 ? '#ffe9a8' : '#7fe3ff');
        gg.addColorStop(1, 'rgba(60,140,220,0)');
        cx.fillStyle = gg;
        cx.beginPath(); cx.arc(0, 0, p.r * 1.6, 0, TAU); cx.fill();
        cx.strokeStyle = '#b6f3ff';
        cx.lineWidth = 2;
        cx.beginPath(); cx.arc(0, 0, p.r * (1 + Math.sin(T * 8) * 0.08), 0, TAU); cx.stroke();
        if (p.held) {
          cx.strokeStyle = ch >= 0.99 ? '#ffffff' : '#ffd166';
          cx.lineWidth = 4;
          cx.beginPath(); cx.arc(0, 0, p.r * 2.1, -Math.PI / 2, -Math.PI / 2 + TAU * ch); cx.stroke();
        }
        break;
      }
      case T_MORTAR:
        cx.fillStyle = hot > 0 ? '#fff2c9' : '#c3cfe8';
        cx.beginPath();
        cx.ellipse(0, 0, p.r * 1.3, p.r, 0, 0, TAU);
        cx.fill();
        cx.fillStyle = '#ff9d5c';
        cx.beginPath(); cx.arc(-p.r * 0.9, 0, p.r * 0.45, 0, TAU); cx.fill();
        cx.strokeStyle = '#8fa6d6';
        cx.lineWidth = 1.6;
        cx.beginPath(); cx.moveTo(p.r * 0.2, -p.r); cx.lineTo(p.r * 0.2, p.r); cx.stroke();
        break;
    }
    cx.restore();
  }
  cx.globalAlpha = 1;
}
function drawEnemy(e) {

  const dying = e.dead;
  cx.save();
  cx.translate(e.x, e.y);

  const trim = dying ? '#ffffff' : '#98a8c8';
  const eye = dying ? '#ffffff' : (e.armor !== null ? '#ffd166' : '#ff6a52');
  cx.fillStyle = base;

      cx.strokeStyle = trim;

      cx.fillStyle = 'rgba(180,205,255,.5)';

      cx.beginPath();
      cx.ellipse(r * 0.8, -r * 0.75 + t, r * 0.5, r * 0.12, 0, 0, TAU); cx.fill();

    case 'turret': {

      const a = Math.atan2(core.y - e.y, core.x - e.x);

      }
      cx.fillStyle = base;
      rr(-r * 0.95, -r * 0.9, r * 1.9, r * 1.5, 6); cx.fill();
      cx.strokeStyle = trim; cx.lineWidth = 2.5; cx.stroke();
      cx.fillStyle = '#7d8ca8';
      rr(-r * 0.75, -r * 0.7, r * 1.5, r * 0.42, 3); cx.fill();
      cx.fillStyle = eye;
      cx.beginPath(); cx.arc(0, r * 0.1, r * 0.26, 0, TAU); cx.fill();
      break;
    }
    case 'boss': {
      const open = e.armorOpen;
      cx.strokeStyle = trim; cx.lineWidth = 6;
      for (const s of [-1, 1]) {
        cx.beginPath();
        cx.moveTo(s * r * 0.5, r * 0.4);
        cx.lineTo(s * r * 0.95, r * 0.95 + Math.sin(e.leg * 0.6 + (s > 0 ? 0 : Math.PI)) * 4);
        cx.lineTo(s * r * 1.2, r * 1.5);
        cx.stroke();
      }
      cx.fillStyle = base;
      rr(-r, -r, r * 2, r * 1.7, 10); cx.fill();
      cx.strokeStyle = trim; cx.lineWidth = 4; cx.stroke();
      // shoulder cannons
      cx.fillStyle = '#79879f';
      for (const s of [-1, 1]) { rr(s * r * 0.95 - r * 0.28, -r * 0.85, r * 0.56, r * 0.9, 4); cx.fill(); }
      // armoured core plates
      if (!open) {
        cx.fillStyle = '#8b99b5';
        for (const s of [-1, 1]) {
          cx.beginPath();
          cx.moveTo(0, -r * 0.1);
          cx.lineTo(s * r * 0.55, -r * 0.5);
          cx.lineTo(s * r * 0.55, r * 0.42);
          cx.lineTo(0, r * 0.5);
          cx.closePath(); cx.fill(); cx.stroke();
        }
        cx.fillStyle = '#ffd166';
        cx.font = '900 ' + Math.round(r * 0.32) + 'px system-ui, sans-serif';
        cx.textAlign = 'center';
        cx.fillText(Math.min(3, e.mortRet) + '/3', 0, r * 0.12);
      } else {
        const gg = cx.createRadialGradient(0, 0, 1, 0, 0, r * 0.65);
        gg.addColorStop(0, '#ffffff');
        gg.addColorStop(0.4, '#ff6a52');
        gg.addColorStop(1, 'rgba(255,60,40,0)');
        cx.fillStyle = gg;
        cx.beginPath(); cx.arc(0, 0, r * 0.65 * (1 + Math.sin(T * 7) * 0.07), 0, TAU); cx.fill();
      }
      // eye bar
      cx.fillStyle = eye;
      rr(-r * 0.6, -r * 0.86, r * 1.2, r * 0.18, 3); cx.fill();
      break;
    }
  }
  // armour badge: which ammo cracks it
  if (e.armor !== null && !dying) {
    cx.fillStyle = 'rgba(12,17,36,.85)';
    cx.strokeStyle = '#ffd166';
    cx.lineWidth = 1.6;
    poly(0, -r - 13, 9, 6, Math.PI / 6);
    cx.fill(); cx.stroke();
    cx.fillStyle = '#ffd166';
    cx.font = '900 11px system-ui, sans-serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText(TYPE_ICON[e.armor], 0, -r - 12);
    cx.textBaseline = 'alphabetic';
  }
  cx.restore();
  // hp bar for tanky machines
  if (!dying && !e.boss && e.maxhp > 40) {
    const f = clamp(e.hp / e.maxhp, 0, 1);
    cx.fillStyle = 'rgba(10,14,30,.7)';
    rr(e.x - r, e.y + r + 5, r * 2, 4, 2); cx.fill();
    cx.fillStyle = f > 0.5 ? '#8affc1' : (f > 0.25 ? '#ffd166' : '#ff6a52');
    rr(e.x - r, e.y + r + 5, r * 2 * f, 4, 2); cx.fill();
  }
}
function drawEnemies() { for (let i = 0; i < enemies.length; i++) drawEnemy(enemies[i]); }
function drawParticles() {
  for (let i = 0; i < QMAX; i++) {
    const q = parts[i];
    if (!q.act) continue;
    const a = clamp(q.life / q.max, 0, 1);
    if (q.kind === 2) {
      cx.globalAlpha = a * 0.28;
      cx.fillStyle = q.col;
      cx.beginPath(); cx.arc(q.x, q.y, q.r, 0, TAU); cx.fill();
    } else if (q.kind === 1) {
      cx.save();
      cx.globalAlpha = a;
      cx.translate(q.x, q.y); cx.rotate(q.rot);
      cx.fillStyle = q.col;
      cx.fillRect(-q.r / 2, -q.r / 3, q.r, q.r * 0.66);
      cx.restore();
    } else {
      cx.globalAlpha = a;
      cx.fillStyle = q.col;
      cx.fillRect(q.x - q.r / 2, q.y - q.r / 2, q.r, q.r);
    }
  }
  cx.globalAlpha = 1;
}
function drawRings() {
  for (let i = 0; i < RMAX; i++) {
    const r = rings[i];
    if (!r.act) continue;
    const a = clamp(r.life / r.max, 0, 1);
    cx.globalAlpha = a * 0.85;
    cx.lineWidth = r.lw * a + 0.5;
    if (r.chroma) {
      cx.strokeStyle = 'rgba(255,80,80,.8)';
      cx.beginPath(); cx.arc(r.x - 3, r.y, r.r, 0, TAU); cx.stroke();
      cx.strokeStyle = 'rgba(80,255,180,.8)';
      cx.beginPath(); cx.arc(r.x + 3, r.y, r.r, 0, TAU); cx.stroke();
      cx.strokeStyle = 'rgba(120,160,255,.8)';
      cx.beginPath(); cx.arc(r.x, r.y + 3, r.r, 0, TAU); cx.stroke();
    }
    cx.strokeStyle = r.col;
    cx.beginPath(); cx.arc(r.x, r.y, r.r, 0, TAU); cx.stroke();
  }
  cx.globalAlpha = 1;
}
function drawFloaters() {
  cx.textAlign = 'center';
  for (let i = 0; i < FMAX; i++) {
    const f = floats[i];
    if (!f.act) continue;
    const a = clamp(f.life / f.max, 0, 1);
    const sc = f.big ? 1 + (1 - a) * 0.18 : 1;
    cx.save();
    cx.translate(clamp(f.x, 54, W - 54), f.y);
    cx.scale(sc, sc);
    cx.globalAlpha = a;
    cx.font = '900 ' + (f.big ? 22 : 15) + 'px system-ui, sans-serif';
    cx.lineWidth = 4;
    cx.strokeStyle = 'rgba(0,0,0,.75)';
    cx.strokeText(f.txt, 0, 0);
    cx.fillStyle = f.col;
    cx.fillText(f.txt, 0, 0);
    cx.restore();
  }
  cx.globalAlpha = 1;
  cx.textAlign = 'left';
}
function drawBattle() {
  cx.save();
  if (camZoom !== 1) {
    cx.translate(camFX, camFY);
    cx.scale(camZoom, camZoom);
    cx.translate(-camFX, -camFY);
  }
  if (shakeMag > 0) {
    cx.translate(shakeX + rand(-1, 1) * shakeMag * 0.45, shakeY + rand(-1, 1) * shakeMag * 0.45);
  }
  drawArena();
  drawEnemies();
  drawProjectiles();
  drawCore();
  drawShield();
  drawParticles();
  drawRings();
  drawFloaters();
  cx.restore();
}

/* ============================= title scene: THE BASTION ============================= */
function drawBastion() {
  const st = bastionStage();
  const g = cx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#141a3c');
  g.addColorStop(0.42, '#25255a');
  g.addColorStop(0.72, '#4a3155');
  g.addColorStop(1, '#6b3a3a');
  cx.fillStyle = g;
  cx.fillRect(0, 0, W, H);
  // stars
  for (let i = 0; i < 46; i++) {
    const x = ((i * 137.5) % 1) * 0 + ((i * 73) % W);
    const y = ((i * 191) % Math.max(1, Math.floor(H * 0.5)));
    cx.globalAlpha = 0.25 + 0.45 * Math.abs(Math.sin(T * 0.7 + i));
    cx.fillStyle = '#cfe0ff';
    cx.fillRect(x, y, 2, 2);
  }
  cx.globalAlpha = 1;

  const gy = H * 0.80;                        // ground line
  const bw = Math.min(W * 0.72, 400);         // bastion width
  const bx = W / 2 - bw / 2;

  // low warm glow on the horizon: the war is still burning out there
  const hg = cx.createRadialGradient(W / 2, gy, 4, W / 2, gy, Math.max(W, H) * 0.55);
  hg.addColorStop(0, 'rgba(255,150,70,.34)');
  hg.addColorStop(0.45, 'rgba(200,80,60,.13)');
  hg.addColorStop(1, 'rgba(120,40,60,0)');
  cx.fillStyle = hg;
  cx.fillRect(0, gy - H * 0.42, W, H * 0.5);

  // distant silhouette of the broken machine army
  cx.fillStyle = '#241d38';
  for (let i = 0; i < 16; i++) {
    const x = ((i * 97) % (W + 60)) - 30;
    const hh = 14 + ((i * 53) % 22);
    cx.fillRect(x, gy - 12 - hh, 12 + (i % 3) * 5, hh);
    cx.fillRect(x - 4, gy - 14 - hh, 20 + (i % 3) * 5, 5);
    if (i % 4 === 1) { cx.fillRect(x + 4, gy - 30 - hh, 3, 18); }
  }

  // ground
  cx.fillStyle = '#382733';
  cx.fillRect(0, gy, W, H - gy);
  cx.fillStyle = '#4a3341';
  cx.beginPath();
  cx.moveTo(0, gy);
  for (let x = 0; x <= W; x += 30) cx.lineTo(x, gy - 3 - Math.abs(Math.sin(x * 0.05)) * 5);
  cx.lineTo(W, gy + 12); cx.lineTo(0, gy + 12);
  cx.closePath(); cx.fill();
  // scorch streaks
  cx.strokeStyle = 'rgba(20,12,18,.5)';
  cx.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    const x = ((i * 137) % W);
    cx.beginPath();
    cx.moveTo(x, gy + 6 + (i % 4) * 9);
    cx.lineTo(x + 26 + (i % 5) * 8, gy + 6 + (i % 4) * 9);
    cx.stroke();
  }

  if (st === 0) {                             // Rubble: broken wall stubs
    cx.fillStyle = '#4b4260';
    for (let i = 0; i < 7; i++) {
      const x = bx + 10 + i * (bw - 20) / 7;
      const hh = 10 + ((i * 29) % 16);
      rr(x, gy - 12 - hh, 16 + (i % 3) * 6, hh + 12, 3);
      cx.fill();
    }
    cx.strokeStyle = 'rgba(200,170,140,.18)';
    cx.lineWidth = 2;
    cx.setLineDash([7, 9]);
    cx.beginPath();
    cx.moveTo(bx - 8, gy - 16); cx.lineTo(bx + bw + 8, gy - 16);
    cx.stroke();
    cx.setLineDash([]);
  }

  // machine-army wreckage piled outside the walls
  const wrecks = 4 + st;
  for (let i = 0; i < wrecks; i++) {
    const side = i % 2 ? 1 : -1;
    const wx = W / 2 + side * (bw * 0.55 + ((i * 53) % Math.max(20, W * 0.22)));
    const wy = gy - 4 - ((i * 17) % 10);
    const s = 9 + ((i * 31) % 12);
    cx.fillStyle = '#525c7e';
    poly(wx, wy - s * 0.4, s * 0.62, 6, i * 0.7 + T * 0.02);
    cx.fill();
    cx.strokeStyle = '#8b97bd';
    cx.lineWidth = 1.6;
    cx.stroke();
    cx.strokeStyle = '#a2adcb';
    cx.beginPath();
    cx.moveTo(wx - s * 0.7, wy);
    cx.lineTo(wx + s * 0.7, wy - s * 0.25);
    cx.stroke();
    if (i % 3 === 0) {
      cx.globalAlpha = 0.2 + 0.1 * Math.sin(T * 2 + i);
      cx.fillStyle = '#6a7285';
      cx.beginPath();
      cx.arc(wx + Math.sin(T * 0.7 + i) * 4, wy - s * 1.6, s * 0.5, 0, TAU);
      cx.fill();
      cx.globalAlpha = 1;
    }
  }

  if (st >= 1) {                              // foundation
    cx.fillStyle = '#3a3348';
    rr(bx - 8, gy - 16, bw + 16, 18, 3); cx.fill();
  }
  if (st >= 2) {                              // palisade
    cx.fillStyle = '#4a4058';
    for (let x = bx; x < bx + bw; x += 14) {
      cx.beginPath();
      cx.moveTo(x, gy - 14); cx.lineTo(x + 5, gy - 34); cx.lineTo(x + 10, gy - 14);
      cx.closePath(); cx.fill();
    }
  }
  if (st >= 3) {                              // stone wall
    cx.fillStyle = '#59526e';
    rr(bx, gy - 62, bw, 50, 4); cx.fill();
    cx.strokeStyle = '#6f6789';
    cx.lineWidth = 1.2;
    for (let y = gy - 56; y < gy - 12; y += 12) {
      cx.beginPath(); cx.moveTo(bx, y); cx.lineTo(bx + bw, y); cx.stroke();
    }
  }
  if (st >= 4) {                              // gatehouse
    cx.fillStyle = '#453f58';
    rr(W / 2 - 24, gy - 52, 48, 52, 3); cx.fill();
    cx.fillStyle = '#2b2739';
    cx.beginPath();
    cx.moveTo(W / 2 - 16, gy); cx.lineTo(W / 2 - 16, gy - 28);
    cx.arc(W / 2, gy - 28, 16, Math.PI, 0);
    cx.lineTo(W / 2 + 16, gy);
    cx.closePath(); cx.fill();
  }
  if (st >= 5) {                              // watchtower (left)
    cx.fillStyle = '#635b7c';
    rr(bx - 6, gy - 108, 40, 96, 4); cx.fill();
    cx.fillStyle = '#7a7096';
    rr(bx - 12, gy - 118, 52, 14, 3); cx.fill();
  }
  if (st >= 6) {                              // twin tower (right)
    cx.fillStyle = '#635b7c';
    rr(bx + bw - 34, gy - 108, 40, 96, 4); cx.fill();
    cx.fillStyle = '#7a7096';
    rr(bx + bw - 40, gy - 118, 52, 14, 3); cx.fill();
  }
  if (st >= 7) {                              // rampart crenellations
    cx.fillStyle = '#6a6285';
    for (let x = bx + 6; x < bx + bw - 12; x += 22) { rr(x, gy - 76, 13, 16, 2); cx.fill(); }
  }
  if (st >= 8) {                              // keep
    cx.fillStyle = '#524a68';
    rr(W / 2 - 46, gy - 132, 92, 74, 5); cx.fill();
    cx.fillStyle = '#ffd166';
    cx.globalAlpha = 0.75;
    for (const o of [-26, 0, 26]) { rr(W / 2 + o - 6, gy - 116, 12, 16, 2); cx.fill(); }
    cx.globalAlpha = 1;
  }
  if (st >= 9) {                              // banners
    for (const s of [-1, 1]) {
      const fx2 = W / 2 + s * 62;
      cx.strokeStyle = '#8f86ac';
      cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(fx2, gy - 108); cx.lineTo(fx2, gy - 150); cx.stroke();
      cx.fillStyle = '#e0512f';
      cx.beginPath();
      cx.moveTo(fx2, gy - 148);
      cx.lineTo(fx2 + s * (26 + Math.sin(T * 2 + s) * 4), gy - 140);
      cx.lineTo(fx2, gy - 128);
      cx.closePath(); cx.fill();
    }
  }
  if (st >= 10) {                             // beacon
    const bl = 0.6 + 0.4 * Math.abs(Math.sin(T * 1.6));
    const gg = cx.createRadialGradient(W / 2, gy - 146, 1, W / 2, gy - 146, 60 * bl);
    gg.addColorStop(0, 'rgba(255,220,140,.95)');
    gg.addColorStop(1, 'rgba(255,180,60,0)');
    cx.fillStyle = gg;
    cx.beginPath(); cx.arc(W / 2, gy - 146, 60 * bl, 0, TAU); cx.fill();
    cx.fillStyle = '#ffd166';
    cx.beginPath(); cx.arc(W / 2, gy - 146, 7, 0, TAU); cx.fill();
  }
  if (st >= 11) {                             // citadel spire
    cx.fillStyle = '#5d5476';
    cx.beginPath();
    cx.moveTo(W / 2 - 22, gy - 132);
    cx.lineTo(W / 2, gy - 196);
    cx.lineTo(W / 2 + 22, gy - 132);
    cx.closePath(); cx.fill();
    cx.fillStyle = '#ffd166';
    cx.beginPath(); cx.arc(W / 2, gy - 196, 5, 0, TAU); cx.fill();
  }
  if (st >= 12) {                             // full bastion: shield dome + searchlights
    cx.globalAlpha = 0.22 + 0.08 * Math.sin(T * 2);
    cx.strokeStyle = '#7fe3ff';
    cx.lineWidth = 3;
    cx.beginPath();
    cx.ellipse(W / 2, gy, bw * 0.75, 140, 0, Math.PI, 0);
    cx.stroke();
    cx.globalAlpha = 1;
    for (const s of [-1, 1]) {
      const a = -Math.PI / 2 + Math.sin(T * 0.6 + (s > 0 ? 1.4 : 0)) * 0.7;
      cx.globalAlpha = 0.12;
      cx.fillStyle = '#cfe6ff';
      cx.beginPath();
      const ox = W / 2 + s * (bw / 2 - 14), oy = gy - 116;
      cx.moveTo(ox, oy);
      cx.lineTo(ox + Math.cos(a - 0.09) * 420, oy + Math.sin(a - 0.09) * 420);
      cx.lineTo(ox + Math.cos(a + 0.09) * 420, oy + Math.sin(a + 0.09) * 420);
      cx.closePath(); cx.fill();
      cx.globalAlpha = 1;
    }
  }

  // patrol drones circling the fortress (machines, always)
  for (let i = 0; i < 3; i++) {
    const a = T * (0.35 + i * 0.08) + i * 2.1;
    const dx = W / 2 + Math.cos(a) * (bw * 0.62);
    const dy = gy - 150 - i * 26 + Math.sin(a * 2) * 9;
    cx.fillStyle = '#4d5878';
    rr(dx - 8, dy - 5, 16, 10, 3); cx.fill();
    cx.strokeStyle = '#93a3c6';
    cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(dx - 11, dy - 7); cx.lineTo(dx + 11, dy - 7); cx.stroke();
    cx.fillStyle = '#ff6a52';
    cx.beginPath(); cx.arc(dx, dy, 2.2, 0, TAU); cx.fill();
  }
  // scrap progress bar
  const st2 = st;
  if (st2 < BASTION_STAGES.length - 1) {
    const a0 = BASTION_STAGES[st2].at, a1 = BASTION_STAGES[st2 + 1].at;
    const f = clamp((save.totalScrap - a0) / Math.max(1, a1 - a0), 0, 1);
    const wpx = Math.min(W * 0.6, 300);
    cx.fillStyle = 'rgba(10,15,34,.7)';
    rr(W / 2 - wpx / 2, gy + 22, wpx, 8, 4); cx.fill();
    cx.fillStyle = '#ffd166';
    rr(W / 2 - wpx / 2, gy + 22, wpx * f, 8, 4); cx.fill();
  }
}

/* ============================= overlays ============================= */
function drawOverlays() {
  if (bloom > 0.01) {
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    cx.globalAlpha = clamp(bloom, 0, 1) * 0.32;
    const gg = cx.createRadialGradient(core.x, core.y, SR * 0.3, core.x, core.y, Math.max(W, H) * 0.8);
    gg.addColorStop(0, 'rgba(220,245,255,1)');
    gg.addColorStop(1, 'rgba(120,180,255,0)');
    cx.fillStyle = gg;
    cx.fillRect(0, 0, W, H);
    cx.restore();
  }
  if (vignette > 0.01) {
    const gg = cx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.34, W / 2, H / 2, Math.max(W, H) * 0.78);
    gg.addColorStop(0, 'rgba(0,0,0,0)');
    gg.addColorStop(1, 'rgba(10,0,6,' + (0.28 + vignette * 0.6).toFixed(3) + ')');
    cx.fillStyle = gg;
    cx.fillRect(0, 0, W, H);
  }
  if (flash > 0.005) {
    cx.fillStyle = 'rgba(' + flashR + ',' + flashG + ',' + flashB + ',' + (flash * 0.55).toFixed(3) + ')';
    cx.fillRect(0, 0, W, H);
  }
}
function draw() {
  cx.clearRect(0, 0, W, H);
  if (state === 'play' || state === 'results') drawBattle();
  else drawBastion();
  drawOverlays();
}

/* ============================= main loop ============================= */
let lastT = 0, frameErrs = 0;
try { lastT = performance.now(); } catch (e) { lastT = Date.now(); }

function loop(t) {
  // Re-arm in `finally`: one bad frame can never permanently blank the game.
  try {
    if (typeof t !== 'number') t = lastT + 16.7;
    if (needTimeReset) { lastT = t; needTimeReset = false; }
    if (--sizeTick <= 0) { sizeTick = 10; checkSize(); }
    let dt = (t - lastT) / 1000;
    lastT = t;
    if (!(dt > 0) || !isFinite(dt)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
  } catch (e) {
    if (++frameErrs <= 3 && window.console && console.error) console.error('[returnfire] frame error:', e);
  } finally {
    requestAnimationFrame(loop);
  }
}

/* ============================= verification hook ============================= */
/* Small, read-mostly surface used by the offline soak harness. */
window.__RF = {
  projs: projs, parts: parts, enemies: enemies, shield: shield, core: core,
  reflectMath: reflectMath, shieldSweep: shieldSweep, deflect: deflect,
  spawnShot: spawnShot, botStep: botStep, update: update, draw: draw,
  startWave: function (n) { startWave(n); },
  goHome: goHome,
  steer: function (a) { shield.target = a; },
  snapShield: function (a) { shield.a = a; shield.pa = a; shield.av = 0; shield.target = a; },
  get SR() { return SR; },
  get arcHalf() { return arcHalf(); },
  get W() { return W; },
  get H() { return H; },
  get save() { return save; },
  get state() { return state; },
  get waveState() { return waveState; },
  get wave() { return waveNum; },
  get hp() { return core.hp; },
  get critical() { return critical; },
  activeProjs: function () { let n = 0; for (let i = 0; i < PMAX; i++) if (projs[i].act) n++; return n; },
  activeParts: function () { let n = 0; for (let i = 0; i < QMAX; i++) if (parts[i].act) n++; return n; },
  caps: { PMAX: PMAX, QMAX: QMAX },
  setCritical: function (v) { if (!v && critical) exitCritical(); else if (v && !critical) enterCritical(); },
};

/* ============================= boot ============================= */
resize();
showScreen('title');
refreshTitle();
setMute(save.muted);
if (save.wave > save.bestWave + 1) save.wave = Math.max(1, save.bestWave + 1);
persist();
requestAnimationFrame(loop);
})();
</script>
