/* point-to-segment distance */
function ptSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const L2 = dx * dx + dy * dy;
  let t = L2 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
  t = clamp(t, 0, 1);
  return hyp(px - (ax + dx * t), py - (ay + dy * t));
}
function segsCross(ax, ay, bx, by, cx, cy, dx, dy) {
  const d1 = (dx - cx) * (ay - cy) - (dy - cy) * (ax - cx);
  const d2 = (dx - cx) * (by - cy) - (dy - cy) * (bx - cx);
  const d3 = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  const d4 = (bx - ax) * (dy - ay) - (by - ay) * (dx - ax);
  return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
}
function segSegDist(ax, ay, bx, by, cx, cy, dx, dy) {
  if (segsCross(ax, ay, bx, by, cx, cy, dx, dy)) return 0;
  return Math.min(
    ptSeg(ax, ay, cx, cy, dx, dy), ptSeg(bx, by, cx, cy, dx, dy),
    ptSeg(cx, cy, ax, ay, bx, by), ptSeg(dx, dy, ax, ay, bx, by));
}

      const o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        def.best = Math.max(0, o.best | 0);
        def.coins = Math.max(0, o.coins | 0);
        def.muted = !!o.muted;
        if (Array.isArray(o.col)) def.col = o.col.map(x => !!x).slice(0, 12);

  } catch (e) {}

      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }

  if (!AC || muted) return;
  try {
    const t = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(Math.max(1, f0), t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}

  if (!AC || muted) return;

    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;

    g.gain.setValueAtTime(vol, t);

    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  } catch (e) {}
}

/* level def for any level number (13+ = shifted variations) */
function levelDef(lv) {
  const base = LEVELS[(lv - 1) % LEVELS.length];
  if (lv <= LEVELS.length) return base;
  const d = JSON.parse(JSON.stringify(base));
  const rng = seededRand((lv * 2654435761) >>> 0);
  const dx = Math.round((rng() - 0.5) * 30);          // whole-layout shift keeps solutions valid
  const shiftX = x => clamp(x + dx, 20, WW - 20);
  for (const p of d.pkgs) p.x = shiftX(p.x);
  for (const b of (d.bombs || [])) b.x = shiftX(b.x);
  for (const b of (d.balloons || [])) b.x = shiftX(b.x);
  for (const r of d.ropes) {
    if (r.a.p) r.a.p[0] = shiftX(r.a.p[0]);
    if (r.b.p) r.b.p[0] = shiftX(r.b.p[0]);
    if (r.pul) r.pul[0] = shiftX(r.pul[0]);
    r.slack = (r.slack || 1) * (1 + (rng() - 0.5) * 0.02);
  }
  for (const s of (d.statics || [])) s.x += dx;
  for (const s of (d.spikes || [])) s.x += dx;
  for (const s of (d.springs || [])) s.x += dx;
  d.truck.cx = clamp(d.truck.cx + dx, 70, WW - 70);
  return d;
}

/* ---------- physics builders ---------- */
function attachOff(b, key) { const f = ATTACH[key] || ATTACH.tc; return f(b.w, b.h); }
function attachWorld(b, ox, oy) {
  const c = Math.cos(b.ang), s = Math.sin(b.ang);
  return [b.x + ox * c - oy * s, b.y + ox * s + oy * c];
}
function endPos(g, e) {
  if (e.k === 'pin') return [e.x, e.y];
  if (e.k === 'bal') { const bl = g.balloons[e.i]; return [bl.x, bl.y]; }
  const b = g.bodies[e.b]; return attachWorld(b, e.ox, e.oy);
}
function makeEnd(g, spec) {
  if (spec.p) return { k: 'pin', x: spec.p[0], y: spec.p[1] };
  if (spec.bal !== undefined) return { k: 'bal', i: spec.bal };
  const b = g.bodies[spec.b];
  const [ox, oy] = attachOff(b, spec.at);
  return { k: 'body', b: spec.b, ox, oy };

    else if (B.t === 'b' && A.t === 'a') rooted[B.i] = true;

    const bnds = [{ i: 0, nd: endNode(r.end0) }];
    for (const mp of r.pins) bnds.push({ i: mp.i, nd: { t: 'a' } });
    bnds.push({ i: r.pts.length - 1, nd: endNode(r.end1) });

/* ============================================================
   PHYSICS STEP (fixed timestep, deterministic)
   ============================================================ */
function stepPhysics(g) {
  const h = STEP;
  /* truck movement (kinematic) */
  const tr = g.truck;
  tr.px = tr.cx;
  if (tr.move) tr.cx = g.def.truck.cx + tr.move.r * Math.sin(tr.move.s * g.simT);
  tr.wheelA += (tr.cx - tr.px) * 0.08;

  /* fray timers -> snap */
  for (const r of g.ropes) {
    for (const L of r.links) {
      if (L.fray > 0 && L.alive) {
        L.fray -= h;
        if (L.fray <= 0) snapLink(g, r, L);
      }
    }
  }
  /* spring anim timers */
  for (const s of g.springs) if (s.animT > 0) s.animT -= h;

  const inFan = (x, y) => {
    for (const f of g.fans) if (x >= f.x && x <= f.x + f.w && y >= f.y && y <= f.y + f.h) return f;
    return null;
  };

  /* integrate rope particles */
  for (const r of g.ropes) {
    for (const p of r.pts) {
      if (!p.inv) continue;
      let ax = 0, ay = GRAV;
      const f = inFan(p.x, p.y);

      let vx = (p.x - p.px) * 0.996, vy = (p.y - p.py) * 0.996;

      p.x += vx + ax * h * h; p.y += vy + ay * h * h;

  for (const bl of g.balloons) {
    if (bl.popped) continue;
    let ax = 0, ay = -1200;
    const f = inFan(bl.x, bl.y);
    if (f) { ax += f.ax; ay += f.ay; }
    let vx = (bl.x - bl.px) * 0.995, vy = (bl.y - bl.py) * 0.995;
    const sp = hyp(vx, vy);
    if (sp > MAXD) { vx *= MAXD / sp; vy *= MAXD / sp; }
    bl.px = bl.x; bl.py = bl.y;
    bl.x += vx + ax * h * h; bl.y += vy + ay * h * h;

      if (Math.abs(dx) < 150) ax += clamp(dx * 3, -260, 260);
    }

    const sp = hyp(vx, vy);
    if (sp > MAXD) { vx *= MAXD / sp; vy *= MAXD / sp; }
    b.px = b.x; b.py = b.y;
    b.x += vx + ax * h * h; b.y += vy + ay * h * h;
    let va = clamp((b.ang - b.pang) * 0.985, -0.2, 0.2);

  for (let it = 0; it < ITER; it++) {
    for (const r of g.ropes) {

  for (let i = 0; i < g.bodies.length; i++) bodyStateCheck(g, g.bodies[i], i);

  for (const r of g.ropes) {

function solveEnd(g, r, e, pt) {

    const tot = pt.inv + bl.inv;
    if (!tot) return;
    const cp = pt.inv / tot, cb = bl.inv / tot;
    pt.x += clampC(dx * cp); pt.y += clampC(dy * cp);
    bl.x -= clampC(dx * cb); bl.y -= clampC(dy * cb);
    return;
  }
  const b = g.bodies[e.b];
  if (b.state === 'delivered' || b.state === 'broken') { /* rope just follows */ }
  const [ax, ay] = attachWorld(b, e.ox, e.oy);
  const dx = ax - pt.x, dy = ay - pt.y;
  const wb = (b.state === 'delivered') ? 0 : b.inv * 1.2;
  const tot = pt.inv + wb;
  if (!tot) return;
  const cp = pt.inv / tot, cb = wb / tot;
  pt.x += clampC(dx * cp); pt.y += clampC(dy * cp);

  const tr = g.truck;
  const vyStep = (b.y - b.py) / STEP;
  const speed = bodySpeed(b);
  let contact = '';
  const rects = [];
  for (const s of g.statics) rects.push({ x: s.x, y: s.y, w: s.w, h: s.h, kind: 'static' });
  /* truck: bed + two side walls (kinematic) */
  rects.push({ x: tr.cx - tr.w / 2, y: tr.bedY, w: tr.w, h: 22, kind: 'bed' });
  rects.push({ x: tr.cx - tr.w / 2 - 9, y: tr.bedY - tr.wallH, w: 9, h: tr.wallH + 20, kind: 'wall' });
  rects.push({ x: tr.cx + tr.w / 2, y: tr.bedY - tr.wallH, w: 9, h: tr.wallH + 20, kind: 'wall' });

  for (const [wx, wy, sx, sy] of bodyCorners(b)) {
    const c = Math.cos(b.ang), s = Math.sin(b.ang);
    const rx = sx * c - sy * s, ry = sx * s + sy * c;
    /* springs first (they sit on the floor) */
    let sprung = false;
    for (const sp of g.springs) {
      if (b.springCd <= 0 && wx >= sp.x && wx <= sp.x + sp.w && wy >= FLOOR - 20 && vyStep > 60) {
        const v = sp.sp;
        b.px = b.x - sp.nx * v * STEP;
        b.py = b.y - sp.ny * v * STEP;
        b.springCd = 0.5; sp.animT = 0.3;
        sfx.boing(); vib(18); shake(0.15, 3);
        addPop(wx, FLOOR - 40, 'BOING!', '#a4f7b0', 20);
        sprung = true;
      }
    }
    if (sprung) continue;
    /* spikes */
    for (const sk of g.spikes) {
      if (wy > FLOOR - 14 && wx >= sk.x && wx <= sk.x + sk.w && b.kind === 'pkg') {
        breakBody(g, b, 'Spiked! Ouch.');
        return;
      }
    }
    /* floor */
    if (wy > FLOOR) {
      applyAt(b, rx, ry, 0, -Math.min(wy - FLOOR, MAXC));
      b.x -= (b.x - b.px) * 0.18;                 // friction
      contact = contact || 'floor';
    }
    /* rects */
    for (const rc of rects) {
      if (wx > rc.x && wx < rc.x + rc.w && wy > rc.y && wy < rc.y + rc.h) {
        const pl = wx - rc.x, pr = rc.x + rc.w - wx, pt2 = wy - rc.y, pb = rc.y + rc.h - wy;
        const m = Math.min(pl, pr, pt2, pb);
        if (m === pt2) { applyAt(b, rx, ry, 0, -Math.min(pt2, MAXC)); b.x -= (b.x - b.px) * 0.15; contact = contact || (rc.kind === 'bed' ? 'bed' : 'rect'); }
        else if (m === pb) applyAt(b, rx, ry, 0, Math.min(pb, MAXC));
        else if (m === pl) applyAt(b, rx, ry, -Math.min(pl, MAXC), 0);
        else applyAt(b, rx, ry, Math.min(pr, MAXC), 0);
      }
    }
  }
  /* impact -> dent / bomb / bounce */
  if (contact) {
    if (b.airborne && vyStep > 120) {
      b.hitV = vyStep;
      const thresh = contact === 'bed' ? DENT_TRUCK : DENT_FLOOR;
      if (b.kind === 'bomb' && vyStep > BOMB_DISTURB) { explodeBomb(g, b); return; }
      if (b.kind === 'pkg' && b.state !== 'broken' && vyStep > thresh && b.dentCd <= 0) dentBody(g, b);
      else if (vyStep > 200) sfx.thud();
      /* small bounce */
      b.py = b.y - (b.y - b.py) * -0.25;
    }
    b.airborne = false;
  } else {
    b.airborne = true;
  }
  b.contact = contact;
}

function collideBodyPairs(g) {
  for (let i = 0; i < g.bodies.length; i++) {
    for (let j = i + 1; j < g.bodies.length; j++) {
      const A = g.bodies[i], B = g.bodies[j];
      const ra = (A.w + A.h) / 4 * 0.92, rb = (B.w + B.h) / 4 * 0.92;
      const dx = B.x - A.x, dy = B.y - A.y;
      const d = hyp(dx, dy), minD = ra + rb;
      if (d > minD || d < 1e-6) continue;
      const relV = hyp((A.x - A.px) - (B.x - B.px), (A.y - A.py) - (B.y - B.py)) / STEP;
      const pen = minD - d;
      const nx = dx / d, ny = dy / d;
      const wa = A.state === 'delivered' ? 0 : A.inv;
      const wb = B.state === 'delivered' ? 0 : B.inv;
      const tot = wa + wb;
      if (!tot) continue;
      const push = Math.min(pen, MAXC);
      if (wa) { A.x -= nx * push * wa / tot; A.y -= ny * push * wa / tot; }
      if (wb) { B.x += nx * push * wb / tot; B.y += ny * push * wb / tot; }
      if (relV > 300) {
        if (A.kind === 'bomb') { explodeBomb(g, A); return; }
        if (B.kind === 'bomb') { explodeBomb(g, B); return; }
        sfx.thud();
      }
    }
  }
}

function bodyStateCheck(g, b, i) {
  if (b.state === 'delivered' || b.state === 'broken') return;
  b.state = g.supported[i] ? 'held' : 'free';
  /* lost off-screen */
  if (b.y < -110 || b.x < -90 || b.x > WW + 90) {
    b.state = 'lost';
    if (b.kind === 'pkg') failLevel(g, 'The package floated away!');
    return;
  }
  /* delivery: resting inside the truck box */
  if (b.kind !== 'pkg') return;
  const tr = g.truck;
  const inZone = Math.abs(b.x - tr.cx) < tr.w / 2 - 4 && b.y > tr.bedY - tr.wallH - 60 && b.y < tr.bedY + 4;
  if (inZone && bodySpeed(b) < REST_SPD && !g.supported[i]) {
    b.restT += STEP;
    if (b.restT > REST_TIME) deliverBody(g, b, i);
  } else b.restT = 0;
}

function popBalloon(g, bl) {
  if (bl.popped) return;
  bl.popped = true;
  sfx.pop(); vib(10);
  addParts(10, () => ({ type: 'shard', x: bl.x + rnd(-8, 8), y: bl.y + rnd(-8, 8), vx: rnd(-130, 130), vy: rnd(-130, 130), g: 200, life: rnd(0.3, 0.6), t: 0, size: rnd(2, 4), col: 'hsl(' + bl.hue + ',80%,65%)', rot: rnd(0, TAU), vr: rnd(-8, 8) }));
  recomputeSupport(g);
}

/* ============================================================
   GAME UPDATE (called from the loop AND from the test harness)
   ============================================================ */
function updateGame(dtReal) {
  const g = game;
  if (!g) return;
  if (g.introT > 0) g.introT -= dtReal;
  if (g.slowT > 0) g.slowT -= dtReal;
  g.timescale = g.slowT > 0 ? SLOWMO_TS : 1;
  g.acc += Math.min(dtReal, 0.033) * g.timescale;
  let n = 0;
  while (g.acc >= STEP && n < 6) {
    if (g.state === 'run' || g.state === 'won' || g.state === 'lost') stepPhysics(g);
    g.simT += STEP;
    g.acc -= STEP;
    n++;
  }
  if (g.acc > STEP * 6) g.acc = 0;
  /* rope creak when heavily strained */
  g.creakT -= dtReal;
  if (g.creakT <= 0) {
    for (const r of g.ropes) {
      let mx = 0;
      for (const L of r.links) if (L.alive) mx = Math.max(mx, L.strain);
      if (mx > 0.05) { sfx.creak(); g.creakT = 0.9; break; }
    }
    if (g.creakT <= 0) g.creakT = 0.25;
  }
  /* end transition */
  if (g.endT >= 0) {
    g.endT -= dtReal;
    if (g.endT <= 0) finishLevel(g.state === 'won' ? 'win' : 'lose');
  }
}

function finishLevel(result) {
  const g = game;
  if (result === 'win') {
    const lv = g.level;
    const stars = g.dentsTotal === 0 ? 3 : (g.dentsTotal === 1 ? 2 : 1);
    const bonus = 5;
    g.coinsEarned += bonus; store.coins += bonus;
    let newItem = null;
    if (lv <= 12 && !store.col[lv - 1]) {
      store.col[lv - 1] = true;
      newItem = { icon: g.def.item, name: g.def.name };
    }
    store.best = Math.max(store.best, lv);
    saveStore();
    winInfo = { coins: g.coinsEarned, stars, newItem };
    window.TTG?.track('level_complete', { level: lv, value: g.coinsEarned });
    sfx.win(); vib([20, 40, 20, 40, 40]);
    addParts(80, () => ({ type: 'confetti', x: rnd(0, view.W), y: rnd(-60, -5), vx: rnd(-40, 40), vy: rnd(60, 190), g: 40, life: rnd(1.6, 3), t: 0, size: rnd(3, 7), col: pick(['#ff8fa3', '#7dffb0', '#ffd166', '#8fc8ff', '#e6b3ff']), rot: rnd(0, TAU), vr: rnd(-8, 8) }));
    setScene('win');
    /* keep celebration confetti after scene switch cleared parts */
    addParts(60, () => ({ type: 'confetti', x: rnd(0, view.W), y: rnd(-60, -5), vx: rnd(-40, 40), vy: rnd(60, 190), g: 40, life: rnd(1.6, 3), t: 0, size: rnd(3, 7), col: pick(['#ff8fa3', '#7dffb0', '#ffd166', '#8fc8ff', '#e6b3ff']), rot: rnd(0, TAU), vr: rnd(-8, 8) }));
  } else {
    window.TTG?.track('game_over', { level: g.level });
    sfx.lose(); vib(60);
    setScene('lose');
  }
}

/* ============================================================
   INPUT — Pointer Events, generous swipe blade
   ============================================================ */
function inRect(p, r) { return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
let activePointer = -1;

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  const p = { x: e.clientX, y: e.clientY };
  if (inRect(p, uiRects.mute)) { setMuted(!muted); sfx.tap(); return; }

  if (scene === 'title') { titlePointer(p); return; }
  if (scene === 'play') {
    if (inRect(p, uiRects.home)) { sfx.tap(); setScene('title'); return; }
    if (inRect(p, uiRects.retry)) { sfx.tap(); game = buildLevel(game.level); return; }
    if (game && game.state === 'run') {
      activePointer = e.pointerId;
      const w = toWorld(p.x, p.y);
      game.blade.active = true;
      game.blade.stroke++;
      game.blade.cuts = 0;
      game.blade.lx = w.x; game.blade.ly = w.y;
      game.blade.trail = [{ x: w.x, y: w.y, t: 0 }];
    }
    return;
  }
  if (scene === 'win') {
    if (inRect(p, uiRects.home)) { sfx.tap(); setScene('title'); return; }
    sfx.tap(); game = buildLevel(game.level + 1); setScene('play'); return;
  }
  if (scene === 'lose') {
    if (inRect(p, uiRects.home)) { sfx.tap(); setScene('title'); return; }
    sfx.tap(); game = buildLevel(game.level); setScene('play'); return;
  }
}, { passive: false });

cvs.addEventListener('pointermove', e => {
  if (scene !== 'play' || !game || !game.blade.active || e.pointerId !== activePointer) return;
  e.preventDefault();
  const w = toWorld(e.clientX, e.clientY);
  const b = game.blade;
  const preCuts = b.cuts;
  tryCutSeg(game, b.lx, b.ly, w.x, w.y);
  if (b.cuts === preCuts && b.cuts >= bladeMax() && hyp(w.x - b.lx, w.y - b.ly) > 26) {
    /* blade is spent this swipe: brief blunt feedback (rate-limited by distance) */
  }
  b.lx = w.x; b.ly = w.y;
  b.trail.push({ x: w.x, y: w.y, t: 0 });
  if (b.trail.length > 22) b.trail.shift();
}, { passive: false });

function endStroke() {
  activePointer = -1;
  if (game) game.blade.active = false;
}
cvs.addEventListener('pointerup', e => { if (e.pointerId === activePointer) endStroke(); });
cvs.addEventListener('pointercancel', e => { if (e.pointerId === activePointer) endStroke(); });
document.addEventListener('visibilitychange', () => {
  endStroke();
  if (!document.hidden && AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
});
['touchstart', 'touchmove', 'gesturestart', 'contextmenu'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

function titlePointer(p) {
  if (inRect(p, uiRects.play)) {
    sfx.tap(); vib(10);
    game = buildLevel(store.best + 1);
    setScene('play');
    return;
  }
  for (let i = 0; i < 12; i++) {
    if (inRect(p, uiRects['shelf' + i])) {
      sfx.tap();
      if (store.col[i]) { shelfMsg = LEVELS[i].item + ' ' + LEVELS[i].name + ' — ' + LEVELS[i].gag; }
      else shelfMsg = '🔒 Deliver level ' + (i + 1) + "'s package to collect it!";
      shelfMsgT = 4;
      return;
    }
  }
  for (let i = 0; i < UPGRADES.length; i++) {
    if (inRect(p, uiRects['shop' + i])) {
      const u = UPGRADES[i];
      if (store.up[u.key]) { sfx.tap(); shelfMsg = u.icon + ' ' + u.name + ' — owned! ' + u.desc; shelfMsgT = 3; return; }
      if (store.coins >= u.cost) {
        store.coins -= u.cost; store.up[u.key] = 1; saveStore();
        sfx.buy(); vib([10, 20, 10]);
        window.TTG?.track('upgrade_bought', { value: u.cost });
        shelfMsg = u.icon + ' ' + u.name + ' purchased! ' + u.desc;
        shelfMsgT = 3;
      } else {
        sfx.denied();
        shelfMsg = 'Need ' + u.cost + ' 🪙 for ' + u.name + ' (you have ' + store.coins + ')';
        shelfMsgT = 3;
      }
      return;
    }
  }
  /* tap anywhere else also starts */
  sfx.tap(); vib(10);
  game = buildLevel(store.best + 1);
  setScene('play');
}

/* ============================================================
   DRAWING
   ============================================================ */
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground(lv, t) {
  const W = view.W, H = view.H;
  const hue = (18 + lv * 23) % 360;
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, 'hsl(' + hue + ',30%,13%)');
  bg.addColorStop(0.6, 'hsl(' + ((hue + 18) % 360) + ',26%,20%)');
  bg.addColorStop(1, 'hsl(' + ((hue + 340) % 360) + ',24%,27%)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

function drawWarehouse(lv, t) {
  const hue = (18 + lv * 23) % 360;
  /* back wall panels */
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 2;
  for (let x = 30; x < WW; x += 78) { ctx.beginPath(); ctx.moveTo(x, 46); ctx.lineTo(x, FLOOR); ctx.stroke(); }
  for (let y = 140; y < FLOOR; y += 105) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WW, y); ctx.stroke(); }
  /* window light shaft */
  ctx.fillStyle = 'rgba(255,235,180,0.05)';
  ctx.beginPath();
  ctx.moveTo(WW * 0.62, 46); ctx.lineTo(WW * 0.94, 46); ctx.lineTo(WW * 0.8, FLOOR); ctx.lineTo(WW * 0.5, FLOOR);
  ctx.closePath(); ctx.fill();
  /* ceiling beam */
  const cg = ctx.createLinearGradient(0, 0, 0, 46);
  cg.addColorStop(0, '#241a20'); cg.addColorStop(1, '#3b2c33');
  ctx.fillStyle = cg;
  ctx.fillRect(-10, -10, WW + 20, 56);
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  for (let x = 16; x < WW; x += 44) { ctx.beginPath(); ctx.arc(x, 36, 2.6, 0, TAU); ctx.fill(); }
  ctx.fillStyle = 'hsla(' + hue + ',35%,60%,0.14)';
  ctx.fillRect(-10, 44, WW + 20, 3);
  /* floor */
  const fg = ctx.createLinearGradient(0, FLOOR, 0, WH);
  fg.addColorStop(0, 'hsl(' + ((hue + 340) % 360) + ',18%,30%)');
  fg.addColorStop(1, 'hsl(' + ((hue + 340) % 360) + ',20%,18%)');
  ctx.fillStyle = fg;
  ctx.fillRect(-10, FLOOR, WW + 20, WH - FLOOR + 10);
  ctx.strokeStyle = 'rgba(0,0,0,0.22)';
  ctx.lineWidth = 2;
  for (let x = -6; x < WW + 10; x += 52) { ctx.beginPath(); ctx.moveTo(x, FLOOR + 4); ctx.lineTo(x + 14, WH); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fillRect(-10, FLOOR, WW + 20, 3);
}

function drawTruck(g, t) {
  const tr = g.truck;
  const x = tr.cx, w = tr.w, by = tr.bedY, wh = tr.wallH;
  /* zone glow */
  if (g.state === 'run' && g.deliveredN < g.bodies.filter(b => b.kind === 'pkg').length) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    const zg = ctx.createLinearGradient(0, by - wh - 60, 0, by);
    zg.addColorStop(0, 'rgba(125,255,176,0)');
    zg.addColorStop(1, 'rgba(125,255,176,' + (0.10 + pulse * 0.10) + ')');
    ctx.fillStyle = zg;
    ctx.fillRect(x - w / 2, by - wh - 60, w, wh + 60);
    ctx.fillStyle = 'rgba(125,255,176,' + (0.5 + pulse * 0.4) + ')';
    ctx.font = '900 15px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('▼', x, by - wh - 70 - pulse * 5);
  }
  /* container */
  const bodyG = ctx.createLinearGradient(0, by - wh, 0, by + 20);
  bodyG.addColorStop(0, '#4e8f5c'); bodyG.addColorStop(1, '#2d5c3a');
  ctx.fillStyle = bodyG;
  roundRect(x - w / 2 - 9, by - wh, 9, wh + 20, 3); ctx.fill();
  roundRect(x + w / 2, by - wh, 9, wh + 20, 3); ctx.fill();
  roundRect(x - w / 2 - 9, by, w + 18, 22, 4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.fillRect(x - w / 2 - 9, by - wh, 9, 6);
  ctx.fillRect(x + w / 2, by - wh, 9, 6);
  /* cab */
  ctx.fillStyle = '#5da76c';
  roundRect(x + w / 2 + 9, by - 12, 34, 34, 6); ctx.fill();
  ctx.fillStyle = '#bfe8ff';
  roundRect(x + w / 2 + 14, by - 7, 14, 12, 3); ctx.fill();
  /* wheels */
  ctx.fillStyle = '#20242c';
  for (const wx of [x - w / 2 + 12, x + w / 2 - 12, x + w / 2 + 26]) {
    ctx.beginPath(); ctx.arc(wx, by + 24, 10, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a93a5'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(wx, by + 24, 5, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(wx, by + 24);
    ctx.lineTo(wx + Math.cos(tr.wheelA) * 5, by + 24 + Math.sin(tr.wheelA) * 5);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '900 9px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('TATER EXPRESS', x, by + 11);
}

function drawStatics(g) {
  for (const s of g.statics) {
    const sg = ctx.createLinearGradient(s.x, 0, s.x + s.w, 0);
    sg.addColorStop(0, '#6b5a4a'); sg.addColorStop(1, '#4a3d32');
    ctx.fillStyle = sg;
    roundRect(s.x, s.y, s.w, s.h, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(s.x, s.y, s.w, 4);
  }
  for (const sk of g.spikes) {
    ctx.fillStyle = '#3a2a2a';
    ctx.fillRect(sk.x, FLOOR - 4, sk.w, 6);
    ctx.fillStyle = '#c9d2dd';
    const n = Math.floor(sk.w / 14);
    for (let i = 0; i < n; i++) {
      const sx = sk.x + 7 + i * (sk.w - 14) / Math.max(1, n - 1);
      ctx.beginPath();
      ctx.moveTo(sx - 6, FLOOR - 2); ctx.lineTo(sx, FLOOR - 16); ctx.lineTo(sx + 6, FLOOR - 2);
      ctx.closePath(); ctx.fill();
    }
  }
  for (const sp of g.springs) {
    const comp = sp.animT > 0 ? 1 - easeOutCubic(1 - sp.animT / 0.3) * 0.5 : 1;
    const hh = 20 * comp;
    ctx.strokeStyle = '#9aa7b8'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const zx = sp.x + sp.w * 0.2 + (i % 2) * sp.w * 0.6;
      const zy = FLOOR - 2 - hh * i / 8;
      if (i === 0) ctx.moveTo(zx, zy); else ctx.lineTo(zx, zy);
    }
    ctx.stroke();
    ctx.fillStyle = '#d8b23e';
    roundRect(sp.x, FLOOR - hh - 10, sp.w, 9, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(sp.x, FLOOR - hh - 10, sp.w, 3, 2); ctx.fill();
    ctx.fillStyle = '#2a2018';
    ctx.font = '900 9px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('▲▲', sp.x + sp.w / 2, FLOOR - hh - 3);
  }
  for (const f of g.fans) {
    /* fan unit on the pushing side + streaks */
    const dir = f.ax >= 0 ? 1 : -1;
    const fx = dir === 1 ? f.x + 4 : f.x + f.w - 4;
    const cy = f.y + f.h / 2;
    ctx.fillStyle = '#39424f';
    roundRect(fx - 14, cy - 26, 28, 52, 6); ctx.fill();
    ctx.strokeStyle = '#96a5b8'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = f.ph * 6 + i * TAU / 3;
      ctx.beginPath();
      ctx.moveTo(fx, cy);
      ctx.lineTo(fx + Math.cos(a) * 11, cy + Math.sin(a) * 11);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(200,225,255,0.14)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      const yy = f.y + f.h * (i + 0.5) / 5;
      const off = ((f.ph * 130 + i * 67) % (f.w * 0.9));
      const sx = dir === 1 ? f.x + off : f.x + f.w - off;
      ctx.beginPath();
      ctx.moveTo(sx, yy + Math.sin(f.ph * 3 + i) * 5);
      ctx.lineTo(sx + 26 * dir, yy + Math.sin(f.ph * 3 + i) * 5);
      ctx.stroke();
    }
  }
  for (const r of g.ropes) {
    if (!r.pulley) continue;
    const [px2, py2] = r.pulley;
    ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(px2, 44); ctx.lineTo(px2, py2 - 6); ctx.stroke();
    ctx.fillStyle = '#7d8794';
    ctx.beginPath(); ctx.arc(px2, py2, 12, 0, TAU); ctx.fill();
    ctx.fillStyle = '#39424f';
    ctx.beginPath(); ctx.arc(px2, py2, 5, 0, TAU); ctx.fill();
  }
  /* anchor mounts */
  for (const r of g.ropes) {
    for (const e of [r.end0, r.end1]) {
      if (e.k !== 'pin') continue;
      ctx.fillStyle = '#6d7787';
      ctx.beginPath(); ctx.arc(e.x, e.y, 5.5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#39424f';
      ctx.beginPath(); ctx.arc(e.x, e.y, 2.4, 0, TAU); ctx.fill();
    }
  }
}

function drawRopes(g, t) {
  for (const r of g.ropes) {
    /* runs of alive links */
    let run = [];
    const flush = () => {
      if (run.length < 1) { run = []; return; }
      drawRopeRun(r, run);
      run = [];
    };
    for (let i = 0; i < r.links.length; i++) {
      if (r.links[i].alive) run.push(i); else flush();
    }
    flush();
    /* fraying links glow + fibers */
    for (const L of r.links) {
      if (!L.alive || L.fray <= 0) continue;
      const a = r.pts[L.a], b = r.pts[L.b];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const k = 1 - L.fray / FRAY_T;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + k * 0.5) + ')';
      ctx.lineWidth = 1.4;
      for (let i = 0; i < 4; i++) {
        const ang = t * 22 + i * 1.7;
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.lineTo(mx + Math.cos(ang) * (3 + k * 6), my + Math.sin(ang) * (3 + k * 6));
        ctx.stroke();
      }
    }
  }
}
function drawRopeRun(r, run) {
  const pts = r.pts;
  const i0 = r.links[run[0]].a, i1 = r.links[run[run.length - 1]].b;
  let maxStrain = 0;
  for (const li of run) maxStrain = Math.max(maxStrain, r.links[li].strain);
  const wh = clamp((maxStrain - 0.015) * 22, 0, 1);   // tension whitening
  const R = Math.round(lerp(150, 255, wh)), G = Math.round(lerp(110, 250, wh)), B = Math.round(lerp(70, 240, wh));
  const passes = r.strands > 1 ? [-1.7, 1.7] : [0];
  for (const off of passes) {
    ctx.strokeStyle = 'rgb(' + R + ',' + G + ',' + B + ')';
    ctx.lineWidth = r.strands > 1 ? 2.6 : 3.2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[i0].x + off, pts[i0].y);
    for (let i = i0 + 1; i <= i1; i++) {
      const p = pts[i], q = pts[i - 1];
      const mx2 = (p.x + q.x) / 2 + off, my2 = (p.y + q.y) / 2;
      ctx.quadraticCurveTo(q.x + off, q.y, mx2, my2);
    }
    ctx.lineTo(pts[i1].x + off, pts[i1].y);
    ctx.stroke();
  }
  /* frayed tufts at severed ends */
  ctx.strokeStyle = '#e8c890'; ctx.lineWidth = 1.3;
  for (const end of [[i0, run[0] > 0], [i1, run[run.length - 1] < r.links.length - 1]]) {
    if (!end[1]) continue;
    const p = pts[end[0]];
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(i * 2.2 + p.x) * 5, p.y + Math.sin(i * 2.2 + p.y) * 5);
      ctx.stroke();
    }
  }
}

function drawBalloons(g, t) {
  for (let i = 0; i < g.balloons.length; i++) {
    const bl = g.balloons[i];
    if (bl.popped) continue;
    const bob = Math.sin(t * 2 + i * 2) * 2;
    ctx.fillStyle = 'hsl(' + bl.hue + ',78%,62%)';
    ctx.beginPath();
    ctx.ellipse(bl.x, bl.y + bob, bl.r * 0.86, bl.r, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(bl.x - bl.r * 0.3, bl.y + bob - bl.r * 0.34, bl.r * 0.22, bl.r * 0.3, -0.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'hsl(' + bl.hue + ',70%,48%)';
    ctx.beginPath();
    ctx.moveTo(bl.x - 4, bl.y + bob + bl.r - 1);
    ctx.lineTo(bl.x + 4, bl.y + bob + bl.r - 1);
    ctx.lineTo(bl.x, bl.y + bob + bl.r + 6);
    ctx.closePath(); ctx.fill();
  }
}

function faceMood(g, b, i) {
  if (b.state === 'broken') return 'ko';
  if (b.state === 'delivered') return 'happy';
  const sp = bodySpeed(b);
  if (!g.supported[i] && b.airborne) return 'scared';
  if (sp > 190) return 'worried';
  return 'idle';
}
function drawBody(g, b, i, t) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.ang);
  const w = b.w, h = b.h;
  if (b.kind === 'bomb') {
    ctx.fillStyle = '#2c2c34';
    roundRect(-w / 2, -h / 2, w, h, 7); ctx.fill();
    ctx.strokeStyle = '#4a4a56'; ctx.lineWidth = 2;
    roundRect(-w / 2 + 3, -h / 2 + 3, w - 6, h - 6, 5); ctx.stroke();
    ctx.font = '400 ' + Math.round(h * 0.5) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💣', 0, 1);
    const blink = Math.sin(t * 6) > 0;
    ctx.fillStyle = blink ? '#ff5a4d' : '#742a24';
    ctx.beginPath(); ctx.arc(w / 2 - 8, -h / 2 + 8, 3.4, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }
  /* cardboard box */
  const squash = b.state === 'broken' ? 0.62 : 1;
  ctx.scale(1, squash);
  const cg = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  cg.addColorStop(0, '#dcae70'); cg.addColorStop(1, '#b98a50');
  ctx.fillStyle = cg;
  roundRect(-w / 2, -h / 2, w, h, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(90,60,30,0.55)'; ctx.lineWidth = 2;
  roundRect(-w / 2, -h / 2, w, h, 6); ctx.stroke();
  /* tape */
  ctx.fillStyle = 'rgba(245,235,210,0.55)';
  ctx.fillRect(-w / 2, -3, w, 6);
  ctx.fillRect(-3, -h / 2, 6, h);
  /* dents (crumple marks) */
  ctx.strokeStyle = 'rgba(70,45,20,0.65)'; ctx.lineWidth = 1.6;
  for (let d = 0; d < b.dents; d++) {
    const cx2 = (d % 2 === 0 ? -1 : 1) * w * 0.3, cy2 = -h * 0.28;
    ctx.beginPath();
    ctx.moveTo(cx2 - 6, cy2 + 4); ctx.lineTo(cx2, cy2 - 3); ctx.lineTo(cx2 + 5, cy2 + 3); ctx.lineTo(cx2 + 9, cy2 - 2);
    ctx.stroke();
  }
  /* item sticker */
  ctx.font = '400 ' + Math.round(h * 0.34) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.item, 0, -h * 0.22);
  /* face */
  const mood = faceMood(g, b, i);
  const fy = h * 0.14;
  const vx = (b.x - b.px) / STEP;
  const look = clamp(vx / 400, -1, 1) * 2.4;
  ctx.fillStyle = '#3a2a18';
  const blink = (Math.sin(t * 1.3 + b.faceT * 7) > 0.985) && mood === 'idle';
  const eyeR = mood === 'scared' ? 5.2 : (mood === 'worried' ? 4.4 : 3.6);
  for (const ex of [-w * 0.18, w * 0.18]) {
    if (mood === 'ko') {
      ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ex - 4, fy - 4); ctx.lineTo(ex + 4, fy + 4);
      ctx.moveTo(ex + 4, fy - 4); ctx.lineTo(ex - 4, fy + 4);
      ctx.stroke();
    } else if (mood === 'happy') {
      ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(ex, fy + 1, 4, Math.PI + 0.4, TAU - 0.4); ctx.stroke();
    } else if (blink) {
      ctx.fillRect(ex - 3.4, fy - 1, 6.8, 2);
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, fy, eyeR, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3a2a18';
      ctx.beginPath(); ctx.arc(ex + look, fy + (mood === 'scared' ? 1 : 0), eyeR * 0.5, 0, TAU); ctx.fill();
    }
  }
  /* brows when worried */
  if (mood === 'worried' || mood === 'scared') {
    ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    const wob = Math.sin(t * 18) * 1.2;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.18 - s * 4, fy - 7 + wob);
      ctx.lineTo(s * w * 0.18 + s * 4, fy - 10 + wob);
      ctx.stroke();
    }
  }
  /* mouth */
  ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (mood === 'happy') ctx.arc(0, fy + 5, 5.5, 0.3, Math.PI - 0.3);
  else if (mood === 'scared') { ctx.arc(0, fy + 8, 3.6, 0, TAU); }
  else if (mood === 'worried') ctx.arc(0, fy + 11, 5, Math.PI + 0.4, TAU - 0.4);
  else if (mood === 'ko') { ctx.moveTo(-4, fy + 8); ctx.lineTo(4, fy + 8); }
  else ctx.arc(0, fy + 5, 4, 0.4, Math.PI - 0.4);
  ctx.stroke();
  ctx.restore();
}

function drawBlade(g) {
  const tr = g.blade.trail;
  if (tr.length < 2) return;
  for (let i = 1; i < tr.length; i++) {
    const a = tr[i - 1], b = tr[i];
    const k = i / tr.length;
    ctx.strokeStyle = 'rgba(220,246,255,' + (k * 0.8) + ')';
    ctx.lineWidth = 1 + k * 3.4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  const tip = tr[tr.length - 1];
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(tip.x, tip.y, 3, 0, TAU); ctx.fill();
}

function updateDrawParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.vy += (p.g || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.rot !== undefined) p.rot += (p.vr || 0) * dt;
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    if (p.type === 'confetti' || p.type === 'shard') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
      ctx.restore();
    } else if (p.type === 'star') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.font = '400 ' + p.size + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✦', 0, 0);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function updateDrawPops(dt) {
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.t += dt;
    if (p.t >= p.life) { pops.splice(i, 1); continue; }
    const k = p.t / p.life;
    const sc = k < 0.2 ? easeOutBack(k / 0.2) : 1;
    ctx.save();
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    ctx.translate(p.x, p.y - easeOutCubic(k) * 34);
    ctx.scale(sc, sc);
    ctx.font = '900 ' + p.size + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(30,15,25,0.8)';
    ctx.strokeText(p.txt, 0, 0);
    ctx.fillStyle = p.col;
    ctx.fillText(p.txt, 0, 0);
    ctx.restore();
  }
}

function drawMuteBtn(x, y) {
  uiRects.mute = { x: x - 22, y: y - 22, w: 44, h: 44 };
  ctx.font = '400 21px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.85;
  ctx.fillText(muted ? '🔇' : '🔊', x, y);
  ctx.globalAlpha = 1;
}

function drawHUD(g, t) {
  const W = view.W;
  const top = 34;
  /* home + retry (>=44px targets) */
  uiRects.home = { x: 8, y: top - 22, w: 44, h: 44 };
  uiRects.retry = { x: 56, y: top - 22, w: 44, h: 44 };
  ctx.font = '400 21px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.85;
  ctx.fillText('🏠', 30, top);
  ctx.fillText('↻', 78, top);
  ctx.globalAlpha = 1;
  drawMuteBtn(W - 30, top);
  /* level + coins */
  ctx.font = '900 17px ' + FONT;
  ctx.fillStyle = '#ffe9c8';
  ctx.fillText('LEVEL ' + g.level, W / 2, top - 8);
  ctx.font = '700 13px ' + FONT;
  ctx.fillStyle = '#ffd166';
  ctx.fillText('🪙 ' + store.coins, W / 2, top + 13);
  /* package status dots */
  const pkgs = g.bodies.filter(b => b.kind === 'pkg');
  const dx0 = W / 2 - (pkgs.length - 1) * 12;
  for (let i = 0; i < pkgs.length; i++) {
    const b = pkgs[i];
    ctx.font = '400 13px ' + FONT;
    ctx.fillText(b.state === 'delivered' ? '✅' : (b.state === 'broken' ? '💥' : '📦'), dx0 + i * 24, top + 33);
  }
  /* slow-mo vignette */
  if (g.slowT > 0) {
    const a = clamp(g.slowT * 2, 0, 0.5);
    const vg = ctx.createRadialGradient(W / 2, view.H / 2, view.H * 0.25, W / 2, view.H / 2, view.H * 0.75);
    vg.addColorStop(0, 'rgba(80,140,255,0)');
    vg.addColorStop(1, 'rgba(60,90,220,' + a * 0.5 + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, view.H);
    ctx.font = '900 13px ' + FONT;
    ctx.fillStyle = 'rgba(190,215,255,' + (0.4 + 0.3 * Math.sin(t * 10)) + ')';
    ctx.fillText('S L O W - M O', W / 2, view.H - 46);
  }
  /* intro banner + hint */
  if (g.introT > 0) {
    const k = 1 - g.introT / 1.5;
    const a = k < 0.85 ? clamp(k / 0.12, 0, 1) : clamp((1 - k) / 0.15, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '900 ' + clamp(W * 0.09, 30, 46) + 'px ' + FONT;
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(30,15,25,0.8)';
    ctx.strokeText(g.def.item + ' ' + g.def.name, W / 2, view.H * 0.3);
    const tg = ctx.createLinearGradient(0, view.H * 0.3 - 24, 0, view.H * 0.3 + 24);
    tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, '#ffca7a');
    ctx.fillStyle = tg;
    ctx.fillText(g.def.item + ' ' + g.def.name, W / 2, view.H * 0.3);
    ctx.restore();
  }
  if (g.simT < 5 && g.def.hint) {
    ctx.globalAlpha = g.simT < 4.4 ? 1 : (5 - g.simT) / 0.6;
    ctx.font = '700 ' + clamp(W * 0.035, 13, 16) + 'px ' + FONT;
    ctx.fillStyle = '#ffe0b8';
    ctx.fillText(g.def.hint, W / 2, view.H * 0.3 + 40);
    ctx.globalAlpha = 1;
  }
}

function drawPlay(dt, t) {
  const g = game;
  drawBackground(g.level, t);
  let sx = 0, sy = 0;
  if (shakeT > 0) {
    shakeT -= dt;
    const m = shakeMag * clamp(shakeT / 0.3, 0, 1);
    sx = rnd(-m, m); sy = rnd(-m, m);
    if (shakeT <= 0) shakeMag = 0;
  }
  ctx.save();
  ctx.translate(view.ox + sx, view.oy + sy);
  ctx.scale(view.s, view.s);
  for (const f of g.fans) f.ph += dt;
  drawWarehouse(g.level, t);
  drawStatics(g);
  drawTruck(g, t);
  drawRopes(g, t);
  drawBalloons(g, t);
  for (let i = 0; i < g.bodies.length; i++) drawBody(g, g.bodies[i], i, t);
  if (g.blade.active) drawBlade(g);
  for (const p of g.blade.trail) p.t += dt;
  if (!g.blade.active && g.blade.trail.length) g.blade.trail.shift();
  updateDrawParts(dt);
  updateDrawPops(dt);
  ctx.restore();
  drawHUD(g, t);
}

/* ---------- title screen: courier office + shelf of curiosities ---------- */
function drawTitle(dt, t) {
  const W = view.W, H = view.H;
  titleT += dt;
  drawBackground(store.best + 1, t);
  /* faint warehouse flavor */
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 2;
  for (let x = 30; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }

  /* logo */
  const bounce = 1 + Math.sin(titleT * 2.4) * 0.03;
  const entry = easeOutBack(clamp(titleT / 0.7, 0, 1));
  ctx.save();
  ctx.translate(W / 2, H * 0.11);
  ctx.scale(bounce * entry, bounce * entry);
  ctx.rotate(Math.sin(titleT * 1.7) * 0.02);
  const ls = clamp(W * 0.105, 32, 64);
  ctx.font = '900 ' + ls + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = ls * 0.22; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(40,18,26,0.9)';
  ctx.strokeText('CUT LOOSE', 0, 0);
  const lg = ctx.createLinearGradient(0, -ls * 0.6, 0, ls * 0.6);
  lg.addColorStop(0, '#ffffff'); lg.addColorStop(0.55, '#ffd18a'); lg.addColorStop(1, '#ef8d4e');
  ctx.fillStyle = lg;
  ctx.fillText('CUT LOOSE', 0, 0);
  ctx.font = '400 ' + ls * 0.6 + 'px ' + FONT;
  ctx.fillText('✂️', ls * 3.1, -ls * 0.3);
  ctx.restore();
  ctx.font = '700 ' + clamp(W * 0.032, 12, 15) + 'px ' + FONT;
  ctx.fillStyle = 'rgba(255,224,184,0.8)';
  ctx.fillText('one snip — physics does the rest', W / 2, H * 0.11 + ls * 0.85);

  /* play button */
  const nextLv = store.best + 1;
  const bw = clamp(W * 0.5, 190, 250), bh = 56;
  const bx = W / 2 - bw / 2, by = H * 0.205;
  uiRects.play = { x: bx - 8, y: by - 8, w: bw + 16, h: bh + 16 };
  const bp = 1 + Math.sin(titleT * 4) * 0.03;
  ctx.save();
  ctx.translate(W / 2, by + bh / 2); ctx.scale(bp, bp); ctx.translate(-W / 2, -(by + bh / 2));
  ctx.fillStyle = '#e0563e';
  roundRect(bx, by, bw, bh, 28); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  roundRect(bx, by, bw, bh / 2, 28); ctx.fill();
  ctx.font = '900 21px ' + FONT;
  ctx.fillStyle = '#fff';
  ctx.fillText('▶ PLAY  LEVEL ' + nextLv, W / 2, by + bh / 2 + 1);
  ctx.restore();

  /* coins + best */
  ctx.font = '700 15px ' + FONT;
  ctx.fillStyle = '#ffd166';
  ctx.fillText('🪙 ' + store.coins + (store.best > 0 ? '   ·   best level ' + store.best : ''), W / 2, H * 0.205 + 80);

  drawShelf(W, H, t);
  drawShop(W, H, t);

  /* shelf/shop message */
  if (shelfMsgT > 0) {
    shelfMsgT -= dt;
    ctx.font = '700 ' + clamp(W * 0.032, 12, 15) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(255,236,200,' + clamp(shelfMsgT, 0, 1) + ')';
    const msg = shelfMsg || '';
    ctx.fillText(msg.length > 52 ? msg.slice(0, 52) + '…' : msg, W / 2, H * 0.60);
    if (msg.length > 52) ctx.fillText(msg.slice(52), W / 2, H * 0.60 + 18);
  }
  drawMuteBtn(W - 30, 30);
}

function drawShelf(W, H, t) {
  const collected = store.col.filter(Boolean).length;
  const sy0 = H * 0.315;
  ctx.font = '800 ' + clamp(W * 0.034, 13, 16) + 'px ' + FONT;
  ctx.fillStyle = '#e8c890';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('— SHELF OF CURIOSITIES  ' + collected + '/12 —', W / 2, sy0 - 14);
  const cols = 6, rows = 2;
  const cw = Math.min(58, (W - 40) / cols);
  const gx0 = W / 2 - cols * cw / 2;
  for (let r = 0; r < rows; r++) {
    /* wooden plank */
    const py = sy0 + r * (cw + 26) + cw;
    ctx.fillStyle = '#7a5533';
    roundRect(gx0 - 10, py, cols * cw + 20, 8, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRect(gx0 - 10, py, cols * cw + 20, 3, 2); ctx.fill();
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      const x = gx0 + c * cw, y = sy0 + r * (cw + 26);
      uiRects['shelf' + i] = { x: x - 2, y: y - 4, w: cw + 4, h: cw + 12 };
      const got = !!store.col[i];
      ctx.font = '400 ' + Math.round(cw * 0.62) + 'px ' + FONT;
      if (got) {
        const bob = Math.sin(t * 2 + i) * 2;
        ctx.fillText(LEVELS[i].item, x + cw / 2, y + cw / 2 + bob);
      } else {
        ctx.globalAlpha = 0.28;
        ctx.fillText('❔', x + cw / 2, y + cw / 2);
        ctx.globalAlpha = 1;
      }
    }
  }
}

function drawShop(W, H, t) {
  const sy0 = H * 0.635;
  ctx.font = '800 ' + clamp(W * 0.034, 13, 16) + 'px ' + FONT;
  ctx.fillStyle = '#e8c890';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('— DEPOT UPGRADES —', W / 2, sy0 - 4);
  const cw = clamp(W * 0.22, 78, 100), ch = clamp(H * 0.115, 74, 92);
  const gap = 8;
  const totW = 4 * cw + 3 * gap;
  let gx0 = W / 2 - totW / 2, rows1 = true;
  if (totW > W - 12) { rows1 = false; gx0 = W / 2 - (2 * cw + gap) / 2; }
  for (let i = 0; i < 4; i++) {
    const u = UPGRADES[i];
    const owned = !!store.up[u.key];
    const afford = store.coins >= u.cost;
    const x = rows1 ? gx0 + i * (cw + gap) : gx0 + (i % 2) * (cw + gap);
    const y = rows1 ? sy0 + 12 : sy0 + 12 + Math.floor(i / 2) * (ch + gap);
    uiRects['shop' + i] = { x, y, w: cw, h: ch };
    ctx.fillStyle = owned ? 'rgba(70,120,80,0.5)' : 'rgba(60,38,48,0.72)';
    roundRect(x, y, cw, ch, 12); ctx.fill();
    ctx.strokeStyle = owned ? 'rgba(140,230,160,0.6)' : (afford ? 'rgba(255,209,102,0.55)' : 'rgba(160,130,140,0.35)');
    ctx.lineWidth = 2;
    roundRect(x, y, cw, ch, 12); ctx.stroke();
    ctx.font = '400 24px ' + FONT;
    ctx.fillText(u.icon, x + cw / 2, y + ch * 0.26);
    ctx.font = '800 ' + clamp(cw * 0.115, 9, 11) + 'px ' + FONT;
    ctx.fillStyle = '#ffe9c8';
    ctx.fillText(u.name, x + cw / 2, y + ch * 0.55);
    ctx.font = '800 12px ' + FONT;
    ctx.fillStyle = owned ? '#8fe6a0' : (afford ? '#ffd166' : '#a08a92');
    ctx.fillText(owned ? '✓ OWNED' : '🪙 ' + u.cost, x + cw / 2, y + ch * 0.8);
  }
}

/* ---------- win / lose screens ---------- */
function drawEndScreen(dt, t, isWin) {
  const W = view.W, H = view.H;
  titleT += dt;
  drawBackground(game.level, t);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.s, view.s);
  drawWarehouse(game.level, t);
  drawStatics(game);
  drawTruck(game, t);
  for (let i = 0; i < game.bodies.length; i++) drawBody(game, game.bodies[i], i, t);
  ctx.restore();

  ctx.fillStyle = 'rgba(20,8,16,0.62)';
  ctx.fillRect(0, 0, W, H);

  const pw = clamp(W * 0.82, 260, 420), ph = clamp(H * 0.52, 310, 400);
  const px2 = W / 2 - pw / 2, py2 = H / 2 - ph / 2;
  const entry = easeOutBack(clamp(titleT / 0.5, 0, 1));
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(entry, entry); ctx.translate(-W / 2, -H / 2);
  ctx.fillStyle = 'rgba(52,30,40,0.94)';
  roundRect(px2, py2, pw, ph, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,205,150,0.45)'; ctx.lineWidth = 2;
  roundRect(px2, py2, pw, ph, 22); ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + clamp(W * 0.07, 26, 38) + 'px ' + FONT;
  const tg2 = ctx.createLinearGradient(0, py2 + 20, 0, py2 + 70);
  tg2.addColorStop(0, '#ffffff');
  tg2.addColorStop(1, isWin ? '#ffd18a' : '#ffb0a0');
  ctx.fillStyle = tg2;
  ctx.fillText(isWin ? 'DELIVERED!' : 'OOPS!', W / 2, py2 + 48);

  if (isWin) {
    for (let i = 0; i < 3; i++) {
      const sx = W / 2 + (i - 1) * 58;
      const sy = py2 + 102 + (i === 1 ? -8 : 0);
      const sd = clamp((titleT - 0.4 - i * 0.25) / 0.3, 0, 1);
      const ss = easeOutBack(sd) * (i === 1 ? 1.25 : 1);
      ctx.save();
      ctx.translate(sx, sy); ctx.scale(ss, ss);
      ctx.font = '400 42px ' + FONT;
      ctx.globalAlpha = i < winInfo.stars ? 1 : 0.22;
      ctx.fillText(i < winInfo.stars ? '⭐' : '☆', 0, 0);
      ctx.restore();
      if (i < winInfo.stars && sd > 0 && sd < 0.15) sfx.tap();
    }
    /* coin count-up */
    const cc = Math.round(winInfo.coins * clamp((titleT - 0.8) / 0.9, 0, 1));
    ctx.font = '900 22px ' + FONT;
    ctx.fillStyle = '#ffd166';
    ctx.fillText('+' + cc + ' 🪙', W / 2, py2 + 152);
    if (winInfo.newItem) {
      const np = 1 + Math.sin(titleT * 6) * 0.05;
      ctx.save();
      ctx.translate(W / 2, py2 + 190); ctx.scale(np, np);
      ctx.font = '800 15px ' + FONT;
      ctx.fillStyle = '#8fe6a0';
      ctx.fillText('🎉 NEW SHELF ITEM: ' + winInfo.newItem.icon + ' ' + winInfo.newItem.name + '!', 0, 0);
      ctx.restore();
    }
  } else {
    ctx.font = '400 50px ' + FONT;
    ctx.fillText('📦💔', W / 2, py2 + 104);
    ctx.font = '700 ' + clamp(W * 0.038, 14, 17) + 'px ' + FONT;
    ctx.fillStyle = '#ffcfc2';
    ctx.fillText(game.failMsg || 'The package broke!', W / 2, py2 + 152);
    ctx.font = '700 13px ' + FONT;
    ctx.fillStyle = 'rgba(255,224,184,0.7)';
    ctx.fillText('Retries are free — no package left behind!', W / 2, py2 + 178);
  }

  /* main button */
  const bw = 190, bh = 52;
  const bx = W / 2 - bw / 2, by = py2 + ph - 82;
  const bp = 1 + Math.sin(titleT * 4) * 0.03;
  ctx.save();
  ctx.translate(W / 2, by + bh / 2); ctx.scale(bp, bp); ctx.translate(-W / 2, -(by + bh / 2));
  ctx.fillStyle = isWin ? '#3fae6c' : '#e0563e';
  roundRect(bx, by, bw, bh, 26); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  roundRect(bx, by, bw, bh / 2, 26); ctx.fill();
  ctx.font = '900 20px ' + FONT;
  ctx.fillStyle = '#fff';
  ctx.fillText(isWin ? 'NEXT LEVEL ▶' : '↻ RETRY', W / 2, by + bh / 2 + 1);
  ctx.restore();

  /* home */
  const hw = 130, hh = 44;
  uiRects.home = { x: W / 2 - hw / 2, y: py2 + ph - 30, w: hw, h: hh };
  ctx.font = '700 14px ' + FONT;
  ctx.fillStyle = 'rgba(255,224,184,0.8)';
  ctx.fillText('🏠 depot', W / 2, py2 + ph - 12);

  ctx.restore();
  updateDrawParts(dt);
  drawMuteBtn(W - 30, 30);
}

/* ============================================================
   MAIN LOOP — re-arms in finally, 3-error cap on logging
   ============================================================ */
let last = performance.now();
let elapsed = 0;
let frameErrs = 0;
function frame(now) {
  try { frameBody(now); }
  catch (e) { if (++frameErrs <= 3 && window.console) console.error('[cutloose] frame error:', e); }
  finally { requestAnimationFrame(frame); }
}
function frameBody(now) {
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  elapsed += dt;
  ctx.clearRect(0, 0, view.W, view.H);
  if (scene === 'play' && game) {
    updateGame(dt);
    drawPlay(dt, elapsed);
  } else if (scene === 'title') {
    drawTitle(dt, elapsed);
    updateDrawParts(dt);
  } else if ((scene === 'win' || scene === 'lose') && game) {
    drawEndScreen(dt, elapsed, scene === 'win');
    updateDrawPops(dt);
  }
}

resize();
setScene('title');
requestAnimationFrame(frame);

/* ---------- headless test hook (used by the verification harness) ---------- */
window.__cutloose__ = {
  start(lv) { game = buildLevel(lv); scene = 'play'; return game; },
  step(dt) { updateGame(dt); },
  cut(ri, frac) { if (game) simCut(game, ri, frac); },
  game: () => game,
  scene: () => scene,
  setScene,
  levelDef, LEVELS,
  world: { WW, WH, FLOOR, STEP, MAXD },
  errs: () => frameErrs
};
</script>
</body>
</html>
