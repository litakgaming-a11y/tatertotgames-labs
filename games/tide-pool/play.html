<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tide Pool | TaterTot Games</title>
<meta name="theme-color" content="#1d4f6b">
<link rel="icon" href="data:,">
<script src="/analytics.js" defer></script>
<style>
  :root {
    --page: #fafcfb; --page2: #eef4f4; --wash: #d9eaf0; --rule: #c6d8dc; --ink: #173a5e; --ink2: #3d5f7c; --faint: #7f97a8;
    --coral: #e8553f; --coral-btn: #c8402c; --kelp: #3f7a52; --sea: #1d4f6b;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --latin: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, serif;
    --dots: radial-gradient(circle, rgba(23, 58, 94, .16) 1px, transparent 1.4px) 0 0 / 6px 6px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #d8c7a0; touch-action: none; overscroll-behavior: none; position: fixed; inset: 0; }
  body { font-family: var(--sans); color: var(--ink); font-size: 14px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  ::selection { background: var(--coral); color: #fff; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums lining-nums; }
  i.lat { font-family: var(--latin); font-style: italic; color: var(--ink2); }

  .btn { min-height: 44px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 22px; font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--page); color: var(--ink); transition: background-color .12s ease-out, transform .12s ease-out; }
  .btn:hover:not(:disabled) { background: #fff; }
  .btn:active:not(:disabled) { background: var(--ink); color: var(--page); transform: translateY(1px); }
  .btn:disabled { color: var(--faint); border-color: var(--rule); background: var(--dots), var(--page2); cursor: default; }
  .btn.go { background: var(--coral-btn); border-color: var(--coral-btn); color: #fff; }
  .btn.go:hover:not(:disabled) { background: #b53824; }
  .btn.go:active:not(:disabled) { background: #93301f; border-color: #93301f; }
  .btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }

  /* ---------- journal ---------- */
  #deck { position: fixed; display: none; flex-direction: column; background: var(--page); z-index: 3; }
  body.port #deck { left: 0; right: 0; bottom: 0; border-top: 2px solid var(--ink); }
  body.land #deck { top: 0; right: 0; bottom: 0; border-left: 2px solid var(--ink); }
  #tideWrap { flex: 0 0 auto; padding: 8px 14px 6px; border-bottom: 1px solid var(--rule); background: var(--page2); }
  #tideCv { width: 100%; height: 52px; display: block; }
  #tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--rule); }
  .tab { min-height: 42px; font-size: 13.5px; font-weight: 600; color: var(--faint); position: relative; }
  .tab.on { color: var(--ink); }
  .tab.on::after { content: ""; position: absolute; left: 24%; right: 24%; bottom: -1px; height: 3px; border-radius: 3px; background: var(--coral); }
  .tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); margin-left: 5px; vertical-align: 2px; }
  #jbody { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding-bottom: 14px; }
  .scroll::-webkit-scrollbar { width: 6px; } .scroll::-webkit-scrollbar-thumb { background: #b8ccd3; border-radius: 3px; }
  .scroll { scrollbar-width: thin; scrollbar-color: #b8ccd3 transparent; }
  .note { padding: 10px 14px 4px; font-size: 13px; color: var(--ink2); }
  .note b { color: var(--ink); }

  .res { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 7px 14px; width: 100%; text-align: left; min-height: 52px; }
  .res + .res { border-top: 1px solid #e3ecee; }
  .res.sel { background: var(--wash); }
  .res canvas { width: 44px; height: 44px; display: block; }
  .res .nm { font-weight: 700; font-size: 14px; }
  .res .why { font-size: 12.5px; color: var(--ink2); }
  .mood { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 11px; white-space: nowrap; }
  .mood.happy { background: #dcefe1; color: #235c36; }
  .mood.ok { background: #eef0da; color: #5b5a1d; }
  .mood.sad { background: #f8dfd9; color: #9a2f1f; }
  .card { margin: 10px 14px 6px; padding: 12px 14px; border-radius: 14px; background: var(--wash); }
  .card h3 { font-size: 16px; font-weight: 800; }
  .card .facts { margin-top: 8px; display: grid; gap: 4px; font-size: 13px; }
  .card .facts div { display: grid; grid-template-columns: 18px 1fr; gap: 6px; align-items: start; }
  .card .facts .tick { width: 14px; height: 14px; margin-top: 3px; border-radius: 50%; border: 1.5px solid var(--ink2); }
  .card .facts .tick.on { background: var(--kelp); border-color: var(--kelp); }
  .card .needs { margin-top: 8px; font-size: 12.5px; color: var(--ink2); }
  .card .act { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

  .guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; padding: 8px 12px; }
  .ge { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; font-size: 11.5px; text-align: center; line-height: 1.2; min-height: 96px; }
  .ge canvas { width: 56px; height: 56px; }
  .ge.sel { background: var(--wash); }
  .ge .pips { display: flex; gap: 3px; margin-top: 2px; }
  .ge .pips i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--ink2); display: block; }
  .ge .pips i.on { background: var(--kelp); border-color: var(--kelp); }
  .ge.ghost { color: var(--faint); }

  .shop { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 8px 14px; }
  .shop + .shop { border-top: 1px solid #e3ecee; }
  .shop canvas { width: 58px; height: 46px; }
  .shop h4 { font-size: 14px; font-weight: 700; }
  .shop p { font-size: 12.5px; color: var(--ink2); }
  .buy { flex-direction: column; gap: 0; line-height: 1.15; min-width: 84px; padding: 4px 12px; }
  .buy small { font-size: 11.5px; font-weight: 600; }
  .cove { margin: 10px 14px 0; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .cove.here { border-color: var(--ink); background: var(--wash); }
  .cove.locked { background: var(--dots), var(--page2); }
  .cove h4 { font-size: 15px; font-weight: 800; }
  .cove p { font-size: 12.5px; color: var(--ink2); }

  #muteBtn { position: fixed; width: 42px; height: 42px; display: none; align-items: center; justify-content: center; z-index: 4;
    background: rgba(250, 252, 251, .92); border: 1.5px solid var(--ink); border-radius: 21px; color: var(--ink); }
  #muteBtn svg { width: 20px; height: 20px; }
  #muteBtn:active { background: var(--ink); color: var(--page); }
  #toast { position: fixed; top: auto; display: none; z-index: 4; pointer-events: none; background: rgba(250, 252, 251, .95); color: var(--ink); border: 1.5px solid var(--ink);
    border-radius: 18px; padding: 6px 14px; font-size: 13px; font-weight: 600; max-width: min(92vw, 460px); text-align: center; transform: translateX(-50%); }
  #placeBar { position: fixed; display: none; z-index: 4; gap: 8px; align-items: center; background: rgba(250, 252, 251, .96); border: 1.5px solid var(--ink); border-radius: 26px; padding: 6px 6px 6px 14px; transform: translateX(-50%); font-size: 13px; font-weight: 600; }

  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; background: rgba(15, 42, 60, .5); padding: 14px; }
  .screen.show { display: flex; }
  .panel { width: min(460px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--page); border: 2px solid var(--ink); border-radius: 18px; padding: 20px; touch-action: pan-y; }
  #title { background: linear-gradient(180deg, rgba(250, 252, 251, .9) 0%, rgba(250, 252, 251, .45) 32%, rgba(250, 252, 251, 0) 50%, rgba(250, 252, 251, 0) 70%, rgba(250, 252, 251, .88) 100%);
    flex-direction: column; justify-content: space-between; text-align: center; padding: max(8vh, 26px) 16px 18px; }
  #title h1 { font-size: clamp(40px, min(12vw, 13vh), 92px); font-weight: 800; letter-spacing: .02em; line-height: .95; color: var(--ink); }
  #title h1 span { color: var(--coral); }
  #title .tag { margin-top: 12px; font-size: clamp(14px, 3.6vw, 17px); color: var(--ink); font-weight: 600; }
  #title .go { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #title .btn.go { min-height: 52px; padding: 0 30px; font-size: 17px; }
  #title .stat { font-size: 13px; color: var(--ink); font-weight: 600; }
  #badge { color: var(--ink); font-size: 13px; font-weight: 600; text-decoration: none; border-bottom: 1.5px solid var(--coral); padding: 6px 2px 2px; }
  #away .panel { text-align: center; }
  #away h2 { font-size: 20px; font-weight: 800; }
  #away .lede { color: var(--ink2); font-size: 14px; margin-top: 8px; }
  #away .act { margin-top: 16px; display: flex; justify-content: center; }
  body.land #title { align-items: flex-start; text-align: left; padding: max(9vh, 22px) 6vw max(7vh, 18px);
    background: linear-gradient(90deg, rgba(250, 252, 251, .94) 0%, rgba(250, 252, 251, .8) 30%, rgba(250, 252, 251, 0) 46%); }
  body.land #title .go { align-items: flex-start; }
  body.land #title > div { max-width: 32vw; }
  @media (max-height: 520px) { #tideCv { height: 40px; } #tideWrap { padding: 5px 12px 4px; } .tab { min-height: 36px; } .res { min-height: 44px; padding: 4px 12px; } .res canvas { width: 36px; height: 36px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="port">
<canvas id="view"></canvas>
<button id="muteBtn" aria-label="Sound on or off">
  <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
  <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" style="display:none"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>
<div id="toast"></div>
<div id="placeBar"><span id="placeText">Tap the pool to set it down</span><button class="btn sm" id="placeCancel">Cancel</button></div>

<div id="deck">
  <div id="tideWrap"><canvas id="tideCv" aria-label="Tide clock"></canvas></div>
  <nav id="tabs">
    <button class="tab on" data-tab="pool">Pool</button>
    <button class="tab" data-tab="guide">Guide</button>
    <button class="tab" data-tab="stones">Stones</button>
    <button class="tab" data-tab="coves">Coves</button>
  </nav>
  <div id="jbody" class="scroll"></div>
</div>

<div id="title" class="screen show">
  <div>
    <h1>Tide<br><span>Pool</span></h1>
    <p class="tag">Make a home. The sea brings the visitors.</p>
  </div>
  <div class="go">
    <button class="btn go" id="playBtn">Go down to the shore</button>
    <div class="stat num" id="titleStat"></div>
    <a id="badge" href="https://tatertotgames.com">tatertotgames.com</a>
  </div>
</div>

<div id="away" class="screen">
  <div class="panel">
    <h2>While you were away</h2>
    <p class="lede num" id="awayText"></p>
    <div class="act"><button class="btn go" id="awayBtn">Back to the pool</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;

/* ============================== species ============================== */
// home: where it lives. food: what it eats. prey: who it hunts. social: pair or group. rare: 1 common, 2 uncommon, 3 rare.
const SP = [
  { id: 'limpet',   n: 'Common limpet',    lat: 'Patella vulgata',        cove: 'cove',  home: 'surface', food: 'algae',    rare: 1, social: 'group', draw: 'limpet',  col: '#b99a6b', max: 5, fact: 'Clamped down tight as the water drained away.' },
  { id: 'winkle',   n: 'Periwinkle',       lat: 'Littorina littorea',     cove: 'cove', also: ['reef'],  home: 'pebble',  food: 'algae',    rare: 1, social: 'group', draw: 'snail',   col: '#5c5048', max: 5, fact: 'Grazed a clean trail across the rock.' },
  { id: 'beadlet',  n: 'Beadlet anemone',  lat: 'Actinia equina',         cove: 'cove',  home: 'surface', food: 'plankton', rare: 1, social: 'solo',  draw: 'anemone', col: '#c8322e', max: 4, fact: 'Opened its tentacles the moment the tide returned.' },
  { id: 'barnacle', n: 'Acorn barnacles',  lat: 'Semibalanus balanoides', cove: 'cove',  home: 'surface', food: 'plankton', rare: 1, social: 'group', draw: 'barnacle',col: '#d8d2c2', max: 5, fact: 'Kicked out their feathery legs to comb the water.' },
  { id: 'mussel',   n: 'Blue mussel',      lat: 'Mytilus edulis',         cove: 'cove', also: ['reef', 'deep'],  home: 'surface', food: 'plankton', rare: 1, social: 'group', draw: 'mussel',  col: '#26354f', max: 5, fact: 'Anchored itself with fine threads.' },
  { id: 'hermit',   n: 'Hermit crab',      lat: 'Pagurus bernhardus',     cove: 'cove', also: ['deep'],  home: 'shell',   food: 'detritus', rare: 1, social: 'solo',  draw: 'hermit',  col: '#d9713a', max: 3, fact: 'Tried on a bigger shell, then moved in.' },
  { id: 'prawn',    n: 'Common prawn',     lat: 'Palaemon serratus',      cove: 'cove', also: ['kelp', 'reef', 'deep'],  home: 'kelp',    food: 'detritus', rare: 1, social: 'group', draw: 'prawn',   col: '#e2b8a6', max: 4, fact: 'Hovered in the fronds, picking at scraps.' },
  { id: 'shore',    n: 'Shore crab',       lat: 'Carcinus maenas',        cove: 'cove', also: ['deep'],  home: 'crevice', food: 'prey', prey: ['winkle', 'mussel', 'limpet'], rare: 2, social: 'solo', draw: 'crab', col: '#4f6b36', max: 3, fact: 'Cracked open a shell with one claw.' },
  { id: 'blenny',   n: 'Shanny',           lat: 'Lipophrys pholis',       cove: 'cove', also: ['reef'],  home: 'pebble',  food: 'prey', prey: ['barnacle', 'prawn'], rare: 2, social: 'solo', draw: 'fish', col: '#7d6b3f', max: 3, fact: 'Propped itself up on its fins to look around.' },
  { id: 'starfish', n: 'Common starfish',  lat: 'Asterias rubens',        cove: 'cove',  home: 'surface', food: 'prey', prey: ['mussel', 'barnacle'], rare: 2, social: 'solo', draw: 'star', col: '#e07a2f', max: 2, fact: 'Pulled a mussel open, very slowly.' },
  { id: 'dogwhelk', n: 'Dog whelk',        lat: 'Nucella lapillus',       cove: 'cove',  home: 'surface', food: 'prey', prey: ['barnacle', 'mussel'], rare: 2, social: 'group', draw: 'topshell', col: '#c9b27a', max: 3, fact: 'Drilled a neat hole through a barnacle.' },
  { id: 'chiton',   n: 'Grey chiton',      lat: 'Lepidochitona cinerea',  cove: 'cove',  home: 'surface', food: 'algae',    rare: 1, social: 'group', draw: 'chiton',  col: '#8b8578', max: 4, fact: 'Rolled into a ball when it was lifted.' },
  { id: 'urchin',   n: 'Purple sea urchin',lat: 'Paracentrotus lividus',  cove: 'kelp', also: ['deep'],  home: 'crevice', food: 'kelp',     rare: 1, social: 'group', draw: 'urchin',  col: '#6b3f7a', max: 4, fact: 'Wedged itself into a hollow it had worn itself.' },
  { id: 'snakelock',n: 'Snakelocks anemone',lat: 'Anemonia viridis',      cove: 'kelp',  home: 'surface', food: 'plankton', rare: 1, social: 'solo',  draw: 'snakelock',col: '#6fa35a', max: 4, fact: 'Waved purple-tipped tentacles in the light.' },
  { id: 'goby',     n: 'Rock goby',        lat: 'Gobius paganellus',      cove: 'kelp', also: ['reef', 'deep'],  home: 'pebble',  food: 'prey', prey: ['prawn'], rare: 1, social: 'pair', draw: 'fish', col: '#8a6e4c', max: 3, fact: 'Guarded a clutch of eggs under a stone.' },
  { id: 'seahare',  n: 'Sea hare',         lat: 'Aplysia punctata',       cove: 'kelp',  home: 'kelp',    food: 'kelp',     rare: 2, social: 'pair',  draw: 'seahare', col: '#8a3d52', max: 3, fact: 'Let out a cloud of purple ink.' },
  { id: 'pipefish', n: 'Snake pipefish',   lat: 'Entelurus aequoreus',    cove: 'kelp',  home: 'eelgrass',food: 'plankton', rare: 2, social: 'solo',  draw: 'pipefish',col: '#9b8a4a', max: 3, fact: 'Hung straight up among the eelgrass, invisible.' },
  { id: 'topshell', n: 'Painted top shell',lat: 'Calliostoma zizyphinum', cove: 'kelp', also: ['reef'],  home: 'surface', food: 'algae',    rare: 1, social: 'group', draw: 'topshell',col: '#d39a8a', max: 4, fact: 'Climbed to the top of a rock to graze.' },
  { id: 'kelpcrab', n: 'Spiny spider crab',lat: 'Maja brachydactyla',     cove: 'kelp',  home: 'kelp',    food: 'kelp',     rare: 2, social: 'solo',  draw: 'spider',  col: '#b0574a', max: 2, fact: 'Decorated its shell with bits of weed.' },
  { id: 'sandgoby', n: 'Sand goby',        lat: 'Pomatoschistus minutus', cove: 'kelp', also: ['deep'],  home: 'sand',    food: 'detritus', rare: 1, social: 'pair',  draw: 'fish',    col: '#cdb88a', max: 3, fact: 'Vanished into the sand with a flick.' },
  { id: 'bluerayed',n: 'Blue-rayed limpet',lat: 'Patella pellucida',      cove: 'kelp',  home: 'kelp',    food: 'kelp',     rare: 2, social: 'group', draw: 'bluelimpet', col: '#6b5a3a', max: 3, fact: 'Its blue lines flashed as the light moved.' },
  { id: 'wrasse',   n: 'Corkwing wrasse',  lat: 'Symphodus melops',       cove: 'kelp',  home: 'kelp',    food: 'prey', prey: ['prawn', 'sandgoby'], rare: 2, social: 'pair', draw: 'fish', col: '#5f8a4a', max: 2, fact: 'Built a nest of weed and guarded it.' },
  { id: 'lumpsucker',n: 'Lumpsucker',      lat: 'Cyclopterus lumpus',     cove: 'kelp',  home: 'surface', food: 'prey', prey: ['prawn'], rare: 3, spring: true, social: 'solo', draw: 'lump', col: '#6f8a5a', max: 1, fact: 'Stuck itself to a rock with its belly and sat there.' },
  { id: 'cushion',  n: 'Cushion star',     lat: 'Asterina gibbosa',       cove: 'reef',  home: 'crevice', food: 'detritus', rare: 1, social: 'group', draw: 'cushion', col: '#c7a13a', max: 4, fact: 'Turned its stomach out over a scrap of food.' },
  { id: 'brittle',  n: 'Common brittle star', lat: 'Ophiothrix fragilis', cove: 'reef',  home: 'crevice', food: 'plankton', rare: 1, social: 'group', draw: 'brittle', col: '#a14a78', max: 4, fact: 'Held two arms up into the current to feed.' },
  { id: 'sealemon', n: 'Sea lemon',        lat: 'Doris pseudoargus',      cove: 'reef',  home: 'surface', food: 'algae',    rare: 2, social: 'pair',  draw: 'slug',    col: '#e0b84a', max: 3, fact: 'Laid a pale ribbon of eggs.' },
  { id: 'dahlia',   n: 'Dahlia anemone',   lat: 'Urticina felina',        cove: 'reef',  home: 'surface', food: 'plankton', rare: 2, social: 'solo',  draw: 'anemone', col: '#d8495f', max: 3, fact: 'Caught a shrimp and folded it in.' },
  { id: 'velvet',   n: 'Velvet swimming crab', lat: 'Necora puber',       cove: 'reef',  home: 'crevice', food: 'prey', prey: ['winkle', 'mussel', 'topshell'], rare: 2, social: 'solo', draw: 'crab', col: '#3d4a73', max: 2, fact: 'Raised its claws and stood its ground.' },

      e.addEventListener('click', () => { guideSel = guideSel === s.id ? null : s.id; sfxTap(); buildJournal(); });
      grid.appendChild(e);
    });
    jb.appendChild(grid);
  });
}
function pieceCost(type) { const c = pool(); const owned = c.pieces.filter(p => p.type === type).length; return Math.round(PIECES[type].cost * Math.pow(1.5, owned)); }
function buildStonesTab() {
  window.TTG?.track('shop_open');
  jb.appendChild(el('div', 'note num', '<b>' + S.shells + '</b> shells. Buy a piece, then tap the pool to set it down. Drag pieces in the pool to move them.'));
  PIECE_ORDER.forEach(type => {
    const p = PIECES[type], row = el('div', 'shop'), cost = pieceCost(type);
    const c = document.createElement('canvas'); c.width = 58 * DPR; c.height = 46 * DPR; const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawPiece(g, type, 29, 23, 2.2, 0, 7); row.appendChild(c);
    row.appendChild(el('div', '', '<h4>' + p.n + '</h4><p>' + p.t + '</p>'));
    const b = el('button', 'btn buy num', 'Buy<small>' + cost + ' shells</small>'); b.disabled = S.shells < cost;
    b.addEventListener('click', () => { if (S.shells < cost) return; startPlacing(type); });
    row.appendChild(b); jb.appendChild(row);
  });
  const c = pool();
  const row = el('div', 'shop');
  row.appendChild(el('span', '', ''));
  if (c.size < SIZE_COST.length) {
    row.appendChild(el('div', '', '<h4>Widen the pool</h4><p>Room for more stones and more residents.</p>'));
    const b = el('button', 'btn buy num', 'Dig<small>' + SIZE_COST[c.size] + ' shells</small>'); b.disabled = S.shells < SIZE_COST[c.size];
    b.addEventListener('click', () => { const cost = SIZE_COST[c.size]; if (S.shells < cost) return; S.shells -= cost; c.size++; shape = null; bgDirty = true; buildBg(); keepInside(); syncBodies(); sfxPlace(); window.TTG?.track('purchase', { level: c.size, value: cost }); persist(); buildJournal(); });
    row.appendChild(b);
  } else row.appendChild(el('div', '', '<h4>The pool is as wide as it gets</h4><p>Every rock you can move, you have moved.</p>'));
  jb.appendChild(row);
}
function buildCovesTab() {
  const f = foundCount();
  jb.appendChild(el('div', 'note num', 'Each cove has its own pool and its own creatures. Finding more species opens the next one. <b>' + f + '</b> found so far.'));
  COVE_ORDER.forEach(id => {
    const cv2 = COVES[id], open = f >= cv2.need || S.coves[id], here = S.cove === id;
    const box = el('div', 'cove' + (here ? ' here' : '') + (open ? '' : ' locked'));
    box.innerHTML = '<div><h4>' + cv2.n + '</h4><p>' + cv2.t + '</p>' + (open ? '' : '<p class="num"><b>Opens at ' + cv2.need + ' species found.</b></p>') + '</div>';
    const b = el('button', 'btn sm', here ? 'Here' : open ? 'Go' : 'Locked'); b.disabled = here || !open;
    b.addEventListener('click', () => goCove(id));
    box.appendChild(b); jb.appendChild(box);
  });
}
function goCove(id) {
  if (!S.coves[id]) { S.coves[id] = freshCove(id); window.TTG?.track('village_levelup', { level: Object.keys(S.coves).length }); }
  S.cove = id; shape = null; bgDirty = true; finds = []; watch = null; selectedSp = null; bodies = []; buildBg(); syncBodies(); persist(); sfxArrive(); tab = 'pool'; buildJournal();
  toast('You walk round to ' + COVES[id].n + '.');
}
document.querySelectorAll('#tabs .tab').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; sfxTap(); buildJournal(); }));

/* ============================== placing and moving stones ============================== */
function canPlace(type, u, v, except) {
  const r = PIECES[type].r;
  if (!inPool(u, v, r * 0.55)) return false;
  for (const p of pool().pieces) { if (p === except) continue; if (Math.hypot(p.x - u, p.y - v) < (r + PIECES[p.type].r) * 0.72) return false; }
  return true;
}
function startPlacing(type) {
  placing = type; hover = null; $('placeBar').style.display = 'flex'; $('placeText').textContent = 'Tap the pool to set down the ' + PIECES[type].n.toLowerCase();
}
function stopPlacing() { placing = null; hover = null; $('placeBar').style.display = 'none'; }
$('placeCancel').addEventListener('click', () => { stopPlacing(); sfxTap(); });
function keepInside() { const c = pool(); c.pieces = c.pieces.filter(p => inPool(p.x, p.y, 2)); }
let downAt = null, grab = null;
cv.addEventListener('pointerdown', e => {
  audio(); if (AC && AC.state === 'suspended') AC.resume();
  if (mode !== 'play') return;
  const px = e.clientX, py = e.clientY; if (px > area.x + area.w || py > area.y + area.h) return;
  const u = toU(px), v = toV(py); downAt = [px, py];
  if (placing) { hover = [u, v]; return; }
  // watching: tap the creature with the eye over it
  if (watch) { const b = watch.b; if (Math.hypot(b.u - u, b.v - (v + 3)) < 7) { recordWatch(); downAt = null; return; } }
  // beach finds
  for (let n = finds.length - 1; n >= 0; n--) { const f = finds[n]; if (Math.hypot(f.u - u, f.v - v) < 4.5) { collect(n); downAt = null; return; } }
  // grab a stone to move it
  for (let n = pool().pieces.length - 1; n >= 0; n--) { const p = pool().pieces[n]; if (Math.hypot(p.x - u, p.y - v) < PIECES[p.type].r * 0.8) { grab = { p, ox: p.x - u, oy: p.y - v, x0: p.x, y0: p.y, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } return; } }
});
cv.addEventListener('pointermove', e => {
  if (mode !== 'play') return;
  const u = toU(e.clientX), v = toV(e.clientY);
  if (placing) { hover = [u, v]; return; }
  if (grab) { if (!grab.moved && downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) { grab.moved = true; dragging = grab.p; } if (grab.moved) { grab.p.x = u + grab.ox; grab.p.y = v + grab.oy; } }
});
cv.addEventListener('pointerup', e => {
  if (mode !== 'play') return;
  const u = toU(e.clientX), v = toV(e.clientY);
  if (placing) {
    if (canPlace(placing, u, v, null)) {
      const cost = pieceCost(placing); if (S.shells >= cost) {
        S.shells -= cost; pool().pieces.push({ type: placing, x: u, y: v }); sfxPlace();
        window.TTG?.track('upgrade_bought', { level: pool().pieces.length, value: cost });
        stopPlacing(); journalDirty = true; syncBodies(); persist();
        if (S.hints < 2) { S.hints = 2; toast('New visitors come in at high water. Watch the tide clock.'); }
      }
    } else toast('It will not fit there. Find open water inside the pool.');
    return;
  }
  if (grab) {
    if (grab.moved) { if (!canPlace(grab.p.type, grab.p.x, grab.p.y, grab.p)) { grab.p.x = grab.x0; grab.p.y = grab.y0; toast('No room there. The stone rolls back.'); } else sfxPlace(); journalDirty = true; syncBodies(); persist(); }
    else if (downAt) selectPieceTap(grab.p);
    grab = null; dragging = null; return;
  }
  // tap a creature to look at it
  if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 10) {
    let best = null, bd = 1e9;
    for (const b of bodies) { const d = Math.hypot(b.u - u, b.v - v); if (d < 5 && d < bd) { bd = d; best = b; } }
    if (best) { selectedSp = best.id; tab = 'pool'; sfxTap(); buildJournal(); }
  }
  downAt = null;
});
function selectPieceTap(p) { toast(PIECES[p.type].n + ': drag it to move it.'); }
function collect(n) {
  const f = finds.splice(n, 1)[0]; S.shells += f.kind.v;
  floats.push({ x: X(f.u), y: Y(f.v) - 10, text: '+' + f.kind.v + (f.kind.v > 5 ? ' sea glass' : ''), t: 0 });
  sfxShell(); journalDirty = true;
}
function recordWatch() {
  const b = watch.b, g = note(b.id); watch = null; watchNext = 9 + Math.random() * 8;
  if (!g.watched) { g.watched = 1; toast(SPBY[b.id].n + ': ' + SPBY[b.id].fact); S.shells += 4; floats.push({ x: X(b.u), y: Y(b.v) - 14, text: 'New note +4', t: 0 }); }
  else { S.shells += 2; floats.push({ x: X(b.u), y: Y(b.v) - 14, text: '+2', t: 0 }); }
  sfxWatch(); journalDirty = true; persist();
}
document.addEventListener('touchmove', e => {
  let n = e.target;
  while (n && n !== document.body) { if (n.scrollHeight > n.clientHeight + 1) { const oy = getComputedStyle(n).overflowY; if (oy === 'auto' || oy === 'scroll') return; } n = n.parentElement; }
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && placing) { stopPlacing(); } });
$('muteBtn').addEventListener('click', () => { audio(); setMuted(!S.muted); });

/* ============================== away ============================== */
function checkAway() {
  const el2 = (Date.now() - S.lastSeen) / 1000;
  if (!isFinite(el2) || el2 < 150) { S.lastSeen = Date.now(); return false; }
  const tides = Math.min(6, Math.floor(el2 / TIDE)); if (!tides) return false;
  const c = pool(), arrivals = [], lefts = []; let gifts = 0;
  for (let k = 0; k < tides; k++) {
    const ev = highWater(c); ev.forEach(e => { if (e.kind === 'arrive') arrivals.push(SPBY[e.who].n); if (e.kind === 'left') lefts.push(SPBY[e.who].n); });
    const r = lowWater(c, false); gifts += r.gift; S.tides++;
    S.t += TIDE;
  }
  syncBodies();
  $('awayText').textContent = 'The tide came in ' + tides + ' time' + (tides > 1 ? 's' : '') + '. ' + (arrivals.length ? 'New arrivals: ' + [...new Set(arrivals)].join(', ') + '. ' : 'Nobody new came in. ') + (lefts.length ? 'Left: ' + [...new Set(lefts)].join(', ') + '. ' : '') + (gifts ? 'Your residents left ' + gifts + ' shells.' : '');
  window.TTG?.track('offline_claim', { value: gifts });
  $('away').classList.add('show'); persist(); return true;
}
$('awayBtn').addEventListener('click', () => { $('away').classList.remove('show'); journalDirty = true; });

/* ============================== boot and loop ============================== */
$('playBtn').addEventListener('click', () => {
  audio(); if (AC && AC.state === 'suspended') AC.resume();
  const firstTime = !S.started; S.started = true;
  mode = 'play'; $('title').classList.remove('show'); $('deck').style.display = 'flex'; $('muteBtn').style.display = 'flex';
  layout(); buildBg(); syncBodies(); buildJournal();
  if (!checkAway() && firstTime) toast('High water brings visitors. Low water leaves shells on the sand.');
  persist();
});
let last = performance.now(), running = true, uiT = 0, saveT = 0;
function frame(nowMs) {
  if (!running) return;
  const dt = Math.min(0.05, Math.max(0, (nowMs - last) / 1000)); last = nowMs;
  const t = nowMs / 1000;
  if (mode === 'play' && !$('away').classList.contains('show')) {
    advance(dt);
    moveBodies(dt, t);
    if (!watch) { watchNext -= dt; if (watchNext <= 0 && bodies.length) { const pick = bodies.filter(b => !b.hiding); if (pick.length) watch = { b: pick[Math.floor(Math.random() * pick.length)], until: 5 }; watchNext = 3; } }
    else { watch.until -= dt; if (watch.until <= 0 || bodies.indexOf(watch.b) < 0) { watch = null; watchNext = 9 + Math.random() * 8; } }
    // finds wash away when the tide comes back
    if (tideState(S.t).level > 0.5 && finds.length) finds = [];
    if (surfGain) surfGain.gain.value = S.muted ? 0 : 0.05 + tideState(S.t).level * 0.12;
  } else if (mode === 'title') { moveBodies(dt, t); }
  draw(dt, t);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.display = 'none'; }
  uiT -= dt;
  if (mode === 'play' && uiT <= 0) { uiT = 0.5; drawTide(); if (journalDirty && !placing) buildJournal(); }
  saveT -= dt; if (saveT <= 0 && S.started && mode === 'play') { saveT = 10; persist(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; if (mode === 'play') persist(); if (AC && AC.state === 'running') AC.suspend(); }
  else {
    if (running) return; running = true; last = performance.now();
    if (AC && AC.state === 'suspended' && !S.muted) AC.resume();
    if (mode === 'play') { checkAway(); journalDirty = true; }
    requestAnimationFrame(frame);
  }
});
window.addEventListener('pagehide', () => { if (mode === 'play') persist(); });
window.addEventListener('resize', () => { layout(); });
// read-only view of the pool for automated checks, plus a fast-forward; only with ?debug in the address
if (/[?&]debug(&|=|$)/.test(location.search)) window.__tp = { state: () => ({ mode, t: S.t, shells: S.shells, cove: S.cove, pieces: pool().pieces.map(p => p.type), res: Object.keys(pool().res).map(id => id + ':' + pool().res[id].n), found: foundCount(), facts: factCount(), tides: S.tides, sc: { x: sc.x, y: sc.y, s: sc.s }, finds: finds.length, watch: !!watch }),
  ff: sec => { for (let k = 0; k < sec * 10; k++) advance(0.1); syncBodies(); journalDirty = true; }, give: n => { S.shells += n; journalDirty = true; },
  collect: () => { let v = 0; while (finds.length) { v += finds[0].kind.v; collect(0); } return v; },
  place: type => { const cost = pieceCost(type); if (S.shells < cost) return false; for (let n = 0; n < 200; n++) { const u = 15 + Math.random() * 70, v = 30 + Math.random() * 55; if (canPlace(type, u, v, null)) { S.shells -= cost; pool().pieces.push({ type, x: u, y: v }); syncBodies(); return true; } } return false; },
  dig: () => { const c = pool(); if (c.size >= SIZE_COST.length || S.shells < SIZE_COST[c.size]) return false; S.shells -= SIZE_COST[c.size]; c.size++; shape = null; bgDirty = true; buildBg(); keepInside(); return true; },
  sp: SP, guide: () => S.guide, cost: pieceCost, go: goCove, open: () => COVE_ORDER.filter(id => foundCount() >= COVES[id].need || S.coves[id]), cove: () => ({ size: pool().size, cap: capacity(pool()), pieces: pool().pieces.length }) };
setMuted(S.muted, true);
layout(); buildBg();
// the title shows the pool as you left it, or a few visitors if it is new
if (!Object.keys(pool().res).length) { pool().res = {}; }
syncBodies();
// a new pool is empty, so the title borrows a few passers-by; the first sync in play clears them
if (!bodies.length) ['beadlet', 'limpet', 'starfish', 'hermit', 'prawn'].forEach(id => { const sp = SPBY[id], [u, v, p] = spotFor(sp, pool()); bodies.push(makeBody(sp, u, v, p, false)); });
if (S.started) { $('titleStat').textContent = foundCount() + ' of ' + SP.length + ' species in your guide. ' + S.shells + ' shells.'; $('playBtn').textContent = 'Back to the shore'; }
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
