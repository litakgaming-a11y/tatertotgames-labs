<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Clockwork Sky | TaterTot Games</title>
<meta name="theme-color" content="#0c1322">
<link rel="icon" href="data:,">
<script src="/analytics.js" defer></script>
<style>
  :root {
    --ink: #0c1322; --ink2: #111b31; --deck: #0a1020; --deck2: #0e1729;
    --line: 226, 214, 186; --text: #ece3cc; --dim: #b8ad93; --faint: #7f7763;
    --brass: #d8a94e; --brass-hi: #f0c874; --verd: #74b8a8; --verm: #e2573c;
    --hatch: repeating-linear-gradient(135deg, rgba(var(--line), .10) 0 1px, transparent 1px 5px);
    --serif: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); touch-action: none; overscroll-behavior: none; position: fixed; inset: 0; }
  body { font-family: var(--serif); color: var(--text); font-size: 14px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  ::selection { background: var(--brass); color: var(--deck); }
  canvas#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 1px solid var(--brass-hi); outline-offset: 3px; }
  .num { font-variant-numeric: tabular-nums lining-nums; }

  /* brass plate buttons: pressing inverts, unaffordable is hatched */
  .btn { min-height: 44px; padding: 0 16px; border: 1px solid var(--brass); border-radius: 2px; color: var(--text);
    letter-spacing: .05em; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background-color .12s ease-out, color .12s ease-out; }
  .btn:hover:not(:disabled) { background: rgba(216, 169, 78, .12); }
  .btn:active:not(:disabled) { background: var(--brass); color: var(--deck); }
  .btn:disabled { border-color: rgba(var(--line), .22); color: var(--faint); background: var(--hatch); cursor: default; }
  .btn.solid { background: var(--brass); color: var(--deck); font-size: 16px; min-height: 50px; padding: 0 28px; letter-spacing: .08em; }
  .btn.solid:active { background: var(--brass-hi); }

  /* ---------- HUD over the sky ---------- */
  #hud { position: fixed; display: none; pointer-events: none; }
  #hud .big { font-size: 26px; line-height: 1.05; letter-spacing: .01em; }
  #hud .big small { font-size: 13px; color: var(--dim); letter-spacing: .08em; margin-left: 6px; }
  #hud .rate { font-size: 13px; color: var(--dim); margin-top: 2px; }
  #hud .ice { font-size: 13px; color: var(--verd); margin-top: 2px; }
  #hud .boost { font-size: 13px; color: var(--brass-hi); margin-top: 2px; }
  #hint { position: fixed; display: none; pointer-events: none; text-align: center; font-style: italic; color: var(--dim);
    font-size: 13px; padding: 0 16px; transition: opacity .4s ease-out; }
  #muteBtn { position: fixed; width: 44px; height: 44px; display: none; align-items: center; justify-content: center;
    border: 1px solid rgba(var(--line), .28); border-radius: 2px; z-index: 5; color: var(--text); }
  #muteBtn svg { width: 22px; height: 22px; }
  #muteBtn:active { background: var(--brass); color: var(--deck); }

  /* ---------- the instrument deck ---------- */
  #deck { position: fixed; display: none; flex-direction: column; background: var(--deck); z-index: 3; }
  body.port #deck { left: 0; right: 0; bottom: 0; border-top: 1px solid rgba(216, 169, 78, .5); }
  body.land #deck { top: 0; right: 0; bottom: 0; border-left: 1px solid rgba(216, 169, 78, .5); }
  #trackWrap { flex: 0 0 auto; padding: 8px 14px 4px; border-bottom: 1px solid rgba(var(--line), .1); }
  #track { width: 100%; height: 58px; display: block; }
  #tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid rgba(var(--line), .1); }
  .tab { min-height: 42px; font-size: 13px; letter-spacing: .06em; color: var(--dim); position: relative; padding: 0 4px; }
  .tab.on { color: var(--text); }
  .tab.on::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 0; height: 2px; background: var(--brass); }
  .tab:active { color: var(--brass-hi); }
  .tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); margin-left: 5px; vertical-align: 2px; }
  #body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 4px 0 18px; touch-action: pan-y; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(216, 169, 78, .35); border-radius: 3px; }
  .scroll { scrollbar-width: thin; scrollbar-color: rgba(216, 169, 78, .35) transparent; }

  .bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 4px; color: var(--dim); font-size: 12px; letter-spacing: .06em; }
  .amt { display: inline-flex; border: 1px solid rgba(var(--line), .22); border-radius: 2px; }
  .amt button { min-height: 32px; min-width: 44px; font-size: 12px; color: var(--dim); letter-spacing: .04em; }
  .amt button.on { background: rgba(216, 169, 78, .16); color: var(--text); }

  .row { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; }
  .row + .row { border-top: 1px solid rgba(var(--line), .07); }
  .sw { width: 26px; height: 26px; border-radius: 50%; background: var(--t); position: relative; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(236, 227, 204, .75); }
  .sw::after { content: ""; position: absolute; inset: 0 0 0 50%; background: repeating-linear-gradient(90deg, rgba(10, 14, 26, .55) 0 1px, transparent 1px 3px); }
  .nm { font-size: 15px; letter-spacing: .02em; }
  .nm .lv { font-size: 12px; color: var(--dim); margin-left: 6px; letter-spacing: .04em; }
  .sub { font-size: 12.5px; color: var(--dim); }
  .sub b { color: var(--text); font-weight: normal; }
  .mo { display: flex; align-items: center; gap: 8px; margin-top: 3px; min-height: 22px; }
  .pips { display: inline-flex; gap: 4px; }
  .pips i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--verd); display: block; }
  .pips i.on { background: var(--verd); }
  .moon { font-size: 12px; color: var(--verd); border-bottom: 1px solid rgba(116, 184, 168, .5); min-height: 24px; padding: 0 2px; }
  .moon:disabled { color: var(--faint); border-color: transparent; cursor: default; }
  .buy { flex-direction: column; gap: 0; min-width: 92px; padding: 4px 12px; line-height: 1.15; }
  .buy .bl { font-size: 12px; letter-spacing: .06em; }
  .buy .bc { font-size: 15px; }
  .locked .nm { color: var(--dim); }
  .locked .sw { background: var(--hatch); box-shadow: inset 0 0 0 1px rgba(var(--line), .3); }
  .locked .sw::after { display: none; }

  .sect { padding: 14px 14px 6px; }
  .sect + .sect { border-top: 1px solid rgba(var(--line), .1); }
  .sect h3 { font-weight: normal; font-size: 15px; letter-spacing: .04em; margin-bottom: 4px; }
  .sect p { color: var(--dim); font-size: 12.5px; max-width: 60ch; }
  .sect .act { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .sect .act .note { font-size: 12.5px; color: var(--dim); }
  .drive { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
  #gauge { width: 112px; height: 66px; display: block; }

  .grow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 14px; }
  .grow + .grow { border-top: 1px solid rgba(var(--line), .07); }
  .dial { display: inline-flex; align-items: center; gap: 2px; }
  .dial button { width: 40px; height: 44px; color: var(--brass); display: grid; place-items: center; }
  .dial button:disabled { color: var(--faint); cursor: default; }
  .dial button:active:not(:disabled) { color: var(--brass-hi); }
  .knob { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--brass); position: relative; display: grid; place-items: center;
    font-size: 12px; letter-spacing: .02em; background: var(--deck2); outline: 3px dotted rgba(216, 169, 78, .55); outline-offset: -5px; }
  .knob::before { content: ""; position: absolute; left: 50%; top: 1px; width: 2px; height: 7px; margin-left: -1px; background: var(--brass-hi);
    transform-origin: 1px 21px; transform: rotate(var(--r, 0deg)); transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .cab { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 14px; }

  /* ---------- screens (title, chart, logbook, away) ---------- */
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10;
    background: rgba(5, 9, 18, .74); padding: 16px; }
  .screen.show { display: flex; }
  .panel { width: min(600px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--deck);
    border: 1px solid rgba(216, 169, 78, .45); border-radius: 2px; padding: 20px 20px 22px; touch-action: pan-y; }
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .phead h2 { font-weight: normal; font-size: 22px; letter-spacing: .08em; }
  .lede { color: var(--dim); font-size: 13.5px; max-width: 62ch; }

  #title { background: linear-gradient(180deg, rgba(5, 9, 18, .86) 0%, rgba(5, 9, 18, .55) 30%, rgba(5, 9, 18, 0) 48%, rgba(5, 9, 18, 0) 68%, rgba(5, 9, 18, .8) 100%); flex-direction: column; justify-content: space-between; padding: max(9vh, 28px) 16px 18px; text-align: center; }
  #title .mark { font-weight: normal; font-size: clamp(30px, min(9vw, 12vh), 76px); letter-spacing: .16em; line-height: 1.02; text-indent: .16em;
    color: var(--text); text-shadow: 0 2px 18px rgba(5, 9, 18, .9); }
  #title .rule { width: min(360px, 70vw); height: 1px; margin: 16px auto 14px; background: linear-gradient(90deg, transparent, var(--brass), transparent); }
  #title .tag { color: var(--dim); font-size: clamp(14px, 3.6vw, 17px); font-style: italic; text-shadow: 0 1px 10px rgba(5, 9, 18, .95); }
  #title .go { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #title .stat { color: var(--dim); font-size: 13px; text-shadow: 0 1px 8px rgba(5, 9, 18, .95); }
  #badge { color: var(--dim); font-size: 13px; letter-spacing: .06em; text-decoration: none; border-bottom: 1px solid rgba(216, 169, 78, .5); padding: 6px 2px 2px; }

  #map { position: relative; width: 100%; aspect-ratio: 100 / 72; margin: 12px 0 8px; border: 1px solid rgba(var(--line), .12);
    background: #0d1628; overflow: hidden; }
  #mapLines { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; display: grid; place-items: center; }
  .node i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(var(--line), .45); background: var(--deck); display: block; transition: transform .2s ease-out; }
  .node.open i { border-color: var(--brass); }
  .node.lit i { background: var(--brass-hi); border-color: var(--brass-hi); box-shadow: 0 0 0 3px var(--deck), 0 0 0 4px rgba(240, 200, 116, .7); }
  .node.sel i { transform: scale(1.45); }
  .cname { position: absolute; font-size: 11px; letter-spacing: .14em; color: var(--faint); pointer-events: none; text-transform: uppercase; }
  #nodeInfo { min-height: 96px; padding: 12px 0 4px; border-top: 1px solid rgba(var(--line), .1); }
  #nodeInfo h3 { font-weight: normal; font-size: 16px; }
  #nodeInfo p { color: var(--dim); font-size: 13px; margin: 2px 0 10px; }
  .stars { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .stars button { min-height: 40px; padding: 0 12px; border: 1px solid rgba(var(--line), .25); border-radius: 2px; font-size: 13px; color: var(--dim); }
  .stars button.on { border-color: var(--brass); color: var(--text); background: rgba(216, 169, 78, .12); }
  .stars button:disabled { background: var(--hatch); color: var(--faint); cursor: default; }
  #starText { color: var(--dim); font-size: 13px; min-height: 36px; }
  .collapse { margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(var(--line), .12); }
  .collapse h3 { font-weight: normal; font-size: 17px; letter-spacing: .04em; }
  .collapse .act { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  #logGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
  .obs { border: 1px solid rgba(var(--line), .14); border-radius: 2px; padding: 10px 10px 9px; display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: start; }
  .seal { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; letter-spacing: .02em;
    border: 1px solid rgba(var(--line), .25); color: var(--faint); background: var(--hatch); }
  .obs.got .seal { border: 3px double var(--brass); color: var(--brass-hi); background: none; }
  .obs h4 { font-weight: normal; font-size: 13.5px; line-height: 1.25; }
  .obs p { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  .obs .when { font-size: 11px; color: var(--brass); margin-top: 3px; letter-spacing: .04em; }
  .obs:not(.got) h4 { color: var(--dim); }

  #away .panel { width: min(420px, 100%); text-align: center; }
  #away .gain { font-size: 34px; margin: 10px 0 4px; }
  #away .act { margin-top: 18px; display: flex; justify-content: center; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="port">
<canvas id="sky"></canvas>

<div id="hud">
  <div class="big num"><span id="hLight">0</span><small>light</small></div>
  <div class="rate num" id="hRate">0 a second</div>
  <div class="ice num" id="hIce"></div>
  <div class="boost num" id="hBoost"></div>
</div>
<div id="hint"></div>
<button id="muteBtn" aria-label="Sound on or off">
  <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
  <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" style="display:none"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<div id="deck">
  <div id="trackWrap"><canvas id="track" aria-label="Upcoming line-ups"></canvas></div>
  <nav id="tabs">
    <button class="tab on" data-tab="planets">Planets</button>
    <button class="tab" data-tab="gears">Gears</button>
    <button class="tab" id="chartBtn">Star chart</button>
    <button class="tab" id="logBtn">Logbook</button>
  </nav>
  <div id="body" class="scroll"></div>
</div>

<div id="title" class="screen show">
  <div>
    <h1 class="mark">Clockwork<br>Sky</h1>
    <div class="rule"></div>
    <p class="tag">Wind the sky. Line up the planets.</p>
  </div>
  <div class="go">
    <button class="btn solid" id="playBtn">Wind the sky</button>
    <div class="stat num" id="titleStat"></div>
    <a id="badge" href="https://tatertotgames.com">tatertotgames.com</a>
  </div>
</div>

<div id="chart" class="screen">
  <div class="panel scroll">
    <div class="phead"><h2>Star chart</h2><button class="btn" id="chartBack">Back</button></div>
    <p class="lede num" id="chartLede"></p>
    <div id="map"><canvas id="mapLines"></canvas></div>
    <div id="nodeInfo"></div>
    <div class="collapse">
      <h3>Collapse the star</h3>
      <p class="lede num" id="colText"></p>
      <div class="stars" id="starPick"></div>
      <p id="starText"></p>
      <div class="act"><button class="btn" id="colBtn">Collapse</button><button class="btn" id="colYes" style="display:none">Yes, let it go out</button></div>
    </div>
  </div>
</div>

<div id="log" class="screen">
  <div class="panel scroll">
    <div class="phead"><h2>Logbook</h2><button class="btn" id="logBack">Back</button></div>
    <p class="lede num" id="logLede"></p>
    <div id="logGrid"></div>
  </div>
</div>

<div id="away" class="screen">
  <div class="panel">
    <h2 style="font-weight:normal;font-size:20px;letter-spacing:.06em">While you were away</h2>
    <p class="lede num" id="awayTime" style="margin:6px auto 0"></p>
    <div class="gain num" id="awayGain"></div>
    <p class="lede" id="awayNote" style="margin:0 auto"></p>
    <div class="act"><button class="btn solid" id="awayBtn">Collect</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const wrap = a => ((a % TAU) + TAU) % TAU;

/* ============================== data ============================== */
const RINGS = [
  { n: 'Cinder', r: 0.25,  size: 0.034, base: 1,     cost: 5,     unlock: 0,     gear: 2, tint: '#c8674a' },
  { n: 'Brine',  r: 0.375, size: 0.040, base: 8,     cost: 60,    unlock: 60,    gear: 4, tint: '#4f9c9a' },
  { n: 'Ochre',  r: 0.5,   size: 0.048, base: 70,    cost: 800,   unlock: 1500,  gear: 5, tint: '#c99a45' },
  { n: 'Frost',  r: 0.62,  size: 0.042, base: 650,   cost: 11000, unlock: 3e4,   gear: 6, tint: '#8fb5d6' },
  { n: 'Heath',  r: 0.74,  size: 0.052, base: 7000,  cost: 1.5e5, unlock: 6e5,   gear: 7, tint: '#9d86b8' },
  { n: 'Umbra',  r: 0.855, size: 0.046, base: 80000, cost: 2.2e6, unlock: 1.2e7, gear: 8, tint: '#8a9a5e' },
];
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
// A gear p:q turns its ring once every p/q beats of the drive.
const GEARS = [
  { p: 1, q: 2, cost: 5e7 }, { p: 2, q: 3, cost: 4e5 }, { p: 1, q: 1, cost: 0 }, { p: 3, q: 2, cost: 1500 },
  { p: 2, q: 1, cost: 0 }, { p: 3, q: 1, cost: 0 }, { p: 4, q: 1, cost: 0 }, { p: 6, q: 1, cost: 0 },
  { p: 8, q: 1, cost: 0 }, { p: 12, q: 1, cost: 2.5e4 },
];
const gearVal = g => GEARS[g].p / GEARS[g].q;
const gearLabel = g => GEARS[g].p + ':' + GEARS[g].q;
const BASE_GEARS = [2, 4, 5, 6, 7, 8];
// A line-up pays each planet in it this many beats' worth of its light, by how many gears lined up.
const CONJ = [0, 0, 0.3, 1, 2.5, 6, 15, 35];
const KWORD = ['', '', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven'];
const STARS = {
  yellow: { n: 'Yellow star', beat: 1,   val: 1,   cap: 1,   tol: 0, conj: 1,   t: 'Steady and bright. The star every sky starts with.' },
  red:    { n: 'Red giant',   beat: 1.4, val: 2.4, cap: 1,   tol: 2, conj: 1,   t: 'Big and slow. Planets turn slower but pay much more, and they line up from further apart.', need: 'cr1' },
  blue:   { n: 'Blue giant',  beat: 0.7, val: 1.3, cap: 0.8, tol: 0, conj: 1,   t: 'Hot and quick. Everything turns faster, but the mainspring is weaker.', need: 'cr2' },
  binary: { n: 'Binary star', beat: 1,   val: 1.5, cap: 1,   tol: 0, conj: 1,   t: 'A second star circles the first. When it lines up with planets, it counts as one more.', need: 'cr3', twin: true },
  pulsar: { n: 'Pulsar',      beat: 1,   val: 1.6, cap: 1,   tol: 0, conj: 1,   t: 'A beam sweeps the sky. Line-ups inside the beam pay three times, and comets come twice as often.', need: 'cr4', beam: true },
  dark:   { n: 'Dark star',   beat: 1,   val: 3,   cap: 1,   tol: 0, conj: 2.5, t: 'The inner ring is gone. Every other planet pays three times, and line-ups hit much harder.', need: 'cr5', dark: true },
};
const STAR_ORDER = ['yellow', 'red', 'blue', 'binary', 'pulsar', 'dark'];
const CONSTS = {
  lyra: { n: 'The Lyre', x: 17, y: 5 }, anvil: { n: 'The Anvil', x: 74, y: 5 },
  heron: { n: 'The Heron', x: 17, y: 95 }, lantern: { n: 'The Lantern', x: 77, y: 95 }, crown: { n: 'The Crown', x: 50, y: 88 },
};
const TREE = [
  { id: 'ly1', c: 'lyra', n: 'Wider eyepiece', t: 'Planets count as lined up from a little further apart.', cost: 2, x: 10, y: 18 },
  { id: 'ly2', c: 'lyra', n: 'Chord', t: 'Every line-up pays half as much again.', cost: 4, x: 22, y: 14 },
  { id: 'ly3', c: 'lyra', n: 'Steady hand', t: 'You can zero the sky every 40 seconds instead of every 2 minutes.', cost: 4, x: 28, y: 30 },
  { id: 'ly4', c: 'lyra', n: 'Resonance', t: 'A line-up within 8 seconds of the last one pays 25% more, stacking up to double.', cost: 10, x: 16, y: 40 },
  { id: 'ly5', c: 'lyra', n: 'Grand chord', t: 'Line-ups of five or more pay three times.', cost: 20, x: 24, y: 54 },

  if (toastT > 0) return hintOverride;
  if (S.hints < 1) return 'Tap or hold the sky to wind the clockwork.';
  if (!S.rings[1].own && !S.rings[2].own) return 'Each planet pays light when it comes round. Set a second planet on ring II.';
  if (!S.log.c2) return 'When planets line up with the star, they pay extra. Watch the track below.';
  if (!S.log.zero && S.rings.filter(r => r.own).length >= 3) return 'New planets start out of step. Zero the sky on the Gears tab to bring them together.';
  if (!S.log.gear && S.lifeLight > 1200) return 'The Gears tab sells new gears. Rings on gears that fit together line up more often.';
  if (!S.log.comet && comet) return 'A comet! Tap it before it leaves the sky.';
  if (S.runLight >= COLLAPSE_AT && S.collapses === 0) return 'This star can collapse now. Open the star chart.';
  return '';
}

/* ============================== loop ============================== */
let last = performance.now(), running = true, uiT = 0, simAcc = 0, fcT = 0;
function frame(nowMs) {
  if (!running) return;
  const dt = Math.min(0.05, Math.max(0, (nowMs - last) / 1000)); last = nowMs;
  const t = nowMs / 1000;
  if (started && openScreen !== 'away') {
    simAcc += dt;
    while (simAcc >= 1 / 60) { step(1 / 60); simAcc -= 1 / 60; }
  } else if (!started) {
    // the title screen shows the orrery idling
    const sd = dt * 0.6;
    for (let i = 0; i < RINGS.length; i++) if (ringActive(i)) S.ph[i] = wrap(S.ph[i] + TAU * sd / period(i));
    S.twin = wrap(S.twin + TAU * sd / (beatSec() * TWIN_BEATS)); S.beam = wrap(S.beam + TAU * sd / (beatSec() * BEAM_BEATS)); S.simT += sd;
  }
  chimeBudget = Math.max(0, chimeBudget - dt * 3);
  if (toastT > 0) toastT -= dt;
  if (zeroArm) { zeroArmT -= dt; if (zeroArmT <= 0) { zeroArm = false; } }
  draw(dt, t);
  fcT -= dt;
  if (started && (fcDirty || fcT <= 0 || S.simT - fcAt > 20)) { runForecast(); fcT = 2; }
  uiT -= dt;
  if (started && uiT <= 0) {
    uiT = 0.2;
    $('hLight').textContent = fmt(S.light);
    const rate = incomeOrbits() + fcBonusRate * speed();
    $('hRate').textContent = fmt(rate) + ' a second' + (S.wind > 0 ? ', wound' : '') + (driveFactor() < 1 ? ', straining' : '');
    $('hIce').textContent = S.ice > 0 || S.st.comets > 0 ? fmt(S.ice) + ' ice' : '';
    $('hBoost').textContent = cometBoost > 0 ? 'Comet light, double for ' + Math.ceil(cometBoost) + ' s' : '';
    const ht = hintText(), hint = $('hint');
    if (hint.textContent !== ht) hint.textContent = ht;
    if (deckDirty && !openScreen) buildDeck(); else updateDeck();
    drawTrack(); drawGauge();
    if (openScreen === 'chart') {
      const cb = $('colBtn'); cb.disabled = S.runLight < COLLAPSE_AT;
    }
  }
  saveTimer -= dt;
  if (started && saveTimer <= 0) { saveTimer = 5; persist(); }
  requestAnimationFrame(frame);
}

/* ============================== pause ============================== */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false; holding = false;
    if (started) persist();
    if (AC && AC.state === 'running') AC.suspend();
  } else {
    if (running) return;
    running = true; last = performance.now();
    if (AC && AC.state === 'suspended' && !S.muted) AC.resume();
    if (started && !openScreen) checkAway(30);
    requestAnimationFrame(frame);
  }
});
window.addEventListener('pagehide', () => { if (started) persist(); });
window.addEventListener('resize', () => { layout(); });

/* ============================== boot ============================== */
setMuted(S.muted, true);
layout();
if (S.started) {
  $('titleStat').textContent = fmt(S.light) + ' light' + (S.collapses ? ', star ' + (S.collapses + 1) : '') + '. The sky kept turning while you were gone.';
  $('playBtn').textContent = 'Back to the sky';
}
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
