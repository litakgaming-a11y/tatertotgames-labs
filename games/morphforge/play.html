function roundRect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function drawHatch(f, L){
  var t = hatchAnim.t;
  var g = lastGlim;
  // light burst
  var b = hatchAnim.burst;
  if(b > 0.01 && b < 1){
    var br = L.eggR*(1 + b*9);
    var rg = ctx.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, Math.max(4, br));
    var bc = hatchAnim.radiant ? [255,244,200] : lightenRGB(g ? g.col : [255,255,255], 0.4);
    rg.addColorStop(0, rgbStr(bc, (1-b)*0.9));
    rg.addColorStop(1, rgbStr(bc, 0));
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(L.cx, L.cy, Math.max(4,br), 0, Math.PI*2); ctx.fill();
  }
  if(hatchAnim.radiant && t < 1.6){
    ctx.fillStyle = 'rgba(255,246,210,' + clamp(0.55*(1 - t/1.6),0,1) + ')';
    ctx.fillRect(0,0,W,H);
  }
  // shards
  for(var i=0;i<shards.length;i++){
    var s = shards[i];
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.globalAlpha = clamp(1 - s.t/2.2, 0, 1);
    ctx.fillStyle = '#f0e2cf';
    ctx.beginPath();
    var sr = L.eggR*s.r;
    ctx.moveTo(-sr, -sr*0.5); ctx.lineTo(sr*0.8, -sr); ctx.lineTo(sr, sr*0.6); ctx.lineTo(-sr*0.6, sr*0.8);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(90,70,50,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // sparks
  for(var j=0;j<sparks.length;j++){
    var k = sparks[j];
    ctx.globalAlpha = clamp(1 - k.t/k.life, 0, 1);
    ctx.fillStyle = rgbStr(k.col, 1);
    ctx.beginPath(); ctx.arc(k.x, k.y, 2.4, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // the new Glim rises, shakes itself off, then blinks at you
  if(g && t > 0.42){
    var rise = easeOut(clamp((t-0.42)/0.7, 0, 1));
    var shakeAmt = (t > 1.05 && t < 1.55) ? 1 : 0;
    var blink = (t > 1.75 && t < 1.95) ? 1 : 0;
    var sc = Math.min(W,H) * 0.13;
    var gy = L.cy + L.eggR*0.7 - rise*L.eggR*0.35;
    drawGlim(ctx, g, L.cx, gy, sc*rise, T, {shake:shakeAmt*0.5, blink:blink, walk:0});
  }
}
function drawResultGlim(L){
  var g = lastGlim;
  if(!g) return;
  var sc = Math.min(W, H*0.7) * 0.15;
  var y = Math.min(H*0.30, H - 330);
  if(y < 90) y = 90;
  drawGlim(ctx, g, W/2, y, sc, T, {walk:0.15});
}

/* ============================================================
   MAIN LOOP, re-arms in finally, capped error log
   ============================================================ */
var lastFrame = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function frame(now){
  try{
    if(typeof now !== 'number' || !isFinite(now)) now = lastFrame + 16;
    var raw = (now - lastFrame)/1000;
    if(!isFinite(raw) || raw < 0) raw = 0;
    lastFrame = now;
    var dt = clamp(raw, 0, 0.05) * timeScale;
    T += dt;
    update(dt);
    render(dt);
  }catch(e){
    if(errCount < 3){ errCount++; try{ console.error(e); }catch(e2){} }
  }finally{
    requestAnimationFrame(frame);
  }
}
requestAnimationFrame(frame);

/* ============================================================
   INPUT
   ============================================================ */
function ptFrom(e){ return {x:e.clientX, y:e.clientY}; }
function hitSpout(x, y, L){
  var best = -1, bd = 1e9;
  for(var i=0;i<NE;i++){
    var sp = spoutPos(i, L);
    var dx = x - sp.x, dy = y - sp.y;
    var d = dx*dx + dy*dy;
    var rr = Math.max(24, L.spoutR*1.55);
    if(d < rr*rr && d < bd){ bd = d; best = i; }
  }
  return best;
}
function onDown(e){
  initAudio();
  if(state === 'title'){
    // a friendly poke for the grove
    for(var i=0;i<groveActors.length;i++){
      var a = groveActors[i];
      var dx = e.clientX - a.x*W, dy = e.clientY - a.y*H;
      if(dx*dx + dy*dy < 3000){ a.hop = 1; sBlip(); buzz(6); break; }
    }
    return;
  }
  if(state !== 'forge') return;
  try{ e.preventDefault(); }catch(err){}
  var p = ptFrom(e), L = layout();
  pointer.down = true; pointer.id = e.pointerId;
  pointer.x = p.x; pointer.y = p.y; pointer.sx = p.x; pointer.sy = p.y;
  pointer.t0 = T; pointer.moved = 0;
  pointer.spout = hitSpout(p.x, p.y, L);
  pointer.overEgg = false;
  try{ if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId); }catch(err){}
  if(pointer.spout >= 0){
    if(forge.timed[pointer.spout] === 0){ sNope(); pointer.spout = -1; }
    else { sDrop(pointer.spout); }
  }
}
function onMove(e){
  if(state !== 'forge') return;
  var p = ptFrom(e);
  if(pointer.down){
    pointer.moved += Math.abs(p.x - pointer.x) + Math.abs(p.y - pointer.y);
  }
  pointer.x = p.x; pointer.y = p.y;
  if(pointer.down && pointer.spout >= 0){
    var L = layout();
    var dx = p.x - L.cx, dy = p.y - L.cy;
    var rr = L.eggR*2.05;
    pointer.overEgg = (dx*dx + dy*dy) < rr*rr;
  }
}
function endPointer(e){
  if(pointer.down && state === 'forge'){
    var quick = (T - pointer.t0) < 0.32 && pointer.moved < 26;
    if(quick && pointer.spout < 0){
      var L = layout();
      var dx = pointer.x - L.cx, dy = pointer.y - L.cy;
      var rr = L.eggR*2.4;
      if(dx*dx + dy*dy < rr*rr){
        if(kneadForge(forge)){
          sKnead(upKneadPower());
          addPop(L.cx, L.cy - L.eggR - 4, 'KNEAD', '#b6ffdc');
          buzz(10);
        } else { sNope(); }
      }
    }
  }
  pointer.down = false; pointer.spout = -1; pointer.overEgg = false;
  if(forge){ forge.pouring = false; forge.pourEss = -1; }
  setFlow(false, -1, 0);
}
cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', function(e){ if(pointer.down) endPointer(e); });
addEventListener('blur', endPointer);
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    endPointer();
  } else {
    initAudio();
    lastFrame = (typeof performance !== 'undefined' && performance.now) ? performance.now() : lastFrame;
  }
});
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('selectstart', function(e){ e.preventDefault(); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

/* ---------- buttons ---------- */
function on(el, fn){ if(el) el.addEventListener('click', function(e){ initAudio(); fn(e); }); }
on($('playBtn'), function(){ sBlip(); startForge(); });
on($('menBtn'), function(){ sBlip(); openMenagerie(); });
on($('cdxBtn'), function(){ sBlip(); openCodex(); });
on($('upBtn'), function(){ sBlip(); openUpgrades(); });
on($('menClose'), function(){ sBlip(); goTitle(); });
on($('cdxClose'), function(){ sBlip(); goTitle(); });
on($('upClose'), function(){ sBlip(); goTitle(); });
on(elBreedBtn, function(){ doBreed(); });
on(elHatch, function(){ if(state === 'forge' && !hatchAnim.on) beginHatch(false); });
on($('quitBtn'), function(){ sBlip(); goTitle(); });
on($('againBtn'), function(){ sBlip(); startForge(); });
on($('resMenBtn'), function(){ sBlip(); openMenagerie(); });
on($('resHomeBtn'), function(){ sBlip(); goTitle(); });
on(elMute, function(){ setMuted(!save.muted); });
on(elMute2, function(){ setMuted(!save.muted); });

/* ---------- boot ---------- */
setMuted(save.muted);
goTitle();

/* ---------- test surface (harness only; harmless in the browser) ---------- */
try{
  window.__MF = {
    makeGlim: makeGlim, normBlend: normBlend, traitsFor: traitsFor, breedBlend: breedBlend,
    TRAITS: TRAITS, ESS: ESS, newForge: newForge, stepForge: stepForge, kneadForge: kneadForge,
    computeHatch: computeHatch, fillOf: fillOf, radiantWindow: radiantWindow,
    layout: layout, drawGlim: drawGlim, paletteOf: paletteOf,
    setState: function(s){ state = s; }, getState: function(){ return state; },
    getForge: function(){ return forge; }, setForge: function(f){ forge = f; },
    startForge: startForge, beginHatch: beginHatch, goTitle: goTitle,
    pointer: pointer, errCount: function(){ return errCount; },
    resize: resize, update: update, render: render
  };
}catch(e){}
