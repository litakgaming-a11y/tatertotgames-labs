<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%A7%B2%3C/text%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b0820; touch-action:none; overscroll-behavior:none; position:fixed; inset:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#eef1ff; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #safeProbe { position:fixed; top:0; left:0; width:0; height:0; visibility:hidden;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
  .screen.show { display:flex; }
  button { pointer-events:auto; font-family:inherit; border:none; cursor:pointer; color:#fff; min-height:44px; }

  /* ---------- Title ---------- */
  #title { justify-content:flex-start; padding-top:calc(7vh + env(safe-area-inset-top)); }
  .logo { font-weight:900; font-size:clamp(46px, 15vw, 96px); line-height:.88; letter-spacing:2px;
    font-style:italic; transform:skewX(-7deg);
    background:linear-gradient(180deg,#fff0f5 0%, #ff9ec0 34%, #ff3f6e 62%, #c11f52 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,80,130,.5)) drop-shadow(0 4px 0 rgba(50,0,25,.7));
    animation:logoBounce 2.3s ease-in-out infinite; }
  .logo small { display:block; font-size:.52em; letter-spacing:11px; margin-left:8px;
    background:linear-gradient(180deg,#e2fbff,#53dcff 52%,#1f8dff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 14px rgba(60,200,255,.45)); }
  @keyframes logoBounce { 0%,100%{transform:skewX(-7deg) translateY(0) scale(1);} 50%{transform:skewX(-7deg) translateY(-10px) scale(1.035);} }
  .statRow { margin-top:14px; font-size:clamp(15px,4.2vw,20px); font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.7);
    background:rgba(14,10,38,.6); padding:7px 16px; border-radius:999px; border:1px solid rgba(150,140,255,.28); backdrop-filter:blur(3px); }
  .statRow + .statRow { margin-top:8px; }
  .statRow .dim { opacity:.75; font-weight:600; font-size:.85em; }
  #playBtn { margin-top:4.5vh; font-size:clamp(20px,6vw,30px); font-weight:900; letter-spacing:1px; padding:18px 42px; border-radius:20px;
    background:linear-gradient(180deg,#ff8fb0,#ff2f63); color:#3d0016;
    box-shadow:0 6px 0 #97113c, 0 0 34px rgba(255,70,120,.5); animation:pulse 1.1s ease-in-out infinite; }
  #playBtn:active { transform:scale(.94); box-shadow:0 2px 0 #97113c, 0 0 24px rgba(255,70,120,.5); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.055);} }
  #labBtn { margin-top:14px; font-size:clamp(15px,4.4vw,20px); font-weight:800; padding:13px 28px; border-radius:16px;
    background:linear-gradient(180deg,#4fd8ff,#1d7fe0); color:#02243c; box-shadow:0 5px 0 #0f4f8f, 0 0 20px rgba(70,200,255,.35); }
  #labBtn:active { transform:scale(.94); box-shadow:0 2px 0 #0f4f8f; }
  #badge { pointer-events:auto; position:absolute; bottom:calc(10px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    font-size:12px; font-weight:700; letter-spacing:.6px; color:#d5d8ff; text-decoration:none; opacity:.85;
    background:rgba(10,7,28,.65); border:1px solid rgba(160,150,255,.3); padding:6px 14px; border-radius:999px; }
  #badge::before { content:"🥔 "; }

  @media (max-height: 540px) {
    #title { padding-top:calc(2vh + env(safe-area-inset-top)); }
    .logo { font-size:clamp(28px, 9vh, 58px); }
    #playBtn { margin-top:2vh; padding:11px 26px; }
    #labBtn { margin-top:8px; padding:9px 20px; }
    #badge { display:none; }
    .statRow { margin-top:8px; padding:5px 12px; }
  }

  /* ---------- HUD ---------- */
  #hud { pointer-events:none; justify-content:flex-start; }
  #hudTop { position:absolute; top:calc(8px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left));
    right:calc(60px + env(safe-area-inset-right)); display:flex; justify-content:space-between; align-items:flex-start; gap:6px; flex-wrap:wrap; }
  .chip { background:rgba(11,8,32,.72); border:1px solid rgba(150,140,255,.28); border-radius:12px; padding:6px 12px;
    font-weight:800; font-size:clamp(13px,3.8vw,17px); text-shadow:0 1px 3px #000; white-space:nowrap; }
  #hudPole { border-color:rgba(255,90,130,.6); color:#ffc6d6; transition:color .18s, border-color .18s, box-shadow .18s; }
  #hudPole.blue { border-color:rgba(80,215,255,.6); color:#bff0ff; }
  #hudPole.pop { animation:polePop .28s ease-out; }
  @keyframes polePop { 0%{transform:scale(1.35);} 100%{transform:scale(1);} }
  #hudHint { position:absolute; bottom:calc(16px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    font-size:clamp(14px,4.4vw,19px); font-weight:900; letter-spacing:2px; color:#ffe9f0;
    text-shadow:0 0 14px rgba(255,80,130,.8), 0 2px 4px #000; opacity:0; transition:opacity .4s; }
  #hudHint.on { opacity:.92; animation:hintPulse 1.2s ease-in-out infinite; }
  @keyframes hintPulse { 0%,100%{transform:translateX(-50%) scale(1);} 50%{transform:translateX(-50%) scale(1.07);} }

  /* ---------- Panels ---------- */
  #results, #fail, #lab { background:rgba(6,4,20,.5); }
  .panel { pointer-events:auto; background:linear-gradient(180deg, rgba(28,20,64,.96), rgba(15,10,38,.97));
    border:1px solid rgba(165,150,255,.35); border-radius:22px; padding:24px 24px 20px; width:min(88vw, 390px);
    box-shadow:0 14px 50px rgba(0,0,0,.65), 0 0 44px rgba(130,90,255,.18); animation:panelIn .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes panelIn { from{transform:scale(.7) translateY(30px); opacity:0;} to{transform:scale(1) translateY(0); opacity:1;} }
  .panel h2 { font-size:clamp(23px,7vw,33px); font-weight:900; font-style:italic; letter-spacing:1px;
    background:linear-gradient(180deg,#fff,#ffc6d8); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,120,170,.45)); }
  .panel .bigNum { font-size:clamp(29px,9vw,42px); font-weight:900; color:#ffd34d; text-shadow:0 0 16px rgba(255,205,60,.6); margin:6px 0 2px; }
  .panel .sub { opacity:.82; font-size:14px; font-weight:600; margin-bottom:4px; }
  #resStars { display:flex; justify-content:center; gap:10px; margin:10px 0 4px; min-height:46px; }
  .starPip { font-size:34px; opacity:.18; filter:grayscale(1); transform:scale(.7); transition:none; }
  .starPip.lit { opacity:1; filter:none; animation:starPop .5s cubic-bezier(.2,1.7,.4,1) forwards; }
  @keyframes starPop { 0%{transform:scale(.2) rotate(-40deg);} 60%{transform:scale(1.35) rotate(9deg);} 100%{transform:scale(1) rotate(0);} }
  #resNote { min-height:20px; font-weight:800; color:#8affc1; font-size:14px; text-shadow:0 0 10px rgba(60,255,150,.45); margin:4px 0; }
  .cta { margin-top:12px; width:100%; font-size:clamp(17px,5vw,22px); font-weight:900; padding:14px; border-radius:16px;
    background:linear-gradient(180deg,#ff8fb0,#ff2f63); color:#3d0016; box-shadow:0 5px 0 #97113c; animation:pulse 1.2s ease-in-out infinite; }
  .cta:active { transform:scale(.95); box-shadow:0 2px 0 #97113c; }
  .cta.blue { background:linear-gradient(180deg,#5fd8ff,#2072d9); color:#02243c; box-shadow:0 5px 0 #124a90; animation:none; }
  .cta.blue:active { box-shadow:0 2px 0 #124a90; }

  /* ---------- Lab ---------- */
  #lab .panel { max-height:84vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #labStars { font-size:clamp(19px,5.5vw,25px); font-weight:900; color:#ffd34d; margin-bottom:10px; text-shadow:0 0 10px rgba(255,205,60,.4); }
  .secHead { text-align:left; font-size:12px; font-weight:900; letter-spacing:2px; color:#b7a9ff; margin:12px 2px 8px; opacity:.9; }
  .upRow { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.06); border:1px solid rgba(160,150,255,.18);
    border-radius:14px; padding:9px 11px; margin-bottom:9px; text-align:left; }
  .upRow.eq { border-color:rgba(120,255,190,.5); background:rgba(90,255,180,.09); }
  .upRow .ic { font-size:25px; width:30px; text-align:center; filter:drop-shadow(0 0 6px rgba(150,160,255,.5)); }
  .upRow .info { flex:1; min-width:0; }
  .upRow .nm { font-weight:800; font-size:15px; }
  .upRow .ds { font-size:11.5px; opacity:.75; font-weight:600; }
  .buyBtn { min-width:82px; padding:11px 10px; border-radius:12px; font-weight:900; font-size:14px;
    background:linear-gradient(180deg,#57e389,#1f9e50); box-shadow:0 4px 0 #0e5c2c; }
  .buyBtn:active { transform:scale(.93); box-shadow:0 1px 0 #0e5c2c; }
  .buyBtn.no { background:linear-gradient(180deg,#5a5680,#3a3654); box-shadow:0 4px 0 #242138; opacity:.72; }
  .buyBtn.eq { background:linear-gradient(180deg,#b48cff,#6c3fd9); box-shadow:0 4px 0 #3c2085; }
  .buyBtn.on { background:linear-gradient(180deg,#3d4a70,#252d4b); box-shadow:0 4px 0 #151a2e; opacity:.85; }

  /* ---------- Mute ---------- */
  #muteBtn { position:absolute; top:calc(8px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right)); z-index:6;
    width:44px; height:44px; border-radius:12px; font-size:20px; padding:0;
    background:rgba(11,8,32,.72); border:1px solid rgba(150,140,255,.28); display:none; }
  #muteBtn.show { display:block; }
  #muteBtn:active { transform:scale(.9); }
</style>
<script src="/analytics.js" defer></script>

<body>
<div id="safeProbe"></div>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="title" class="screen">
    <div class="logo">FLIP<small>FORCE</small></div>
    <div class="statRow">⭐ <span id="tStars">0</span> <span class="dim">star bits</span></div>
    <div class="statRow">🧲 <span class="dim">best zone</span> <span id="tBest">1</span></div>
    <button id="playBtn">🧲 TAP TO PLAY</button>
    <button id="labBtn">🔬 THE LAB</button>

  </div>

  <div id="hud" class="screen">
    <div id="hudTop">
      <div class="chip" id="hudLevel">ZONE 1</div>
      <div class="chip" id="hudPole">🔴 REPEL</div>
      <div class="chip" id="hudStars">⭐ 0</div>

    <div class="panel">
      <h2 id="resTitle">ZONE CLEAR!</h2>

      <div class="bigNum" id="resEarned">+0 ⭐</div>

      <div id="coreList"></div>
      <div class="secHead">TRAILS</div>

      <button class="cta blue" id="labBackBtn">⬅ BACK</button>
    </div>
  </div>

  <button id="muteBtn">🔊</button>
</div>

<script>
(() => {
'use strict';
/* ============================= helpers ============================= */
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);

function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}
// Deterministic PRNG so a retried zone is the exact same (fair) layout.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================= save ============================= */
const SAVE_KEY = 'ttg_flipforce';
const CORES = [
  { id: 'classic',  ic: '⚪', nm: 'Classic Core', ds: 'The original lab prototype.',        cost: 0 },
  { id: 'nova',     ic: '✴️', nm: 'Nova Core',    ds: 'Sheds bright starburst sparks.',     cost: 45 },
  { id: 'bubble',   ic: '🫧', nm: 'Bubble Core',  ds: 'Glassy shell, drifting bubbles.',    cost: 110 },
  { id: 'prism',    ic: '🔷', nm: 'Prism Core',   ds: 'Faceted shell, shard confetti.',     cost: 200 },
  { id: 'ember',    ic: '🔥', nm: 'Ember Core',   ds: 'Molten heart, rising embers.',       cost: 330 },
  { id: 'void',     ic: '🌑', nm: 'Void Core',    ds: 'Dark centre with a screaming rim.',  cost: 520 },
  { id: 'quantum',  ic: '🌀', nm: 'Quantum Core', ds: 'Phase-doubled. Leaves echoes.',      cost: 800 },
];
const TRAILS = [
  { id: 'std',    ic: '·',  nm: 'Standard Trail', ds: 'Clean fading dots.',            cost: 0 },
  { id: 'comet',  ic: '☄️', nm: 'Comet Trail',    ds: 'Thick tapered streak.',         cost: 35 },
  { id: 'ribbon', ic: '🎀', nm: 'Ribbon Trail',   ds: 'Twin woven ribbons.',           cost: 90 },
  { id: 'aurora', ic: '🌈', nm: 'Aurora Trail',   ds: 'Hue-shifting polar light.',     cost: 180 },
];
const CORE_IDS = CORES.map(c => c.id);
const TRAIL_IDS = TRAILS.map(t => t.id);

function defaultSave() {
  return { v: 1, stars: 0, lifetime: 0, level: 1, best: 1, muted: false,
           core: 'classic', trail: 'std', cores: ['classic'], trails: ['std'] };
}
function repairList(raw, allowed, fallback) {
  const out = [fallback];
  if (Array.isArray(raw)) {
    for (const id of raw) {
      if (typeof id === 'string' && allowed.indexOf(id) >= 0 && out.indexOf(id) < 0) out.push(id);
    }
  }
  return out;
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const s = JSON.parse(raw);
    const out = Object.assign(defaultSave(), (s && typeof s === 'object') ? s : {});
    out.stars    = Math.max(0, Math.floor(+out.stars || 0));
    out.lifetime = Math.max(0, Math.floor(+out.lifetime || 0));
    out.level    = clamp(Math.floor(+out.level || 1), 1, 9999);
    out.best     = clamp(Math.floor(+out.best || 1), 1, 9999);
    out.muted    = !!out.muted;
    out.cores    = repairList(out.cores, CORE_IDS, 'classic');
    out.trails   = repairList(out.trails, TRAIL_IDS, 'std');
    if (out.cores.indexOf(out.core) < 0) out.core = 'classic';
    if (out.trails.indexOf(out.trail) < 0) out.trail = 'std';
    out.v = 1;
    return out;
  } catch (e) { return defaultSave(); }
}
let save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ============================= world / canvas ============================= */
const WW = 100, WH = 170;          // fixed world box, letterboxed into the viewport
const RAIL = 2.4;                  // side rail thickness (crash surface)
const ORB_R = 2.7, HIT_R = 1.85;   // forgiving hitbox (risk note)
const GATE_T = 4.2;
const UP_THRUST = 30, FORCE_K = 4200, MIN_D = 8, MAX_F = 95, DRAG = 1.15, MAX_V = 58;

const cv = $('cv');
const cx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;
let scale = 1, ox = 0, oy = 0;
let inset = { t: 0, b: 0, l: 0, r: 0 };
let bgGrad = null;
let stars = [];              // background starfield (screen space) — initialized empty, safe from frame 0
let resizing = false;

const sx = wx => ox + wx * scale;
const sy = wy => oy + wy * scale;
const sc = v => v * scale;

function readInsets() {
  try {
    const cs = getComputedStyle($('safeProbe'));
    inset.t = parseFloat(cs.paddingTop) || 0;
    inset.b = parseFloat(cs.paddingBottom) || 0;
    inset.l = parseFloat(cs.paddingLeft) || 0;
    inset.r = parseFloat(cs.paddingRight) || 0;
  } catch (e) { inset.t = inset.b = inset.l = inset.r = 0; }
}
function resize() {
  if (resizing) return;              // re-entrancy guard
  resizing = true;
  try {
    const vw = Math.max(1, window.innerWidth  || 1);
    const vh = Math.max(1, window.innerHeight || 1);
    if (vw < 2 || vh < 2) return;    // 0-size guard
    DPR = Math.min(2.5, Math.max(1, window.devicePixelRatio || 1));
    W = vw; H = vh;
    cv.width  = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    readInsets();
    const padTop = inset.t + 56;     // HUD chip row
    const padBot = inset.b + 14;
    const padSide = 8;
    const availW = Math.max(40, W - inset.l - inset.r - padSide * 2);
    const availH = Math.max(60, H - padTop - padBot);
    scale = Math.min(availW / WW, availH / WH);
    ox = inset.l + padSide + (availW - WW * scale) / 2;
    oy = padTop + (availH - WH * scale) / 2;
    buildStarfield();
    buildBg();
  } catch (e) {
    if (window.console) console.error('[flip] resize error:', e);
  } finally {
    resizing = false;
  }
}
function buildStarfield() {
  stars = [];
  const n = clamp(Math.round(W * H / 12000), 20, 110);
  for (let i = 0; i < n; i++) {
    stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.5, 1.7), p: rand(0, TAU), s: rand(0.6, 2.2) });
  }
}
function buildBg() {
  try {
    const hue = (levelNum * 37) % 360;
    const g = cx.createLinearGradient(0, 0, 0, Math.max(1, H));
    g.addColorStop(0,    'hsl(' + hue + ',48%,10%)');
    g.addColorStop(0.42, 'hsl(' + ((hue + 26) % 360) + ',44%,14%)');
    g.addColorStop(0.78, 'hsl(' + ((hue + 52) % 360) + ',40%,11%)');
    g.addColorStop(1,    'hsl(' + ((hue + 8) % 360) + ',50%,7%)');
    bgGrad = g;
  } catch (e) { bgGrad = null; }
}

/* ============================= audio ============================= */
let AC = null, master = null, noiseBuf = null;
let hum = null, humAcc = 0;
let userGestured = false;

function initAudio() {
  if (AC) return;
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) { AC = null; return; }
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = save.muted ? 0 : 0.5;
    master.connect(AC.destination);
    const len = Math.max(1, Math.floor(AC.sampleRate * 0.5));
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; master = null; noiseBuf = null; }
}
function resumeAudio() { try { if (AC && AC.state === 'suspended') AC.resume().catch(() => {}); } catch (e) {} }
function setMute(m) {
  save.muted = m; persist();
  try { if (master) master.gain.value = m ? 0 : 0.5; } catch (e) {}
  $('muteBtn').textContent = m ? '🔇' : '🔊';
}
function tone(freq, dur, type, vol, t0, slideTo) {
  if (!AC || !master) return;
  try {
    const t = (t0 !== undefined ? t0 : AC.currentTime);

// EVERY collection here exists from boot; update()/render() run on the title screen.
function emptyLevel() {
  return { n: 1, nodes: [], gates: [], zones: [], blocks: [], bits: [],
           exit: { x: WW / 2, y: 11, r: 7 }, startX: WW / 2, startY: WH - 12 };
}
let level = emptyLevel();

const POL_RED = 0, POL_BLUE = 1;
const COL_RED = '255,63,110', COL_BLUE = '53,214,255';
const polCol = p => (p === POL_RED ? COL_RED : COL_BLUE);

const orb = { x: WW / 2, y: WH - 12, vx: 0, vy: 0, pol: POL_RED, alive: true, py: WH - 12, invuln: 0, dead: 0, stall: 0 };
let checkpoint = { x: WW / 2, y: WH - 12 };

function farFrom(x, y, list, minD) {
  for (let i = 0; i < list.length; i++) {
    const dx = list[i].x - x, dy = list[i].y - y;
    if (dx * dx + dy * dy < minD * minD) return false;
  }
  return true;
}
function genLevel(n) {
  const rng = mulberry32((n * 2654435761) >>> 0);
  const rnd = (a, b) => a + rng() * (b - a);
  const lv = emptyLevel();
  lv.n = n;

  // --- gates: horizontal crash barriers with a threadable gap ---
  const gCount = clamp(1 + Math.floor(n / 2), 1, 6);
  const gapW = clamp(34 - n * 1.25, 17, 34);
  for (let i = 0; i < gCount; i++) {
    const y = lerp(WH - 46, 30, (i + 0.5) / gCount);
    const baseX = clamp(rnd(gapW * 0.6 + RAIL + 4, WW - gapW * 0.6 - RAIL - 4), gapW / 2 + RAIL + 2, WW - gapW / 2 - RAIL - 2);
    let kind = 'fixed';
    if (n >= 6 && rng() < 0.34) kind = 'move';
    else if (n >= 8 && rng() < 0.3) kind = 'shutter';
    lv.gates.push({
      y, baseX, gx: baseX, baseW: gapW, gw: gapW, kind,
      amp: Math.min(18, 6 + n * 0.7), spd: rnd(0.5, 0.95), phase: rnd(0, TAU),
      passed: false, glow: 0,
    });
  }
  lv.gates.sort((a, b) => b.y - a.y);   // bottom-up, the order the orb meets them

  const avoid = [{ x: lv.startX, y: lv.startY }, { x: lv.exit.x, y: lv.exit.y }];

  // --- magnet nodes ---
  const nCount = clamp(2 + n, 3, 14);
  const orbitClusters = n >= 5 ? Math.min(2, 1 + Math.floor((n - 5) / 6)) : 0;
  for (let i = 0; i < nCount; i++) {
    let x = 0, y = 0, ok = false;
    for (let tries = 0; tries < 24; tries++) {
      x = rnd(RAIL + 9, WW - RAIL - 9);
      y = rnd(20, WH - 22);
      // keep clear of gate corridors so a zone is never impossible
      let blocked = false;
      for (const g of lv.gates) {
        if (Math.abs(y - g.y) < 11) { blocked = true; break; }
        if (Math.abs(y - g.y) < 20 && Math.abs(x - g.baseX) < g.baseW * 0.42) { blocked = true; break; }
      }
      if (blocked) continue;
      if (!farFrom(x, y, avoid, 17)) continue;
      if (!farFrom(x, y, lv.nodes, 15)) continue;
      ok = true; break;
    }
    if (!ok) continue;
    const pulses = n >= 3 && rng() < 0.32;
    lv.nodes.push({
      x, y, cx: x, cy: y, pol: rng() < 0.5 ? POL_RED : POL_BLUE,
      s: rnd(0.8, 1.25), base: rnd(0.8, 1.25), pulses,
      phase: rnd(0, TAU), pspd: rnd(1.1, 2.1),
      orbitR: 0, orbitSpd: 0, ring: 0,
    });
    avoid.push({ x, y });
  }
  // rotating node clusters
  for (let c = 0; c < orbitClusters && lv.nodes.length > 2; c++) {
    const idx = Math.floor(rng() * lv.nodes.length);
    const nd = lv.nodes[idx];
    nd.orbitR = rnd(7, 12);
    nd.orbitSpd = rnd(0.6, 1.15) * (rng() < 0.5 ? -1 : 1);
    nd.phase = rnd(0, TAU);
  }

  // --- neutralizing static zones (flip locked inside) ---
  const zCount = n >= 4 ? Math.min(3, Math.floor((n - 1) / 3)) : 0;
  for (let i = 0; i < zCount; i++) {
    for (let tries = 0; tries < 20; tries++) {
      const r = rnd(9, 14);
      const x = rnd(RAIL + r + 2, WW - RAIL - r - 2);
      const y = rnd(26, WH - 30);
      let blocked = false;
      for (const g of lv.gates) if (Math.abs(y - g.y) < r + 10) blocked = true;
      if (blocked || !farFrom(x, y, avoid, r + 12)) continue;
      lv.zones.push({ x, y, r, phase: rnd(0, TAU) });
      avoid.push({ x, y });
      break;
    }
  }

  // --- floating crash blocks ---
  const bCount = n >= 3 ? Math.min(5, Math.floor(n / 3)) : 0;
  for (let i = 0; i < bCount; i++) {
    for (let tries = 0; tries < 20; tries++) {
      const w = rnd(10, 22), h = rnd(4, 7);
      const x = rnd(RAIL + 3, WW - RAIL - 3 - w);
      const y = rnd(28, WH - 34);
      let blocked = false;
      for (const g of lv.gates) if (Math.abs(y - g.y) < 13) blocked = true;
      if (blocked || !farFrom(x + w / 2, y + h / 2, avoid, 16)) continue;
      lv.blocks.push({ x, y, w, h });
      avoid.push({ x: x + w / 2, y: y + h / 2 });
      break;
    }
  }

  // --- star bits ---
  const sCount = clamp(5 + Math.floor(n / 2), 5, 10);
  for (let i = 0; i < sCount; i++) {
    for (let tries = 0; tries < 22; tries++) {
      const x = rnd(RAIL + 7, WW - RAIL - 7);
      const y = rnd(20, WH - 20);
      let blocked = false;
      for (const g of lv.gates) if (Math.abs(y - g.y) < 8) blocked = true;
      for (const b of lv.blocks) {
        if (x > b.x - 5 && x < b.x + b.w + 5 && y > b.y - 5 && y < b.y + b.h + 5) blocked = true;
      }
      if (blocked || !farFrom(x, y, lv.bits, 11)) continue;
      lv.bits.push({ x, y, got: false, phase: rnd(0, TAU) });
      break;
    }
  }
  lv.exit.x = clamp(lv.gates.length ? lv.gates[lv.gates.length - 1].baseX : WW / 2, 14, WW - 14);
  return lv;
}

}

/* ============================= collision ============================= */
function rectDist(px, py, rx, ry, rw, rh) {
  const qx = px < rx ? rx : (px > rx + rw ? rx + rw : px);
  const qy = py < ry ? ry : (py > ry + rh ? ry + rh : py);
  const dx = px - qx, dy = py - qy;
  return Math.sqrt(dx * dx + dy * dy);
}
// Returns nearest surface distance; sets crashHit when overlapping.
let crashHit = false;
function surfaceScan(px, py) {
  crashHit = false;
  let best = 1e9;
  // side rails
  let d = px - RAIL; if (d < best) best = d;
  d = (WW - RAIL) - px; if (d < best) best = d;
  // gate posts
  for (let i = 0; i < level.gates.length; i++) {
    const g = level.gates[i];
    const half = g.gw / 2;
    const leftW = Math.max(0, (g.gx - half) - RAIL);
    const rightX = g.gx + half;
    const rightW = Math.max(0, (WW - RAIL) - rightX);
    if (leftW > 0) { d = rectDist(px, py, RAIL, g.y - GATE_T / 2, leftW, GATE_T); if (d < best) best = d; }
    if (rightW > 0) { d = rectDist(px, py, rightX, g.y - GATE_T / 2, rightW, GATE_T); if (d < best) best = d; }
  }
  // free-floating blocks
  for (let i = 0; i < level.blocks.length; i++) {
    const b = level.blocks[i];
    d = rectDist(px, py, b.x, b.y, b.w, b.h);
    if (d < best) best = d;
  }
  if (best <= HIT_R) crashHit = true;
  return best;
}

/* ============================= simulation ============================= */
function crash(demo) {
  if (demo) {
    burst(orb.x, orb.y, 16, polCol(orb.pol), 34, 0, 6);
    resetOrb(level.startX, level.startY);
    return;
  }
  crashes++;
  hearts--;
  orb.alive = false;
  orb.dead = 0.65;
  burst(orb.x, orb.y, 26, polCol(orb.pol), 46, 0, 10);

/* ============================= HUD ============================= */
function updateHUD() {

/* ============================= update ============================= */
function update(dt) {
  tScale += (tScaleTarget - tScale) * Math.min(1, dt * 9);
  const sdt = dt * tScale;

  if (state === 'title') sim(sdt, true);
  else if (state === 'playing') sim(sdt, false);

  if (hintTimer > 0) {
    hintTimer -= dt;
    if (hintTimer <= 0) $('hudHint').classList.remove('on');
  }

  // magnetic crackle bed, throttled
  humAcc += dt;
  if (humAcc > 0.07) {
    humAcc = 0;
    updateHum(state === 'playing' || state === 'title' ? fieldStrength : 0);
  }

  // results count-up + staggered star pops
  if (state === 'results' && resAnim) {
    const ra = resAnim;
    ra.t += dt;
    const p = clamp(ra.t / 1.05, 0, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    const shown = Math.round(ra.earned * eased);
    if (shown !== ra.shown) {
      ra.shown = shown;
      $('resEarned').textContent = '+' + fmt(shown) + ' ⭐';
      $('resBank').textContent = fmt(ra.bankBefore + shown);
      if (ra.dinged < 8 && Math.random() < 0.4) { sfxCoin(0); ra.dinged++; }
    }
    const pips = document.querySelectorAll('#resStars .starPip');
    while (ra.litStars < ra.rating && ra.t > 0.35 + ra.litStars * 0.28) {
      const pip = pips[ra.litStars];
      if (pip) pip.className = 'starPip lit';
      ra.litStars++;
      sfxStar(ra.litStars * 3);
      vibrate(12);
    }
  }

  // particles
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (p.life <= 0) continue;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += p.grav * dt;
    p.vx *= (1 - dt * 1.1); p.vy *= (1 - dt * 0.5);
    p.rot += p.vr * dt;
    p.life -= dt;
  }
  for (let i = 0; i < FMAX; i++) {
    const f = floats[i];
    if (f.life <= 0) continue;
    f.y -= 9 * dt; f.life -= dt;
  }
  for (let i = 0; i < TMAX; i++) {
    const t = trail[i];
    if (t.life > 0) t.life -= dt * 1.9;
  }
  shake = Math.max(0, shake - dt * 48);
  flash = Math.max(0, flash - dt * 2.6);
}

function drawFieldLines() {

    const repel = n.pol === orb.pol;
    const col = polCol(n.pol);

      const ax1 = nx + Math.cos(a1) * (repel ? r2 : r1), ay1 = ny + Math.sin(a1) * (repel ? r2 : r1);
      const am = (a0 + a1) / 2, rm = (r1 + r2) / 2;

      cx.fillStyle = 'rgba(' + col + ',' + (0.4 + flipAnim * 0.5).toFixed(3) + ')';

    const col = polCol(n.pol);
    const nx = sx(n.x), ny = sy(n.y);
    const r = sc(3.2 + n.s * 1.5);
    const g = cx.createRadialGradient(nx, ny, r * 0.15, nx, ny, r * 2.6);
    g.addColorStop(0, 'rgba(' + col + ',0.55)');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(nx, ny, r * 2.6, 0, TAU); cx.fill();
    const bg = cx.createRadialGradient(nx - r * 0.3, ny - r * 0.35, r * 0.1, nx, ny, r);
    bg.addColorStop(0, 'rgba(255,255,255,0.95)');
    bg.addColorStop(0.45, 'rgba(' + col + ',1)');
    bg.addColorStop(1, 'rgba(' + col + ',0.55)');
    cx.fillStyle = bg;
    cx.beginPath(); cx.arc(nx, ny, r, 0, TAU); cx.fill();
    cx.strokeStyle = 'rgba(255,255,255,0.7)';
    cx.lineWidth = Math.max(1, sc(0.32));
    cx.beginPath(); cx.arc(nx, ny, r, 0, TAU); cx.stroke();
    // polarity glyph
    cx.strokeStyle = 'rgba(20,10,30,0.85)';
    cx.lineWidth = Math.max(1.5, sc(0.55));
    cx.beginPath();
    cx.moveTo(nx - r * 0.42, ny); cx.lineTo(nx + r * 0.42, ny);
    if (n.pol === POL_RED) { cx.moveTo(nx, ny - r * 0.42); cx.lineTo(nx, ny + r * 0.42); }
    cx.stroke();
    if (n.orbitR > 0) {
      cx.strokeStyle = 'rgba(' + col + ',0.18)';
      cx.lineWidth = 1;
      cx.beginPath(); cx.ellipse(sx(n.cx), sy(n.cy), sc(n.orbitR), sc(n.orbitR * 0.7), 0, 0, TAU); cx.stroke();
    }
  }
}
function drawTrail() {
  const style = save.trail;
  for (let k = 0; k < TMAX; k++) {
    const idx = (tHead + k) % TMAX;
    const t = trail[idx];
    if (t.life <= 0) continue;
    const a = clamp(t.life, 0, 1);
    const col = polCol(t.pol);
    const px = sx(t.x), py = sy(t.y);
    if (style === 'comet') {
      cx.fillStyle = 'rgba(' + col + ',' + (a * 0.55).toFixed(3) + ')';
      cx.beginPath(); cx.arc(px, py, sc(ORB_R * 0.95 * a), 0, TAU); cx.fill();
    } else if (style === 'ribbon') {
      const off = Math.sin(k * 0.6 + T * 5) * sc(1.6) * a;
      cx.fillStyle = 'rgba(' + col + ',' + (a * 0.5).toFixed(3) + ')';
      cx.fillRect(px - sc(0.5) + off, py - sc(0.5), sc(1.1), sc(1.1));
      cx.fillStyle = 'rgba(255,255,255,' + (a * 0.28).toFixed(3) + ')';
      cx.fillRect(px - sc(0.5) - off, py - sc(0.5), sc(1.1), sc(1.1));
    } else if (style === 'aurora') {
      const hue = (T * 90 + k * 7) % 360;
      cx.fillStyle = 'hsla(' + hue + ',100%,68%,' + (a * 0.5).toFixed(3) + ')';
      cx.beginPath(); cx.arc(px, py, sc(ORB_R * 0.8 * a), 0, TAU); cx.fill();
    } else {
      cx.fillStyle = 'rgba(' + col + ',' + (a * 0.42).toFixed(3) + ')';
      cx.beginPath(); cx.arc(px, py, sc(1.5 * a + 0.4), 0, TAU); cx.fill();
    }
  }
}
function drawOrb() {
  if (!orb.alive) return;
  if (orb.invuln > 0 && (Math.floor(T * 14) % 2 === 0)) return;
  const col = polCol(orb.pol);
  const px = sx(orb.x), py = sy(orb.y);
  const r = sc(ORB_R) * (1 + flipAnim * 0.28);
  // aura
  const g = cx.createRadialGradient(px, py, r * 0.2, px, py, r * 3.2);
  g.addColorStop(0, 'rgba(' + col + ',0.55)');
  g.addColorStop(1, 'rgba(' + col + ',0)');
  cx.fillStyle = g;
  cx.beginPath(); cx.arc(px, py, r * 3.2, 0, TAU); cx.fill();

  const core = save.core;
  if (core === 'quantum') {
    cx.globalAlpha = 0.4;
    cx.fillStyle = 'rgba(' + col + ',1)';
    cx.beginPath(); cx.arc(px + Math.sin(T * 22) * r * 0.5, py + Math.cos(T * 19) * r * 0.5, r, 0, TAU); cx.fill();
    cx.globalAlpha = 1;
  }
  if (core === 'prism') {
    cx.fillStyle = 'rgba(' + col + ',0.95)';
    cx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = T * 1.4 + k * TAU / 6;
      const xx = px + Math.cos(a) * r, yy = py + Math.sin(a) * r;
      if (k === 0) cx.moveTo(xx, yy); else cx.lineTo(xx, yy);
    }
    cx.closePath(); cx.fill();
  } else if (core === 'void') {
    cx.fillStyle = '#0a0616';
    cx.beginPath(); cx.arc(px, py, r, 0, TAU); cx.fill();
    cx.strokeStyle = 'rgba(' + col + ',1)';
    cx.lineWidth = Math.max(1.5, r * 0.28);
    cx.beginPath(); cx.arc(px, py, r * 0.86, 0, TAU); cx.stroke();
  } else {
    const bg = cx.createRadialGradient(px - r * 0.32, py - r * 0.36, r * 0.1, px, py, r);
    bg.addColorStop(0, 'rgba(255,255,255,0.98)');
    bg.addColorStop(0.42, 'rgba(' + col + ',1)');
    bg.addColorStop(1, 'rgba(' + col + ',0.6)');
    cx.fillStyle = bg;
    cx.beginPath(); cx.arc(px, py, r, 0, TAU); cx.fill();
  }
  if (core === 'nova') {
    cx.strokeStyle = 'rgba(255,255,255,0.8)';
    cx.lineWidth = Math.max(1, sc(0.4));
    cx.beginPath();
    for (let k = 0; k < 4; k++) {
      const a = T * 2.2 + k * TAU / 4;
      cx.moveTo(px + Math.cos(a) * r * 1.05, py + Math.sin(a) * r * 1.05);
      cx.lineTo(px + Math.cos(a) * r * 1.85, py + Math.sin(a) * r * 1.85);
    }
    cx.stroke();
  } else if (core === 'bubble') {
    cx.strokeStyle = 'rgba(255,255,255,0.85)';
    cx.lineWidth = Math.max(1, sc(0.35));
    cx.beginPath(); cx.arc(px - r * 0.28, py - r * 0.3, r * 0.4, 0.6, 2.6); cx.stroke();
  } else if (core === 'ember') {
    cx.fillStyle = 'rgba(255,190,90,' + (0.4 + 0.3 * Math.sin(T * 18)).toFixed(3) + ')';
    cx.beginPath(); cx.arc(px, py, r * 0.5, 0, TAU); cx.fill();
  }
  cx.strokeStyle = 'rgba(255,255,255,0.85)';
  cx.lineWidth = Math.max(1, sc(0.34));
  cx.beginPath(); cx.arc(px, py, r, 0, TAU); cx.stroke();

  // net-force indicator
  const sp = Math.sqrt(orb.vx * orb.vx + orb.vy * orb.vy);
  if (sp > 4) {
    const a = Math.atan2(orb.vy, orb.vx);
    cx.fillStyle = 'rgba(255,255,255,0.42)';
    arrowHead(px + Math.cos(a) * r * 2.1, py + Math.sin(a) * r * 2.1, a, sc(1.7));
  }
}
function drawParts() {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (p.life <= 0) continue;
    const a = clamp(p.life / p.max, 0, 1);
    const px = sx(p.x), py = sy(p.y);
    if (p.kind === 2) {                     // expanding ring
      cx.strokeStyle = 'rgba(' + p.col + ',' + (a * 0.8).toFixed(3) + ')';
      cx.lineWidth = Math.max(1, sc(0.6) * a);
      cx.beginPath(); cx.arc(px, py, sc(p.r) * (1 + (1 - a) * 3.4), 0, TAU); cx.stroke();
    } else if (p.kind === 1) {              // shard
      cx.save();
      cx.translate(px, py); cx.rotate(p.rot);
      cx.globalAlpha = a;
      cx.fillStyle = 'rgb(' + p.col + ')';
      cx.fillRect(-sc(p.r) / 2, -sc(p.r) / 4, sc(p.r), sc(p.r) / 2);
      cx.restore();
      cx.globalAlpha = 1;
    } else if (p.kind === 3) {              // soft blob
      cx.fillStyle = 'rgba(' + p.col + ',' + (a * 0.42).toFixed(3) + ')';
      cx.beginPath(); cx.arc(px, py, sc(p.r) * (1 + (1 - a)), 0, TAU); cx.fill();
    } else {                                // spark
      cx.fillStyle = 'rgba(' + p.col + ',' + a.toFixed(3) + ')';
      const s = sc(p.r);
      cx.fillRect(px - s / 2, py - s / 2, s, s);
    }
  }
  cx.globalAlpha = 1;
}
function drawFloats() {
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (let i = 0; i < FMAX; i++) {
    const f = floats[i];
    if (f.life <= 0) continue;
    const a = clamp(f.life / f.max, 0, 1);
    const size = (f.big ? 22 : 16);
    cx.save();
    cx.translate(clamp(sx(f.x), 60, Math.max(61, W - 60)), sy(f.y));
    const s = f.big ? 1 + (1 - a) * 0.16 : 1;
    cx.scale(s, s);
    cx.globalAlpha = a;
    cx.font = '900 ' + size + 'px system-ui, sans-serif';
    cx.lineWidth = 4; cx.strokeStyle = 'rgba(0,0,0,0.72)';
    cx.strokeText(f.txt, 0, 0);
    cx.fillStyle = f.col;
    cx.fillText(f.txt, 0, 0);
    cx.restore();
  }
  cx.globalAlpha = 1;
}
function render() {
  drawBg();
  cx.save();
  if (shake > 0.4) cx.translate(rand(-shake, shake) * 0.45, rand(-shake, shake) * 0.45);
  drawField();
  drawFieldLines();
  drawZones();
  drawGates();
  drawBits();
  drawExit();
  drawNodes();
  drawTrail();
  drawOrb();
  drawParts();
  drawFloats();
  cx.restore();
  if (flash > 0.002) {
    cx.fillStyle = 'rgba(' + flashCol + ',' + (flash * 0.5).toFixed(3) + ')';
    cx.fillRect(0, 0, W, H);
  }
  if (tScale < 0.85) {   // slow-mo vignette
    const a = (1 - tScale) * 0.35;
    cx.fillStyle = 'rgba(140,255,210,' + a.toFixed(3) + ')';
    cx.fillRect(0, 0, W, 3);
    cx.fillRect(0, H - 3, W, 3);
  }
}

/* ============================= input ============================= */
function gestureInit() {
  userGestured = true;
  initAudio();
  resumeAudio();
}
function onPointerDown(e) {
  if (e && e.cancelable) e.preventDefault();
  gestureInit();
  if (state === 'playing' && orb.alive) doFlip(false);
  else if (state === 'title') { doFlip(true); }
}
cv.addEventListener('pointerdown', onPointerDown);
cv.addEventListener('pointerup', e => { if (e && e.cancelable) e.preventDefault(); });
cv.addEventListener('pointercancel', () => { flipLock = 0; });
window.addEventListener('pointerdown', () => { userGestured = true; }, { capture: true });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

$('playBtn').addEventListener('click', () => { gestureInit(); sfxBuy(); startLevel(); });
$('labBtn').addEventListener('click', () => { gestureInit(); openLab(); });
$('labBackBtn').addEventListener('click', () => { gestureInit(); sfxDenied(); goHome(); });
$('contBtn').addEventListener('click', () => { gestureInit(); resAnim = null; startLevel(); });
$('resHomeBtn').addEventListener('click', () => { gestureInit(); goHome(); });
$('retryBtn').addEventListener('click', () => { gestureInit(); startLevel(); });
$('failHomeBtn').addEventListener('click', () => { gestureInit(); goHome(); });
$('muteBtn').addEventListener('click', () => { gestureInit(); setMute(!save.muted); });

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    flipLock = 0;                 // never leave input stuck mid-gesture
    tScaleTarget = 1;
    stopHum();
    persist();
  } else {
    lastT = (window.performance && performance.now) ? performance.now() : Date.now();
    resumeAudio();
    if (state === 'playing') startHum();
  }
});
window.addEventListener('pagehide', () => { flipLock = 0; stopHum(); persist(); });
window.addEventListener('blur', () => { flipLock = 0; });

/* ============================= main loop ============================= */
let lastT = (window.performance && performance.now) ? performance.now() : Date.now();
let frameErrs = 0;
function frame(t) {
  // Re-arm in `finally`: one bad frame must never permanently blank the game.
  try {
    const now = (typeof t === 'number' && isFinite(t)) ? t : lastT + 16.7;
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;
    T += dt;
    update(dt);
    render();
  } catch (e) {
    if (++frameErrs <= 3 && window.console) console.error('[flip] frame error:', e);
  } finally {
    requestAnimationFrame(frame);
  }
}

/* ============================= boot ============================= */
$('muteBtn').textContent = save.muted ? '🔇' : '🔊';
$('muteBtn').classList.add('show');
resize();
buildLevel(Math.max(1, save.level), true);
showScreen('title');
refreshTitle();
updateHUD();
setInterval(persist, 8000);
requestAnimationFrame(frame);
})();
</script>
</body>
