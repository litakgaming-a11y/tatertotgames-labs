      ctx.strokeStyle = '#c8b48a'; ctx.lineWidth = 2; ctx.strokeRect(s.x - 13, s.y - 1, 26, 24);
    } else {
      ctx.fillStyle = '#c4472e'; ctx.fillRect(s.x - 9, s.y, 18, 24);
      ctx.fillStyle = '#f2d9a5'; ctx.fillRect(s.x - 9, s.y + 9, 18, 4);
    }
    // signal flare beacon so nobody is ever hidden
    const t = (G.time * 0.55 + s.flareT) % 1;
    ctx.save();
    ctx.globalAlpha = 0.5 * (1 - t);
    ctx.fillStyle = '#ff9a3a';
    ctx.beginPath(); ctx.arc(s.x, s.y - 22 - t * 46, 4 + t * 9, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#ffd76b';
    ctx.beginPath(); ctx.arc(s.x, s.y - 20, 2.6, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawShooters() {
  for (let i = 0; i < G.shooters.length; i++) {
    const s = G.shooters[i];
    ctx.save();
    ctx.translate(s.x, s.y + 12);
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(0, 1, 8, 2.6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7a5c47';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-4.5, -14, 9, 12, 3) : ctx.rect(-4.5, -14, 9, 12); ctx.fill();
    ctx.fillStyle = '#e3c9a0'; ctx.beginPath(); ctx.arc(0, -17, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5c4636'; ctx.beginPath(); ctx.arc(0, -18.5, 4.6, Math.PI, TAU); ctx.fill();
    ctx.strokeStyle = '#3d3128'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-2, -12); ctx.lineTo(9, -19); ctx.stroke();
    if (s.muzzle > 0) {
      ctx.fillStyle = '#ffe08a';
      ctx.beginPath(); ctx.arc(10, -19.5, 3 + s.muzzle * 22, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  // tracer arcs
  for (let i = 0; i < G.tracers.length; i++) {
    const tr = G.tracers[i];
    ctx.save();
    ctx.strokeStyle = 'rgba(255,190,90,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let j = 0; j < tr.trail.length; j += 2) {
      if (j === 0) ctx.moveTo(tr.trail[j], tr.trail[j + 1]); else ctx.lineTo(tr.trail[j], tr.trail[j + 1]);
    }
    ctx.stroke();
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath(); ctx.arc(tr.x, tr.y, 3, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.arc(tr.x, tr.y, 7, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  for (let i = 0; i < G.particles.length; i++) {
    const p = G.particles[i];
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = clamp(a, 0, 1) * (p.kind === 'dust' ? 0.5 : 1);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.kind === 'dust' ? 1 : a), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  ctx.textAlign = 'center';
  for (let i = 0; i < G.popups.length; i++) {
    const q = G.popups[i];
    const t = q.t / q.life;
    ctx.globalAlpha = clamp(1 - t * t, 0, 1);
    ctx.fillStyle = q.col;
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText(q.text, q.x, q.y - easeOutCubic(t) * 34);
  }
  ctx.globalAlpha = 1;
}

function drawNight() {
  if (!G.night) return;
  const ch = G.chopper;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = 'rgba(6,12,30,.74)';
  ctx.fillRect(0, 0, W, H);
  const sx = (ch.x - G.cam.x) * SCALE + W * 0.5;
  const sy = (ch.y - G.cam.y) * SCALE + H * 0.5;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // searchlight cone straight down from the belly
  const reach = 300 * SCALE;
  const gsp = ctx.createLinearGradient(sx, sy, sx, sy + reach);
  gsp.addColorStop(0, 'rgba(255,244,200,.30)');
  gsp.addColorStop(1, 'rgba(255,244,200,0)');
  ctx.fillStyle = gsp;
  ctx.beginPath();
  ctx.moveTo(sx - 12 * SCALE, sy);
  ctx.lineTo(sx - 130 * SCALE, sy + reach);
  ctx.lineTo(sx + 130 * SCALE, sy + reach);
  ctx.lineTo(sx + 12 * SCALE, sy);
  ctx.closePath();
  ctx.fill();
  const rg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 190 * SCALE);
  rg.addColorStop(0, 'rgba(255,240,200,.35)');
  rg.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(sx - 200 * SCALE, sy - 200 * SCALE, 400 * SCALE, 400 * SCALE);
  ctx.restore();
}

function drawOverlays() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // under-fire vignette
  if (G.vign > 0.02) {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.28, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(255,60,60,0)');
    g.addColorStop(1, 'rgba(255,50,50,' + (0.42 * G.vign).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  // fuel-critical amber pulse
  if (G.screen === 'playing' && G.fuel / Math.max(1, G.fuelMax) < 0.12) {
    const a = 0.16 + 0.1 * Math.sin(G.time * 8);
    const g = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.34, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,170,60,0)');
    g.addColorStop(1, 'rgba(255,170,60,' + a.toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (G.flash > 0.01) {
    ctx.fillStyle = 'rgba(255,240,200,' + (0.5 * G.flash).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  // steering stick feedback
  if (G.input.active && G.screen === 'playing') {
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = '#dcff9a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(G.input.ax, G.input.ay, STICK_R, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#dcff9a';
    ctx.beginPath(); ctx.arc(G.input.ax + G.steer.x * STICK_R, G.input.ay + G.steer.y * STICK_R, 15, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // off-screen objective arrow
  if (G.screen === 'playing') {
    let tx = null, ty = null, col = '#ffd76b';
    if (G.cargo || G.delivered >= G.quota) { tx = G.lzX; ty = G.lzY; col = '#9ede4b'; }
    else {
      let bd = 1e9;
      for (const s of G.survivors) {
        if (s.taken || s.done) continue;
        const d = Math.abs(s.x - G.chopper.x);
        if (d < bd) { bd = d; tx = s.x; ty = s.y; }
      }
    }
    if (tx !== null) {
      const sx = (tx - G.cam.x) * SCALE + W * 0.5;
      if (sx < 40 || sx > W - 40) {
        const edge = sx < 40 ? 30 : W - 30;
        const sy = clamp((ty - G.cam.y) * SCALE + H * 0.5, 90, H - 110);
        ctx.save();
        ctx.translate(edge, sy);
        ctx.rotate(sx < 40 ? Math.PI : 0);
        ctx.globalAlpha = 0.55 + 0.25 * Math.sin(G.time * 5);
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawClouds();
  drawParallax();
  worldTransform();
  drawTerrain();
  drawGrass();
  drawTowers();
  drawPad();
  drawSurvivors();
  drawShooters();
  // shadows for depth
  const load = G.parts[0];
  if (load) drawShadowFor(load.x, load.y, (load.r || 6) + 3, 1);
  if (G.parts[1]) drawShadowFor(G.parts[1].x, G.parts[1].y, (G.parts[1].r || 6) + 3, 1);
  drawShadowFor(G.chopper.x, G.chopper.y, 20, 0.8);
  drawFlood();
  drawCable();
  if (load) drawCargoBody(load, load.type, G.parts[1]);
  drawChopper();
  drawParticles();
  drawPopups();
  drawNight();
  drawOverlays();
}

// ================================================================
//                        DOM / SCREENS / META
// ================================================================
const $ = id => document.getElementById(id);
const el = {
  hud: $('hud'), hudMission: $('hudMission'), hudQuota: $('hudQuota'), hudHull: $('hudHull'),
  hudSalv: $('hudSalv'), fuelWrap: $('fuelWrap'), fuelBar: $('fuelBar'),
  hintBar: $('hintBar'), winchBtn: $('winchBtn'), winchLbl: $('winchLbl'),
  title: $('title'), base: $('base'), win: $('win'), lose: $('lose'),
  titleBest: $('titleBest'), titleSalv: $('titleSalv'), titleSaved: $('titleSaved'),
  baseSalv: $('baseSalv'), baseStage: $('baseStage'), panelWrap: $('panelWrap'),
  tabUp: $('tabUp'), tabBuild: $('tabBuild'), tabRoster: $('tabRoster'),
  stars: $('stars'), winSalv: $('winSalv'), winRoster: $('winRoster'),
  loseHint: $('loseHint'), muteBtn: $('muteBtn')
};

const UPGRADES = [
  { key: 'damp', icon: '🪢', name: 'Cable Damping', base: 60,
    desc: l => 'Load settles ' + Math.round((0.22 + 0.20 * l) / 0.22 * 100 - 100) + '% faster' },
  { key: 'fuel', icon: '⛽', name: 'Fuel Cell', base: 52,
    desc: l => '+' + (13 * l) + '% fuel on every sortie' },
  { key: 'hull', icon: '🛡️', name: 'Hull Plating', base: 78,
    desc: l => (3 + (l >= 3 ? 1 : 0) + (l >= 5 ? 1 : 0)) + ' hull · ' + Math.round(l * 10) + '% shots shrug off' },
  { key: 'winch', icon: '⚙️', name: 'Winch Speed', base: 48,
    desc: l => (46 + 13 * l) + ' cable units / sec' }
];
function upCost(u, lvl) { return Math.round(u.base * Math.pow(1.75, lvl)); }

const STAGES = [
  { n: 'Landing Pad',   i: '🅷', c: 90 },
  { n: 'Tent Line',     i: '⛺', c: 150 },
  { n: 'Hangar',        i: '🏚️', c: 240 },
  { n: 'Radar Mast',    i: '📡', c: 360 },
  { n: 'Fuel Depot',    i: '🛢️', c: 520 },
  { n: 'Barracks',      i: '🏠', c: 720 },
  { n: 'Watchtower',    i: '🗼', c: 960 },
  { n: 'Sandbag Berm',  i: '🧱', c: 1250 },
  { n: 'Windsock',      i: '🎏', c: 1600 },
  { n: 'Floodlights',   i: '💡', c: 2050 },
  { n: 'Supply Stack',  i: '📦', c: 2600 },
  { n: 'Colours',       i: '🚩', c: 3300 }
];

function setScreen(name) {
  G.screen = name;
  el.title.classList.toggle('hidden', name !== 'title');
  el.base.classList.toggle('hidden', name !== 'base');
  el.win.classList.toggle('hidden', name !== 'win');
  el.lose.classList.toggle('hidden', name !== 'lose');
  el.hud.classList.toggle('show', name === 'playing');
  el.winchBtn.classList.toggle('show', name === 'playing');
  if (name !== 'playing') { el.hintBar.classList.remove('show'); }
  if (name === 'title') {
    el.titleBest.textContent = S.best;
    el.titleSalv.textContent = S.salv;
    el.titleSaved.textContent = S.saved;
  }
  if (name === 'win') showWin();
  if (name === 'lose') showLose();
  if (name === 'base') renderBase();
}

function showWin() {
  const spans = el.stars.children;
  for (let i = 0; i < spans.length; i++) {
    spans[i].className = '';
    (function (i) {
      setTimeout(function () {
        if (!spans[i]) return;
        spans[i].className = i < G.starCount ? 'lit pop' : 'pop';
        if (i < G.starCount) tone(660 + i * 180, 0.2, 'triangle', 0.16);
      }, 260 + i * 230);
    })(i);
  }
  const target = G.salvEarned;
  let shown = 0;
  const t0 = performance.now();
  el.winSalv.textContent = '0';
  function countUp() {
    const k = clamp((performance.now() - t0) / 900, 0, 1);
    shown = Math.round(target * easeOutCubic(k));
    el.winSalv.textContent = shown;
    if (k < 1 && G.screen === 'win') requestAnimationFrame(countUp);
  }
  requestAnimationFrame(countUp);
  const names = G.rescuedNames.slice(0, 6);
  const left = G.survivors.filter(s => !s.done && !s.taken).length;
  el.winRoster.innerHTML = (names.length
      ? '🎖️ ABOARD: ' + names.map(n => '<b>' + n + '</b>').join(' · ')
      : 'CARGO DELIVERED')
    + (left ? '<br><span style="color:#9db28f">' + left + ' left in the field</span>' : '');
}

function showLose() {
  const tips = [
    'Fly INTO the swing to kill it — chasing the load is how you damp it.',
    'Short cable = stiff and controllable. Long cable = reach for the pickup.',
    'A heavy crate steals your climb. Winch it in before you go vertical.',
    'Fuel burns faster the harder you steer. Smooth is cheap.',
    'Tracer arcs are lobbed — break your line, do not out-run them.',
    'Deliberately pendulum the load to swing it over an obstacle.'
  ];
  const left = G.survivors.filter(s => !s.done).length;
  el.loseHint.innerHTML = (left ? left + ' still in the field. ' : '') +
    tips[Math.floor(Math.random() * tips.length)];
}

function renderBase() {
  el.baseSalv.textContent = '🔩 ' + S.salv + ' salvage';
  el.baseStage.textContent = 'STAGE ' + S.stage + ' / ' + BASE_STAGES +
    (S.stage >= BASE_STAGES ? ' · BASE COMPLETE' : ' · NEXT: ' + STAGES[S.stage].n);
  el.tabUp.classList.toggle('on', G.baseTab === 'up');
  el.tabBuild.classList.toggle('on', G.baseTab === 'build');
  el.tabRoster.classList.toggle('on', G.baseTab === 'roster');
  let html = '';
  if (G.baseTab === 'up') {
    for (const u of UPGRADES) {
      const lvl = S.up[u.key];
      const maxed = lvl >= MAX_UP;
      const cost = maxed ? 0 : upCost(u, lvl);
      let pips = '';
      for (let i = 0; i < MAX_UP; i++) pips += '<div class="pip' + (i < lvl ? ' on' : '') + '"></div>';
      html += '<div class="upCard"><div class="upIcon">' + u.icon + '</div>' +
        '<div class="upInfo"><div class="upName">' + u.name + '</div>' +
        '<div class="upDesc">' + u.desc(Math.min(MAX_UP, lvl + (maxed ? 0 : 1))) + '</div>' +
        '<div class="pips">' + pips + '</div></div>' +
        (maxed ? '<button class="buyBtn maxed" disabled>MAX</button>'
               : '<button class="buyBtn" data-buy="' + u.key + '"' + (S.salv < cost ? ' disabled' : '') +
                 '>🔩 ' + cost + '</button>') + '</div>';
    }
  } else if (G.baseTab === 'build') {
    for (let i = 0; i < STAGES.length; i++) {
      const st = STAGES[i];
      const done = i < S.stage;
      const next = i === S.stage;
      html += '<div class="stageRow' + (done ? ' done' : (next ? '' : ' locked')) + '">' +
        '<div class="upIcon">' + st.i + '</div>' +
        '<div class="upInfo"><div class="upName">' + (i + 1) + '. ' + st.n + '</div>' +
        '<div class="upDesc">' + (done ? 'Built' : next ? 'Ready to raise' : 'Locked') + '</div></div>' +
        (done ? '<button class="buyBtn maxed" disabled>✔</button>'
              : next ? '<button class="buyBtn" data-build="1"' + (S.salv < st.c ? ' disabled' : '') + '>🔩 ' + st.c + '</button>'
                     : '<button class="buyBtn" disabled>🔒</button>') + '</div>';
    }
  } else {
    const list = S.roster.slice().sort((a, b) => b.c - a.c);
    if (!list.length) html = '<div class="emptyNote">No personnel on the roster yet. Every soul you winch out lands here — and they remember.</div>';
    for (const r of list) {
      html += '<div class="rosterRow">🎖️ <b>' + r.n + '</b><span class="cnt">' + r.c + ' rescue' + (r.c > 1 ? 's' : '') + '</span></div>';
    }
  }
  el.panelWrap.innerHTML = html;
}

el.panelWrap.addEventListener('click', e => {
  const t = e.target;
  if (!t || !t.getAttribute) return;
  const key = t.getAttribute('data-buy');
  if (key) {
    const u = UPGRADES.filter(x => x.key === key)[0];
    if (!u) return;
    const lvl = S.up[key];
    if (lvl >= MAX_UP) return;
    const cost = upCost(u, lvl);
    if (S.salv < cost) { sfxDenied(); return; }
    S.salv -= cost;
    S.up[key] = lvl + 1;
    G.U = upVals();
    persist();
    sfxBuy(); vibrate(25);
    window.TTG?.track('upgrade_bought', { level: S.mission, value: cost });
    renderBase();
    return;
  }
  if (t.getAttribute('data-build')) {
    if (S.stage >= BASE_STAGES) return;
    const cost = STAGES[S.stage].c;
    if (S.salv < cost) { sfxDenied(); return; }
    S.salv -= cost;
    S.stage++;
    persist();
    sfxBuy(); vibrate([20, 40, 20]);
    window.TTG?.track('upgrade_bought', { level: S.mission, value: cost });
    renderBase();
  }
});

// ---------------- HUD ----------------
const hudCache = { m: -1, q: '', h: -1, s: -1, f: -1, hint: '', cls: '' };
function updateHud() {
  if (G.mission !== hudCache.m) { hudCache.m = G.mission; el.hudMission.textContent = (G.convoy ? 'CONVOY ' : 'MISSION ') + G.mission; }
  const q = '🎖️ ' + G.delivered + ' / ' + G.quota;
  if (q !== hudCache.q) { hudCache.q = q; el.hudQuota.textContent = q; }
  const ch = G.chopper;
  if (ch.hull !== hudCache.h) {
    hudCache.h = ch.hull;
    let s = '🛡️';
    for (let i = 0; i < ch.hullMax; i++) s += '<span' + (i < ch.hull ? '' : ' class="gone"') + '>▮</span>';
    el.hudHull.innerHTML = s;
  }
  const salv = S.salv + G.salvEarned;
  if (salv !== hudCache.s) { hudCache.s = salv; el.hudSalv.textContent = '🔩 ' + salv; }
  const pct = clamp(G.fuel / Math.max(1, G.fuelMax), 0, 1);
  const pr = Math.round(pct * 100);
  if (pr !== hudCache.f) {
    hudCache.f = pr;
    el.fuelBar.style.width = pr + '%';
    const cls = pr < 12 ? 'crit' : pr < 25 ? 'low' : '';
    if (cls !== hudCache.cls) { hudCache.cls = cls; el.fuelWrap.className = cls; }
  }
  const hintOn = G.hintT > 0 && G.screen === 'playing';
  if (hintOn && G.hint !== hudCache.hint) { hudCache.hint = G.hint; el.hintBar.textContent = G.hint; }
  el.hintBar.classList.toggle('show', hintOn);
  const lbl = G.cable.dir < 0 ? 'REEL OUT' : 'REEL IN';
  if (el.winchLbl.textContent !== lbl) el.winchLbl.textContent = lbl;
}

// ---------------- input ----------------
function releaseInput() {
  G.input.active = false;
  G.input.id = -1;
  G.steerT.x = 0; G.steerT.y = 0;
  G.keys.l = G.keys.r = G.keys.u = G.keys.d = 0;
}

function onDown(e) {
  ensureAudio();
  if (G.screen !== 'playing') return;
  const I = G.input;
  if (I.active) return;
  I.active = true;
  I.id = (e.pointerId === undefined ? 0 : e.pointerId);
  I.ax = I.cx = e.clientX;
  I.ay = I.cy = e.clientY;
  I.t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  I.moved = 0;
  if (cv.setPointerCapture && e.pointerId !== undefined) { try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
}
function onMove(e) {
  const I = G.input;
  if (!I.active) return;
  if (e.pointerId !== undefined && I.id !== e.pointerId) return;
  I.moved += Math.hypot(e.clientX - I.cx, e.clientY - I.cy);
  I.cx = e.clientX; I.cy = e.clientY;
}
function onUp(e) {
  const I = G.input;
  if (!I.active) return;
  if (e && e.pointerId !== undefined && I.id !== e.pointerId) return;
  const dt = (typeof performance !== 'undefined' ? performance.now() : Date.now()) - I.t0;
  const tap = I.moved < 16 && dt < 280;
  releaseInput();
  if (tap && G.screen === 'playing') toggleWinch();
}
cv.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
window.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { releaseInput(); }
  else {
    last = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    G.physAcc = 0;
    releaseInput();
    if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { /* ignore */ } }
  }
});
window.addEventListener('blur', releaseInput);

window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') G.keys.l = 1;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') G.keys.r = 1;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') G.keys.u = 1;
  else if (k === 'ArrowDown' || k === 's' || k === 'S') G.keys.d = 1;
  else if (k === ' ' || k === 'Enter') {
    ensureAudio();
    if (G.screen === 'playing') toggleWinch();
    else if (G.screen === 'title') startMission(S.mission);
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') G.keys.l = 0;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') G.keys.r = 0;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') G.keys.u = 0;
  else if (k === 'ArrowDown' || k === 's' || k === 'S') G.keys.d = 0;
});

el.winchBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); ensureAudio(); toggleWinch(); });
el.winchBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });

function bindTap(id, fn) {
  const node = $(id);
  if (!node) return;
  node.addEventListener('click', () => { ensureAudio(); sfxClick(); fn(); });
}
bindTap('playBtn', () => startMission(S.mission));
bindTap('baseBtn', () => { G.baseFrom = 'title'; setScreen('base'); });
bindTap('baseBack', () => setScreen(G.baseFrom === 'playing' ? 'title' : G.baseFrom));
bindTap('nextBtn', () => startMission(S.mission));
bindTap('winBaseBtn', () => { G.baseFrom = 'win'; setScreen('base'); });
bindTap('winTitleBtn', () => setScreen('title'));
bindTap('retryBtn', () => startMission(G.mission));
bindTap('loseBaseBtn', () => { G.baseFrom = 'lose'; setScreen('base'); });
bindTap('loseTitleBtn', () => setScreen('title'));
el.tabUp.addEventListener('click', () => { ensureAudio(); sfxClick(); G.baseTab = 'up'; renderBase(); });
el.tabBuild.addEventListener('click', () => { ensureAudio(); sfxClick(); G.baseTab = 'build'; renderBase(); });
el.tabRoster.addEventListener('click', () => { ensureAudio(); sfxClick(); G.baseTab = 'roster'; renderBase(); });

el.muteBtn.addEventListener('click', () => {
  ensureAudio();
  S.mute = !S.mute;
  persist();
  if (master) { try { master.gain.value = S.mute ? 0 : 0.5; } catch (e) { /* ignore */ } }
  if (S.mute) setRotor(0, 52);
  el.muteBtn.textContent = S.mute ? '🔇' : '🔊';
  if (!S.mute) sfxClick();
});
el.muteBtn.textContent = S.mute ? '🔇' : '🔊';

// ---------------- main loop ----------------
let last = (typeof performance !== 'undefined' ? performance.now() : Date.now());
function frame(now) {
  // Re-arm in `finally`: one bad frame must never permanently blank the game.
  try {
    const dt = clamp((now - last) / 1000, 0, 0.034);
    last = now;
    update(dt);
    draw();
  } catch (e) {
    if (++frameErrs <= 3 && typeof console !== 'undefined') console.error('[chopper] frame error:', e);
  } finally {
    requestAnimationFrame(frame);
  }
}

// ---------------- boot ----------------
resize();
genMission(S.mission);
G.chopper.x = G.lzX;
G.chopper.y = G.lzY - 170;
G.fuel = G.fuelMax = 100;
resetTether();
G.parts[0].x = G.chopper.x; G.parts[0].y = G.chopper.y + G.cable.len;
G.parts[0].px = G.parts[0].x; G.parts[0].py = G.parts[0].y;
G.cam.x = G.chopper.x; G.cam.y = G.chopper.y;
G.padCrew = [];
setScreen('title');
requestAnimationFrame(frame);

// ---------------- test hooks (harness only; harmless in production) ----------------
window.__CHOPPER__ = {
  G: G, S: S, CARGO: CARGO,
  consts: { SUB_DT: SUB_DT, CABLE_MIN: CABLE_MIN, CABLE_MAX: CABLE_MAX, MAX_PV: MAX_PV, CH_R: CH_R, GROUND_Y: GROUND_Y },
  update: update, draw: draw, physicsStep: physicsStep,
  startMission: startMission, missionCfg: missionCfg, genMission: genMission,
  attachCargo: attachCargo, releaseCargo: releaseCargo, toggleWinch: toggleWinch,
  setScreen: setScreen, groundAt: groundAt, ceilAt: ceilAt, surfaceAt: surfaceAt,
  swingMetric: swingMetric, upVals: upVals, persist: persist,
  setSteer: function (x, y) { G.steerT.x = clamp(x, -1, 1); G.steerT.y = clamp(y, -1, 1); G.steer.x = G.steerT.x; G.steer.y = G.steerT.y; },
  setWinchTarget: function (v) { G.cable.target = clamp(v, CABLE_MIN, CABLE_MAX); },
  cableLen: function (i) {
    const cab = G.cables[i || 0];
    if (!cab) return 0;
    const p = G.parts[cab.p];
    if (!p) return 0;
    return Math.hypot(p.x - (G.chopper.x + cab.ox), p.y - (G.chopper.y + cab.oy));
  },
  loadSpeed: function () { const p = G.parts[0]; return p ? Math.hypot(p.vx, p.vy) : 0; },
  nanResets: function () { return G.nanResets; }
};
</script>
