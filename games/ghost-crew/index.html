<style>

  /* ---------------- HUD ---------------- */
  #hud{position:fixed;left:0;right:0;top:0;z-index:4;display:none;

    backdrop-filter:blur(5px);min-height:32px;display:flex;align-items:center;gap:6px}
  #hCrew{flex:1;justify-content:center;gap:7px}

  #btnMute{pointer-events:auto;background:rgba(14,7,38,.62);border:1px solid rgba(140,190,255,.22);

  #barWrap{margin:7px auto 0;max-width:420px;height:7px;border-radius:5px;

'use strict';
/* ==================================================================
   GHOST CREW — record a run, rewind, cooperate with your past selves
   Recording model is deliberately dumb: we store the player's
   position + flags per fixed timestep in typed arrays and replay
   them frame-by-frame. No deterministic physics replay anywhere.
   ================================================================== */

const TAU = Math.PI * 2;
const SAVE_KEY = 'ttg_ghost';
const FONT = '"Trebuchet MS","Segoe UI",system-ui,sans-serif';

const COLS = 13, ROWS = 10;

/* movement (tiles / second) */
const SPEED = 5.6;
const GRAV = 46;
const JUMP_V = 15.4;
const HALF_W = 0.30;
const BODY_H = 0.82;

/* ---------- tiny helpers ---------- */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const easeOutBack = t => { const c = 1.70158; t -= 1; return 1 + t * t * ((c + 1) * t + c); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
function vib(ms) { try { if (navigator && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
function seededRand(seed) { let s = (seed >>> 0) || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ==================================================================

   ================================================================== */
const SKINS = [

  { name: 'BUBBLE',  body: '#ff9ecb', dark: '#c9558f', hat: 'party',  cost: 27 },
  { name: 'COSMIC',  body: '#b79cff', dark: '#6d4fd1', hat: 'antenna',cost: 42 },

/* ==================================================================
   LEVELS  (13 x 10 ASCII, single screen, never scrolls)
     #  solid      .  empty      S  spawn      E  exit door
     a  hold plate ch0      b  hold plate ch1
     x  timed plate ch0     y  timed plate ch1
     L  one-use lever ch0   M  one-use lever ch1
     A  gate ch0            B  gate ch1        &  gate ch0 AND ch1
   plats: {cx, w, r0, r1, period, phase}   (cx/w in tiles, r = top surface row)

/* ==================================================================
   PERSISTENCE  (every access guarded; schema repaired on load)
   ================================================================== */
function defaultStore() {
  return { v: 1, best: 1, level: 1, stars: {}, skin: 0, unlocked: [0], photos: 0, muted: false };
}
function loadStore() {
  const d = defaultStore();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return d;
    const o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return d;
    d.best = Math.max(1, o.best | 0 || 1);
    d.level = Math.max(1, o.level | 0 || 1);
    d.skin = clamp(o.skin | 0, 0, SKINS.length - 1);
    d.photos = Math.max(0, o.photos | 0);
    d.muted = !!o.muted;
    if (o.stars && typeof o.stars === 'object') {
      for (const k in o.stars) {
        const n = parseInt(k, 10);
        const v = o.stars[k] | 0;
        if (n > 0 && v > 0) d.stars[n] = clamp(v, 1, 3);
      }
    }
    if (Array.isArray(o.unlocked)) {
      const set = { 0: true };
      for (const u of o.unlocked) { const i = u | 0; if (i >= 0 && i < SKINS.length) set[i] = true; }
      d.unlocked = Object.keys(set).map(Number);
    }
    if (d.unlocked.indexOf(d.skin) < 0) d.skin = 0;
  } catch (e) { return defaultStore(); }
  return d;
}
let store = loadStore();
function saveStore() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(store)); } catch (e) {} }
function totalStars() { let s = 0; for (const k in store.stars) s += store.stars[k] | 0; return s; }

/* ==================================================================
   DOM refs
   ================================================================== */
function $(id) { return document.getElementById(id); }
const cvs = $('c');
const ctx = cvs.getContext('2d');
const elHud = $('hud'), elLevel = $('hLevel'), elCrew = $('hCrew'), elRew = $('hRew');
const elBar = $('bar'), elHint = $('hint'), elCtrl = $('ctrl');
const zoneL = $('zoneL'), zoneR = $('zoneR');
const btnGo = $('btnGo'), btnRew = $('btnRew'), btnMute = $('btnMute');
const scTitle = $('titleScreen'), scWin = $('winScreen'), scFail = $('failScreen'), scMeta = $('metaScreen');
const badge = $('badge'), probe = $('probe');

/* ==================================================================
   VIEW / CANVAS  (dpr backing store + EXPLICIT css size — a canvas with
   no css size lays out at its attribute size = 2x the viewport on phones)
   ================================================================== */
const view = { W: 360, H: 640, dpr: 1, safeTop: 0, safeBot: 0 };
const cam = { ox: 0, oy: 0, ts: 28 };

function readSafeArea() {
  try {
    const cs = window.getComputedStyle(probe);
    view.safeTop = parseFloat(cs.paddingTop) || 0;
    view.safeBot = parseFloat(cs.paddingBottom) || 0;
  } catch (e) { view.safeTop = 0; view.safeBot = 0; }
}
function layoutWorld() {
  const topRes = 90 + view.safeTop;
  const botRes = 132 + view.safeBot;
  const availW = Math.max(60, view.W - 18);
  const availH = Math.max(60, view.H - topRes - botRes);

/* ==================================================================

   ================================================================== */
function levelDef(n) {
  const idx = (n - 1) % LEVELS.length;
  const variant = Math.floor((n - 1) / LEVELS.length);
  const base = LEVELS[idx];
  const mirror = (variant % 2) === 1;
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    const row = base.g[r] || '#############';
    g.push(mirror ? row.split('').reverse().join('') : row);
  }
  const ps = [];
  for (let i = 0; i < base.plats.length; i++) {
    const p = base.plats[i];
    ps.push({ cx: mirror ? (COLS - p.cx) : p.cx, w: p.w, r0: p.r0, r1: p.r1, period: p.period, phase: p.phase });
  }
  const seconds = Math.max(13, BASE_TAKE_SECONDS - variant * 2);
  const extra = variant >= 2 ? 1 : 2;

    n, name: base.name, hint: variant === 0 ? base.hint : '',
    crew: base.crew, par: base.par, g, plats: ps, variant,
    takeFrames: Math.min(MAX_REC, Math.round(seconds / STEP)),

function tileAt(c, r) {

}

  if (ch === 'B') return !chActive[1];
  if (ch === '&') return !(chActive[0] && chActive[1]);

      else if (ch === 'E') lv.exit = { c, r };

      if (seen[c + ',' + r]) continue;

    }

    const c = Math.floor(player.x - HALF_W);
    for (let r = r0; r <= r1; r++) {

  let grounded = false;

    }

    }

      const wasAbove = prevBottom <= p.prevTop + 0.06;
      if (wasAbove && player.y >= p.top - 0.02 && player.y <= p.top + 0.55) {

    const bx = i < 0 ? player.x : ghosts[i].x;
    const by = i < 0 ? player.y : ghosts[i].y;
    const ft = feetTile(bx, by);
    const ch = tileAt(ft.c, ft.r);

    else if (ch === 'b') hold[1] = true;
    else if (ch === 'x') chTimer[0] = TIMED_DUR;
    else if (ch === 'y') chTimer[1] = TIMED_DUR;

    for (let k = 0; k < levers.length; k++) {
      const L = levers[k];

        sfx.lever(); vib(14);

  player.squash += (1 - player.squash) * 0.22;

  updateChannels(STEP);

  /* ---- record this frame ---- */
  if (rec.n < rec.cap) {
    const i = rec.n;
    rec.x[i] = player.x; rec.y[i] = player.y;
    rec.f[i] = (player.face > 0 ? 1 : 0) | (player.walking ? 2 : 0) | (player.air ? 4 : 0);
    rec.n = i + 1;
  }

  /* ---- win check ---- */
  if (crewAtDoor() >= lv.crew) doWin();
}

function updateGates(dt) {
  for (let i = 0; i < gates.length; i++) {
    const G = gates[i];
    const want = G.type === 2 ? (chActive[0] && chActive[1]) : chActive[G.type];
    G.open += ((want ? 1 : 0) - G.open) * Math.min(1, dt * 11);
  }
  for (let i = 0; i < levers.length; i++) {
    const L = levers[i];
    L.anim += (((L.on ? 1 : 0)) - L.anim) * Math.min(1, dt * 10);
  }
}

/* ==================================================================
   TAKE FLOW — GO / REWIND / CUT
   ================================================================== */
function startTake() {
  if (scene !== 'play' || phase !== 'ready') return;
  ensureAudio();
  phase = 'acting';
  rec = newRec(takeFrames + 4);
  tl = 0; acc = 0;
  sfx.go(); vib(12);
  addPop(view.W / 2, view.H * 0.32, 'ACTION!', '#7cf5d0', 34);
  refreshCtrl();
}
function autoCut() {
  if (phase !== 'acting') return;
  addPop(view.W / 2, view.H * 0.3, 'CUT!', '#ffd469', 32);
  doRewind(true);
}
function doRewind(auto) {
  if (scene !== 'play' || phase !== 'acting') return;
  if (rec.n < 6) {                     /* nothing worth recording — free reset */
    phase = 'ready'; resetTake(); refreshCtrl(); return;
  }
  if (rewindsLeft <= 0) { doFail(); return; }
  rewindsLeft--; rewindsUsed++;
  rewGhost = makeGhost(rec, store.skin, ghosts.length + 1);
  rewFrom = tl;
  rewT = 0;
  phase = 'rewind';
  ensureAudio();
  sfx.rewind(); vib([10, 30, 10]);
  shake(0.5, 5);
  refreshCtrl();
  if (!auto) addPop(view.W / 2, view.H * 0.3, 'REWIND', '#ff6fb2', 30);
}
function finishRewind() {
  ghosts.push(rewGhost);
  rewGhost = null;
  phase = 'ready';
  resetTake();
  sfx.ghostBorn();
  refreshCtrl();
  syncHud(true);
}

function doWin() {
  if (phase === 'celebrate') return;
  phase = 'celebrate';
  celebT = 0;
  lastStars = rewindsUsed <= lv.par ? 3 : (rewindsUsed <= lv.par + 1 ? 2 : 1);
  sfx.teamwork(); vib([15, 40, 15, 40, 30]);
  shake(0.4, 7);
  const ex = tx(lv.exit.c + 0.5), ey = ty(lv.exit.r + 1);
  addPop(ex, ey - cam.ts * 2.2, 'TEAMWORK!', '#ffd469', 30);
  burst(70, () => ({ type: 'confetti', x: ex + rnd(-60, 60), y: ey - rnd(20, 160),
    vx: rnd(-140, 140), vy: rnd(-260, -40), g: 420, life: rnd(1.1, 2.1), t: 0,
    size: rnd(3, 7), col: pick(['#7cf5d0', '#ffd469', '#ff6fb2', '#6fe0ff', '#ffffff']),
    rot: rnd(0, TAU), vr: rnd(-9, 9) }));
  for (let i = 0; i < ghosts.length; i++) if (atExit(ghosts[i].x, ghosts[i].y)) ghosts[i].cheer = 1;
  window.TTG?.track('level_complete', { level: lv.n, value: lastStars });
  const prev = store.stars[lv.n] | 0;
  if (lastStars > prev) { store.stars[lv.n] = lastStars; }
  store.best = Math.max(store.best | 0, lv.n);
  store.level = lv.n + 1;
  if (lv.n % LEVELS_PER_WORLD === 0) {
    const worlds = Math.floor(lv.n / LEVELS_PER_WORLD);
    if (worlds > (store.photos | 0)) { store.photos = worlds; newPhoto = true; }
  }
  saveStore();
  checkUnlocks();
}
function doFail() {
  phase = 'ready';
  window.TTG?.track('game_over', { level: lv ? lv.n : level });
  sfx.fail(); vib(70);
  $('failSub').textContent = 'You used all ' + (lv ? lv.limit : 0) +
    ' rewinds on "' + (lv ? lv.name : '') + '". Fresh take?';
  showScreen(scFail);
  refreshCtrl();
}
function checkUnlocks() {
  const ts = totalStars();
  for (let i = 0; i < SKINS.length; i++) {
    if (ts >= SKINS[i].cost && store.unlocked.indexOf(i) < 0) {
      store.unlocked.push(i);
      saveStore();
      sfx.unlock();
      addPop(view.W / 2, view.H * 0.5, 'NEW SKIN: ' + SKINS[i].name, SKINS[i].body, 24);
      window.TTG?.track('skin_unlocked', { level: lv ? lv.n : level, value: i });
    }
  }
}

/* ==================================================================
   SCREENS
   ================================================================== */
function hideAllScreens() {
  scTitle.classList.remove('show');
  scWin.classList.remove('show');
  scFail.classList.remove('show');
  scMeta.classList.remove('show');
}
function showScreen(el) { hideAllScreens(); if (el) el.classList.add('show'); }

function refreshCtrl() {
  const playing = scene === 'play';
  elHud.classList.toggle('show', playing);
  elCtrl.classList.toggle('show', playing && (phase === 'ready' || phase === 'acting'));
  btnGo.style.display = (playing && phase === 'ready') ? 'flex' : 'none';
  btnRew.style.display = (playing && phase === 'acting') ? 'flex' : 'none';
  badge.classList.toggle('show', scene === 'title');
  const showHint = playing && phase === 'ready' && lv && lv.hint && rewindsUsed === 0;
  elHint.classList.toggle('show', !!showHint);
  if (showHint) elHint.textContent = lv.hint;
}

let hudCache = { lvl: '', crew: -1, done: -1, rew: -1 };
function syncHud(force) {
  if (!lv) return;
  const name = 'LV ' + lv.n;
  if (force || hudCache.lvl !== name) { elLevel.textContent = name; hudCache.lvl = name; }
  const done = Math.min(ghosts.length + 1, lv.crew);
  if (force || hudCache.crew !== lv.crew) {
    elCrew.textContent = '';
    for (let i = 0; i < lv.crew; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      elCrew.appendChild(d);
    }
    hudCache.crew = lv.crew; hudCache.done = -1;
  }
  if (force || hudCache.done !== done) {
    const kids = elCrew.childNodes;
    for (let i = 0; i < kids.length; i++) {
      if (kids[i].className !== undefined) kids[i].className = 'dot' + (i < ghosts.length ? ' on' : '');
    }
    hudCache.done = done;
  }
  if (force || hudCache.rew !== rewindsLeft) {
    elRew.textContent = '↺ ' + rewindsLeft;
    hudCache.rew = rewindsLeft;
  }
}

function goTitle() {
  scene = 'title';
  phase = 'ready';
  lv = null; ghosts = []; plats = []; gates = []; levers = [];
  titleT = 0;
  moveDir = 0;
  setZone(zoneL, false); setZone(zoneR, false);
  const ts = totalStars();
  $('titleStats').innerHTML =
    '⭐ ' + ts + ' stars &nbsp;·&nbsp; 🏁 best level ' + (store.best | 0) +
    '<br>🖼️ crew photos: ' + (store.photos | 0) +
    '<br>👻 ' + store.unlocked.length + ' / ' + SKINS.length + ' skins unlocked';
  showScreen(scTitle);
  refreshCtrl();
}
function goMeta() {
  scene = 'meta';
  buildSkinGrid();
  const ts = totalStars();
  $('metaStats').innerHTML = '⭐ ' + ts + ' stars collected';
  const ph = store.photos | 0;
  $('photoNote').innerHTML = ph > 0
    ? '🖼️ ' + ph + ' crew photo' + (ph === 1 ? '' : 's') + ' on the wall behind you — one per world of 10 levels.'
    : '🖼️ The wall is bare. Clear all 10 levels of World 1 for your first crew photo!';
  showScreen(scMeta);
  refreshCtrl();
}
function startLevel(n) {
  scene = 'play';
  phase = 'ready';
  level = Math.max(1, n | 0);
  buildLevel(level);
  parts.length = 0; pops.length = 0;
  hudCache = { lvl: '', crew: -1, done: -1, rew: -1 };
  syncHud(true);
  hideAllScreens();
  refreshCtrl();
  updateBar(1);
}
function updateBar(k) {
  try {
    elBar.style.transform = 'scaleX(' + clamp(k, 0, 1).toFixed(3) + ')';
    elBar.classList.toggle('low', k < 0.28);
  } catch (e) {}
}

function buildSkinGrid() {
  const grid = $('skinGrid');
  grid.textContent = '';
  const ts = totalStars();
  for (let i = 0; i < SKINS.length; i++) {
    const s = SKINS[i];
    const owned = store.unlocked.indexOf(i) >= 0;
    const b = document.createElement('button');
    b.className = 'skin' + (store.skin === i ? ' eq' : '') + (owned ? '' : ' lk');
    const sw = document.createElement('div');
    sw.className = 'sw';
    sw.style.background = s.body;
    b.appendChild(sw);
    const lab = document.createElement('div');
    lab.textContent = owned ? s.name : '🔒 ' + s.cost + '⭐';
    b.appendChild(lab);
    b.addEventListener('pointerdown', ev => {
      ev.preventDefault(); ensureAudio();
      if (!owned) { sfx.tap(); return; }
      store.skin = i; saveStore(); sfx.unlock(); buildSkinGrid();
    });
    grid.appendChild(b);
    if (!owned && ts >= s.cost) { /* defensive: unlock on view */ store.unlocked.push(i); saveStore(); }
  }
}

/* ==================================================================
   INPUT — pointer events only, plus keyboard for desktop
   ================================================================== */
const heldPointers = {};      // pointerId -> -1 | 1
function setZone(z, on) { try { z.classList.toggle('on', !!on); } catch (e) {} }
function recomputeDir() {
  let l = false, r = false;
  for (const k in heldPointers) { if (heldPointers[k] < 0) l = true; else r = true; }
  moveDir = (l && !r) ? -1 : ((r && !l) ? 1 : 0);
  setZone(zoneL, l); setZone(zoneR, r);
}
function releaseAll() {
  for (const k in heldPointers) delete heldPointers[k];
  recomputeDir();
}
function zoneDown(dir) {
  return function (e) {
    e.preventDefault();
    ensureAudio();
    if (scene !== 'play' || phase !== 'acting') return;
    heldPointers[e.pointerId === undefined ? 'k' : e.pointerId] = dir;
    recomputeDir();
  };
}
zoneL.addEventListener('pointerdown', zoneDown(-1), { passive: false });
zoneR.addEventListener('pointerdown', zoneDown(1), { passive: false });
function ptrUp(e) {
  const id = e.pointerId === undefined ? 'k' : e.pointerId;
  if (heldPointers[id] !== undefined) { delete heldPointers[id]; recomputeDir(); }
}
document.addEventListener('pointerup', ptrUp);
document.addEventListener('pointercancel', ptrUp);
document.addEventListener('pointerleave', ptrUp);
window.addEventListener('blur', releaseAll);

function bindTap(el, fn) {
  if (!el) return;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    ensureAudio();
    fn(e);
  }, { passive: false });
}
bindTap(btnGo, () => { sfx.tap(); startTake(); });
bindTap(btnRew, () => { releaseAll(); doRewind(false); });
bindTap(btnMute, () => { setMuted(!muted); sfx.tap(); });
bindTap($('btnPlay'), () => { sfx.tap(); startLevel(Math.max(1, store.level | 0)); });
bindTap($('btnMeta'), () => { sfx.tap(); goMeta(); });
bindTap($('btnBack'), () => { sfx.tap(); goTitle(); });
bindTap($('btnNext'), () => { sfx.tap(); startLevel(lv ? lv.n + 1 : 1); });
bindTap($('btnRetry'), () => { sfx.tap(); startLevel(lv ? lv.n : 1); });
bindTap($('btnWinHome'), () => { sfx.tap(); goTitle(); });
bindTap($('btnFailHome'), () => { sfx.tap(); goTitle(); });

document.addEventListener('keydown', e => {
  ensureAudio();
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { heldPointers.kbL = -1; recomputeDir(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { heldPointers.kbR = 1; recomputeDir(); }
  else if (k === ' ' || k === 'Enter') {
    e.preventDefault();
    if (scene === 'title') startLevel(Math.max(1, store.level | 0));
    else if (scene === 'play' && phase === 'ready') startTake();
  }
  else if (k === 'r' || k === 'R') { if (scene === 'play' && phase === 'acting') doRewind(false); }
  else if (k === 'm' || k === 'M') setMuted(!muted);
});
document.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { delete heldPointers.kbL; recomputeDir(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { delete heldPointers.kbR; recomputeDir(); }
});

['touchstart', 'touchmove', 'touchend', 'gesturestart', 'contextmenu', 'dblclick'].forEach(ev => {
  document.addEventListener(ev, e => {
    if (ev === 'contextmenu' || ev === 'gesturestart' || ev === 'dblclick') { e.preventDefault(); return; }
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { releaseAll(); }
  else { ensureAudio(); }
});

/* ==================================================================
   DRAWING — world
   ================================================================== */
function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y); ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr); ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr); ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function drawBackdrop(seed, t) {
  const W = view.W, H = view.H;
  const hue = (258 + seed * 23) % 360;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'hsl(' + hue + ',52%,10%)');
  g.addColorStop(0.5, 'hsl(' + ((hue + 18) % 360) + ',46%,17%)');
  g.addColorStop(1, 'hsl(' + ((hue + 320) % 360) + ',44%,25%)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const sr = seededRand(1234 + seed * 31);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < 34; i++) {
    const sx = sr() * W, sy = sr() * H;
    ctx.globalAlpha = 0.18 + 0.42 * Math.abs(Math.sin(t * (0.5 + sr() * 1.4) + i));
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;

  /* soft moon */
  const mx = W * 0.8, my = H * 0.13, mr = clamp(W * 0.09, 26, 54);
  const mg = ctx.createRadialGradient(mx, my, 2, mx, my, mr * 3);
  mg.addColorStop(0, 'rgba(255,246,214,0.30)');
  mg.addColorStop(1, 'rgba(255,246,214,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, mr * 3, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff6d6';
  ctx.beginPath(); ctx.arc(mx, my, mr * 0.5, 0, TAU); ctx.fill();
}

function drawLevelGeometry(t) {
  const ts = cam.ts;
  /* frame */
  ctx.fillStyle = 'rgba(10,5,30,0.42)';
  roundRect(tx(0) - 6, ty(0) - 6, COLS * ts + 12, ROWS * ts + 12, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(150,200,255,0.20)';
  ctx.lineWidth = 2;
  roundRect(tx(0) - 6, ty(0) - 6, COLS * ts + 12, ROWS * ts + 12, 14);
  ctx.stroke();

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = tileAt(c, r);
      const X = tx(c), Y = ty(r);
      if (ch === '#') {
        const top = !(tileAt(c, r - 1) === '#');
        ctx.fillStyle = top ? '#3b2b6b' : '#2a1e50';
        ctx.fillRect(X, Y, ts + 0.6, ts + 0.6);
        if (top) {
          ctx.fillStyle = '#5c46a3';
          ctx.fillRect(X, Y, ts + 0.6, Math.max(2, ts * 0.16));
          ctx.fillStyle = 'rgba(190,170,255,0.25)';
          ctx.fillRect(X, Y, ts + 0.6, Math.max(1, ts * 0.05));
        }
        ctx.strokeStyle = 'rgba(10,5,30,0.35)';
        ctx.lineWidth = 1;
        ctx.strokeRect(X + 0.5, Y + 0.5, ts, ts);
      } else if (ch === 'a' || ch === 'b') {
        drawPlate(X, Y, ts, ch === 'a' ? 0 : 1, false, t);
      } else if (ch === 'x' || ch === 'y') {
        drawPlate(X, Y, ts, ch === 'x' ? 0 : 1, true, t);
      }
    }
  }
  drawExit(t);
  for (let i = 0; i < levers.length; i++) drawLever(levers[i], t);
  for (let i = 0; i < gates.length; i++) drawGate(gates[i], t);
  for (let i = 0; i < plats.length; i++) drawPlat(plats[i], t);
}

const CH_COL = ['#6fe0ff', '#ff9ecb', '#ffd469'];
function drawPlate(X, Y, ts, ch, timed, t) {
  const active = timed ? chTimer[ch] > 0 : chActive[ch];
  const col = timed ? '#ffd469' : CH_COL[ch];
  const h = ts * (active ? 0.16 : 0.24);
  ctx.fillStyle = 'rgba(10,5,30,0.5)';
  roundRect(X + ts * 0.1, Y + ts - ts * 0.3, ts * 0.8, ts * 0.3, 4); ctx.fill();
  ctx.fillStyle = active ? col : 'rgba(120,140,190,0.75)';
  roundRect(X + ts * 0.12, Y + ts - h, ts * 0.76, h, 4); ctx.fill();
  if (active) {
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t * 8);
    ctx.fillStyle = col;
    roundRect(X + ts * 0.02, Y + ts - h - 4, ts * 0.96, h + 6, 6); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (timed) {
    const k = clamp(chTimer[ch] / TIMED_DUR, 0, 1);
    ctx.fillStyle = 'rgba(10,5,30,0.6)';
    ctx.fillRect(X + ts * 0.12, Y + ts * 0.52, ts * 0.76, ts * 0.1);
    ctx.fillStyle = '#ffd469';
    ctx.fillRect(X + ts * 0.12, Y + ts * 0.52, ts * 0.76 * k, ts * 0.1);
  }
}

function drawGate(G, t) {
  const ts = cam.ts;
  const X = tx(G.c), Y0 = ty(G.r0);
  const h = (G.r1 - G.r0 + 1) * ts;
  const col = G.type === 2 ? '#c9a2ff' : CH_COL[G.type];
  /* jamb */
  ctx.fillStyle = 'rgba(12,6,34,0.55)';
  ctx.fillRect(X - 2, Y0, ts + 4, h);
  ctx.strokeStyle = col;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 2;
  ctx.strokeRect(X - 2, Y0, ts + 4, h);
  ctx.globalAlpha = 1;
  /* two panels retracting into the jambs */
  const seg = h / 2 * (1 - G.open);
  const grad = ctx.createLinearGradient(X, 0, X + ts, 0);
  grad.addColorStop(0, col);
  grad.addColorStop(0.5, 'rgba(255,255,255,0.9)');
  grad.addColorStop(1, col);
  ctx.fillStyle = grad;
  ctx.globalAlpha = 0.92;
  ctx.fillRect(X, Y0, ts, seg);
  ctx.fillRect(X, Y0 + h - seg, ts, seg);
  ctx.globalAlpha = 1;
  /* stripes */
  ctx.fillStyle = 'rgba(12,6,34,0.30)';
  for (let y = 0; y < seg; y += Math.max(6, ts * 0.22)) {
    ctx.fillRect(X, Y0 + y, ts, Math.max(2, ts * 0.06));
    ctx.fillRect(X, Y0 + h - seg + y, ts, Math.max(2, ts * 0.06));
  }
  if (G.type === 2) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '900 ' + Math.round(ts * 0.3) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(t * 4);
    ctx.fillText('2', X + ts / 2, Y0 + h / 2);
    ctx.globalAlpha = 1;
  }
}

function drawLever(L, t) {
  const ts = cam.ts;
  const X = tx(L.c) + ts / 2, Y = ty(L.r) + ts;
  ctx.fillStyle = '#2a1e50';
  roundRect(X - ts * 0.16, Y - ts * 0.22, ts * 0.32, ts * 0.22, 3); ctx.fill();
  const ang = lerp(-0.85, 0.85, L.anim);
  ctx.save();
  ctx.translate(X, Y - ts * 0.2);
  ctx.rotate(ang);
  ctx.strokeStyle = L.on ? '#ffd469' : '#b7c6e8';
  ctx.lineWidth = Math.max(3, ts * 0.1);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -ts * 0.52); ctx.stroke();
  ctx.fillStyle = L.on ? '#ffd469' : '#ff6fb2';
  ctx.beginPath(); ctx.arc(0, -ts * 0.56, ts * 0.15, 0, TAU); ctx.fill();
  ctx.restore();
  if (L.on) {
    ctx.globalAlpha = 0.25 + 0.2 * Math.sin(t * 6);
    ctx.fillStyle = '#ffd469';
    ctx.beginPath(); ctx.arc(X, Y - ts * 0.55, ts * 0.42, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawPlat(p, t) {
  const ts = cam.ts;
  const x = tx(p.cx - p.w / 2), y = ty(p.top);
  const w = p.w * ts, h = ts * 0.32;
  ctx.fillStyle = 'rgba(10,5,30,0.4)';
  roundRect(x + 3, y + 4, w, h, 6); ctx.fill();
  ctx.fillStyle = '#4e3a90';
  roundRect(x, y, w, h, 6); ctx.fill();
  ctx.fillStyle = '#7cf5d0';
  roundRect(x, y, w, Math.max(3, h * 0.34), 6); ctx.fill();
  ctx.fillStyle = 'rgba(124,245,208,0.35)';
  for (let i = 0; i < 3; i++) {
    const gx = x + w * (0.2 + i * 0.3);
    ctx.beginPath(); ctx.arc(gx, y + h * 0.72, Math.max(1.5, ts * 0.05), 0, TAU); ctx.fill();
  }
  /* thruster wisps */
  ctx.globalAlpha = 0.3 + 0.2 * Math.sin(t * 9);
  ctx.fillStyle = '#7cf5d0';
  ctx.beginPath(); ctx.ellipse(x + w / 2, y + h + 5, w * 0.32, 4, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawExit(t) {
  const ts = cam.ts;
  const X = tx(lv.exit.c), Y = ty(lv.exit.r);
  const need = lv.crew;
  const have = Math.min(need, crewAtDoorSafe());
  ctx.save();
  const glow = 0.25 + 0.2 * Math.sin(t * 3) + have / need * 0.4;
  ctx.globalAlpha = clamp(glow, 0, 1);
  const rg = ctx.createRadialGradient(X + ts / 2, Y + ts / 2, 2, X + ts / 2, Y + ts / 2, ts * 2.4);
  rg.addColorStop(0, 'rgba(124,245,208,0.75)');
  rg.addColorStop(1, 'rgba(124,245,208,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(X + ts / 2, Y + ts / 2, ts * 2.4, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#1b1140';
  roundRect(X + ts * 0.04, Y - ts * 0.15, ts * 0.92, ts * 1.15, ts * 0.28); ctx.fill();
  ctx.fillStyle = '#7cf5d0';
  roundRect(X + ts * 0.14, Y - ts * 0.05, ts * 0.72, ts * 1.02, ts * 0.22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  roundRect(X + ts * 0.14, Y - ts * 0.05, ts * 0.72, ts * 0.4, ts * 0.22); ctx.fill();
  ctx.fillStyle = '#1b1140';
  ctx.beginPath(); ctx.arc(X + ts * 0.72, Y + ts * 0.55, Math.max(2, ts * 0.07), 0, TAU); ctx.fill();

  /* crew counter above the door */
  ctx.font = '900 ' + Math.max(10, Math.round(ts * 0.34)) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,5,30,0.8)';
  const label = have + '/' + need;
  ctx.strokeText(label, X + ts / 2, Y - ts * 0.42);
  ctx.fillStyle = have >= need ? '#ffd469' : '#eaf2ff';
  ctx.fillText(label, X + ts / 2, Y - ts * 0.42);
}
function crewAtDoorSafe() {
  if (!lv) return 0;
  let n = atExit(player.x, player.y) ? 1 : 0;
  for (let i = 0; i < ghosts.length; i++) if (atExit(ghosts[i].x, ghosts[i].y)) n++;
  return n;
}

/* ---------- the cute crew member ---------- */
function drawGuy(px, py, s, o) {
  /* px,py = feet position in canvas px; s = body radius px */
  const skin = SKINS[clamp(o.skin | 0, 0, SKINS.length - 1)];
  const ghost = !!o.ghost;
  const walk = !!o.walking;
  const ph = o.phase || 0;
  const sq = o.squash || 1;
  const hop = walk ? Math.abs(Math.sin(ph)) * s * 0.14 : 0;
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.translate(px, py - hop);
  ctx.scale((o.face || 1) / sq, sq);

  if (ghost) {
    ctx.shadowColor = 'rgba(140,230,255,0.9)';
    ctx.shadowBlur = s * 0.7;
  }

  /* legs (solid selves only) */
  if (!ghost) {
    ctx.fillStyle = skin.dark;
    const st = walk ? Math.sin(ph) * s * 0.34 : 0;
    ctx.beginPath(); ctx.ellipse(-s * 0.34 + st, -s * 0.08, s * 0.26, s * 0.13, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.34 - st, -s * 0.08, s * 0.26, s * 0.13, 0, 0, TAU); ctx.fill();
  }

  /* body */
  ctx.fillStyle = skin.body;
  ctx.beginPath();
  if (ghost) {
    /* wavy ghost skirt */
    const top = -s * 1.55, wob = o.wob || 0;
    ctx.moveTo(-s * 0.86, -s * 0.35);
    ctx.quadraticCurveTo(-s * 0.95, top, 0, top);
    ctx.quadraticCurveTo(s * 0.95, top, s * 0.86, -s * 0.35);
    for (let i = 0; i < 4; i++) {
      const x0 = s * 0.86 - (i + 0.5) * (s * 1.72 / 4);
      const x1 = s * 0.86 - (i + 1) * (s * 1.72 / 4);
      const dip = Math.sin(wob + i * 1.5) * s * 0.12;
      ctx.quadraticCurveTo(x0, -s * 0.02 + dip, x1, -s * 0.22);
    }
    ctx.closePath();
  } else {
    ctx.ellipse(0, -s * 0.9, s * 0.86, s * 0.95, 0, 0, TAU);
  }
  ctx.fill();
  ctx.shadowBlur = 0;

  /* belly */
  ctx.fillStyle = 'rgba(255,255,255,0.62)';
  ctx.beginPath(); ctx.ellipse(0, -s * 0.72, s * 0.5, s * 0.55, 0, 0, TAU); ctx.fill();

  /* arms — high five when cheering */
  ctx.strokeStyle = skin.dark;
  ctx.lineWidth = Math.max(2, s * 0.18);
  ctx.lineCap = 'round';
  const armUp = o.cheer ? 1 : 0;
  const swing = walk ? Math.sin(ph + Math.PI) * 0.5 : 0;
  ctx.beginPath();
  ctx.moveTo(-s * 0.7, -s * 1.0);
  ctx.lineTo(-s * 0.98 - armUp * s * 0.1, -s * 1.0 - armUp * s * 0.75 + swing * s * 0.2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(s * 0.7, -s * 1.0);
  ctx.lineTo(s * 0.98 + armUp * s * 0.1, -s * 1.0 - armUp * s * 0.75 - swing * s * 0.2);
  ctx.stroke();

  /* eyes */
  const ey = -s * 1.12, ex = s * 0.3;
  const blink = o.blink === undefined ? 1 : o.blink;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-ex, ey, s * 0.2, s * 0.24 * blink, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ex, ey, s * 0.2, s * 0.24 * blink, 0, 0, TAU); ctx.fill();
  if (blink > 0.4) {
    ctx.fillStyle = '#171034';
    const look = o.face > 0 ? s * 0.05 : s * 0.05;
    ctx.beginPath(); ctx.arc(-ex + look, ey, s * 0.09, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + look, ey, s * 0.09, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(-ex + look + s * 0.04, ey - s * 0.06, s * 0.03, 0, TAU); ctx.fill();
  }
  /* blush + smile */
  ctx.fillStyle = 'rgba(255,120,170,0.4)';
  ctx.beginPath(); ctx.ellipse(-s * 0.55, ey + s * 0.24, s * 0.14, s * 0.09, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.55, ey + s * 0.24, s * 0.14, s * 0.09, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#171034';
  ctx.lineWidth = Math.max(1.4, s * 0.07);
  ctx.beginPath();
  ctx.arc(0, ey + s * 0.2, s * 0.18, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  /* hats */
  const hy = -s * 1.72;
  if (skin.hat === 'cap') {
    ctx.fillStyle = skin.dark;
    ctx.beginPath(); ctx.ellipse(0, hy + s * 0.16, s * 0.62, s * 0.34, 0, Math.PI, TAU); ctx.fill();
    ctx.fillRect(0, hy + s * 0.12, s * 0.85, s * 0.1);
  } else if (skin.hat === 'bow') {
    ctx.fillStyle = '#ff6fb2';
    ctx.beginPath(); ctx.ellipse(-s * 0.28, hy + s * 0.2, s * 0.24, s * 0.17, 0.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.28, hy + s * 0.2, s * 0.24, s * 0.17, -0.4, 0, TAU); ctx.fill();
  } else if (skin.hat === 'party') {
    ctx.fillStyle = '#ffd469';
    ctx.beginPath();
    ctx.moveTo(-s * 0.4, hy + s * 0.28); ctx.lineTo(0, hy - s * 0.45); ctx.lineTo(s * 0.4, hy + s * 0.28);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff6fb2';
    ctx.beginPath(); ctx.arc(0, hy - s * 0.5, s * 0.12, 0, TAU); ctx.fill();
  } else if (skin.hat === 'antenna') {
    ctx.strokeStyle = '#c9a2ff'; ctx.lineWidth = Math.max(2, s * 0.09);
    ctx.beginPath(); ctx.moveTo(0, hy + s * 0.3); ctx.lineTo(0, hy - s * 0.3); ctx.stroke();
    ctx.fillStyle = '#7cf5d0';
    ctx.beginPath(); ctx.arc(0, hy - s * 0.38, s * 0.14, 0, TAU); ctx.fill();
  } else if (skin.hat === 'crown') {
    ctx.fillStyle = '#ffd469';
    ctx.beginPath();
    ctx.moveTo(-s * 0.46, hy + s * 0.3);
    ctx.lineTo(-s * 0.46, hy - s * 0.12); ctx.lineTo(-s * 0.16, hy + s * 0.06);
    ctx.lineTo(0, hy - s * 0.2); ctx.lineTo(s * 0.16, hy + s * 0.06);
    ctx.lineTo(s * 0.46, hy - s * 0.12); ctx.lineTo(s * 0.46, hy + s * 0.3);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawGhostBody(gh, t) {
  const ts = cam.ts;
  const s = ts * 0.36;
  const wob = t * 3 + gh.phase;
  /* faint trail of where it is heading */
  drawGuy(tx(gh.x), ty(gh.y) + Math.sin(wob) * 2, s, {
    skin: gh.skin, face: gh.face, walking: gh.walking, phase: t * 11 + gh.phase,
    squash: 1, ghost: true, alpha: 0.62, wob, cheer: gh.cheer > 0,
    blink: 1
  });
  /* number badge */
  ctx.font = '900 ' + Math.max(9, Math.round(ts * 0.26)) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(10,5,30,0.55)';
  ctx.beginPath(); ctx.arc(tx(gh.x), ty(gh.y) - ts * 1.55, ts * 0.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#9beeff';
  ctx.fillText(String(gh.num), tx(gh.x), ty(gh.y) - ts * 1.54);
}

function drawPlayerBody(t) {
  const ts = cam.ts;
  const s = ts * 0.36;
  drawGuy(tx(player.x), ty(player.y), s, {
    skin: store.skin, face: player.face, walking: player.walking,
    phase: player.phase, squash: player.squash, ghost: false, alpha: 1,
    cheer: phase === 'celebrate' && atExit(player.x, player.y),
    blink: (elapsed % 3.4) < 0.1 ? 0.1 : 1
  });
  /* direction chevron so touch input is always readable */
  if (moveDir !== 0 && phase === 'acting') {
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 12);
    ctx.fillStyle = '#7cf5d0';
    ctx.font = '900 ' + Math.round(ts * 0.5) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(moveDir > 0 ? '›' : '‹', tx(player.x) + moveDir * ts * 0.85, ty(player.y) - ts * 0.6);
    ctx.globalAlpha = 1;
  }
}

/* ---------- particles / popups ---------- */
function updateDrawParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt;
    if (p.rot !== undefined) p.rot += (p.vr || 0) * dt;
    ctx.globalAlpha = 1 - p.t / p.life;
    if (p.type === 'confetti') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.fillStyle = p.col; ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.7);
      ctx.restore();
    } else if (p.type === 'ring') {
      ctx.strokeStyle = p.col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size + (p.t / p.life) * 40, 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function updateDrawPops(dt) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.t += dt;
    if (p.t >= p.life) { pops.splice(i, 1); continue; }
    const k = p.t / p.life;
    const sc = k < 0.22 ? easeOutBack(k / 0.22) : 1;
    ctx.save();
    ctx.translate(p.x, p.y - easeOutCubic(k) * 46);
    ctx.scale(sc, sc);
    ctx.globalAlpha = k > 0.65 ? 1 - (k - 0.65) / 0.35 : 1;
    ctx.font = '900 ' + p.size + 'px ' + FONT;
    ctx.lineWidth = 6; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(10,5,30,0.85)';
    ctx.strokeText(p.txt, 0, 0);
    ctx.fillStyle = p.col;
    ctx.fillText(p.txt, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ==================================================================
   VHS REWIND — the showpiece
   ================================================================== */
function drawVHS(k, t) {
  const W = view.W, H = view.H, dpr = view.dpr;
  /* torn horizontal bands sliced out of the frame we just drew */
  try {
    const bands = 7;
    for (let i = 0; i < bands; i++) {
      const bh = H / bands;
      const sy = i * bh;
      const off = (Math.sin(t * 40 + i * 2.3) * 26 + rnd(-10, 10)) * (0.4 + k);
      ctx.drawImage(cvs, 0, Math.round(sy * dpr), Math.round(W * dpr), Math.round(bh * dpr),
                    off, sy, W, bh);
    }
  } catch (e) {}
  /* chromatic split */
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.16;
  try {
    ctx.drawImage(cvs, 0, 0, Math.round(W * dpr), Math.round(H * dpr), -5, 0, W, H);
    ctx.fillStyle = 'rgba(255,60,120,0.10)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(60,255,220,0.08)';
    ctx.fillRect(0, 0, W, H);
  } catch (e) {}
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  /* scanlines */
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (let y = ((t * 400) % 4); y < H; y += 4) ctx.fillRect(0, y, W, 2);

  /* static speckle */
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  for (let i = 0; i < 90; i++) ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2);

  /* rolling bright bar */
  const barY = ((1 - k) * 2 % 1) * H;
  const bg = ctx.createLinearGradient(0, barY - 40, 0, barY + 40);
  bg.addColorStop(0, 'rgba(255,255,255,0)');
  bg.addColorStop(0.5, 'rgba(255,255,255,0.13)');
  bg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, barY - 40, W, 80);

  /* vignette */
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* label */
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + clamp(view.W * 0.09, 26, 46) + 'px ' + FONT;
  ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(t * 14));
  ctx.lineWidth = 8; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(10,5,30,0.85)';
  ctx.strokeText('◀◀ REWIND', view.W / 2, view.H * 0.18);
  ctx.fillStyle = '#ff6fb2';
  ctx.fillText('◀◀ REWIND', view.W / 2, view.H * 0.18);
  ctx.font = '800 13px ' + FONT;
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = '#9beeff';
  ctx.fillText('TAKE ' + (rewindsUsed) + '  ·  SPOOLING BACK', view.W / 2, view.H * 0.18 + 34);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ==================================================================
   SCENE RENDERERS
   ================================================================== */
function drawPlayScene(dt, t) {
  drawBackdrop(lv.n, t);
  updateFog(dt); drawFog();

  let sx = 0, sy = 0;
  if (shakeT > 0) {
    shakeT -= dt;
    const m = shakeMag * Math.max(0, shakeT / 0.4);
    sx = rnd(-m, m); sy = rnd(-m, m);
    if (shakeT <= 0) shakeMag = 0;
  }
  ctx.save();
  ctx.translate(sx, sy);
  drawLevelGeometry(t);
  for (let i = 0; i < ghosts.length; i++) drawGhostBody(ghosts[i], t);
  if (phase === 'rewind' && rewGhost) drawGhostBody(rewGhost, t);
  else drawPlayerBody(t);
  updateDrawParts(dt);
  updateDrawPops(dt);
  ctx.restore();

  if (phase === 'ready') {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + clamp(view.W * 0.05, 16, 24) + 'px ' + FONT;
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 4);
    ctx.lineWidth = 6; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(10,5,30,0.8)';
    const msg = ghosts.length === 0 ? 'TAKE 1 — PRESS GO' : ('TAKE ' + (ghosts.length + 1) + ' — ' + ghosts.length + ' GHOST' + (ghosts.length > 1 ? 'S' : '') + ' READY');
    ctx.strokeText(msg, view.W / 2, ty(0) - 22);
    ctx.fillStyle = '#7cf5d0';
    ctx.fillText(msg, view.W / 2, ty(0) - 22);
    ctx.globalAlpha = 1;
  }
  if (phase === 'celebrate') {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const k = clamp(celebT / 0.4, 0, 1);
    ctx.save();
    ctx.translate(view.W / 2, view.H * 0.2);
    ctx.scale(easeOutBack(k), easeOutBack(k));
    ctx.font = '900 ' + clamp(view.W * 0.11, 30, 56) + 'px ' + FONT;
    ctx.lineWidth = 10; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(10,5,30,0.85)';
    ctx.strokeText('TEAMWORK!', 0, 0);
    const g = ctx.createLinearGradient(0, -30, 0, 30);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ffd469');
    ctx.fillStyle = g;
    ctx.fillText('TEAMWORK!', 0, 0);
    ctx.restore();
  }
}

function drawTitleScene(dt, t) {
  drawBackdrop(3, t);
  updateFog(dt); drawFog();
  const W = view.W, H = view.H;
  const gy = H * 0.60;                 /* keep the crew clear of the DOM buttons */
  /* stage floor: a lit band that fades into the night below */
  const fg = ctx.createLinearGradient(0, gy, 0, H);
  fg.addColorStop(0, 'rgba(61,43,115,0.95)');
  fg.addColorStop(0.25, 'rgba(36,24,68,0.75)');
  fg.addColorStop(1, 'rgba(22,12,51,0)');
  ctx.fillStyle = fg;
  ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = '#6a52c2';
  ctx.fillRect(0, gy, W, 5);
  ctx.fillStyle = 'rgba(124,245,208,0.25)';
  ctx.fillRect(0, gy, W, 2);
  /* a little crew hanging out */
  const n = clamp(1 + Math.floor(totalStars() / 4), 1, 5);
  for (let i = 0; i < n; i++) {
    const px = W * (0.22 + i * 0.14);
    const bob = Math.sin(t * 2 + i * 1.3) * 4;
    const isGhost = i > 0;
    drawGuy(px, gy - bob, clamp(W * 0.05, 16, 30), {
      skin: i === 0 ? store.skin : (store.unlocked[i % store.unlocked.length] || 0),
      face: i % 2 ? -1 : 1, walking: false, phase: t * 3 + i,
      squash: 1 + Math.sin(t * 3 + i) * 0.04, ghost: isGhost,
      alpha: isGhost ? 0.6 : 1, wob: t * 3 + i, cheer: (t * 0.5 + i) % 4 < 0.6, blink: ((t + i) % 3.2) < 0.12 ? 0.1 : 1
    });
  }
  updateDrawParts(dt);
  if (Math.random() < 0.03) {
    addPart({ type: 'shimmer', x: rnd(W * 0.15, W * 0.85), y: gy - rnd(10, 60),
      vx: rnd(-10, 10), vy: rnd(-24, -8), g: -4, life: rnd(0.6, 1.2), t: 0,
      size: rnd(1.5, 3), col: 'rgba(160,240,255,0.8)' });
  }
}

function drawMetaScene(dt, t) {
  drawBackdrop(0, t);
  updateFog(dt); drawFog();
  const W = view.W, H = view.H;
  const gy = H * 0.86;
  ctx.fillStyle = '#241844';
  ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = '#3d2b73';
  ctx.fillRect(0, gy, W, 7);
  /* crew photo wall */
  const ph = store.photos | 0;
  const shown = Math.max(1, Math.min(4, ph || 1));
  const fw = clamp(W * 0.26, 84, 132), fh = fw * 0.76;
  const total = shown * fw + (shown - 1) * 12;
  let x0 = (W - total) / 2;
  const y0 = H * 0.56;
  for (let i = 0; i < shown; i++) {
    const has = i < ph;
    const x = x0 + i * (fw + 12);
    const tilt = Math.sin(t * 1.1 + i) * 0.02;
    ctx.save();
    ctx.translate(x + fw / 2, y0 + fh / 2);
    ctx.rotate(tilt);
    ctx.translate(-fw / 2, -fh / 2);
    ctx.fillStyle = 'rgba(10,5,30,0.5)';
    roundRect(4, 6, fw, fh, 6); ctx.fill();
    ctx.fillStyle = has ? '#e9dcc0' : '#2a1e50';
    roundRect(0, 0, fw, fh, 6); ctx.fill();
    ctx.fillStyle = has ? '#1d2a4a' : '#170f38';
    roundRect(5, 5, fw - 10, fh - 16, 4); ctx.fill();
    if (has) {
      drawPhotoCrew(5, 5, fw - 10, fh - 16, i + 1, t);
      ctx.fillStyle = '#5a4a2c';
      ctx.font = '900 ' + Math.max(7, Math.round(fw * 0.095)) + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('WORLD ' + (i + 1) + ' CREW', fw / 2, fh - 6);
    } else {
      ctx.fillStyle = 'rgba(200,220,255,0.35)';
      ctx.font = '900 ' + Math.round(fw * 0.3) + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', fw / 2, fh / 2 - 4);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    roundRect(0, 0, fw, fh, 6); ctx.stroke();
    ctx.restore();
  }
  /* the equipped crew member waves under the wall */
  drawGuy(W / 2, gy, clamp(W * 0.055, 18, 32), {
    skin: store.skin, face: 1, walking: false, phase: t * 3,
    squash: 1 + Math.sin(t * 3) * 0.05, ghost: false, alpha: 1,
    cheer: Math.sin(t * 2) > 0, blink: (t % 3) < 0.12 ? 0.1 : 1
  });
  updateDrawParts(dt);
}
function drawPhotoCrew(x, y, w, h, world, t) {
  const sr = seededRand(world * 7717);
  const n = 3 + (world % 2);
  for (let i = 0; i < n; i++) {
    const px = x + w * (0.18 + (i / Math.max(1, n - 1)) * 0.64);
    const py = y + h * (0.86 - sr() * 0.06);
    const s = h * 0.17;
    ctx.save();
    if (i === 1) { ctx.translate(px, py - s * 1.2); ctx.rotate(Math.PI); ctx.translate(-px, -(py - s * 1.2)); }
    drawGuy(px, py, s, {
      skin: Math.floor(sr() * SKINS.length), face: i % 2 ? -1 : 1, walking: false,
      phase: i, squash: 1, ghost: i === n - 1, alpha: i === n - 1 ? 0.7 : 1,
      wob: t + i, cheer: i !== 1, blink: 1
    });
    ctx.restore();
  }
}

/* ==================================================================
   MAIN LOOP — re-armed in finally so one bad frame can never
   permanently blank the game.
   ================================================================== */
let last = 0;
function frame(now) {
  try { frameBody(now); }
  catch (e) { if (++frameErrs <= 3 && window.console) console.error('[ghost] frame error:', e); }
  finally { requestAnimationFrame(frame); }
}
function frameBody(now) {
  const n = (typeof now === 'number' && isFinite(now)) ? now : 0;
  let dt = (n - last) / 1000;
  last = n;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;
  elapsed += dt;

  ctx.clearRect(0, 0, view.W, view.H);

  if (scene === 'play' && lv) {
    if (phase === 'acting') {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard < 5 && phase === 'acting') { acc -= STEP; simStep(); guard++; }
      if (acc > 0.25) acc = 0;
      updateBar(1 - tl / takeFrames);
    } else if (phase === 'rewind') {
      rewT += dt;
      const k = clamp(rewT / 0.85, 0, 1);
      const f = Math.round(lerp(rewFrom, 0, easeOutCubic(k)));
      updatePlats(f);
      for (let i = 0; i < ghosts.length; i++) readGhost(ghosts[i], f);
      if (rewGhost) readGhost(rewGhost, f);
      if (k >= 1) finishRewind();
    } else if (phase === 'celebrate') {
      celebT += dt;
      if (celebT > 1.5 && !scWin.classList.contains('show')) showWinScreen();
    }
    updateGates(dt);
    syncHud(false);
    drawPlayScene(dt, elapsed);
    if (phase === 'rewind') drawVHS(clamp(rewT / 0.85, 0, 1), elapsed);
  } else if (scene === 'meta') {
    drawMetaScene(dt, elapsed);
  } else {
    titleT += dt;
    drawTitleScene(dt, elapsed);
  }
}

function showWinScreen() {
  sfx.win();
  const st = $('stars');
  st.textContent = '';
  for (let i = 0; i < 3; i++) {
    const sp = document.createElement('span');
    sp.textContent = i < lastStars ? '⭐' : '☆';
    sp.style.animationDelay = (0.1 + i * 0.16) + 's';
    if (i >= lastStars) sp.style.opacity = '0.3';
    st.appendChild(sp);
  }
  $('winTitle').textContent = lastStars === 3 ? 'PERFECT TAKE!' : 'CREW ASSEMBLED!';
  $('winSub').innerHTML = '“' + (lv ? lv.name : '') + '”<br>' +
    lv.crew + ' crew at the door<br>' +
    rewindsUsed + ' rewind' + (rewindsUsed === 1 ? '' : 's') + ' · par ' + lv.par;
  $('teamNote').textContent = newPhoto
    ? '📸 New crew photo unlocked — check the Crew Room!'
    : (lastStars === 3 ? '👻 Flawless choreography.' : 'Fewer rewinds = more stars.');
  if (newPhoto) sfx.photo();
  showScreen(scWin);
  refreshCtrl();
}

/* ==================================================================
   BOOT
   ================================================================== */
setMuted(muted);
resize();
goTitle();
requestAnimationFrame(frame);
</script>
