<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fire Season | TaterTot Games</title>
<meta name="theme-color" content="#edf0e8">
<link rel="icon" href="data:,">
<script src="/analytics.js" defer></script>
<style>
  :root {
    --paper: #edf0e8; --paper2: #f6f7f2; --rule: #c9cdc3; --ink: #1c2120; --dim: #545b57; --faint: #858b86;
    --signal: #e2521c; --signal-dk: #b83d10; --signal-btn: #c2410c; --signal-btn-hi: #b03a0a; --fire: #d8341c; --pink: #d9677a; --water: #7fb3d6; --contour: #a7784c;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --hatch: repeating-linear-gradient(135deg, rgba(28, 33, 32, .09) 0 1px, transparent 1px 5px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); touch-action: none; overscroll-behavior: none; position: fixed; inset: 0; }
  body { font-family: var(--sans); color: var(--ink); font-size: 14px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  ::selection { background: var(--signal); color: #fff; }
  canvas#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums lining-nums; }

  .btn { min-height: 44px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 3px; font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--paper2); transition: background-color .1s ease-out; }
  .btn:hover:not(:disabled) { background: #fff; }
  .btn:active:not(:disabled) { background: var(--ink); color: var(--paper2); }
  .btn:disabled { color: var(--faint); border-color: var(--rule); background: var(--hatch); cursor: default; }
  .btn.go { background: var(--signal-btn); border-color: var(--signal-btn); color: #fff; }
  .btn.go:hover:not(:disabled) { background: var(--signal-btn-hi); border-color: var(--signal-btn-hi); }
  .btn.go:active:not(:disabled) { background: #8f2f08; border-color: #8f2f08; }
  .btn.on { background: var(--ink); color: var(--paper2); }
  .btn.sm { min-height: 36px; padding: 0 10px; font-size: 13px; }

  /* ---------- incident deck ---------- */
  #deck { position: fixed; display: none; flex-direction: column; background: var(--paper2); z-index: 3; }
  body.port #deck { left: 0; right: 0; bottom: 0; border-top: 1.5px solid var(--ink); }
  body.land #deck { top: 0; right: 0; bottom: 0; border-left: 1.5px solid var(--ink); }
  #dHead { flex: 0 0 auto; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
  #clock { font-size: 26px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
  #phase { font-size: 12px; color: var(--dim); font-weight: 600; }
  .tctl { display: flex; gap: 6px; }
  .tctl .btn { min-width: 44px; padding: 0 8px; }
  #dStats { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--rule); }
  #dStats div { padding: 6px 12px; }
  #dStats div + div { border-left: 1px solid var(--rule); }
  #dStats b { display: block; font-size: 16px; }
  #dStats span { font-size: 11px; color: var(--dim); letter-spacing: .04em; }
  #units { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
  .u { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 5px 12px; min-height: 46px; width: 100%; text-align: left; }
  .u + .u { border-top: 1px solid #e3e5de; }
  .u.sel { background: #fff; }
  .u.sel .mk { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--signal); }
  .u .mk { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .u .mk.engine { border-radius: 4px; }
  .u .mk.dozer { border-radius: 2px; transform: rotate(45deg) scale(.86); }
  .u .mk.dozer i { transform: rotate(-45deg); font-style: normal; }
  .u .nm { font-weight: 600; font-size: 14px; }
  .u .st { font-size: 12px; color: var(--dim); }
  .u .ht { font-size: 12px; font-weight: 700; color: var(--signal); }
  .u.out { opacity: .5; }
  #acts { flex: 0 0 auto; padding: 7px 12px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #acts .hint { font-size: 12px; color: var(--dim); flex: 1 1 100%; line-height: 1.35; }
  #air { flex: 0 0 auto; padding: 8px 12px 10px; border-top: 1px solid var(--rule); display: flex; gap: 6px; }
  #air .btn { flex: 1 1 0; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: #b9bdb4; border-radius: 3px; }
  .scroll { scrollbar-width: thin; scrollbar-color: #b9bdb4 transparent; }

  #radio { flex: 0 0 auto; font-size: 12.5px; padding: 5px 12px; border-bottom: 1px solid var(--rule); min-height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #radio b { font-weight: 700; margin-right: 6px; }
  #radio.warn { color: var(--signal-dk); font-weight: 600; }
  #radio.warn b { color: var(--ink); }
  #muteBtn { position: fixed; width: 40px; height: 40px; display: none; align-items: center; justify-content: center; z-index: 4;
    background: rgba(246, 247, 242, .92); border: 1.5px solid var(--ink); border-radius: 3px; }
  #muteBtn svg { width: 20px; height: 20px; }
  #muteBtn:active { background: var(--ink); color: var(--paper2); }

  /* ---------- screens ---------- */
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; background: rgba(28, 33, 32, .55); padding: 14px; }
  .screen.show { display: flex; }
  .panel { width: min(640px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--paper2); border: 1.5px solid var(--ink);
    border-radius: 3px; padding: 18px 18px 20px; touch-action: pan-y; }
  .ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .ph h2 { font-size: 22px; font-weight: 800; letter-spacing: .01em; }
  .lede { color: var(--dim); font-size: 13.5px; max-width: 62ch; }
  .money { font-size: 20px; font-weight: 700; }
  .rule { border: 0; border-top: 1px solid var(--rule); margin: 14px 0; }

  #title { background: linear-gradient(180deg, rgba(237, 240, 232, .92) 0%, rgba(237, 240, 232, .55) 34%, rgba(237, 240, 232, 0) 55%, rgba(237, 240, 232, 0) 70%, rgba(237, 240, 232, .9) 100%);
    flex-direction: column; justify-content: space-between; text-align: center; padding: max(8vh, 26px) 16px 18px; }
  #title h1 { font-size: clamp(38px, min(11vw, 13vh), 88px); font-weight: 800; letter-spacing: .06em; line-height: .95; text-transform: uppercase; }
  #title h1 span { color: var(--signal); }
  #title .tag { margin-top: 12px; font-size: clamp(14px, 3.6vw, 17px); color: var(--dim); font-weight: 600; }
  #title .go { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #title .btn.go { min-height: 52px; padding: 0 30px; font-size: 17px; }
  #title .stat { font-size: 13px; color: var(--dim); font-weight: 600; }
  #badge { color: var(--dim); font-size: 13px; font-weight: 600; text-decoration: none; border-bottom: 1.5px solid var(--signal); padding: 6px 2px 2px; }

  .call { border: 1.5px solid var(--ink); border-radius: 3px; padding: 12px 14px; margin: 14px 0 4px; display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; background: #fff; }
  .call h3 { font-size: 18px; font-weight: 800; }
  .call .facts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px 14px; font-size: 13px; }
  .call .facts div span { display: block; font-size: 11px; color: var(--dim); letter-spacing: .04em; }
  .call .facts div b { font-weight: 700; }
  .danger { font-weight: 800; }
  .danger.d3, .danger.d4 { color: var(--signal); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1.5px solid var(--ink); margin-top: 16px; }
  .tabs button { min-height: 42px; font-weight: 700; font-size: 13.5px; color: var(--dim); position: relative; }
  .tabs button.on { color: var(--ink); }
  .tabs button.on::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -1.5px; height: 3px; background: var(--signal); }
  .crew { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; }
  .crew + .crew { border-top: 1px solid #e3e5de; }
  .crew .mk { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .crew .mk.engine { border-radius: 4px; }
  .crew .mk.dozer { border-radius: 2px; }
  .crew .nm { font-weight: 700; }
  .crew .st { font-size: 12.5px; color: var(--dim); }
  .crew .tr { font-size: 12px; color: var(--ink); margin-top: 2px; }
  .crew .tr i { font-style: normal; border: 1px solid var(--rule); border-radius: 2px; padding: 0 5px; margin-right: 4px; display: inline-block; }
  .crew .out { color: var(--signal); font-weight: 700; }
  .tog { min-height: 36px; min-width: 64px; border: 1.5px solid var(--ink); border-radius: 3px; font-size: 12.5px; font-weight: 700; }
  .tog.off { border-color: var(--rule); color: var(--faint); }
  .row2 { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; }
  .row2 + .row2 { border-top: 1px solid #e3e5de; }
  .row2 h4 { font-size: 14.5px; font-weight: 700; }
  .row2 p { font-size: 12.5px; color: var(--dim); }
  .row2 .lv { font-size: 12px; color: var(--dim); font-weight: 600; margin-left: 6px; }
  .buy { flex-direction: column; gap: 0; line-height: 1.15; min-width: 92px; padding: 4px 10px; }
  .buy small { font-size: 11.5px; font-weight: 600; }
  .recs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-top: 12px; }
  .rec { border: 1px solid var(--rule); border-radius: 3px; padding: 8px 10px; background: var(--hatch); }
  .rec.got { background: #fff; border-color: var(--ink); }
  .rec h4 { font-size: 13px; font-weight: 700; }
  .rec p { font-size: 11.5px; color: var(--dim); }
  .rec:not(.got) h4 { color: var(--dim); }

  .stamp { width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--signal); color: var(--signal); display: grid; place-items: center;
    font-size: 54px; font-weight: 800; transform: rotate(-8deg); margin: 4px auto 8px; }
  .stamp.gF, .stamp.gD { border-color: var(--ink); color: var(--ink); }
  .res { display: grid; grid-template-columns: 1fr auto; font-size: 14px; }
  .res div { padding: 6px 0; border-bottom: 1px solid #e3e5de; }
  .res div:nth-child(even) { text-align: right; font-weight: 700; }
  .lvup { border: 1.5px solid var(--signal); border-radius: 3px; padding: 10px 12px; margin-top: 10px; background: #fff; }
  .lvup h4 { font-size: 14px; font-weight: 800; }
  .lvup .opts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .lvup .opts .btn { flex: 1 1 140px; flex-direction: column; gap: 0; padding: 6px 10px; line-height: 1.2; text-align: left; align-items: flex-start; }
  .lvup .opts .btn small { font-weight: 400; font-size: 11.5px; }
  @media (max-height: 520px) {
    #dHead { padding: 4px 10px; } #clock { font-size: 20px; } #phase { font-size: 11px; }
    #dStats div { padding: 3px 10px; } #dStats b { font-size: 14px; } #dStats span { font-size: 11px; white-space: nowrap; }
    .u { min-height: 42px; padding: 5px 10px; } .u .mk { width: 26px; height: 26px; }
    #acts { padding: 5px 10px; min-height: 0; gap: 4px; } #acts .hint { font-size: 11.5px; } #acts .btn.sm { min-height: 34px; }
    #air { padding: 5px 10px 6px; } #air .btn.sm { min-height: 34px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="port">
<canvas id="map"></canvas>
<button id="muteBtn" aria-label="Sound on or off">
  <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
  <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" style="display:none"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<div id="deck">
  <div id="dHead">
    <div><div id="clock" class="num">10:00</div><div id="phase">Morning</div></div>
    <div></div>
    <div class="tctl"><button class="btn sm" id="pauseBtn" aria-label="Pause or resume"></button><button class="btn sm num" id="speedBtn">1x</button></div>
  </div>
  <div id="dStats">
    <div><b class="num" id="sAcres">0</b><span>Acres burned</span></div>
    <div><b class="num" id="sHomes">0</b><span>Homes safe</span></div>
    <div><b class="num" id="sCont">0%</b><span>Contained</span></div>
  </div>
  <div id="radio" class="num" aria-live="polite"></div>
  <div id="units" class="scroll"></div>
  <div id="acts"></div>
  <div id="air"><button class="btn sm" id="dropBtn"></button><button class="btn sm" id="heliBtn"></button></div>
</div>

<div id="title" class="screen show">
  <div>
    <h1>Fire<br><span>Season</span></h1>
    <p class="tag">Read the wind. Cut the line. Hold the town.</p>
  </div>
  <div class="go">
    <button class="btn go" id="playBtn">Report for duty</button>
    <div class="stat num" id="titleStat"></div>
    <a id="badge" href="https://tatertotgames.com">tatertotgames.com</a>
  </div>
</div>

<div id="station" class="screen">
  <div class="panel scroll">
    <div class="ph"><h2 id="stTitle">Station</h2><div class="money num" id="stBudget"></div></div>
    <p class="lede num" id="stLede"></p>
    <div class="call" id="callCard"></div>
    <div class="tabs"><button data-t="crews" class="on">Crews</button><button data-t="station">Station</button><button data-t="record">Record</button></div>
    <div id="stBody"></div>
  </div>
</div>

<div id="results" class="screen">
  <div class="panel scroll">
    <div class="ph"><h2 id="rsTitle">Incident report</h2></div>
    <div class="stamp" id="rsStamp">A</div>
    <p class="lede" id="rsLede" style="text-align:center;margin:0 auto 12px"></p>
    <div class="res num" id="rsTable"></div>
    <div id="rsCrew"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn go" id="rsBack">Back to station</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;

/* ============================== data ============================== */

const REGIONS = {

function cellAt(px, py) {
  if (!inc) return -1;
  const x = Math.floor((px - grid.x) / grid.cs), y = Math.floor((py - grid.y) / grid.cs);
  if (x < 0 || y < 0 || x >= inc.cols || y >= inc.rows) return -1;
  return y * inc.cols + x;
}
function rasterize(pts) {
  // turn a drawn stroke into a 4-connected run of cells, so fire cannot slip through the corners
  const out = [];
  const push = i => { if (i >= 0 && out[out.length - 1] !== i) out.push(i); };
  let prev = null;
  for (const p of pts) {
    const c = cellAt(p[0], p[1]); if (c < 0) continue;
    if (prev === null) { push(c); prev = c; continue; }
    let x0 = prev % inc.cols, y0 = (prev / inc.cols) | 0; const x1 = c % inc.cols, y1 = (c / inc.cols) | 0;
    while (x0 !== x1 || y0 !== y1) {
      if (Math.abs(x1 - x0) >= Math.abs(y1 - y0)) x0 += Math.sign(x1 - x0); else y0 += Math.sign(y1 - y0);
      push(y0 * inc.cols + x0);

  }

}

/* ============================== loop ============================== */

    if (!paused && !stroke) {
      const gm = dt * SPEEDS[speedI] / GAME_MIN;
      for (const u of inc.units) unitMove(inc, u, gm);
      acc += gm;
      while (acc >= 1 && !inc.over) { acc -= 1; tickMinute(); }
    }
    if (crackleGain) crackleGain.gain.value = paused || S.muted ? 0 : clamp(inc.burning.length / 250, 0, 0.5);
  } else if (mode === 'title' && inc) {
    // the title screen shows a fire running on its own
    titleT += dt * 3;
    while (titleT >= 1) { titleT -= 1; spreadMinute(inc); inc.t = Math.min(1100, inc.t + 1); if (!inc.burning.length || inc.t >= 1100) titleMap(); }
    if (crackleGain) crackleGain.gain.value = 0;
  } else if (crackleGain) crackleGain.gain.value = 0;
  drawMap(dt, now);
  uiT -= dt;
  if (mode === 'incident' && uiT <= 0) { uiT = 0.25; updateDeck(); renderRadio(); }
  saveT -= dt; if (saveT <= 0 && S.started) { saveT = 10; persist(); }
  requestAnimationFrame(frame);
}
function titleMap() {
  const c = { season: 2, call: 1, region: ['valley', 'foothills', 'ridge'][Math.floor(Math.random() * 3)], seed: (Math.random() * 1e9) | 0, windLo: 14, windHi: 30, moist: 0.14, danger: 2 };
  const [cols, rows] = land ? [56, 32] : [30, 48];
  inc = genIncident(c, cols, rows);
  ignite(inc, inc.ign); inc.t = 780; fitGrid(); baseDirty = true;
}

/* ============================== pause ============================== */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false; if (S.started) persist();
    if (AC && AC.state === 'running') AC.suspend();
  } else {
    if (running) return;
    running = true; last = performance.now();
    if (mode === 'incident') { paused = true; updateDeck(); }
    if (AC && AC.state === 'suspended' && !S.muted) AC.resume();
    requestAnimationFrame(frame);
  }
});
window.addEventListener('pagehide', () => { if (S.started) persist(); });
window.addEventListener('resize', () => { layout(); });

/* ============================== boot ============================== */
// read-only view of the map for automated checks; only with ?debug in the address
if (/[?&]debug(&|=|$)/.test(location.search)) window.__fs = () => inc && ({ mode, t: inc.t, over: inc.over, cols: inc.cols, rows: inc.rows, cs: grid.cs, gx: grid.x, gy: grid.y,
  ign: inc.ign, town: inc.town, station: inc.station, burning: inc.burning.length, burned: countBurned(inc), lost: inc.housesLost, houses: inc.houses.length,
  cut: inc.cutCells, lit: inc.burnCells, contain: inc.containPct, units: inc.units.map(u => ({ n: u.crew.name, cell: u.cell, status: u.status, hurt: u.hurt, heat: u.heat })) });
setMuted(S.muted, true);
layout(); titleMap();
if (S.started) {
  $('titleStat').textContent = 'Season ' + S.season + ', $' + S.budget.toLocaleString('en-US') + ' in the budget.';
  $('playBtn').textContent = 'Back to the station';
}
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
